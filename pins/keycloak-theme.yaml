# Pins of the keycloak-theme image group (scripts/images.yaml), read by the auth Application
# (helm.valueFiles, charts/app-of-apps/templates/auth.yaml). Written by the Kargo stage
# pin-keycloak-theme and by scripts/pin-image; do not edit by hand.
#
# Style "digest": the key holds only the digest; its sibling keycloak.image.tag ("latest") stays in
# charts/auth/values.yaml.
keycloak:
  image:
    # The keycloakx chart puts image.tag into the app.kubernetes.io/version label, so the pin is the
    # separate digest value (tag@digest in a label is invalid). scripts/pin-image style "digest".
    digest: sha256:6e417a9959bdcbca22962c000b7abd22976e38cae3ab8ad0f04f46970fdbecc3
