# Values for teknoir-cloud (staging, r415). The chart is only deployed when
# charts/app-of-apps sets virtualDevices.enabled.
#
# The operator manifests themselves are vendored (vendor/, pinned by version,
# upstream sha256 and image digest) and are not configurable here.

kubevirt:
  enabled: true
  # virt-api / virt-controller replicas. virt-api serves the aggregated
  # subresources.kubevirt.io APIServices: while no virt-api pod is ready, API
  # discovery is incomplete for every client, which stalls
  # namespace deletion and garbage collection cluster-wide. Two replicas keep one
  # serving through a single pod crash, OOM kill or eviction. Both fit on one node
  # (KubeVirt's anti-affinity is only preferred). The second virt-api and
  # virt-controller request +775Mi/+15m; r415 has 252 GiB. KubeVirt then adds PDBs
  # with minAvailable 1, which block a drain of a single node; r415 cannot be drained
  # today anyway (keycloak, backstage and oauth2-proxy PDBs allow 0 disruptions).
  # Staging is the single 14 GB vpro host since 2026-10-16: one replica each. At two, KubeVirt and
  # CDI reserved 3.5 GiB of requests and CI pods no longer scheduled ("Insufficient memory").
  infraReplicas: 1
  # Where virt-handler runs, so where VMs can run: the dev host agent (taint teknoir.org/ci,
  # label teknoir.org/virtual-devices=true). Empty: every node. The VMs themselves are placed
  # by the device-controller (virtualDevices.nodeSelector/tolerations).
  workloadsNodePlacement:
    nodeSelector: {teknoir.org/virtual-devices: "true"}
    tolerations:
      - {key: teknoir.org/ci, operator: Exists, effect: NoSchedule}
  # No feature gates: nothing in the virtual-device design needs one.
  featureGates: []
  # The auto-attached serial console is still available (virtctl console), but its
  # output is not copied into a guest-console-log container. That log would carry
  # cloud-init and bootstrap output into pod logs (readable through any Kubernetes
  # log path) and onto r415's small /var.
  disableSerialConsoleLog: true
  # Refuse to delete the KubeVirt CR while VMs exist.
  uninstallStrategy: BlockUninstallIfWorkloadsExist

cdi:
  enabled: true
  # HonorWaitForFirstConsumer: local-path is WaitForFirstConsumer, so the disk is
  # imported on the node the VM is scheduled to. (Upstream's default CR also enables
  # WebhookPvcRendering, which only applies to PVCs labelled for StorageProfile
  # rendering; virtual devices use DataVolumes, so it is left off.)
  featureGates:
    - HonorWaitForFirstConsumer
  # Resources of CDI worker pods (importer, cloner, upload server). Set explicitly
  # (these are the upstream defaults) so the per-teamspace ResourceQuota in
  # <ns>-vdev can budget for the importer pod.
  podResourceRequirements:
    requests:
      cpu: 100m
      memory: 60M
    limits:
      cpu: 750m
      memory: 600M
  # cdi-apiserver replicas. It serves the aggregated APIService
  # v1beta1.upload.cdi.kubevirt.io and CDI's webhooks; two for the same reason as
  # kubevirt.infraReplicas (+150Mi requests). CDI's anti-affinity is only preferred.
  # One on the single vpro host (see kubevirt.infraReplicas).
  apiServerReplicas: 1
  # CDI workload pods (importer, cloner, upload server) run next to the VM's disk: the dev host.
  workloadTolerations:
    - {key: teknoir.org/ci, operator: Exists, effect: NoSchedule}
  uninstallStrategy: BlockUninstallIfWorkloadsExist

# Scheduling class for virtual-device VMs (virt-launcher pods). Platform pods run at
# priority 0 (no class), so a negative value keeps VMs below the platform; with
# preemptionPolicy Never a VM never evicts anything to get scheduled.
priorityClass:
  enabled: true
  name: teknoir-virtual-device
  value: -100

# CoreDNS override (coredns-custom key virtual-devices.override). Answers
# <prefix>-<ns>.<domain> with the ClusterIP of the public ingress gateway, so a VM
# reaches EMQX (8883/8084) and deadend (2222) through the same gateway and SNI as
# an external device, without depending on router hairpin NAT. r415 has no other
# coredns-custom keys (checked 2026-10-09); this chart owns the ConfigMap there.
coreDNS:
  enabled: true
  domain: teknoir.cloud
  prefixes:
    - mqtt
    - deadend
  target: istio-ingressgateway-public.istio-system.svc.cluster.local

# WireGuard (ZTNA) tunnels: two more CoreDNS rewrites (wg-device.<domain> to the public ingress
# gateway above, turn.<domain> to the STUNner gateway Service). enabled is passed by
# charts/app-of-apps (ztna.enabled) to this Application; off renders nothing extra.
ztna:
  enabled: false
  # Service the STUNner operator creates for Gateway teknoir-turn (named after the Gateway, in its
  # namespace; charts/stunner values gateway.name).
  turnTarget: teknoir-turn.stunner-system.svc.cluster.local
