# Pinned upstream inputs for the vendored operator manifests in this directory.
#
# Every input is pinned three ways:
#   version  the upstream release tag;
#   sha256   the checksum of the release asset as downloaded from GitHub;
#   images   the registry digest of every image the operator runs or deploys,
#            resolved with `crane digest <registry>/<name>:<version>`.
#
# The vendored files are produced from these inputs by hack/vendor.py and are
# never fetched at runtime. To bump a version, edit `version`, `source` and
# `sha256`, run `python3 -I hack/vendor.py resolve` (rewrites the digests) and
# `python3 -I hack/vendor.py rebuild`, then review the diff.
#
# Pairing: KubeVirt v1.8.4 + CDI v1.65.0 is the pair pinned by the
# hyperconverged-cluster-operator release-1.18 branch (hack/config). KubeVirt 1.8
# supports Kubernetes 1.34 and 1.35 (kubevirt/sig-release k8s-support-matrix.md),
# which covers r415 (k3s v1.34.5).
