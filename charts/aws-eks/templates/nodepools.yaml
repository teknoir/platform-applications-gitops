---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: stable-compute
spec:
  weight: 100 # The default weight is 0. Higher values are preferred.
  template:
    spec:
      nodeClassRef:
        group: eks.amazonaws.com
        kind: NodeClass
        name: default # Auto Mode provides a default NodeClass
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - on-demand
        - key: eks.amazonaws.com/instance-category
          operator: In
          values:
            - c
            - m
            - r
        - key: eks.amazonaws.com/instance-generation
          operator: Gt
          values:
            - "4"
        - key: kubernetes.io/arch
          operator: In
          values:
            - amd64
        - key: kubernetes.io/os
          operator: In
          values:
            - linux
      terminationGracePeriod: 24h0m0s
  # Control the scale-in behavior here
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 15m # Wait 15 minutes before consolidating (instead of 30s)
    # OR use WhenEmpty to never consolidate nodes unless they are completely empty:
    # consolidationPolicy: WhenEmpty
    # consolidateAfter: 5m
    budgets:
      - nodes: 10% # Only allow 10% of nodes to be disrupted at a time