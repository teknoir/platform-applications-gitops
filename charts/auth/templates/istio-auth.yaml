{{- $domain := include "auth.domain" . -}}
{{- $authPath := .Values.istio.auth.oauth2ProxyAuthPath | default "/oauth2/auth" -}}
{{- $oauth2RouteName := .Values.istio.auth.oauth2ProxyRouteName | default "oauth2-proxy-auth" -}}
{{- $keycloakRouteName := .Values.istio.auth.keycloakRouteName | default "keycloak" -}}
{{- $oauth2SharedHost := .Values.oauth2Proxy.sharedHost | default $domain -}}
{{- $cookieName := .Values.oauth2Proxy.cookie.name | default "_oauth2_proxy" -}}
{{- $namespace := .Values.namespace | default .Release.Namespace -}}
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: oauth2-proxy-ext-authz
  namespace: {{ .Values.istio.gateway.namespace | default "istio-system" }}
spec:
  workloadSelector:
    labels:
{{- toYaml .Values.istio.gateway.selector | nindent 6 }}
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_FIRST
        value:
          name: envoy.filters.http.ext_authz
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
            transport_api_version: V3
            http_service:
              server_uri:
                uri: http://oauth2-proxy.{{ $namespace }}.svc.cluster.local:{{ .Values.oauth2Proxy.service.port }}
                cluster: outbound|{{ .Values.oauth2Proxy.service.port }}||oauth2-proxy.{{ $namespace }}.svc.cluster.local
                timeout: 10s
              path_prefix: {{ $authPath | quote }}
              authorization_request:
                allowed_headers:
                  patterns:
                    - exact: cookie
                    - exact: authorization
                    - exact: x-forwarded-proto
                    - exact: x-forwarded-host
                    - exact: x-forwarded-uri
              authorization_response:
                allowed_upstream_headers:
                  patterns:
                    - exact: x-forwarded-access-token
                    - exact: x-auth-request-access-token
                    - exact: x-auth-request-user
                    - exact: x-auth-request-email
                    - exact: x-auth-request-preferred-username
                allowed_client_headers:
                  patterns:
                    - exact: set-cookie
                    - exact: location
    # Denied-request shaping. Runs AFTER ext_authz decided: it never changes who is let in.
    # Only a 401/403 that ext_authz itself produced is rewritten (a browser navigation gets the
    # login redirect, everything else gets a 401 challenge); a 401/403 from the backend passes
    # unchanged. Contract: charts/auth/README.md ("Denied requests").
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              local function urlencode(str)
                if str == nil then
                  return ""
                end
                return (string.gsub(str, "([^%w%-_%.~])", function(c)
                  return string.format("%%%02X", string.byte(c))
                end))
              end

              local function has_session_cookie(h)
                local cookie = h:get("cookie") or ""
                if cookie == "" then
                  return false
                end
                return string.find(cookie, "{{ $cookieName }}=", 1, true) ~= nil
              end

              -- "browser" = a top-level navigation that can follow a login redirect.
              -- Everything else (fetch/XHR/WebSocket/CLI/curl) is "api". Never classify by path.
              local function classify(h)
                local mode = h:get("sec-fetch-mode")
                if mode ~= nil then
                  -- Sec-* request headers cannot be set by page scripts: authoritative.
                  if mode == "navigate" then
                    return "browser"
                  end
                  return "api"
                end
                if h:get("authorization") ~= nil or h:get("x-requested-with") ~= nil then
                  return "api"
                end
                local method = h:get(":method")
                local accept = string.lower(h:get("accept") or "")
                if (method == "GET" or method == "HEAD") and string.find(accept, "text/html", 1, true) ~= nil then
                  return "browser"
                end
                return "api"
              end

              function envoy_on_request(handle)
                local h = handle:headers()
                -- rd and the /oauth2 exemption come from :authority/:path (what Envoy routes on),
                -- never from client-supplied x-forwarded-host/-uri. The scheme comes from
                -- x-forwarded-proto, which the edge Envoy sets.
                local scheme = h:get("x-forwarded-proto")
                if scheme ~= "http" and scheme ~= "https" then
                  scheme = "https"
                end
                local path = h:get(":path") or "/"
                local rd = scheme .. "://" .. (h:get(":authority") or h:get("host") or "") .. path
                local md = handle:streamInfo():dynamicMetadata()
                md:set("oauth2_proxy", "rd", rd)
                md:set("oauth2_proxy", "path", path)
                md:set("oauth2_proxy", "client", classify(h))
                md:set("oauth2_proxy", "has_session", has_session_cookie(h) and "true" or "false")
                md:set("oauth2_proxy", "has_auth", h:get("authorization") ~= nil and "true" or "false")
              end

              function envoy_on_response(handle)
                local rh = handle:headers()
                local status = rh:get(":status")
                if status ~= "401" and status ~= "403" then
                  return
                end
                local md = handle:streamInfo():dynamicMetadata()
                -- The marker filter (below) runs only when ext_authz let the request through or was
                -- disabled for the route, so this 401/403 is the backend's own: pass it unchanged.
                -- A missing marker falls back to rewriting (today's behaviour), never to exposure.
                local authz = md:get("oauth2_proxy_authz")
                if authz ~= nil and authz["passed"] == "true" then
                  return
                end
                local info = md:get("oauth2_proxy") or {}
                local path = info["path"] or ""
                if string.sub(path, 1, 7) == "/oauth2" then
                  return
                end
                if info["has_session"] == "true" then
                  return
                end
                -- body() is only touched here, on a denial (a small sign-in page); never on normal
                -- responses, where it would buffer SSE, WebSocket and downloads.
                if info["client"] == "browser" then
                  local body = handle:body(true)
                  if body ~= nil then
                    body:setBytes("")
                  end
                  -- body() yields: a headers object taken before it is out of scope, take it again.
                  rh = handle:headers()
                  local rd = info["rd"] or ""
                  rh:replace(":status", "302")
                  rh:replace("location", "https://{{ $oauth2SharedHost }}/oauth2/start?rd=" .. urlencode(rd))
                  rh:replace("content-length", "0")
                  rh:replace("cache-control", "no-store")
                  rh:remove("content-type")
                  return
                end
                local payload = '{"error":"unauthorized","message":"Authentication required: run tnctl login or sign in in the browser."}'
                local body = handle:body(true)
                if body ~= nil then
                  body:setBytes(payload)
                end
                rh = handle:headers()
                local challenge = 'Bearer realm="teknoir"'
                if info["has_auth"] == "true" then
                  challenge = challenge .. ', error="invalid_token"'
                end
                rh:replace(":status", "401")
                rh:replace("content-type", "application/json")
                rh:replace("content-length", tostring(#payload))
                rh:replace("www-authenticate", challenge)
                rh:replace("cache-control", "no-store")
                rh:remove("location")
                rh:remove("set-cookie")
              end
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.ext_authz
      patch:
        operation: INSERT_AFTER
        value:
          name: envoy.filters.http.lua.authz_passed
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            # Marker: only requests that ext_authz let through (or that skip it per route) reach this
            # filter. Clients cannot write dynamic metadata.
            inlineCode: |
              function envoy_on_request(handle)
                handle:streamInfo():dynamicMetadata():set("oauth2_proxy_authz", "passed", "true")
              end
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "{{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}"
          vhost:
            name: {{ printf "auth.%s:443" $domain | quote }}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "{{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}"
          vhost:
            name: {{ printf "harbor.%s:443" $domain | quote }}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
            envoy.filters.http.lua:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              disabled: true
    - applyTo: VIRTUAL_HOST
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "{{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}"
          vhost:
            name: {{ printf "argocd.%s:443" $domain | quote }}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "{{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}"
          vhost:
            route:
              name: {{ $oauth2RouteName | quote }}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
    - applyTo: HTTP_ROUTE
      match:
        context: GATEWAY
        routeConfiguration:
          gateway: "{{ .Values.istio.gateway.namespace }}/{{ .Values.istio.gateway.name }}"
          vhost:
            route:
              name: {{ $keycloakRouteName | quote }}
      patch:
        operation: MERGE
        value:
          typed_per_filter_config:
            envoy.filters.http.ext_authz:
              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
              disabled: true
            envoy.filters.http.lua:
              "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.LuaPerRoute
              disabled: true

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: oauth2-proxy-allow
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app: oauth2-proxy
  action: ALLOW
  rules:
    - {}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: oauth2-proxy-redis-allow
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app: oauth2-proxy-redis
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ $namespace }}
---
apiVersion: security.istio.io/v1beta1
kind: PeerAuthentication
metadata:
  name: strict-mtls-auth
  namespace: {{ $namespace }}
spec:
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: keycloak-istio-mtls
  namespace: {{ $namespace }}
spec:
  host: keycloak-http.{{ $namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: oauth2-proxy-istio-mtls
  namespace: {{ $namespace }}
spec:
  host: oauth2-proxy.{{ $namespace }}.svc.cluster.local
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
