{{- if .Values.oauth2Proxy.redis.enabled -}}
{{- $namespace := .Values.namespace | default .Release.Namespace -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.oauth2Proxy.redis.host }}-pvc
  namespace: {{ $namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.oauth2Proxy.redis.storage.size }}
  storageClassName: auto-ebs-gp3-retain
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.oauth2Proxy.redis.host }}
  namespace: {{ $namespace }}
spec:
  selector:
    app: {{ .Values.oauth2Proxy.redis.host }}
  ports:
    - name: redis
      port: {{ .Values.oauth2Proxy.redis.port }}
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.oauth2Proxy.redis.host }}
  namespace: {{ $namespace }}
spec:
  serviceName: {{ .Values.oauth2Proxy.redis.host }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.oauth2Proxy.redis.host }}
  template:
    metadata:
      labels:
        app: {{ .Values.oauth2Proxy.redis.host }}
    spec:
      containers:
        - name: redis
          image: docker.io/redis:7.2-alpine@sha256:29e8589c3f9ba699b5f7aa4b3c7733c58852a3626439e619aa0ee78de08c6ca0
          command:
            - sh
            - -c
            - redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes
          ports:
            - name: redis
              containerPort: {{ .Values.oauth2Proxy.redis.port }}
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.oauth2Proxy.redis.secretName }}
                  key: {{ .Values.oauth2Proxy.redis.passwordKey }}
          resources:
            {{- toYaml .Values.oauth2Proxy.redis.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.oauth2Proxy.redis.host }}-pvc
{{- end -}}
