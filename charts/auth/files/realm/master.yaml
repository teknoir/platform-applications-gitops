{{- /*
Realm `master` on teknoir-cloud, imported by keycloak-config-cli
(templates/keycloak-config.yaml) after every sync of the auth Application. This file
replaces the manual Keycloak steps of the old bootstrap (infra README): a fresh install
needs nothing done in the Keycloak UI.

Rendered by Helm first (domain); keycloak-config-cli then substitutes $(env:...) with
the client secrets from Secret teknoir-auth/keycloak-client-secrets (platform-secrets).
No secret is in Git.

Nothing that is not listed here is ever deleted (the Job sets every IMPORT_MANAGED_*
to no-delete). Users are managed by user-controller (User CRs); this file only pins
service accounts and the platform owners' Keycloak admin access. For a managed user
the import sets exactly the listed realm roles, client roles and groups.
*/ -}}
{{- $d := .Values.domain }}
{{- $scopes := list "web-origins" "acr" "profile" "roles" "email" "basic" "groups" }}
realm: master

# Session lifetimes (realm-level attributes; keycloak-config-cli sends only what this file lists, so
# every other realm setting is left as it is). They were Keycloak's defaults before (access token
# 60 s, SSO idle 30 min, SSO max 10 h), which logged people out at every lunch and overnight and
# left the 12 h oauth2-proxy cookie pointing at a dead session. The oauth2-proxy cookie expiry
# (values.yaml oauth2Proxy.cookie.expire) equals ssoSessionMaxLifespan.
accessTokenLifespan: 300          # 5 min; was 60 s, equal to oauth2-proxy's 1 m refresh (no margin)
ssoSessionIdleTimeout: 86400      # 1 d: a session survives a night and a weekend afternoon
ssoSessionMaxLifespan: 604800     # 7 d: one login a week at most
offlineSessionIdleTimeout: 2592000  # 30 d (tnctl's offline token); explicit, was the Keycloak default

clientScopes:
  # Flat group names as claim "groups" (ArgoCD, Argo Workflows and Harbor RBAC on group admin).
  - name: groups
    description: Group membership (flat names) as claim "groups"
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"
  # Audience "teknoir" in access tokens of the platform login (oauth2-proxy -> services).
  - name: teknoir
    description: Audience teknoir
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: audience-teknoir
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: teknoir
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"
  # Audience "teknoir-ztna" for the WireGuard hub (wg.{{ $d }}). OPTIONAL on teknoir-cli: tnctl asks
  # for it only on hub calls, so the token it sends to Backstage and the fleet API never has the
  # audience and cannot open tunnel sessions (a default scope cannot be left out of a token). The
  # hub checks aud on top of azp teknoir-cli (plans/ztna-later.md, "ztna-audience").
  - name: teknoir-ztna
    description: Audience teknoir-ztna (WireGuard hub)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: audience-teknoir-ztna
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.custom.audience: teknoir-ztna
          access.token.claim: "true"
          id.token.claim: "false"
          introspection.token.claim: "true"

groups:
  # Platform administrators: ArgoCD role:admin, Argo Workflows ci-admin, Harbor admin.
  - name: admin

clients:
  # The edge login (oauth2-proxy on every *.{{ $d }} host) and user-controller's Keycloak
  # admin access (client credentials, master-realm manage/view/query-users).
  - clientId: teknoir
    name: Teknoir platform (oauth2-proxy, user-controller)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:TEKNOIR_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    rootUrl: https://{{ $d }}
    redirectUris:
      - https://{{ $d }}/oauth2/callback
      - https://*.{{ $d }}/oauth2/callback
    webOrigins: ["+"]
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: "https://{{ $d }}/*##https://*.{{ $d }}/*"
    defaultClientScopes: {{ toJson (append $scopes "teknoir") }}
    optionalClientScopes: [offline_access]
  # tnctl (cli): public client, OAuth device flow; tokens carry audience teknoir-cli, which
  # oauth2-proxy (--extra-jwt-issuers) and Backstage externalAccess accept. The optional scope
  # teknoir-ztna adds the hub audience to the tokens tnctl sends to wg.{{ $d }} only.
  - clientId: teknoir-cli
    name: tnctl
    enabled: true
    protocol: openid-connect
    publicClient: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    attributes:
      oauth2.device.authorization.grant.enabled: "true"
    protocolMappers:
      - name: audience-teknoir-cli
        protocol: openid-connect
        protocolMapper: oidc-audience-mapper
        consentRequired: false
        config:
          included.client.audience: teknoir-cli
          access.token.claim: "true"
          id.token.claim: "false"
    defaultClientScopes: {{ toJson $scopes }}
    optionalClientScopes: [offline_access, teknoir-ztna]
  # Argo CD (infra charts/argo, oidc.config): group admin -> role:admin.
  - clientId: argocd
    name: Argo CD (argocd.{{ $d }})
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:ARGOCD_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://argocd.{{ $d }}
    redirectUris: ["https://argocd.{{ $d }}/auth/callback"]
    webOrigins: ["https://argocd.{{ $d }}"]
    defaultClientScopes: {{ toJson $scopes }}
    optionalClientScopes: [offline_access]
  # Argo Workflows UI (charts/ci): group admin -> ServiceAccount ci-admin.
  - clientId: argo-workflows
    name: Argo Workflows (ci.{{ $d }})
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:ARGO_WORKFLOWS_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://ci.{{ $d }}
    redirectUris: ["https://ci.{{ $d }}/oauth2/callback"]
    webOrigins: ["https://ci.{{ $d }}"]
    attributes:
      post.logout.redirect.uris: "https://ci.{{ $d }}/*"
    defaultClientScopes: {{ toJson $scopes }}
    optionalClientScopes: [offline_access]
  # Harbor UI login (charts/harbor oidcConfig): group admin -> Harbor system admin.
  - clientId: harbor
    name: Harbor (harbor.{{ $d }})
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:HARBOR_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://harbor.{{ $d }}
    redirectUris: ["https://harbor.{{ $d }}/c/oidc/callback"]
    webOrigins: ["https://harbor.{{ $d }}"]
    defaultClientScopes: {{ toJson $scopes }}
    optionalClientScopes: [offline_access]
  # The import's own identity (client credentials, realm role admin). keycloak-admin-bootstrap
  # creates it once with `kc.sh bootstrap-admin service`; from then on it is managed here.
  - clientId: keycloak-config-cli
    name: keycloak-config-cli (GitOps realm import)
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    serviceAccountsEnabled: true
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    secret: $(env:KEYCLOAK_CONFIG_CLI_CLIENT_SECRET)

users:
  # Keep realm role admin, or the next import cannot log in.
  - username: service-account-keycloak-config-cli
    enabled: true
    serviceAccountClientId: keycloak-config-cli
    realmRoles: [admin, default-roles-master]
  # user-controller (KEYCLOAK_CLIENTID=teknoir in backstage-keycloak-secrets).
  - username: service-account-teknoir
    enabled: true
    serviceAccountClientId: teknoir
    realmRoles: [default-roles-master]
    clientRoles:
      master-realm: [manage-users, view-users, query-users, query-groups]
{{- range .Values.keycloakConfig.platformOwners }}
  # Platform owner: always Keycloak admin and in group admin, on every install.
  - username: {{ . | quote }}
    email: {{ . | quote }}
    enabled: true
    emailVerified: true
    realmRoles: [admin, default-roles-master]
    groups: [admin]
{{- end }}
