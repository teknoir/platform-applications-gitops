{{- /*
Realm `teknoir`, imported by keycloak-config-cli (templates/keycloak-config.yaml).
Rendered by Helm first (domain, names); keycloak-config-cli then substitutes
$(env:...) with the client secrets from Secret keycloak-client-secrets, which
the platform-secrets chart generates. No secret is in this file.

Only what is listed here is managed. keycloak-config-cli keeps remote state,
so it only ever deletes objects it created itself, and it never deletes users.
The only users managed here are the user-controller service account and the
initial human admin platform-admin; user-controller creates every other user
from its User CRs.
*/ -}}
{{- $domain := include "auth.domain" . -}}
{{- $r := .Values.realm -}}
realm: {{ $r.name }}
displayName: {{ $r.displayName | quote }}
enabled: true
loginTheme: {{ $r.loginTheme | quote }}
sslRequired: external
registrationAllowed: false
# No SMTP in the air-gapped environments.
resetPasswordAllowed: false
verifyEmail: false
rememberMe: true
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
editUsernameAllowed: false
bruteForceProtected: true
permanentLockout: false
failureFactor: 10
accessTokenLifespan: {{ $r.accessTokenLifespan }}
ssoSessionIdleTimeout: {{ $r.ssoSessionIdleTimeout }}
ssoSessionMaxLifespan: {{ $r.ssoSessionMaxLifespan }}

clientScopes:
  # Flat group names in the ID/access tokens and userinfo: ArgoCD maps group
  # `admin` to role:admin, Harbor uses it as its OIDC admin group.
  - name: groups
    description: Group membership (flat names) as claim "groups"
    protocol: openid-connect
    attributes:
      include.in.token.scope: "true"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: groups
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        consentRequired: false
        config:
          claim.name: groups
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
          introspection.token.claim: "true"

groups:
  - name: admin

clients:
  # oauth2-proxy: the ext_authz login for every protected vhost.
  - clientId: teknoir
    name: Teknoir platform (oauth2-proxy)
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:TEKNOIR_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    redirectUris:
      - https://{{ $domain }}/oauth2/callback
      - https://*.{{ $domain }}/oauth2/callback
    webOrigins:
      - "+"
    attributes:
      pkce.code.challenge.method: S256
    # "basic" carries `sub`, which Backstage requires.
    defaultClientScopes: {{ toJson $r.defaultClientScopes }}
    optionalClientScopes: {{ toJson $r.optionalClientScopes }}

  # ArgoCD SSO (oidc.config clientID argocd).
  - clientId: argocd
    name: Argo CD
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:ARGOCD_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://argocd.{{ $domain }}
    redirectUris:
      - https://argocd.{{ $domain }}/auth/callback
    webOrigins:
      - https://argocd.{{ $domain }}
    defaultClientScopes: {{ toJson $r.defaultClientScopes }}
    optionalClientScopes: {{ toJson $r.optionalClientScopes }}

  # Harbor OIDC auth mode.
  - clientId: harbor
    name: Harbor
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:HARBOR_CLIENT_SECRET)
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    rootUrl: https://harbor.{{ $domain }}
    redirectUris:
      - https://harbor.{{ $domain }}/c/oidc/callback
    webOrigins:
      - https://harbor.{{ $domain }}
    defaultClientScopes: {{ toJson $r.defaultClientScopes }}
    optionalClientScopes: {{ toJson $r.optionalClientScopes }}

  # user-controller: client credentials only; manages the realm's users.
  - clientId: user-controller
    name: Teknoir user-controller
    enabled: true
    protocol: openid-connect
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:USER_CONTROLLER_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    defaultClientScopes: {{ toJson (without $r.defaultClientScopes "groups") }}
    optionalClientScopes: []

users:
  # The service account of client user-controller (Keycloak creates the user;
  # this only grants it the realm-management roles user-controller needs).
  - username: service-account-user-controller
    enabled: true
    serviceAccountClientId: user-controller
    clientRoles:
      realm-management:
        - manage-users
        - view-users
        - query-users

  # The initial human admin. Username and password come from Secret
  # keycloak-platform-admin (platform-secrets). The credential labelled
  # "initial" is set only when keycloak-config-cli creates the user, and is
  # temporary; requiredActions are also applied only at creation
  # (IMPORT_BEHAVIORS_USERUPDATEIGNOREDPROPERTIES). So Keycloak forces one
  # password change at first login and later imports never reset it. email,
  # firstName and lastName satisfy the default user profile, so there is no
  # profile form at first login. Membership is exactly group admin.
  - username: $(env:PLATFORM_ADMIN_USERNAME)
    email: $(env:PLATFORM_ADMIN_USERNAME)@{{ $domain }}
    emailVerified: true
    firstName: {{ $r.platformAdmin.firstName | quote }}
    lastName: {{ $r.platformAdmin.lastName | quote }}
    enabled: {{ $r.platformAdmin.enabled }}
    groups:
      - admin
    requiredActions:
      - UPDATE_PASSWORD
    credentials:
      - type: password
        userLabel: initial
        value: $(env:PLATFORM_ADMIN_PASSWORD)
        temporary: true
