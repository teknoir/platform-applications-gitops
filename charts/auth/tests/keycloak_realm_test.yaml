suite: keycloak realm session lifetimes (keycloak-config-cli import)
templates:
  - templates/keycloak-config.yaml
# The pin the auth Application passes (charts/app-of-apps/templates/auth.yaml): the chart values carry an empty
# digest now that Kargo writes the pins (scripts/images.yaml), and the keycloak-config image requires it.
values:
  - ../../../pins/keycloak-theme.yaml
release:
  name: auth
  namespace: teknoir-auth
tests:
  - it: pins the realm lifetimes as realm-level attributes (access 5 min, SSO idle 1 d, SSO max 7 d, offline idle 30 d)
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^accessTokenLifespan: 300(\s|$)'
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^ssoSessionIdleTimeout: 86400(\s|$)'
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^ssoSessionMaxLifespan: 604800(\s|$)'
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^offlineSessionIdleTimeout: 2592000(\s|$)'

  # Keep in step with oauth2Proxy.cookie.expire (168h = 604800 s), pinned in oauth2_proxy_test.yaml: change both together.

  - it: sets the Teknoir login theme on the realm
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^loginTheme: teknoir-theme(\s|$)'

  # ztna-audience (plans/ztna-later.md): the hub audience comes from an OPTIONAL scope of teknoir-cli, so the
  # token tnctl sends to Backstage (downscoped) never has it. A default scope cannot be left out of a token.
  - it: defines the client scope teknoir-ztna with an access-token audience mapper
    set:
      ztna.enabled: true
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - name: teknoir-ztna\n    description: .*\n    protocol: openid-connect\n    attributes:\n      include\.in\.token\.scope: "true"\n      display\.on\.consent\.screen: "false"\n    protocolMappers:\n      - name: audience-teknoir-ztna\n        protocol: openid-connect\n        protocolMapper: oidc-audience-mapper\n        consentRequired: false\n        config:\n          included\.custom\.audience: teknoir-ztna\n          access\.token\.claim: "true"\n          id\.token\.claim: "false"\n          introspection\.token\.claim: "true"\n'

  - it: lists teknoir-ztna as an optional scope of teknoir-cli only, and as a default scope of no client
    set:
      ztna.enabled: true
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - clientId: teknoir-cli\n(?: {4,}[^\n]*\n)*? {4}optionalClientScopes: \[offline_access, teknoir-ztna\]\n'
      # the browser client (azp teknoir) is unchanged: its tokens are forwarded to every upstream
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - clientId: teknoir\n(?: {4,}[^\n]*\n)*? {4}optionalClientScopes: \[offline_access\]\n'
      - notMatchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^    defaultClientScopes: .*teknoir-ztna'

  # Only an install with ZTNA on gets the scope: with ztna off the realm is unchanged.
  - it: has no teknoir-ztna scope with ztna off
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["master.yaml"]
          pattern: 'teknoir-ztna'
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - clientId: teknoir-cli\n(?: {4,}[^\n]*\n)*? {4}optionalClientScopes: \[offline_access\]\n'

  # Kargo (gitops charts/kargo api.oidc): public PKCE clients, only while app-of-apps passes kargo.enabled.
  - it: defines the public PKCE clients kargo (UI) and kargo-cli (fixed localhost port) with kargo.enabled
    set:
      kargo.enabled: true
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - clientId: kargo\n    name: Kargo \(kargo\.teknoir\.cloud\)\n    enabled: true\n    protocol: openid-connect\n    publicClient: true\n    standardFlowEnabled: true\n    implicitFlowEnabled: false\n    directAccessGrantsEnabled: false\n    serviceAccountsEnabled: false\n    fullScopeAllowed: false\n    rootUrl: https://kargo\.teknoir\.cloud\n    redirectUris: \["https://kargo\.teknoir\.cloud/login"\]\n    webOrigins: \["https://kargo\.teknoir\.cloud"\]\n    attributes:\n      pkce\.code\.challenge\.method: S256\n'
      - matchRegex:
          path: data["master.yaml"]
          pattern: '(?m)^  - clientId: kargo-cli\n(?: {4,}[^\n]*\n)*? {4}publicClient: true\n(?: {4,}[^\n]*\n)*? {4}fullScopeAllowed: false\n {4}redirectUris: \["http://localhost:8085/auth/callback"\]\n    attributes:\n      pkce\.code\.challenge\.method: S256\n'
      # no wildcard redirect: http://localhost* would also match http://localhost.<any domain>
      - notMatchRegex:
          path: data["master.yaml"]
          pattern: 'localhost\*'
  - it: has no kargo client without kargo.enabled
    documentSelector:
      path: kind
      value: ConfigMap
    asserts:
      - notMatchRegex:
          path: data["master.yaml"]
          pattern: 'clientId: kargo'
