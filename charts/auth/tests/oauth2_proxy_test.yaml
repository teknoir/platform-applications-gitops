suite: oauth2-proxy extra JWT issuer (tnctl)
templates:
  - templates/oauth2-proxy.yaml
tests:
  - it: is off by default, bearer skip stays on
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: --skip-jwt-bearer-tokens=true
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: extra-jwt-issuers
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --extra-jwt-issuers=https://auth.teknoir.airgapped/auth/realms/teknoir=teknoir-cli

  - it: accepts tnctl bearer tokens when cliClientId is set, issuer derived from the domain and realm
    set:
      oauth2Proxy.oidc.cliClientId: teknoir-cli
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --extra-jwt-issuers=https://auth.teknoir.airgapped/auth/realms/teknoir=teknoir-cli
      - contains:
          path: spec.template.spec.containers[0].args
          content: --skip-jwt-bearer-tokens=true

  - it: follows the domain and the realm name
    set:
      domain: example.test
      realm.name: other
      oauth2Proxy.oidc.cliClientId: teknoir-cli
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --extra-jwt-issuers=https://auth.example.test/auth/realms/other=teknoir-cli
      - notMatchRegex:
          path: spec.template.spec.containers[0].args[1]
          pattern: teknoir\.airgapped

  - it: trims the trailing slash of an explicit issuerUrl
    set:
      oauth2Proxy.oidc.cliClientId: teknoir-cli
      oauth2Proxy.oidc.issuerUrl: https://auth.x.test/auth/realms/foo/
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --extra-jwt-issuers=https://auth.x.test/auth/realms/foo=teknoir-cli

  - it: uses another client id
    set:
      oauth2Proxy.oidc.cliClientId: other-cli
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --extra-jwt-issuers=https://auth.teknoir.airgapped/auth/realms/teknoir=other-cli
