# Values for auth.
domain: "teknoir.airgapped"
namespace: teknoir-auth

keycloak:
  enabled: true
  fullnameOverride: keycloak
  # Pinned (G-09): immutable tag plus the linux/amd64 manifest digest
  # (`crane digest --platform linux/amd64`, never the index digest). keycloakx
  # renders `<repository>@<digest>` and puts `tag` only into the label
  # app.kubernetes.io/version, so the tag is part of `repository` and `tag`
  # repeats it without the digest (a label value cannot hold '@'). With
  # IfNotPresent a restart never pulls a different Keycloak, whose one-way DB
  # migration would run unannounced. sha-29d2ed6a = main-20260421-114315
  # (Keycloak 26.5.3), the image running since the redesign.
  image:
    repository: ghcr.io/teknoir/keycloak-theme:sha-29d2ed6a
    digest: sha256:ab392e6e52789483c63818cbe8919ae0e44b6cf547c17faf8a0f024cc29d35f7
    tag: sha-29d2ed6a
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  service:
    httpPort: 80
  # Keycloak serves under /auth (the keycloakx default, stated here because
  # the issuer URLs in this chart derive from it).
  http:
    relativePath: "/auth"
  database:
    vendor: postgres
    hostname: keycloak-db
    port: 5432
    database: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: password
  proxy:
    mode: xforwarded
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
  startupProbe: |
    httpGet:
      path: /auth/health
      port: http-internal
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 180
    periodSeconds: 5
  # The master-realm admin comes from Secret keycloak-admin (platform-secrets).
  # Keycloak applies it only when it creates the admin; the keycloak-config
  # Job converges an existing admin (see keycloakConfig below).
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-admin
          key: username
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: keycloak-admin
          key: password
    - name: KC_HOSTNAME
      value: auth.teknoir.airgapped
    - name: KC_HOSTNAME_URL
      value: https://auth.teknoir.airgapped
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-db-secret
          key: username

# keycloak-db: Keycloak's PostgreSQL (templates/keycloak-postgres.yaml).
# Pinned to the version that runs today (16.15), amd64 manifest digest; a
# major-version change needs a dump and restore, never just a new tag.
keycloakDb:
  image:
    repository: docker.io/library/postgres
    tag: "16.15"
    digest: sha256:75adc2a65806c96bc0e59030230bfe3f1c1b0d6d8f8181a8913e2b8b53bdc166
    pullPolicy: IfNotPresent

oauth2Proxy:
  enabled: true
  secret:
    existingName: "oauth2-proxy-secret"
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.6.0
  oidc:
    # Default: the issuer of realm `realm.name` (https://auth.<domain>/auth/realms/teknoir).
    issuerUrl: ""
    clientId: teknoir
    # Keycloak is reached over the gateway, whose certificate is signed by the
    # Teknoir root CA. teknoir-root-ca-bundle {ca.crt} holds only the public
    # CA certificate; the node's secrets phase reconciles it from the CA
    # Secret. Mounted non-optional: a missing CA is a visible failure, not a
    # silent TLS error at login. --provider-ca-file loads it for every OIDC
    # call (redeem, discovery of the extra JWT issuer).
    caSecretName: teknoir-root-ca-bundle
    caSecretKey: ca.crt
    # When set, bearer tokens of this client (tnctl) are accepted too, via
    # --extra-jwt-issuers. Off: the client is not in the realm yet, and an
    # extra issuer makes oauth2-proxy run OIDC discovery at startup, so it
    # could not start before the PostSync realm import has created the realm.
    cliClientId: ""
  cookie:
    domain: ""
    name: _teknoir_oauth2_proxy
    sameSite: none
    path: /
    csrfPerRequest: false
    csrfExpire: 10m
    refresh: 1m
    expire: 12h
  redirectUrl: ""
#  whitelistDomains: []
  whitelistDomains:
    - "teknoir.airgapped"
    - "*.teknoir.airgapped"
  authHosts: []
  sharedHost: ""
  emailDomains:
    - "*"
  provider: keycloak-oidc
  pkceMethod: S256
  extraAudiences:
    - account
  allowedRoles: []
  allowedGroups: []
  passAccessToken: true
  sessionCookieMinimal: false
  reverseProxy: true
  redis:
    enabled: true
    # Session store. Pinned to the version that runs today (7.2.16), amd64
    # manifest digest; a restart drops every session either way.
    image:
      repository: docker.io/library/redis
      tag: 7.2.16-alpine
      digest: sha256:84bab713067f5494d94c24e99ae3fa3ae2388c037152edcbcf301f7cfaeb3048
      pullPolicy: IfNotPresent
    host: oauth2-proxy-redis
    port: 6379
    database: 0
    secretName: oauth2-proxy-redis-secret
    passwordKey: password
    connectionUrlKey: connection-url
    storage:
      size: 1Gi
      hostPath: /opt/teknoir/oauth2-proxy/redis
  service:
    port: 4180

istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
    selector:
      istio: ingressgateway
  auth:
    jwksIssuer: ""
    jwksUri: ""
  # Gateway vhosts whose backend authenticates by itself: both the ext_authz
  # check and the Lua login redirect are disabled for them. Items are
  # {gateway: <namespace>/<name>, vhost: <host>:<port>}, e.g.
  # {gateway: istio-system/contoai-gateway, vhost: contoai.site:443} (staging).
  bypassAuth: []

# Test backend behind the gateway (JWT required). Upstream publishes only
# `latest`, so it is pinned by digest alone (amd64 manifest).
httpbin:
  image:
    repository: docker.io/kennethreitz/httpbin
    tag: ""
    digest: sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
    pullPolicy: IfNotPresent
  virtualService:
    hosts: []

# Realm `teknoir` (realm-as-code, files/realm/teknoir.yaml). All platform
# clients live here; the master realm only holds the Keycloak admin.
realm:
  name: teknoir
  displayName: Teknoir
  loginTheme: teknoir-theme
  accessTokenLifespan: 300
  ssoSessionIdleTimeout: 1800
  ssoSessionMaxLifespan: 43200
  defaultClientScopes: [web-origins, acr, profile, roles, email, basic, groups]
  optionalClientScopes: [offline_access]
  # The initial human admin, in group admin (ArgoCD role:admin, Harbor admin,
  # every oauth2-proxy-protected host). Username and initial password come
  # from Secret keycloakConfig.platformAdminSecret (platform-secrets); the
  # email is <username>@<domain>. The password is temporary (forced change at
  # first login) and only set when the import creates the user. The user
  # stays managed: enabled: false disables it once named admins exist.
  platformAdmin:
    enabled: true
    firstName: Platform
    lastName: Admin

# keycloak-config-cli PostSync Job that imports the realm.
keycloakConfig:
  enabled: true
  image:
    repository: docker.io/adorsys/keycloak-config-cli
    tag: 6.5.1-26.5.5
    pullPolicy: IfNotPresent
  # Init step (sh, curl, jq): waits for Keycloak and converges the master
  # admin password to Secret keycloak-admin (files/keycloak-admin-check.sh).
  toolboxImage:
    repository: docker.io/alpine/k8s
    tag: "1.34.11"
    pullPolicy: IfNotPresent
  # Secrets from the platform-secrets chart.
  adminSecret: keycloak-admin
  clientSecretsSecret: keycloak-client-secrets
  # {username, password}: realm.platformAdmin's username and initial password.
  platformAdminSecret: keycloak-platform-admin
  # Env var used in the realm file -> key of clientSecretsSecret.
  clientSecretEnv:
    TEKNOIR_CLIENT_SECRET: teknoir
    ARGOCD_CLIENT_SECRET: argocd
    HARBOR_CLIENT_SECRET: harbor
    USER_CONTROLLER_CLIENT_SECRET: user-controller
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  javaOpts: "-XX:MaxRAMPercentage=75"
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
