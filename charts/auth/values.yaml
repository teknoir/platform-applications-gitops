# GitOps values for auth.
# Configured for EKS/AKS Auto Mode with Karpenter.
# PDBs and replicas are set to ensure high availability during aggressive node consolidation.
domain: "teknoir.online"
namespace: teknoir-auth

keycloak:
  enabled: true
  fullnameOverride: keycloak
  image:
    repository: ghcr.io/teknoir/keycloak-theme
    tag: latest
    pullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  service:
    httpPort: 80
  database:
    vendor: postgres
    hostname: keycloak-db
    port: 5432
    database: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: password
  proxy:
    mode: xforwarded
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
  startupProbe: |
    httpGet:
      path: /auth/health
      port: http-internal
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 180
    periodSeconds: 5
  resources:
    limits:
      cpu: "2"
      memory: 3Gi
    requests:
      cpu: 500m
      memory: 1Gi
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: change-me
    - name: KC_HOSTNAME
      value: auth.teknoir.online
    - name: KC_HOSTNAME_URL
      value: https://auth.teknoir.online
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-db-secret
          key: username

oauth2Proxy:
  enabled: true
  secret:
    existingName: "oauth2-proxy-secret"
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.6.0
  oidc:
    issuerUrl: ""
    clientId: teknoir
  cookie:
    domain: ""
    name: _teknoir_oauth2_proxy
    sameSite: none
    path: /
    csrfPerRequest: false
    csrfExpire: 10m
    refresh: 1m
    expire: 12h
  redirectUrl: ""
#  whitelistDomains: []
  whitelistDomains:
    - "teknoir.online"
    - "*.teknoir.online"
  authHosts: []
  sharedHost: ""
  emailDomains:
    - "*"
  provider: keycloak-oidc
  pkceMethod: S256
  extraAudiences:
    - master-realm
    - account
  allowedRoles: []
  allowedGroups: []
  passAccessToken: true
  sessionCookieMinimal: false
  reverseProxy: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  redis:
    enabled: true
    host: oauth2-proxy-redis
    port: 6379
    database: 0
    secretName: oauth2-proxy-redis-secret
    passwordKey: password
    connectionUrlKey: connection-url
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    storage:
      size: 1Gi
  service:
    port: 4180

keycloakPostgres:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi

istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
    selector:
      istio: ingressgateway
  auth:
    jwksIssuer: ""
    jwksUri: ""

httpbin:
  image:
    repository: docker.io/kennethreitz/httpbin
    tag: latest
  resources:
    limits:
      cpu: 200m
      memory: 128Mi
    requests:
      cpu: 25m
      memory: 64Mi
  virtualService:
    hosts: []
