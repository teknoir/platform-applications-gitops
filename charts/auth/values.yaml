# Values for auth.
domain: "teknoir.cloud"
namespace: teknoir-auth

keycloak:
  enabled: true
  fullnameOverride: keycloak
  image:
    repository: ghcr.io/teknoir/keycloak-theme
    # The keycloakx chart puts image.tag into the app.kubernetes.io/version label, so the pin is the
    # separate digest value (tag@digest in a label is invalid). scripts/pin-image style "digest".
    tag: "latest"
    digest: "sha256:cb44f58c427e2064f21a0a1d2f8de242befcfd2ba5ceae9ef9874d00ca622a9c"
    pullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  service:
    httpPort: 80
  database:
    vendor: postgres
    hostname: keycloak-db
    port: 5432
    database: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: password
  proxy:
    mode: xforwarded
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
  startupProbe: |
    httpGet:
      path: /auth/health
      port: http-internal
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 180
    periodSeconds: 5
  # No KC_BOOTSTRAP_ADMIN_*: a bootstrap admin with a password in Git would be an open admin
  # on every fresh install. Admin access is the keycloak-config-cli service client that
  # keycloak-admin-bootstrap creates (templates/keycloak-config.yaml).
  extraEnv: |
    - name: KC_HOSTNAME
      value: auth.teknoir.cloud
    - name: KC_HOSTNAME_URL
      value: https://auth.teknoir.cloud
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-db-secret
          key: username

oauth2Proxy:
  enabled: true
  secret:
    existingName: "oauth2-proxy-secret"
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.6.0
  oidc:
    issuerUrl: ""
    clientId: teknoir
    # Bearer tokens of this realm client (tnctl) are accepted too, via
    # --extra-jwt-issuers (same issuer as the flags above). Empty disables.
    # An extra issuer makes oauth2-proxy run OIDC discovery at startup, so the
    # realm must have the client before it starts.
    cliClientId: teknoir-cli
  cookie:
    domain: ""
    # Renamed when staging moved to vpro (2026-10-16): sessions from r415 were signed with
    # the old cookie secret, and oauth2-proxy answers such a cookie with HTTP 500 instead of
    # a new login. A new name makes browsers ignore the stale cookie.
    name: _teknoir_oauth2_proxy_v2
    sameSite: none
    path: /
    csrfPerRequest: false
    csrfExpire: 10m
    refresh: 1m
    # Same length as the Keycloak ssoSessionMaxLifespan (files/realm/master.yaml). The cookie slides on
    # refresh while the SSO maximum is absolute, so a cookie can outlive its SSO session (a dead session).
    expire: 168h
  redirectUrl: ""
#  whitelistDomains: []
  whitelistDomains:
    - "teknoir.cloud"
    - "*.teknoir.cloud"
  authHosts: []
  sharedHost: ""
  emailDomains:
    - "*"
  provider: keycloak-oidc
  pkceMethod: S256
  extraAudiences:
    - master-realm
    - account
  allowedRoles: []
  allowedGroups: []
  passAccessToken: true
  sessionCookieMinimal: false
  reverseProxy: true
  redis:
    enabled: true
    host: oauth2-proxy-redis
    port: 6379
    database: 0
    secretName: oauth2-proxy-redis-secret
    passwordKey: password
    connectionUrlKey: connection-url
    storage:
      size: 1Gi
      hostPath: /opt/teknoir/oauth2-proxy/redis
  service:
    port: 4180

istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
    selector:
      istio: ingressgateway
  auth:
    jwksIssuer: ""
    jwksUri: ""
  # Edge vhosts that must bypass this chart's oauth2-proxy ext_authz + Lua
  # filters because their backend authenticates them. contoai.site is fronted by
  # istio-system/contoai-gateway (charts/istio) and authenticated by the contoai
  # cluster's own oauth2-proxy. Without this, r415 intercepts the request and
  # redirects to https://teknoir.cloud/oauth2/start.
  bypassAuth:
    - gateway: istio-system/contoai-gateway
      vhost: contoai.site:443

httpbin:
  image:
    repository: docker.io/kennethreitz/httpbin
    tag: "latest@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b"
  virtualService:
    hosts: []

# Realm-as-code for realm master (templates/keycloak-config.yaml, files/realm/master.yaml):
# keycloak-config-cli imports the listed groups, clients and users after every sync.
keycloakConfig:
  enabled: true
  relativePath: /auth
  # Always Keycloak admin (realm role admin) and in group admin.
  platformOwners:
    - anders.aslund@teknoir.ai
  image:
    repository: docker.io/adorsys/keycloak-config-cli
    tag: 6.5.1-26.5.5
    pullPolicy: IfNotPresent
  toolboxImage:
    repository: docker.io/alpine/k8s
    tag: "1.34.11"
    pullPolicy: IfNotPresent
  # platform-secrets: canonical client secrets (keys = client ids).
  clientSecretsSecret: keycloak-client-secrets
  # Env var used in the realm file -> key of clientSecretsSecret.
  clientSecretEnv:
    KEYCLOAK_CONFIG_CLI_CLIENT_SECRET: keycloak-config-cli
    ARGO_WORKFLOWS_CLIENT_SECRET: argo-workflows
    HARBOR_CLIENT_SECRET: harbor
    TEKNOIR_CLIENT_SECRET: teknoir
    ARGOCD_CLIENT_SECRET: argocd
  backoffLimit: 4
  activeDeadlineSeconds: 1800
  javaOpts: "-XX:MaxRAMPercentage=75"
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
