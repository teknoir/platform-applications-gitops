# Values for auth.
domain: "teknoir.airgapped"
namespace: teknoir-auth

keycloak:
  enabled: true
  fullnameOverride: keycloak
  image:
    repository: ghcr.io/teknoir/keycloak-theme
    tag: latest
    pullPolicy: Always
  imagePullSecrets: []
  service:
    httpPort: 80
  database:
    vendor: postgres
    hostname: keycloak-db
    port: 5432
    database: keycloak
    existingSecret: keycloak-db-secret
    existingSecretKey: password
  proxy:
    mode: xforwarded
  command:
    - "/opt/keycloak/bin/kc.sh"
  args:
    - "start"
    - "--http-enabled=true"
    - "--http-port=8080"
    - "--hostname-strict=false"
  startupProbe: |
    httpGet:
      path: /auth/health
      port: http-internal
      scheme: HTTP
    initialDelaySeconds: 30
    timeoutSeconds: 5
    failureThreshold: 180
    periodSeconds: 5
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: change-me
    - name: KC_HOSTNAME
      value: auth.teknoir.airgapped
    - name: KC_HOSTNAME_URL
      value: https://auth.teknoir.airgapped
    - name: KC_DB_USERNAME
      valueFrom:
        secretKeyRef:
          name: keycloak-db-secret
          key: username

oauth2Proxy:
  enabled: true
  secret:
    existingName: "oauth2-proxy-secret"
  image:
    repository: quay.io/oauth2-proxy/oauth2-proxy
    tag: v7.15.4
  oidc:
    issuerUrl: ""
    clientId: teknoir
    # Existing Secret (owned by the infra repo — generated by
    # scripts/gen-local-ca-secret.sh and deployed into this namespace as an
    # opaque ca.crt-only secret) holding the CA bundle used to verify the OIDC
    # provider (Keycloak) TLS certificate. In the airgapped setup Keycloak is
    # reached over the Istio gateway's wildcard cert signed by the Teknoir Local
    # Root CA, which is not present in the container's default trust store. When
    # caSecretName is set, the secret is mounted at /etc/ssl/teknoir and passed
    # to oauth2-proxy via --provider-ca-file (see templates/oauth2-proxy.yaml).
    # This is the same CA embedded in ArgoCD's OIDC config, but referenced here
    # rather than inlined so the infra repo stays the single source of truth.
    # Leave caSecretName empty to use only the system trust store.
    caSecretName: teknoir-root-ca-bundle
    caSecretKey: ca.crt
  cookie:
    domain: ""
    name: _teknoir_oauth2_proxy
    sameSite: none
    path: /
    csrfPerRequest: false
    csrfExpire: 10m
    refresh: 1m
    expire: 12h
  redirectUrl: ""
#  whitelistDomains: []
  whitelistDomains:
    - "teknoir.airgapped"
    - "*.teknoir.airgapped"
  authHosts: []
  sharedHost: ""
  emailDomains:
    - "*"
  provider: keycloak-oidc
  pkceMethod: S256
  extraAudiences:
    - master-realm
    - account
  allowedRoles: []
  allowedGroups: []
  passAccessToken: true
  sessionCookieMinimal: false
  reverseProxy: true
  redis:
    enabled: true
    host: oauth2-proxy-redis
    port: 6379
    database: 0
    secretName: oauth2-proxy-redis-secret
    passwordKey: password
    connectionUrlKey: connection-url
    storage:
      size: 1Gi
      hostPath: /opt/teknoir/oauth2-proxy/redis
  service:
    port: 4180

istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
    selector:
      istio: ingressgateway
  auth:
    jwksIssuer: ""
    jwksUri: ""

httpbin:
  image:
    repository: docker.io/kennethreitz/httpbin
    tag: latest
  virtualService:
    hosts: []
