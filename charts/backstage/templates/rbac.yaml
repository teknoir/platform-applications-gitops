---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.name }}-api-resources-role
rules:
- apiGroups:
  - '*'
  resources:
  - devices
  - users
  - profiles
  - devstudios
  - notebooks
  - claims
  - claimsets
  - helmcharts
  - virtualservices
  - deviceapplicationsets
  - robots
  - robottypes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
# Virtual devices: the advisory allowance check reads <teamspace>-vdev/vdev-quota.
- apiGroups:
  - ""
  resources:
  - resourcequotas
  verbs:
  - get
  - list
- apiGroups:
  - teknoir.org
  resources:
  - devices/status
  - users/status
  - profiles/status
  - devstudios/status
  - notebooks/status
  - deviceapplicationsets/status
  - robots/status
  - robottypes/status
  verbs:
  - get
# Next-gen fleet pages: the "needs you" list reads events; Connect records who turned browser access on or off as
# an Event on the Device (TunnelAccessEnabled/Disabled).
- apiGroups:
  - ""
  - events.k8s.io
  resources:
  - events
  verbs:
  - get
  - list
  - watch
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-api-resources-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.name }}-api-resources-role
subjects:
- kind: ServiceAccount
  name: {{ .Values.name }}-api
  namespace: {{ .Release.Namespace }}

