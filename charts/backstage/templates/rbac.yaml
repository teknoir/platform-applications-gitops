---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.name }}-api-teknoir-admin-rolebinding
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: teknoir-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Values.name }}-api
    namespace: {{ .Release.Namespace }}