---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstage.replicas }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      imagePullSecrets:
        {{- toYaml .Values.backstage.imagePullSecrets | nindent 8 }}
      containers:
        - name: backstage
          image: {{ .Values.backstage.image }}
          imagePullPolicy: {{ .Values.backstage.imagePullPolicy }}
          ports:
            - name: http-web
              containerPort: 80
          env:
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstageApi.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backstage-api
  template:
    metadata:
      labels:
        app: backstage-api
    spec:
      {{- with .Values.backstageApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: backstage-auth-secrets
          secret:
            secretName: {{ .Values.backstageApi.secrets.authSecretsName }}
        - name: techdocs-persistent-storage
          persistentVolumeClaim:
            claimName: backstage-techdocs
        - name: backstage-app-config
          configMap:
            name: backstage-app-config
      serviceAccountName: backstage-api
      imagePullSecrets:
        {{- toYaml .Values.backstageApi.imagePullSecrets | nindent 8 }}
      containers:
        - name: backstage-api
          {{- with .Values.backstageApi.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.backstageApi.image }}
          imagePullPolicy: {{ .Values.backstageApi.imagePullPolicy }}
          ports:
            - name: http-api
              containerPort: 7007
            - name: http-metrics
              containerPort: 9464
          envFrom:
            - secretRef:
                name: {{ .Values.backstageApi.secrets.postgresSecretName }}
            - secretRef:
                name: {{ .Values.backstageApi.secrets.keycloakSecretName }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.backstageApi.googleApplicationCredentials | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.backstageApi.nodeOptions | quote }}
            - name: SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-sa-token
                  key: token
          command:
            - /bin/bash
            - '-c'
            - |
              node packages/backend \
              --config app-config.yaml \
              --config app-config.prod-env.yaml
          volumeMounts:
            - name: backstage-auth-secrets
              readOnly: true
              mountPath: /app/secrets
            - name: techdocs-persistent-storage
              mountPath: /app/techdocs
            - name: backstage-app-config
              mountPath: /app/app-config.prod-env.yaml
              subPath: app-config.prod-env.yaml
          readinessProbe:
            initialDelaySeconds: 60
            httpGet:
              port: 7007
              path: /api/healthcheck
          livenessProbe:
            initialDelaySeconds: 60
            httpGet:
              port: 7007
              path: /api/healthcheck
