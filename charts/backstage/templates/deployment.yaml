---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstage.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.name }}
      annotations:
        # Backstage reads its config only at start: roll the pods when the app-config changes.
        checksum/app-config: {{ include (print $.Template.BasePath "/configmap-app-config.yaml") . | sha256sum }}
    spec:
      imagePullSecrets:
        {{- toYaml .Values.backstage.imagePullSecrets | nindent 8 }}
      containers:
        - name: backstage
          image: {{ .Values.backstage.image }}
          imagePullPolicy: {{ .Values.backstage.imagePullPolicy }}
          ports:
            - name: http-web
              containerPort: 80
          env:
            - name: APP_CONFIG_app_baseUrl
              value: "https://{{ .Values.config.host | default .Values.config.domain }}"
            - name: APP_CONFIG_backend_baseUrl
              value: "https://{{ .Values.config.host | default .Values.config.domain }}"
            {{- if (.Values.virtualDevices).enabled }}
            - name: APP_CONFIG_teknoir_virtualDevices_enabled
              value: "true"
            {{- end }}
            {{- if (.Values.ztna).enabled }}
            - name: APP_CONFIG_teknoir_ztna_enabled
              value: "true"
            {{- end }}
            {{- if (.Values.fleet).classicUrl }}
            - name: APP_CONFIG_teknoir_fleet_classicUrl
              value: {{ .Values.fleet.classicUrl | quote }}
            {{- end }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
          {{- with .Values.backstage.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstageApi.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.name }}-api
  template:
    metadata:
      labels:
        app: {{ .Values.name }}-api
      annotations:
        # Backstage reads its config only at start: roll the pods when the app-config changes.
        checksum/app-config: {{ include (print $.Template.BasePath "/configmap-app-config.yaml") . | sha256sum }}
    spec:
      {{- with .Values.backstageApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: backstage-auth-secrets
          secret:
            secretName: {{ .Values.backstageApi.secrets.authSecretsName }}
        - name: techdocs-persistent-storage
          persistentVolumeClaim:
            claimName: {{ .Values.name }}-techdocs
        - name: backstage-app-config
          configMap:
            name: {{ .Values.name }}-app-config
        {{- if (.Values.ztna).enabled }}
        # Token for the ZTNA hub's live status port only: its own audience, so the hub never
        # holds a token the API server accepts.
        - name: ztna-status-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: teknoir-ztna-status
                  expirationSeconds: 3600
                  path: token
        {{- end }}
      serviceAccountName: {{ .Values.name }}-api
      imagePullSecrets:
        {{- toYaml .Values.backstageApi.imagePullSecrets | nindent 8 }}
      containers:
        - name: backstage-api
          {{- with .Values.backstageApi.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.backstageApi.image }}
          imagePullPolicy: {{ .Values.backstageApi.imagePullPolicy }}
          ports:
            - name: http-api
              containerPort: 7007
            - name: http-metrics
              containerPort: 9464
          envFrom:
            - secretRef:
                name: {{ .Values.backstageApi.secrets.postgresSecretName }}
            - secretRef:
                name: {{ .Values.backstageApi.secrets.keycloakSecretName }}
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.backstageApi.googleApplicationCredentials | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.backstageApi.nodeOptions | quote }}
            - name: SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.name }}-k8s-sa-token
                  key: token
          command:
            - /bin/bash
            - '-c'
            - |
              node packages/backend \
              --config app-config.yaml \
              --config app-config.prod-env.yaml
          volumeMounts:
            - name: backstage-auth-secrets
              readOnly: true
              mountPath: /app/secrets
            - name: techdocs-persistent-storage
              mountPath: /app/techdocs
            - name: backstage-app-config
              mountPath: /app/app-config.prod-env.yaml
              subPath: app-config.prod-env.yaml
            {{- if (.Values.ztna).enabled }}
            - name: ztna-status-token
              readOnly: true
              mountPath: /var/run/secrets/ztna-status
            {{- end }}
          {{- with .Values.backstageApi.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            initialDelaySeconds: 60
            httpGet:
              port: 7007
              path: /api/healthcheck
          livenessProbe:
            initialDelaySeconds: 60
            httpGet:
              port: 7007
              path: /api/healthcheck
