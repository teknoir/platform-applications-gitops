---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstage.replicas }}
  selector:
    matchLabels:
      app: backstage
  template:
    metadata:
      labels:
        app: backstage
    spec:
      {{- with .Values.backstage.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backstage
          image: {{ .Values.backstage.image }}
          imagePullPolicy: {{ .Values.backstage.imagePullPolicy }}
          ports:
            - name: http-web
              containerPort: 80
          env:
            - name: APP_CONFIG_app_baseUrl
              value: "https://{{ .Values.config.domain }}"
            - name: APP_CONFIG_backend_baseUrl
              value: "https://{{ .Values.config.domain }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            {{- /* Frontend runtime config teknoir.auth.* (docker/inject-config.sh
            splits the key on "_"): the logout ends the Keycloak session too.
            Without config.oidc.realm the frontend keeps the legacy logout. */}}
            {{- $oidc := .Values.config.oidc | default dict }}
            {{- if $oidc.realm }}
            - name: APP_CONFIG_teknoir_auth_issuer
              value: {{ include "backstage.oidcIssuer" . | quote }}
            - name: APP_CONFIG_teknoir_auth_clientId
              value: {{ $oidc.clientId | default "teknoir" | quote }}
            {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage-api
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.backstageApi.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backstage-api
  template:
    metadata:
      labels:
        app: backstage-api
    spec:
      {{- with .Values.backstageApi.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: backstage-auth-secrets
          secret:
            secretName: {{ .Values.backstageApi.secrets.authSecretsName }}
        {{- with .Values.backstageApi.caBundle }}
        - name: teknoir-ca
          secret:
            secretName: {{ .secretName }}
            optional: true
            items:
              - key: {{ .key }}
                path: ca.crt
        {{- end }}
        - name: techdocs-persistent-storage
          persistentVolumeClaim:
            claimName: backstage-techdocs
        - name: backstage-app-config
          configMap:
            name: backstage-app-config
      serviceAccountName: backstage-api
      {{- with .Values.backstageApi.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $wait := .Values.backstageApi.waitForDb | default dict }}
      {{- if $wait.enabled }}
      {{- /* backstage-api gives up on its first database connect (ECONNRESET,
      no retry) and then stays unready until the startupProbe restarts it
      (~10 min). After a node reboot it can start before backstage-postgres,
      so wait here. Runs after the native istio-proxy sidecar (injected
      first), so the mTLS the postgres AuthorizationPolicy requires works.
      Bounded: on timeout the app starts anyway and behaves as before. The
      image defaults to the postgres image (pg_isready), already mirrored.
      -U/-d are required: the container runs as uid 1000 without a passwd
      entry, and pg_isready then reports "no attempt" (rc 3) forever. */}}
      initContainers:
        - name: wait-for-postgres
          image: {{ $wait.image | default .Values.postgres.image }}
          imagePullPolicy: {{ $wait.imagePullPolicy | default .Values.postgres.imagePullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              i=0
              while [ "$i" -lt {{ $wait.attempts | default 120 }} ]; do
                if pg_isready -q -h backstage-postgres -p 5432 -U backstage -d postgres; then
                  echo "backstage-postgres accepts connections"
                  exit 0
                fi
                i=$((i + 1))
                sleep {{ $wait.intervalSeconds | default 5 }}
              done
              echo "backstage-postgres not ready after {{ mul ($wait.attempts | default 120) ($wait.intervalSeconds | default 5) }}s; starting anyway"
              exit 0
      {{- end }}
      containers:
        - name: backstage-api
          {{- with .Values.backstageApi.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: {{ .Values.backstageApi.image }}
          imagePullPolicy: {{ .Values.backstageApi.imagePullPolicy }}
          ports:
            - name: http-api
              containerPort: 7007
            - name: http-metrics
              containerPort: 9464
          envFrom:
            - secretRef:
                name: {{ .Values.backstageApi.secrets.postgresSecretName }}
            - secretRef:
                name: {{ .Values.backstageApi.secrets.keycloakSecretName }}
                optional: true
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: {{ .Values.backstageApi.googleApplicationCredentials | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.config.prometheusUrl | quote }}
            - name: NODE_OPTIONS
              value: {{ .Values.backstageApi.nodeOptions | quote }}
            {{- with .Values.backstageApi.caBundle }}
            - name: NODE_EXTRA_CA_CERTS
              value: {{ printf "%s/ca.crt" .mountPath | quote }}
            {{- end }}
            - name: SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backstage-k8s-sa-token
                  key: token
          command:
            - /bin/bash
            - '-c'
            - |
              node packages/backend \
              --config app-config.yaml \
              --config app-config.prod-env.yaml
          volumeMounts:
            - name: backstage-auth-secrets
              readOnly: true
              mountPath: /app/secrets
            - name: techdocs-persistent-storage
              mountPath: /app/techdocs
            - name: backstage-app-config
              mountPath: /app/app-config.prod-env.yaml
              subPath: app-config.prod-env.yaml
            {{- with .Values.backstageApi.caBundle }}
            - name: teknoir-ca
              mountPath: {{ .mountPath }}
              readOnly: true
            {{- end }}
          {{- with .Values.backstageApi.probes }}
          {{- toYaml . | nindent 10 }}
          {{- end }}
