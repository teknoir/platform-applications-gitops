---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-auth-policy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
  action: ALLOW
  rules:
    # Allow calls only from gateway, no internal calls
    - from:
        - source:
            principals: [ "cluster.local/ns/{{ .Values.istio.ingressNamespace }}/sa/{{ .Values.istio.ingressServiceAccount }}" ]

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-api-auth-policy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}-api
  action: ALLOW
  rules:
    # Allow calls only from gateway, no internal calls
    - from:
        - source:
            principals: [ "cluster.local/ns/{{ .Values.istio.ingressNamespace }}/sa/{{ .Values.istio.ingressServiceAccount }}" ]
    # Allow calls from all namespaces to the catalog API and auth refresh endpoint
    # These endpoints are portected by Backstage auth system
    - from:
        - source:
            namespaces: [ '*' ]
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/api/catalog/entities/*", "/api/auth/teknoir/refresh"]
      when:
        - key: request.auth.principal
          notValues: [ "cluster.local/ns/{{ .Values.istio.ingressNamespace }}/sa/{{ .Values.istio.ingressServiceAccount }}" ]
{{- if and (.Values.teknoirBots).enabled ((.Values.teknoirBots).agent).enabled }}
    # TeknoirBot API: the public gateway (tb-api.<domain>:8085, in-cluster only) reaches the bot routes and nothing else.
    - from:
        - source:
            principals: [ "cluster.local/ns/{{ .Values.istio.ingressNamespace }}/sa/{{ .Values.istio.publicIngressServiceAccount }}" ]
      to:
        - operation:
            paths: [ "/api/device/bot/*" ]

---
# The bot key is unusable through the main gateway (<domain>:443): the bot routes are refused from it. Backstage also
# refuses a bot request whose Host is not tb-api.<domain> (Express routing is case-insensitive, Istio paths are not).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-api-bot-deny
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}-api
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals: [ "cluster.local/ns/{{ .Values.istio.ingressNamespace }}/sa/{{ .Values.istio.publicIngressServiceAccount }}" ]
      to:
        - operation:
            paths: [ "/api/device/bot", "/api/device/bot/*" ]
{{- end }}

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.name }}-postgres-allow
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}-postgres
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}
