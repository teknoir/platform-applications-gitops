---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: backstage-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: backstage-postgres
spec:
  serviceName: backstage-postgres
  replicas: {{ .Values.postgres.replicas }}
  selector:
    matchLabels:
      app: backstage-postgres
  template:
    metadata:
      labels:
        app: backstage-postgres
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9187"
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.postgres.imagePullPolicy }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          readinessProbe:
            exec:
              command: ["psql", "-U", "backstage", "-d", "postgres", "-c", "SELECT 1"]
            initialDelaySeconds: 15
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["psql", "-U", "backstage", "-d", "postgres", "-c", "SELECT 1"]
            initialDelaySeconds: 45
            timeoutSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          envFrom:
            - secretRef:
                name: {{ .Values.backstageApi.secrets.postgresSecretName }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
        - name: prometheus-exporter
          image: {{ .Values.postgres.exporter.image }}
          args: ["--no-collector.stat_bgwriter"]
          imagePullPolicy: {{ .Values.postgres.exporter.imagePullPolicy }}
          resources:
            {{- toYaml .Values.postgres.exporter.resources | nindent 12 }}
          ports:
            - name: metrics
              containerPort: 9187
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.backstageApi.secrets.postgresSecretName }}
          env:
            - name: DATA_SOURCE_URI
              value: "localhost:5432/postgres?sslmode=disable"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
