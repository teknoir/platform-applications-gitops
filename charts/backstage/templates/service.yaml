---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  ports:
    - name: http-web
      appProtocol: http
      port: 80
      targetPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}-api
spec:
  selector:
    app: {{ .Values.name }}-api
  ports:
    - name: http-api
      appProtocol: http
      port: 80
      targetPort: 7007
    - name: http-metrics
      appProtocol: http
      port: 9464
      targetPort: 9464
