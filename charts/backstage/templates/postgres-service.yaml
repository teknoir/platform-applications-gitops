---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.name }}-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app: {{ .Values.name }}-postgres
