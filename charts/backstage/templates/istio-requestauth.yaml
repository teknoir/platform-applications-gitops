---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: backstage-request-auth
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: backstage
  jwtRules:
    - issuer: {{ include "backstage.oidcIssuer" . | quote }}
      jwksUri: {{ printf "%s/protocol/openid-connect/certs" (include "backstage.oidcIssuer" .) | quote }}
      outputPayloadToHeader: verified-jwt
      fromHeaders:
        {{- range .Values.istio.jwt.fromHeaders }}
        - name: {{ .name }}
        {{- end }}

---
apiVersion: security.istio.io/v1beta1
kind: RequestAuthentication
metadata:
  name: backstage-api-request-auth
  namespace: {{ .Release.Namespace }}
spec:
