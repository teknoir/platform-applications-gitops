apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-app-config
  namespace: {{ .Release.Namespace }}
data:
  app-config.prod-env.yaml: |
    app:
      baseUrl: https://{{ .Values.config.host | default .Values.config.domain }}

    backend:
      auth:
        externalAccess:
          - type: jwks
            options:
              url: https://auth.{{ .Values.config.domain }}/auth/realms/master/protocol/openid-connect/certs
              issuer: https://auth.{{ .Values.config.domain }}/auth/realms/master
              algorithm: RS256
              audience: teknoir-cli
              subjectPrefix: keycloak
{{- with .Values.config.externalAccess.accessRestrictions }}
{{- $seen := dict }}
{{- range . }}
{{- if hasKey $seen .plugin }}
{{- fail (printf "config.externalAccess.accessRestrictions: plugin %q listed twice; Backstage refuses a duplicate at start (use one entry with a permission list)" .plugin) }}
{{- end }}
{{- $_ := set $seen .plugin true }}
{{- end }}
            accessRestrictions:
{{- toYaml . | nindent 14 }}
{{- end }}
        keys:
          - $include: /app/secrets/backend-auth-backstage-secrets.yaml
      baseUrl: https://{{ .Values.config.host | default .Values.config.domain }}
{{- if ne .Values.name "backstage" }}
      # The image's app-config.yaml points at the Service "backstage-postgres"; another instance
      # must use its own database, not the one of the instance named backstage.
      database:
        connection:
          host: {{ .Values.name }}-postgres
{{- end }}

    scaffolder:
      customActions:
        domain: {{ .Values.config.domain }}
        projectId: teknoir

    teknoir:
      projectId: teknoir
      domain: {{ .Values.config.domain }}
{{- with .Values.virtualDevices }}
      virtualDevices:
        enabled: {{ .enabled | default false }}
        {{- with .presets }}
        presets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .custom }}
        custom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
{{- $fleet := .Values.fleet | default dict }}
{{- $access := $fleet.access | default dict }}
{{- if or $fleet.prometheusUrlTemplate $access.enabled }}
      fleet:
{{- with $fleet.prometheusUrlTemplate }}
        prometheusUrlTemplate: {{ . | quote }}
{{- end }}
{{- if $access.enabled }}
        # Connect: web terminal and device apps over Tunneling (wgt-/wgs- hosts), plans/nextgen/app-tunnels.md.
        # writes turns on "enable on first use"; it needs this instance to run as the SA the ztna VAP admits.
        access:
          enabled: true
          tunnelDomain: {{ $access.tunnelDomain | default .Values.config.domain | quote }}
          writes: {{ $access.writes | default false }}
          maxPerTeamspace: {{ $access.maxPerTeamspace | default 25 }}
{{- end }}
{{- end }}
{{- if (.Values.ztna).enabled }}
      # WireGuard (ZTNA) tunnels: charts/app-of-apps passes ztna.enabled to this Application.
      ztna:
        enabled: true
{{- end }}

{{- with (.Values.catalog).orphanStrategy }}
    catalog:
      # delete: entities that no provider or location emits any more are removed from the catalog
      # (Backstage default: keep, which leaves them as orphans).
      orphanStrategy: {{ . }}
{{- end }}

    integrations:
      github:
        - host: github.com
          apps:
            - $include: {{ .Values.backstageApi.githubAppSecretPath }}
