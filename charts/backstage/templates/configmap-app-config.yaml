apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-app-config
  namespace: {{ .Release.Namespace }}
data:
  app-config.prod-env.yaml: |
    app:
      baseUrl: https://{{ .Values.config.domain }}

    backend:
      auth:
        externalAccess:
          - type: jwks
            options:
              url: {{ include "backstage.oidcIssuer" . }}/protocol/openid-connect/certs
              issuer: {{ include "backstage.oidcIssuer" . }}
              algorithm: RS256
              audience: teknoir-cli
              subjectPrefix: keycloak
{{- $restrictions := (.Values.externalAccess | default dict).accessRestrictions }}
{{- if not $restrictions }}
{{- fail "externalAccess.accessRestrictions must not be empty: an unrestricted externalAccess token is a service principal that the permission framework allows everything, /api/kubernetes/proxy included" }}
{{- end }}
            accessRestrictions:
              {{- toYaml $restrictions | nindent 14 }}
        keys:
          - $include: /app/secrets/backend-auth-backstage-secrets.yaml
      baseUrl: https://{{ .Values.config.domain }}

    scaffolder:
      customActions:
        domain: {{ .Values.config.domain }}
        projectId: teknoir

    teknoir:
      projectId: teknoir
      domain: {{ .Values.config.domain }}
{{- /*
catalog.k8sProviderSchedules: each provider gets a one-entry array with only a
schedule, which replaces the image's array. Restricted to providers that read
nothing else from their entries (packages/backend/src/plugins/providers/*).
*/}}
{{- $scheduleOnly := list "users" "profiles" "roles" "orgtree" "services" "devices" "deviceapplicationsets" }}
{{- $schedules := (.Values.catalog | default dict).k8sProviderSchedules | default dict }}
{{- if $schedules }}

    catalog:
      providers:
        k8s:
{{- range $name, $schedule := $schedules }}
{{- if not (has $name $scheduleOnly) }}
{{- fail (printf "catalog.k8sProviderSchedules.%s: only these providers hold nothing but a schedule and can be overridden: %s" $name (join ", " $scheduleOnly)) }}
{{- end }}
{{- if not (kindIs "map" $schedule) }}
{{- fail (printf "catalog.k8sProviderSchedules.%s must be a map with frequency and timeout" $name) }}
{{- end }}
{{- if not (and $schedule.frequency $schedule.timeout) }}
{{- fail (printf "catalog.k8sProviderSchedules.%s needs both frequency and timeout (Backstage requires them)" $name) }}
{{- end }}
          {{ $name }}:
            - schedule:
                {{- toYaml $schedule | nindent 16 }}
{{- end }}
{{- end }}

{{- if .Values.backstageApi.github.enabled }}

    integrations:
      github:
        - host: github.com
          apps:
            - $include: {{ .Values.backstageApi.githubAppSecretPath }}
{{- end }}
{{- $k8sTypes := ((.Values.rbac | default dict).kubernetesPlugin | default dict).objectTypes }}
{{- if $k8sTypes }}

    # Only the object types templates/rbac.yaml lets backstage-api read.
    kubernetes:
      objectTypes:
        {{- toYaml $k8sTypes | nindent 8 }}
{{- end }}
