apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-app-config
  namespace: {{ .Release.Namespace }}
data:
  app-config.prod-env.yaml: |
    app:
      baseUrl: https://{{ .Values.config.host | default .Values.config.domain }}

    backend:
      auth:
        externalAccess:
          - type: jwks
            options:
              url: https://auth.{{ .Values.config.domain }}/auth/realms/master/protocol/openid-connect/certs
              issuer: https://auth.{{ .Values.config.domain }}/auth/realms/master
              algorithm: RS256
              audience: teknoir-cli
              subjectPrefix: keycloak
{{- with .Values.config.externalAccess.accessRestrictions }}
{{- $seen := dict }}
{{- range . }}
{{- if hasKey $seen .plugin }}
{{- fail (printf "config.externalAccess.accessRestrictions: plugin %q listed twice; Backstage refuses a duplicate at start (use one entry with a permission list)" .plugin) }}
{{- end }}
{{- $_ := set $seen .plugin true }}
{{- end }}
            accessRestrictions:
{{- toYaml . | nindent 14 }}
{{- end }}
        keys:
          - $include: /app/secrets/backend-auth-backstage-secrets.yaml
      baseUrl: https://{{ .Values.config.host | default .Values.config.domain }}
{{- if ne .Values.name "backstage" }}
      # The image's app-config.yaml points at the Service "backstage-postgres"; another instance
      # must use its own database, not the one of the instance named backstage.
      database:
        connection:
          host: {{ .Values.name }}-postgres
{{- end }}

    scaffolder:
      customActions:
        domain: {{ .Values.config.domain }}
        projectId: teknoir

    teknoir:
      projectId: teknoir
      domain: {{ .Values.config.domain }}
{{- with .Values.virtualDevices }}
      virtualDevices:
        enabled: {{ .enabled | default false }}
        {{- with .presets }}
        presets:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .custom }}
        custom:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}
{{- with .Values.teknoirBots }}
      teknoirBots:
        enabled: {{ .enabled | default false }}
{{- with .agent }}
        # The agent in a bot's computer (plans/teknoirbot/design/agent-mvp-design.md): the bot API
        # /api/device/bot/v1 (fleet, whoami, model proxy) on tb-api.<domain>:8085, in-cluster only.
        agent:
          enabled: {{ .enabled | default false }}
          host: {{ printf "tb-api.%s" $.Values.config.domain | quote }}
{{- if and .enabled .model }}
          model:
            {{- toYaml .model | nindent 12 }}
{{- end }}
{{- end }}
{{- if and .enabled (.agent).enabled (.council).enabled }}
        # The TeknoirBot council chat (plans/teknoirbot/council-mvp.md); needs the bot API above.
        council:
          enabled: true
          retentionDays: {{ .council.retentionDays | default 30 | int }}
{{- end }}
{{- end }}
{{- $fleet := .Values.fleet | default dict }}
{{- $access := $fleet.access | default dict }}
{{- $mirror := $fleet.registryMirror | default dict }}
{{- $mirrorSecret := $mirror.secret | default dict }}
{{- $mirrorHost := $mirror.host | default "" | trim | lower }}
{{- if $mirrorHost }}
{{- /* The backend's own check (registryMirror.ts): it refuses to start on a bad host, so fail at render time instead.
       DNS labels with an optional port 1-65535; never "none" (tnctl reads that as "remove the registries.yaml"). */}}
{{- $hostOnly := regexReplaceAll ":[0-9]+$" $mirrorHost "" }}
{{- $port := trimPrefix ":" (trimPrefix $hostOnly $mirrorHost) }}
{{- $badHost := or (eq $hostOnly "none") (gt (len $hostOnly) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$" $hostOnly)) }}
{{- $badPort := and $port (or (gt (len $port) 5) (lt (atoi $port) 1) (gt (atoi $port) 65535)) }}
{{- if or $badHost $badPort }}
{{- fail (printf "fleet.registryMirror.host must be a host name such as harbor.teknoir.cloud with an optional port 1-65535 (no scheme or path, not none), not %q" $mirror.host) }}
{{- end }}
{{- end }}
{{- if or $fleet.prometheusUrlTemplate $access.enabled $mirrorHost }}
      fleet:
{{- with $fleet.prometheusUrlTemplate }}
        prometheusUrlTemplate: {{ . | quote }}
{{- end }}
{{- if $mirrorHost }}
        # Device credentials carry the teamspace's Harbor pull-through cache (plans/harbor-proxy-staging.md
        # phase 1b): the API reads <teamspace>.username/.password from this one Secret, by name only.
        registryMirror:
          host: {{ $mirrorHost | quote }}
          secret:
            namespace: {{ $mirrorSecret.namespace | default "teknoir-system" | quote }}
            name: {{ $mirrorSecret.name | default "harbor-teamspace-pull" | quote }}
{{- end }}
{{- if $access.enabled }}
        # Connect: web terminal and device apps over Tunneling (wgt-/wgs- hosts), plans/nextgen/app-tunnels.md.
        # writes turns on "enable on first use"; it needs this instance to run as the SA the ztna VAP admits.
        access:
          enabled: true
          tunnelDomain: {{ $access.tunnelDomain | default .Values.config.domain | quote }}
          writes: {{ $access.writes | default false }}
          maxPerTeamspace: {{ $access.maxPerTeamspace | default 25 }}
{{- end }}
{{- end }}
{{- if (.Values.ztna).enabled }}
      # WireGuard (ZTNA) tunnels: charts/app-of-apps passes ztna.enabled to this Application.
      ztna:
        enabled: true
{{- end }}

{{- with (.Values.catalog).orphanStrategy }}
    catalog:
      # delete: entities that no provider or location emits any more are removed from the catalog
      # (Backstage default: keep, which leaves them as orphans).
      orphanStrategy: {{ . }}
{{- end }}

    integrations:
      github:
        - host: github.com
          apps:
            - $include: {{ .Values.backstageApi.githubAppSecretPath }}
