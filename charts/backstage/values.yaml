# GitOps values for backstage

# Parameters from params.env
config:
  domain: "teknoir.airgapped"
  logLevel: info
  prometheusUrl: http://prometheus.__NAMESPACE__.svc.cluster.local:80
  # Keycloak realm whose tokens oauth2-proxy forwards (istio
  # RequestAuthentication) and whose JWKS backs externalAccess. Issuer:
  # https://auth.<domain><basePath>/realms/<realm>; basePath is Keycloak's
  # http-relative-path.
  oidc:
    realm: teknoir
    basePath: /auth
    # Keycloak client of the browser session (oauth2-proxy's client). When
    # realm is set, the frontend gets teknoir.auth.issuer and
    # teknoir.auth.clientId (env APP_CONFIG_teknoir_auth_*), and its logout
    # ends the Keycloak session as well (oauth2-proxy /oauth2/sign_out, then
    # the realm's end_session endpoint). Without realm the frontend keeps the
    # legacy logout URL. Default: teknoir.
    clientId: teknoir

# Catalog: override the schedules of the image's catalog.providers.k8s.<name>
# entity providers. A map <provider> -> Backstage schedule ({frequency,
# timeout}, optionally initialDelay/scope); each entry replaces the image's
# array for that provider (Backstage replaces arrays wholesale). Only the
# providers whose entries hold nothing but a schedule can be overridden
# (users, profiles, roles, orgtree, services, devices,
# deviceapplicationsets); never peripherals, which also carries wsUrl,
# mqttUrl and syncOrgConfig. Default {}: the image's schedules (30 min for
# users and profiles).
#
# teknoir-local: a new User or Profile (e.g. the GitOps teamspace
# teknoir-default, or an owner claim from `teknoir-airgap admin-user`) shows
# up in Backstage within about a minute. A restart never pulls a scheduled
# run forward (next run = min(stored, now + cadence)), so only a short
# cadence makes it fast.
catalog:
  k8sProviderSchedules:
    users:
      frequency: { minutes: 1 }
      timeout: { minutes: 2 }
    profiles:
      frequency: { minutes: 1 }
      timeout: { minutes: 2 }
    roles:
      frequency: { minutes: 5 }
      timeout: { minutes: 3 }
    orgtree:
      frequency: { minutes: 5 }
      timeout: { minutes: 3 }

# Images: <repo>:<immutable tag>@sha256:<linux/amd64 manifest digest>
# (`crane digest --platform linux/amd64 <repo>:<tag>`; never the index digest:
# the airgap bundle pushes only the amd64 manifest to Harbor), IfNotPresent.
# PIN(WP-BS): both images are the CI build of backstage branch r5-backstage at
# 9491c6d8 (SIGN-C4 logout, TS-C7 create-teamspace, SEC-C11 Kubernetes plugin
# for platform admins only, provider-managed sign-in, Debian 12 base).

# Backstage frontend deployment
backstage:
  replicas: 1
  image: ghcr.io/teknoir/backstage-app:sha-9491c6d8@sha256:149fd1228af160b3fc029460822ebfd78481fd6b6c9654c70203cf4bea9bf35a
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # The image's APP_CONFIG_* injection never reaches the frontend (index.html's
  # config script tag wins), so a chart script adds teknoir.* to index.html as
  # window.__APP_CONFIG__ (only with config.oidc.realm). enabled: false removes
  # it, for an image that does this itself.
  indexRuntimeConfig:
    enabled: true

# Backstage API deployment
backstageApi:
  replicas: 1
  image: ghcr.io/teknoir/backstage:sha-9491c6d8@sha256:834574074c2c49c85fc6ffc66aa914fe98bf544a2a6a29c6911fad349459eee9
  imagePullPolicy: IfNotPresent
  imagePullSecrets: []
  # Root health endpoints of @backstage/backend-defaults: readiness answers
  # 503 until every plugin has started (and again on shutdown), liveness is
  # always 200 once the HTTP server listens. The startup probe allows 10 min
  # for a first start on an empty database (migrations of ~15 plugin
  # databases); liveness only takes over afterwards. No initialDelaySeconds.
  probes:
    startupProbe:
      httpGet:
        path: /.backstage/health/v1/readiness
        port: 7007
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 60
    readinessProbe:
      httpGet:
        path: /.backstage/health/v1/readiness
        port: 7007
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /.backstage/health/v1/liveness
        port: 7007
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6
  # initContainer that waits (pg_isready, bounded: attempts x intervalSeconds,
  # then starts anyway) for backstage-postgres, so a node reboot does not leave
  # backstage-api unready for ~10 min. Image defaults to postgres.image.
  waitForDb:
    enabled: true
    attempts: 120
    intervalSeconds: 5
  nodeOptions: '--max-old-space-size=8192'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  # All three Secrets come from the platform-secrets chart; this chart
  # creates none of them.
  secrets:
    # POSTGRES_USER/POSTGRES_PASSWORD (+ DATA_SOURCE_* for the exporter).
    postgresSecretName: backstage-postgres-secrets
    # KEYCLOAK_* (user-controller's client). Backstage does not read it (the
    # keycloakOrg provider is off), so it is mounted optional.
    keycloakSecretName: backstage-keycloak-secrets
    # Mounted at /app/secrets; holds backend-auth-backstage-secrets.yaml
    # ("secret: <random>"), $included as backend.auth.keys.
    authSecretsName: backstage-backend-auth
  googleApplicationCredentials: '/app/secrets/admin-credentials.json'
  # GitHub App integration. Off air-gapped: its $include makes the
  # credentials file mandatory; without it Backstage falls back to the
  # unauthenticated github.com integration (and the GitHub discovery provider
  # only logs errors).
  github:
    enabled: false
  githubAppSecretPath: /app/secrets/github-app-backstage-teknoir-credentials.yaml
  # Public CA certificate of the platform (teknoir-root-ca-bundle {ca.crt},
  # reconciled by the node's secrets phase), trusted by Node.js through
  # NODE_EXTRA_CA_CERTS so backend calls to https://auth.<domain> verify.
  # Optional: Backstage still starts without it.
  caBundle:
    secretName: teknoir-root-ca-bundle
    key: ca.crt
    mountPath: /etc/teknoir-ca

# PostgreSQL database configuration
postgres:
  replicas: 1
  # Same 17.11 as live (no data migration); linux/amd64 manifest digest.
  image: postgres:17.11-alpine@sha256:aa90e97ee862e558111d34cfb8b2c4bec768c2b039fb791341686928560263b3
  imagePullPolicy: IfNotPresent
  storage: 10Gi
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    imagePullPolicy: IfNotPresent

# Istio configuration (optional)
istio:
  gateway: istio-system/teknoir-gateway
  ingressNamespace: istio-system
  ingressServiceAccount: istio-ingressgateway
  metricsNamespace: monitoring-system
  jwt:
    fromHeaders:
      - name: X-Forwarded-Access-Token
      - name: X-Auth-Request-Access-Token
  # Mesh-layer guard for backstage-api (templates/istio-api-guard.yaml and the
  # VirtualService), independent of the Backstage image: it holds even when
  # the image's permission policy lets every signed-in user use the
  # Kubernetes plugin (backstage `robot` up to 9f15dacf). README "API guard".
  apiGuard:
    # Keycloak groups (realm config.oidc.realm, access-token claim "groups")
    # that may use /api/kubernetes (the Kubernetes tab). `teknoir-airgap
    # admin-user` puts platform admins into group admin. Must not be empty.
    kubernetesGroups:
      - admin
    # /api/kubernetes/proxy forwards any Kubernetes API call with
    # backstage-api's own ServiceAccount token (templates/rbac.yaml: User
    # patch, the named teamspace Secrets, PVC delete, ConfigMap create). With
    # this chart's RBAC nothing in the UI can use it (pod logs, events and pod
    # delete need pods/log, events and pods delete, which are not granted),
    # so it is closed for everyone, platform admins included.
    denyKubernetesProxy: true

# backstage-api's own Kubernetes access (templates/rbac.yaml). It replaces the
# cluster-wide teknoir-admin binding (every Secret, pods/exec everywhere).
# Every rule maps to a call in the backend: README "RBAC".
rbac:
  # Secrets backstage-api reads by name, in every teamspace namespace. Get by
  # name only; no list, no other Secret.
  teamspaceSecrets:
    # OrgTreeEntityProvider, PeripheralEntityProvider and the org-tree API
    # connect to the teamspace MongoDB with it.
    - mongodb-credentials
    # PeripheralEntityProvider subscribes to the teamspace EMQX with it.
    - emqx-bootstrap-user
  # ConfigMaps the peripheral API reads and updates by name in a teamspace
  # namespace. It also creates them, and create cannot be limited by name.
  teamspaceConfigMaps:
    - peripheral-config
  # The namespace whose Claims backstage-api lists (fixed in the image).
  claimsNamespace: teknoir-system
  # ValidatingAdmissionPolicy (templates/admission-policy.yaml) that keeps the
  # ServiceAccount's ConfigMap, PVC and namespaced teknoir.org writes inside
  # teamspace namespaces, and its ConfigMap writes to teamspaceConfigMaps.
  # enabled=false is the break-glass. The AppProject must whitelist
  # ValidatingAdmissionPolicy and its binding (app-of-apps values).
  admissionPolicy:
    enabled: true
    # Never a teamspace, even when labelled like one (profile-controller's
    # reserved names, plus the user-controller credentials namespace). The
    # release namespace and kube-* are always added.
    reservedNamespaces:
      - default
      - teknoir
      - teknoir-local
      - teknoir-cloud
      - teknoir-online
      - teknoir-system
      - teknoir-auth
      - teknoir-user-credentials
      - istio-system
      - cert-manager
  # @backstage/plugin-kubernetes-backend (the Kubernetes tab, for platform
  # admins only: the backend's permission policy denies everyone else).
  # Read-only, cluster-wide, for exactly these object types; the chart also
  # renders them as app-config kubernetes.objectTypes. configmaps is left out
  # on purpose (the plugin's default list has it): ConfigMaps can carry
  # credentials, and the tab does not need them.
  kubernetesPlugin:
    enabled: true
    objectTypes:
      - pods
      - services
      - limitranges
      - resourcequotas
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - horizontalpodautoscalers
      - jobs
      - cronjobs
      - ingresses

# backend.auth.externalAccess (jwks, audience teknoir-cli, i.e. tnctl). Such a
# caller is a Backstage *service* principal, and the permission framework
# allows a service principal everything (the permission policy never sees
# it) unless accessRestrictions narrow it. Without them a tnctl token could
# use /api/kubernetes/proxy with backstage-api's ServiceAccount. tnctl only
# reads catalog entities (cli pkg/api/devices.go, cmd/ns.go). Must not be
# empty: the chart refuses to render an unrestricted externalAccess.
externalAccess:
  accessRestrictions:
    - plugin: catalog
      permission: catalog.entity.read
