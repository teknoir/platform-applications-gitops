# GitOps values for backstage

# Parameters from params.env
config:
  domain: "teknoir.online"
  logLevel: info
  # Restrictions on the Keycloak (tnctl, client teknoir-cli) access-token principal of backend.auth.externalAccess.
  # Without them that principal passes every plugin and permission check of backstage-api, including the
  # kubernetes proxy, which runs with backstage-api's cluster-wide ServiceAccount.
  # Production default: the device plugin only (fleet API, applies the same group + org-unit checks as the
  # browser). The classic Backstage on this branch has no fleet routes yet, so tnctl commands that read the
  # catalog (devices, ns, ssh, ...) stop until the next-gen Backstage is here.
  # P0 alternative, if tnctl must keep working on the catalog meanwhile (read-only catalog + device; still
  # closes the kubernetes proxy, search, techdocs, permission and catalog writes, but leaves a cross-teamspace
  # catalog read, including device keys):
  #   accessRestrictions:
  #     - plugin: catalog
  #       permission: catalog.entity.read
  #     - plugin: device
  # Plugin ids must be unique in the list (a duplicate stops backstage-api at start). Empty list = no restriction.
  externalAccess:
    accessRestrictions:
      - plugin: device
  prometheusUrl: http://prometheus.__NAMESPACE__.svc.cluster.local:80

# Backstage frontend deployment
backstage:
  replicas: 1
  image: ghcr.io/teknoir/backstage-app:robot-20261011-182607@sha256:027bf01ae2fd920866027cffc5ceb70a2f877a2147b1b09e512cc9c2b35f950a
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi

# Backstage API deployment
backstageApi:
  replicas: 1
  image: ghcr.io/teknoir/backstage:robot-20261011-182607@sha256:a8a8fbb444de635df8c202a0097ea0cab2e80a18a8ba9528c1f9335ebdd78eb6
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  nodeOptions: '--max-old-space-size=8192'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  secrets:
    postgresSecretName: backstage-postgres-secrets
    keycloakSecretName: backstage-keycloak-secrets
    authSecretsName: backstage-auth-secrets
  googleApplicationCredentials: '/app/secrets/admin-credentials.json'
  githubAppSecretPath: /app/secrets/backstage-github-credentials.yaml
  resources:
    limits:
      cpu: "2"
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 1Gi

# PostgreSQL database configuration
postgres:
  replicas: 1
  image: postgres:17-alpine
  imagePullPolicy: Always
  storage: 10Gi
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    imagePullPolicy: Always
    resources:
      limits:
        cpu: 200m
        memory: 256Mi
      requests:
        cpu: 50m
        memory: 64Mi

# Istio configuration (optional)
istio:
  gateway: istio-system/teknoir-gateway
  ingressNamespace: istio-system
  ingressServiceAccount: istio-ingressgateway
  metricsNamespace: monitoring-system
  jwt:
    fromHeaders:
      - name: X-Forwarded-Access-Token
      - name: X-Auth-Request-Access-Token
