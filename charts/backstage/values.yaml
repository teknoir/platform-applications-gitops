# GitOps values for backstage

# Parameters from params.env
config:
  domain: "teknoir.cloud"
  logLevel: info
  prometheusUrl: http://prometheus.__NAMESPACE__.svc.cluster.local:80

# Backstage frontend deployment
backstage:
  replicas: 1
  image: ghcr.io/teknoir/backstage-app:robot
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token

# Backstage API deployment
backstageApi:
  replicas: 1
  image: ghcr.io/teknoir/backstage:robot
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  nodeOptions: '--max-old-space-size=8192'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  secrets:
    postgresSecretName: backstage-postgres-secrets
    keycloakSecretName: backstage-keycloak-secrets
    authSecretsName: backstage-github-app-secret
  googleApplicationCredentials: '/app/secrets/admin-credentials.json'
  githubAppSecretPath: /app/secrets/github-app-backstage-teknoir-credentials.yaml

# PostgreSQL database configuration
postgres:
  replicas: 1
  image: postgres:17-alpine
  imagePullPolicy: Always
  storage: 10Gi
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    imagePullPolicy: Always

# Istio configuration (optional)
istio:
  gateway: istio-system/teknoir-gateway
  ingressNamespace: istio-system
  ingressServiceAccount: istio-ingressgateway
  metricsNamespace: monitoring-system
  jwt:
    fromHeaders:
      - name: X-Forwarded-Access-Token
      - name: X-Auth-Request-Access-Token

# Virtual devices (board "Virtual" in Add Device). The flag is read by the backend
# (app-config ConfigMap) and the frontend (APP_CONFIG_teknoir_virtualDevices_enabled);
# both are driven by enabled. The sizes are backend-only (whole vCPUs and whole GiB) and
# must stay within the controller's maxPerDevice (charts/device-controller). A teamspace
# also needs an allowance: ResourceQuota vdev-quota in <teamspace>-vdev (device-controller chart).
virtualDevices:
  enabled: true                # teknoir-cloud (staging) only
  presets:
    - {name: small, label: Small, cpu: "2", memory: 4Gi, disk: 20Gi}
    - {name: medium, label: Medium, cpu: "4", memory: 8Gi, disk: 40Gi}
  custom:
    enabled: true
    cpu: {min: 2, max: 4}
    memoryGi: {min: 4, max: 8}
    diskGi: {min: 20, max: 40}
