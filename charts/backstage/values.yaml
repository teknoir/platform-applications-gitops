# GitOps values for backstage

# Parameters from params.env
# name prefixes every object (Deployments, Services, ConfigMap, PVC, ServiceAccount, postgres,
# Istio policies, ClusterRole/Binding), so a second instance (backstage-next) can run beside the
# first in the same namespace. Do not change it on a running instance: it renames the PVC and the database.
name: backstage

config:
  domain: "teknoir.cloud"
  # Public host of this instance (VirtualService, app.baseUrl, backend.baseUrl). Empty = config.domain.
  # Issuer/JWKS and teknoir.domain keep config.domain.
  host: ""
  # Hosts that only redirect (301, path kept) to the host above, e.g. next.teknoir.cloud after the UI cut-over.
  redirectHosts: []
  logLevel: info
  # Restrictions on the Keycloak (tnctl) access-token principal of backend.auth.externalAccess.
  # Without them a service principal passes every plugin and permission check.
  # P2 (staging, since tnctl v0.1.0-beta): only the device plugin. tnctl >= v0.1.0-beta calls nothing but
  # /api/device/fleet/... (user-scoped fleet routes); everything else (catalog, kubernetes proxy, search, techdocs,
  # permission, ...) answers 403 for its token. tnctl <= v0.0.9-beta read the catalog and stops working
  # against this platform: upgrade tnctl.
  # Earlier steps: P0 = [catalog: catalog.entity.read, device], P1 = fleet routes for tnctl.
  # Plugin ids must be unique in the list (a duplicate stops backstage-api at start). Empty list = no restriction.
  externalAccess:
    accessRestrictions:
      - plugin: device
  prometheusUrl: http://prometheus.__NAMESPACE__.svc.cluster.local:80

# Backstage frontend deployment
backstage:
  replicas: 1
  image: "ghcr.io/teknoir/backstage-app:sha-87a1a31a@sha256:1fa2d58c79489564be1ed7ae8b8a2a7b46c14000503d8b70a30b1f1ba3dedf72"
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  resources: {}

# Backstage API deployment
backstageApi:
  replicas: 1
  image: "ghcr.io/teknoir/backstage:sha-87a1a31a@sha256:f0538551430ce2ce8cfe3aadb4cd91b2f4f2986d129a088eebd47da3de6d5c3d"
  imagePullPolicy: Always
  imagePullSecrets:
    - name: ghcr-token
  resources: {}
  nodeOptions: '--max-old-space-size=8192'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  secrets:
    postgresSecretName: backstage-postgres-secrets
    keycloakSecretName: backstage-keycloak-secrets
    authSecretsName: backstage-github-app-secret
  googleApplicationCredentials: '/app/secrets/admin-credentials.json'
  githubAppSecretPath: /app/secrets/github-app-backstage-teknoir-credentials.yaml

# PostgreSQL database configuration
postgres:
  replicas: 1
  image: "postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24"
  imagePullPolicy: Always
  storage: 10Gi
  resources: {}
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    imagePullPolicy: Always

# Istio configuration (optional)
istio:
  gateway: istio-system/teknoir-gateway
  ingressNamespace: istio-system
  ingressServiceAccount: istio-ingressgateway
  # The public gateway (MQTT, WireGuard, the in-cluster TeknoirBot API on 8085).
  publicIngressServiceAccount: istio-ingressgateway-public
  metricsNamespace: monitoring-system
  jwt:
    fromHeaders:
      - name: X-Forwarded-Access-Token
      - name: X-Auth-Request-Access-Token

# Virtual devices (board "Virtual" in Add Device). The flag is read by the backend
# (app-config ConfigMap) and the frontend (APP_CONFIG_teknoir_virtualDevices_enabled);
# both are driven by enabled. The sizes are backend-only (whole vCPUs and whole GiB) and
# must stay within the controller's maxPerDevice (charts/device-controller). A teamspace
# also needs an allowance: ResourceQuota vdev-quota in <teamspace>-vdev (device-controller chart).
virtualDevices:
  enabled: true                # on on r415 since 2026-11-07 (TeknoirBot)
  presets:
    - {name: small, label: Small, cpu: "2", memory: 4Gi, disk: 20Gi}
    - {name: medium, label: Medium, cpu: "4", memory: 8Gi, disk: 40Gi}
  custom:
    enabled: true
    cpu: {min: 2, max: 4}
    memoryGi: {min: 4, max: 8}
    diskGi: {min: 20, max: 40}

# TeknoirBots (the Bots page and the device Desktop tab in nextgen). Read by the backend (app-config
# teknoir.teknoirBots.enabled) and the frontend (APP_CONFIG_teknoir_teknoirBots_enabled). Turn on together with
# teknoirbot.enabled in app-of-apps. Turn it on only in a release whose ServiceAccount `<name>-api` is the fence's portal
# identity (charts/teknoirbot-controller `fence.backstageServiceAccount`, default
# `system:serviceaccount:teknoir-system:backstage-api`). The fence denies every bot write from any other account, including
# backstage-next-api, so the Bots page would fail there.
teknoirBots:
  enabled: false
  # The agent in a bot's computer: app-config teknoir.teknoirBots.agent.{enabled,host}, the VirtualService
  # teknoirbot-api (Gateway istio-system/teknoirbot-api, port 8085, prefix /api/device/bot/ only, identity headers
  # removed) and the AuthorizationPolicy rules that admit the public gateway for /api/device/bot/* only and refuse
  # /api/device/bot/* from the main gateway. Needs charts/istio teknoirbotApi (one switch: app-of-apps
  # teknoirbot.agent.enabled).
  agent:
    enabled: false
    # The bot model proxy (app-config teknoir.teknoirBots.agent.model, rendered only with the agent on): TeknoirBots
    # use Sonnet and Haiku only (Anders, 2026-11-11). The effort cap (at most high) is in the proxy code.
    model:
      defaultModel: claude-sonnet-5-5
      modelPrefixes: [claude-sonnet-5-5, claude-haiku-5-5]

# Next-gen fleet pages (backstage-plugin-teknoir-fleet). Both optional.
fleet:
  # Frontend env APP_CONFIG_teknoir_fleet_classicUrl: where the "Classic" nav links point.
  classicUrl: ""
  # Backend teknoir.fleet.prometheusUrlTemplate ({namespace} is replaced). Empty = the plugin default.
  prometheusUrlTemplate: ""
  # Connect (teknoir.fleet.access): open the web terminal and device apps over Tunneling from the fleet pages.
  # Off by default; tunnelDomain defaults to config.domain; writes = enable on first use (needs the SA that the
  # ztna Device-annotation VAP admits, i.e. the backstage-api instance).
  access:
    enabled: false
    tunnelDomain: ""
    writes: false
    maxPerTeamspace: 25

# Catalog behaviour (app-config catalog.*). orphanStrategy delete removes entities that nothing emits any
# more, e.g. the mock robots (examples/robots) after their location was removed (2026-10-16). Empty = the
# Backstage default (keep).
catalog:
  orphanStrategy: delete
