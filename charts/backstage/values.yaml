# GitOps values for backstage

# Parameters from params.env
config:
  domain: "teknoir.airgapped"
  logLevel: info
  prometheusUrl: http://prometheus.__NAMESPACE__.svc.cluster.local:80
  # Keycloak realm whose tokens oauth2-proxy forwards (istio
  # RequestAuthentication) and whose JWKS backs externalAccess. Issuer:
  # https://auth.<domain><basePath>/realms/<realm>; basePath is Keycloak's
  # http-relative-path.
  oidc:
    realm: teknoir
    basePath: /auth

# Backstage frontend deployment
backstage:
  replicas: 1
  image: ghcr.io/teknoir/backstage-app:robot
  imagePullPolicy: Always
  imagePullSecrets: []

# Backstage API deployment
backstageApi:
  replicas: 1
  image: ghcr.io/teknoir/backstage:robot
  imagePullPolicy: Always
  imagePullSecrets: []
  nodeOptions: '--max-old-space-size=8192'
  podSecurityContext:
    fsGroup: 1000
  containerSecurityContext:
    runAsUser: 1000
  # All three Secrets come from the platform-secrets chart; this chart
  # creates none of them.
  secrets:
    # POSTGRES_USER/POSTGRES_PASSWORD (+ DATA_SOURCE_* for the exporter).
    postgresSecretName: backstage-postgres-secrets
    # KEYCLOAK_* (user-controller's client). Backstage does not read it (the
    # keycloakOrg provider is off), so it is mounted optional.
    keycloakSecretName: backstage-keycloak-secrets
    # Mounted at /app/secrets; holds backend-auth-backstage-secrets.yaml
    # ("secret: <random>"), $included as backend.auth.keys.
    authSecretsName: backstage-backend-auth
  googleApplicationCredentials: '/app/secrets/admin-credentials.json'
  # GitHub App integration. Off air-gapped: its $include makes the
  # credentials file mandatory; without it Backstage falls back to the
  # unauthenticated github.com integration (and the GitHub discovery provider
  # only logs errors).
  github:
    enabled: false
  githubAppSecretPath: /app/secrets/github-app-backstage-teknoir-credentials.yaml
  # Public CA certificate of the platform (teknoir-root-ca-bundle {ca.crt},
  # reconciled by the node's secrets phase), trusted by Node.js through
  # NODE_EXTRA_CA_CERTS so backend calls to https://auth.<domain> verify.
  # Optional: Backstage still starts without it.
  caBundle:
    secretName: teknoir-root-ca-bundle
    key: ca.crt
    mountPath: /etc/teknoir-ca

# PostgreSQL database configuration
postgres:
  replicas: 1
  image: postgres:17-alpine
  imagePullPolicy: Always
  storage: 10Gi
  exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    imagePullPolicy: Always

# Istio configuration (optional)
istio:
  gateway: istio-system/teknoir-gateway
  ingressNamespace: istio-system
  ingressServiceAccount: istio-ingressgateway
  metricsNamespace: monitoring-system
  jwt:
    fromHeaders:
      - name: X-Forwarded-Access-Token
      - name: X-Auth-Request-Access-Token

# backstage-api's own Kubernetes access (templates/rbac.yaml). It replaces the
# cluster-wide teknoir-admin binding (every Secret, pods/exec everywhere).
# Every rule maps to a call in the backend: README "RBAC".
rbac:
  # Secrets backstage-api reads by name, in every teamspace namespace. Get by
  # name only; no list, no other Secret.
  teamspaceSecrets:
    # OrgTreeEntityProvider, PeripheralEntityProvider and the org-tree API
    # connect to the teamspace MongoDB with it.
    - mongodb-credentials
    # PeripheralEntityProvider subscribes to the teamspace EMQX with it.
    - emqx-bootstrap-user
  # ConfigMaps the peripheral API reads and updates by name in a teamspace
  # namespace. It also creates them, and create cannot be limited by name.
  teamspaceConfigMaps:
    - peripheral-config
  # The namespace whose Claims backstage-api lists (fixed in the image).
  claimsNamespace: teknoir-system
  # @backstage/plugin-kubernetes-backend (the Kubernetes tab, for platform
  # admins only: the backend's permission policy denies everyone else).
  # Read-only, cluster-wide, for exactly these object types; the chart also
  # renders them as app-config kubernetes.objectTypes. configmaps is left out
  # on purpose (the plugin's default list has it): ConfigMaps can carry
  # credentials, and the tab does not need them.
  kubernetesPlugin:
    enabled: true
    objectTypes:
      - pods
      - services
      - limitranges
      - resourcequotas
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
      - horizontalpodautoscalers
      - jobs
      - cronjobs
      - ingresses

# backend.auth.externalAccess (jwks, audience teknoir-cli, i.e. tnctl). Such a
# caller is a Backstage *service* principal, and the permission framework
# allows a service principal everything (the permission policy never sees
# it) unless accessRestrictions narrow it. Without them a tnctl token could
# use /api/kubernetes/proxy with backstage-api's ServiceAccount. tnctl only
# reads catalog entities (cli pkg/api/devices.go, cmd/ns.go). Must not be
# empty: the chart refuses to render an unrestricted externalAccess.
externalAccess:
  accessRestrictions:
    - plugin: catalog
      permission: catalog.entity.read
