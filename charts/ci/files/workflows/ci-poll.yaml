# Starts ci-dispatch for new commits on registered repos (files/poll.py). Polling keeps
# the cluster closed to inbound traffic: no public webhook endpoint, no login bypass.
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: ci-poll
  namespace: @@NAMESPACE@@
spec:
  schedules: ["@@POLL_SCHEDULE@@"]
  timezone: UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 60
  # suspend is rendered only when true: ArgoCD (server-side diff/apply) does not
  # move a live true back to an explicit false; dropping the field does.
  @@POLL_SUSPEND@@
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  workflowSpec:
    serviceAccountName: ci-poller
    executor:
      serviceAccountName: ci-executor
    entrypoint: poll
    # Successful polls are noise: remove them (and their pods) right away.
    ttlStrategy:
      secondsAfterSuccess: 300
      secondsAfterFailure: 86400
    podGC:
      strategy: OnPodSuccess
    volumes:
      - name: scripts
        configMap: {name: ci-scripts, defaultMode: 0555}
      - name: repos
        configMap: {name: ci-repos}
      - name: github
        secret:
          secretName: @@GITHUB_SECRET@@
          items: [{key: token, path: token}]
    templates:
      - name: poll
        activeDeadlineSeconds: 600
        container:
          image: @@IMAGE_PYTHON@@
          command: [python3, -I, /scripts/poll.py]
          env:
            - {name: GITHUB_ORG, value: "@@GITHUB_ORG@@"}
            - {name: NAMESPACE, value: "@@NAMESPACE@@"}
            - {name: STATE_CONFIGMAP, value: ci-poll-state}
            - {name: REPOS_DIR, value: /repos}
            - {name: MAX_SUBMIT, value: "@@POLL_MAX_SUBMIT@@"}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
            - {name: repos, mountPath: /repos}
            - {name: github, mountPath: /github}
