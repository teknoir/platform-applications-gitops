# wg-tunnel (public). Translated from .github/workflows/build.yml on 2026-10-16.
# Tests gate all three images. Tag builds publish the tag as is; VERSION is built in.
# NOT ported: the wg-agent smoke tests (test/smoke-agent-init.sh, test/smoke-attestor.sh)
# need `docker run` with capability sets; the CI has no Docker daemon on purpose (charts/ci
# README.md). Run them locally before a release.
branches: ['**']
tags: ['**']
tests:
  - {name: go-vet, image: "docker.io/library/golang:1.26", run: go vet ./...}
  - {name: go-test-race, image: "docker.io/library/golang:1.26", run: go test -race -count=1 ./..., memory: 4Gi}
images:
  - name: wg-hub
    target: wg-hub
    platforms: [linux/amd64, linux/arm64]
    tagTemplates: ["sha-{sha7}", "{ref}-{ts}", "{ref}"]
    tagTagTemplates: ["sha-{sha7}", "{ref}"]
    buildArgs: {VERSION: "{ref}-{sha7}"}
    tagBuildArgs: {VERSION: "{ref}"}
  - name: wg-agent
    target: wg-agent
    platforms: [linux/amd64, linux/arm64, linux/arm/v7]
    tagTemplates: ["sha-{sha7}", "{ref}-{ts}", "{ref}"]
    tagTagTemplates: ["sha-{sha7}", "{ref}"]
    buildArgs: {VERSION: "{ref}-{sha7}"}
    tagBuildArgs: {VERSION: "{ref}"}
  - name: wg-gateway
    target: wg-gateway
    platforms: [linux/amd64, linux/arm64]
    tagTemplates: ["sha-{sha7}", "{ref}-{ts}", "{ref}"]
    tagTagTemplates: ["sha-{sha7}", "{ref}"]
    buildArgs: {VERSION: "{ref}-{sha7}"}
    tagBuildArgs: {VERSION: "{ref}"}
githubActions: disable
actionsWorkflows: [build.yml]
