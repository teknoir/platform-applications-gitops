{{- /*
crds/ holds the cert-manager CRDs vendored from the cert-manager dependency by
update-crds.sh (annotated Prune=false,Delete=false); the dependency's own CRD
templates stay off (cert-manager.crds.enabled=false). Fail the render when the
dependency is bumped without re-running update-crds.sh, so cert-manager never
runs against CRDs of another version. Renders nothing.
*/}}
{{- $pinned := "" }}
{{- range .Chart.Dependencies }}
{{- if eq .Name "cert-manager" }}{{ $pinned = .Version }}{{ end }}
{{- end }}
{{- $count := 0 }}
{{- range $path, $_ := .Files.Glob "crds/*.yaml" }}
{{- $version := $.Files.Get $path | regexFind "cert-manager [0-9][^ ]*" | trimPrefix "cert-manager " }}
{{- if ne $version $pinned }}
{{- fail (printf "%s is vendored from cert-manager %q, Chart.yaml pins %q: run charts/cert-manager/update-crds.sh" $path $version $pinned) }}
{{- end }}
{{- $count = add1 $count }}
{{- end }}
{{- if eq $count 0 }}
{{- fail "crds/ is empty: run charts/cert-manager/update-crds.sh" }}
{{- end }}
{{- if (index .Values "cert-manager" "crds" "enabled") }}
{{- fail "cert-manager.crds.enabled must stay false: the CRDs ship from crds/ (annotated Prune=false,Delete=false)" }}
{{- end }}
