{{- if .Values.leaderElection }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teknoirbot-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teknoirbot-controller.labels" . | nindent 4 }}
rules:
# Leader election (controller-runtime, Lease lock): client-go's leaselock calls only Get, Create and
# Update. create cannot be limited by name; everything else only on the controller's own Lease.
# The name must match LeaderElectionID in the controller's cmd/main.go.
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  resourceNames:
  - teknoirbot-controller.teknoir.org
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teknoirbot-controller-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teknoirbot-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teknoirbot-controller-leader-election
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
