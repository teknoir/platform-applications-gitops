{{- /*
ValidatingAdmissionPolicy teknoirbot-device-guard (defence in depth). The ClusterRole of the controller may
create and patch every Device in the cluster (RBAC cannot narrow by label); this policy narrows what ITS service
account can do to Devices, keyed on who writes (like charts/ztna admission.yaml). Nobody else is affected: the
matchCondition selects the controller's username only.

The controller (internal/controller/device.go) creates a Device with the labels teknoir.org/teknoirbot=<bot> and
teknoir.org/part-of=teknoirbot, device_type virtual, no ztna/disabled annotation and only the bot's two placement
annotations, and afterwards patches (ownedPatch) only labels, the preset and placement annotations,
spec.virtual.cpu/memory/disabled and spec.desktop. It never patches
spec.keys. So the policy requires:
  1. the labels on every write;
  2. UPDATE: the old Device was already a bot's (label teknoir.org/teknoirbot, or a controller ownerReference to a
     teknoir.org/v1alpha1 TeknoirBot); no takeover of another Device;
  3. CREATE: spec.device_type virtual;
  4. UPDATE: spec.keys unchanged (keys are written at create only);
  5. platform annotations (ztna.teknoir.org/*, teknoir.org/disabled*, teknoir.org/org-tree-*): none at create, and
     unchanged (none added, changed or removed) on update. The two placement keys teknoir.org/org-tree-path and
     teknoir.org/org-tree-node-id are the exception: the controller copies them from the TeknoirBot, which carries
     the bot's org unit (set by the portal at create and frozen by teknoirbot-created-by in fence.yaml). A policy
     cannot compare them with the TeknoirBot, so the controller is trusted with their values;
  6. CREATE: a controller ownerReference to the TeknoirBot named in the teknoir.org/teknoirbot label;
  7. CREATE: an empty spec.manifest (no apps) and no spec.applications, spec.overrides or spec.plugins: those fields
     make device-controller run workloads, and the controller never writes them;
  8. UPDATE: spec.manifest, spec.applications, spec.overrides, spec.plugins, metadata.ownerReferences and
     metadata.finalizers unchanged;
  9. every write: metadata.name == 'tb-' + the teknoir.org/teknoirbot label (the name is immutable, so this also freezes
     the label: a removed label may be restored, never set to another bot).

Break-glass: a cluster-admin deletes the ValidatingAdmissionPolicyBinding (pause the Application's auto-sync first).
*/ -}}
{{- $sa := printf "system:serviceaccount:%s:%s" .Release.Namespace .Values.serviceAccount.name }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: teknoirbot-device-guard
  labels:
    {{- include "teknoirbot-controller.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["devices"]
  matchConditions:
    - name: only-the-teknoirbot-controller
      expression: "request.userInfo.username == '{{ $sa }}'"
  variables:
    - name: labels
      expression: "object.metadata.?labels.orValue({})"
    - name: oldLabels
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?labels.orValue({}) : {}"
    - name: newAnn
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnn
      expression: "request.operation == 'UPDATE' ? oldObject.metadata.?annotations.orValue({}) : {}"
    # The bot's org unit, copied from the TeknoirBot: the only org-tree keys the controller may write.
    - name: placementKeys
      expression: "['teknoir.org/org-tree-path', 'teknoir.org/org-tree-node-id']"
    # Annotation keys a platform component writes: matched by prefix, without the two placement keys.
    - name: newPlatform
      expression: "variables.newAnn.filter(k, k.startsWith('ztna.teknoir.org/') || k.startsWith('teknoir.org/disabled') || (k.startsWith('teknoir.org/org-tree-') && !(k in variables.placementKeys)))"
    - name: oldPlatform
      expression: "variables.oldAnn.filter(k, k.startsWith('ztna.teknoir.org/') || k.startsWith('teknoir.org/disabled') || (k.startsWith('teknoir.org/org-tree-') && !(k in variables.placementKeys)))"
  validations:
    - expression: "variables.labels[?'teknoir.org/teknoirbot'].orValue('') != '' && variables.labels[?'teknoir.org/part-of'].orValue('') == 'teknoirbot'"
      message: "teknoirbot-controller may only write Devices that carry a non-empty label teknoir.org/teknoirbot and teknoir.org/part-of=teknoirbot"
    - expression: >-
        request.operation != 'UPDATE' || variables.oldLabels[?'teknoir.org/teknoirbot'].orValue('') != '' ||
        oldObject.metadata.?ownerReferences.orValue([]).exists(r, r.apiVersion == 'teknoir.org/v1alpha1' && r.kind == 'TeknoirBot' && r.?controller.orValue(false))
      message: "teknoirbot-controller may not update a Device that is not a TeknoirBot's (the old object has neither a teknoir.org/teknoirbot label nor a TeknoirBot controller reference)"
    - expression: "request.operation != 'CREATE' || object.spec.?device_type.orValue('') == 'virtual'"
      message: "teknoirbot-controller may only create virtual Devices (spec.device_type must be virtual)"
    - expression: "request.operation != 'UPDATE' || object.spec.?keys == oldObject.spec.?keys"
      message: "teknoirbot-controller writes spec.keys at create only and may not change it"
    - expression: >-
        request.operation == 'CREATE' ? size(variables.newPlatform) == 0 :
        (variables.newPlatform.all(k, k in variables.oldAnn && variables.oldAnn[k] == variables.newAnn[k]) &&
         variables.oldPlatform.all(k, k in variables.newAnn && variables.newAnn[k] == variables.oldAnn[k]))
      message: "teknoirbot-controller may not set, change or remove platform annotations (ztna.teknoir.org/*, teknoir.org/disabled*, teknoir.org/org-tree-* other than teknoir.org/org-tree-path and teknoir.org/org-tree-node-id)"
    - expression: >-
        request.operation != 'CREATE' ||
        object.metadata.?ownerReferences.orValue([]).exists(r, r.apiVersion == 'teknoir.org/v1alpha1' && r.kind == 'TeknoirBot' &&
          r.?controller.orValue(false) && r.name == variables.labels[?'teknoir.org/teknoirbot'].orValue(''))
      message: "teknoirbot-controller creates a Device only with a controller reference to the TeknoirBot named in its teknoir.org/teknoirbot label"
    - expression: >-
        request.operation != 'CREATE' ||
        (size(object.spec.?manifest.?apps.orValue({})) == 0 && !has(object.spec.applications) &&
         !has(object.spec.overrides) && !has(object.spec.plugins))
      message: "teknoirbot-controller creates a Device with an empty spec.manifest and no spec.applications, spec.overrides or spec.plugins"
    - expression: >-
        request.operation != 'UPDATE' ||
        (object.spec.?manifest == oldObject.spec.?manifest && object.spec.?applications == oldObject.spec.?applications &&
         object.spec.?overrides == oldObject.spec.?overrides && object.spec.?plugins == oldObject.spec.?plugins &&
         object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences &&
         object.metadata.?finalizers == oldObject.metadata.?finalizers)
      message: "teknoirbot-controller may not change spec.manifest, spec.applications, spec.overrides, spec.plugins, ownerReferences or finalizers of a Device"
    - expression: "object.metadata.name == 'tb-' + variables.labels[?'teknoir.org/teknoirbot'].orValue('')"
      message: "teknoirbot-controller writes a Device only as tb-<bot>, the bot named in its teknoir.org/teknoirbot label (the name never changes, so neither does the label)"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: teknoirbot-device-guard
  labels:
    {{- include "teknoirbot-controller.labels" . | nindent 4 }}
spec:
  policyName: teknoirbot-device-guard
  validationActions: [Deny]
