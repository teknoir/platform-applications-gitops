apiVersion: apps/v1
kind: Deployment
metadata:
  name: teknoirbot-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "teknoirbot-controller.labels" . | nindent 4 }}
    control-plane: controller-manager
    kustomize.component: teknoirbot-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "teknoirbot-controller.selectorLabels" . | nindent 6 }}
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
        sidecar.istio.io/inject: "false"
      labels:
        {{- include "teknoirbot-controller.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: teknoirbot-controller
        control-plane: controller-manager
        kustomize.component: teknoirbot-controller
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ required "image.tag is required: pin it with scripts/pin-image teknoirbot-controller=<tag> ('<tag>@sha256:<digest>')" .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        {{- if .Values.leaderElection }}
        - --leader-elect
        {{- end }}
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
