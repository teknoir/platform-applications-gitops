---
# Generated by teknoirbot-controller (make manifests); refreshed with charts/teknoirbot-controller/hack/sync-crd.sh.
# Do not edit. Prune=false,Delete=false: pruning a CRD deletes every TeknoirBot.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    controller-gen.kubebuilder.io/version: v0.16.5
  name: teknoirbots.teknoir.org
spec:
  group: teknoir.org
  names:
    kind: TeknoirBot
    listKind: TeknoirBotList
    plural: teknoirbots
    shortNames:
    - tb
    singular: teknoirbot
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.deviceName
      name: Device
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TeknoirBot is a teamspace bot whose computer is a virtual Device of the
          platform, with a browser remote desktop.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            default: {}
            description: |-
              The default makes spec, and so spec.resources and its disk, always
              present: a transition rule (the disk is immutable) only runs when the old
              value exists.
            properties:
              description:
                description: Description says what the bot is for.
                maxLength: 500
                type: string
              desktop:
                description: Desktop configures the bot's remote desktop.
                properties:
                  geometry:
                    description: Geometry is the screen size, WIDTHxHEIGHT (640x480
                      to 3840x2160). Default 1280x800.
                    pattern: ^(6[4-9][0-9]|[7-9][0-9]{2}|[1-2][0-9]{3}|3[0-7][0-9]{2}|38[0-3][0-9]|3840)x(4[89][0-9]|[5-9][0-9]{2}|1[0-9]{3}|20[0-9]{2}|21[0-5][0-9]|2160)$
                    type: string
                type: object
              displayName:
                description: DisplayName is the bot's name in the UI.
                maxLength: 63
                type: string
              resources:
                default: {}
                description: Resources size the bot's computer (a virtual device).
                properties:
                  cpu:
                    default: "2"
                    description: |-
                      CPU is the number of vCPUs, 1..64. A new value applies at the computer's
                      next start (suspend and resume the bot).
                    pattern: ^([1-9]|[1-5][0-9]|6[0-4])$
                    type: string
                  disk:
                    default: 20Gi
                    description: Disk is the root disk size in whole GiB, 10Gi..1024Gi.
                      Fixed after creation.
                    pattern: ^([1-9][0-9]|[1-9][0-9][0-9]|10[01][0-9]|102[0-4])Gi$
                    type: string
                    x-kubernetes-validations:
                    - message: disk cannot be changed after creation
                      rule: self == oldSelf
                  memory:
                    default: 4Gi
                    description: |-
                      Memory is the memory in whole GiB, 1Gi..256Gi. A new value applies at the
                      computer's next start (suspend and resume the bot).
                    pattern: ^([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-6])Gi$
                    type: string
                type: object
              suspended:
                description: Suspended halts the bot's computer and keeps its disk.
                type: boolean
            type: object
          status:
            description: TeknoirBotStatus is the observed state of a TeknoirBot.
            properties:
              conditions:
                description: 'Conditions: Ready, DeviceReady, DesktopReady.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              desktopURL:
                description: |-
                  DesktopURL opens the bot's remote desktop. It is set only while the phase
                  is Running.
                type: string
              deviceName:
                description: DeviceName is the bot's Device, tb-<name>.
                type: string
              message:
                description: Message explains the phase to a person.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation of the bot the status
                  describes.
                format: int64
                type: integer
              phase:
                description: 'Phase: Pending, Provisioning, Starting, Running, Suspended,
                  NotAdmitted, Failed, Deleting.'
                enum:
                - Pending
                - Provisioning
                - Starting
                - Running
                - Suspended
                - NotAdmitted
                - Failed
                - Deleting
                type: string
            type: object
        type: object
        x-kubernetes-validations:
        - message: the name of a TeknoirBot is at most 40 characters
          rule: size(self.metadata.name) <= 40
        - message: the name of a TeknoirBot is a DNS label (lower-case letters, digits,
            '-')
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
    served: true
    storage: true
    subresources:
      status: {}
