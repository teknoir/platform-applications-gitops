# Values for the gha-runner-scale-set chart (ARC 0.15.1), release name = scale-set name.
#   helm upgrade --install teknoir-ci --namespace arc-runners --kube-context devhost-ci \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.15.1 -f charts/ci-runners/arc/teknoir-ci.yaml
#
# The Helm release MUST be named teknoir-ci: charts/ci-runners NetworkPolicies select
# actions.github.com/scale-set-name=teknoir-ci, which ARC sets from the release name.
#
# runs-on: teknoir-ci - PR jobs from test.yml (scripts/test, make test, lint). No secrets; PR code is untrusted.
# Egress and quotas come from the ci-runners chart (namespace arc-runners).
githubConfigUrl: https://github.com/teknoir
githubConfigSecret: arc-github
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
runnerScaleSetName: teknoir-ci
minRunners: 1
maxRunners: 3
template:
  spec:
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    securityContext:
      fsGroup: 1001
    # Test database: a native sidecar (a k8s >= 1.29 initContainer with restartPolicy: Always; the cluster is 1.34),
    # so every runner pod gets its own Postgres 16 on its own emptyDir. It dies with the pod, which is the point: no
    # job can leave a database, a changed template1 or an ALTER SYSTEM behind for the next job, and a job that is
    # cancelled leaks nothing beyond its own pod. See README "Test database".
    initContainers:
      - name: postgres
        # Postgres 16: Backstage TestDatabases' POSTGRES16 slot.
        image: docker.io/library/postgres:16.16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
        restartPolicy: Always
        # listen_addresses=127.0.0.1: reachable only from this pod, so no other runner or workload can reach it.
        # fsync/synchronous_commit/full_page_writes off: a throwaway database, speed over durability.
        # max_connections 500: every parallel test of a job may hold its own pool.
        args:
          - -c
          - listen_addresses=127.0.0.1
          - -c
          - max_connections=500
          - -c
          - fsync=off
          - -c
          - synchronous_commit=off
          - -c
          - full_page_writes=off
        env:
          # Not a secret: a fresh, throwaway server per job, reachable only on this pod's localhost.
          - name: POSTGRES_PASSWORD
            value: ci-test-only
          - name: PGDATA
            value: /var/lib/postgresql/data/pgdata
        # uid 70, not the runner's 1001. It can still write the pgdata volume: the pod's fsGroup 1001 is a
        # supplementary group on every container in the pod, and the emptyDir root is world-writable until kubelet
        # rewrites it to root:1001, so 70 can create PGDATA either way.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 70
          runAsGroup: 70
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        # The runner container does not start until this probe passes, so tests never race the database's initdb.
        # No liveness probe: restartPolicy: Always restarts the sidecar if it exits.
        startupProbe:
          exec:
            command: [pg_isready, -h, 127.0.0.1, -U, postgres]
          periodSeconds: 2
          failureThreshold: 60
          timeoutSeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "2", memory: 1Gi}
        volumeMounts:
          - name: pgdata
            mountPath: /var/lib/postgresql/data
    containers:
      # ARC requires the runner container to be named "runner"
      - name: runner
        # actions-runner 2.338.2 + make, gcc, gh, yq, xz, zstd (teknoir/ci-workflows runner-image/Dockerfile).
        # The ghcr package is private until it is made public; until then the image is imported into the node's
        # containerd (infra clusters/devhost-ci) and IfNotPresent keeps kubelet from pulling.
        image: ghcr.io/teknoir/ci-runner:2.338.2-3@sha256:9248ca3c6947c4666847603672d6c02b09527ccf8d04aabd1bcee99c6b2718eb
        imagePullPolicy: IfNotPresent
        # No sudo or root inside jobs: the runner image ships passwordless sudo, which this turns off.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        command: ["/home/runner/run.sh"]
        env:
          - name: GOMODCACHE
            value: /cache/go-mod
          - name: GOCACHE
            value: /cache/go-build
          - name: YARN_CACHE_FOLDER
            value: /cache/yarn
          - name: npm_config_cache
            value: /cache/npm
          - name: RUNNER_TOOL_CACHE
            value: /cache/tool-cache
          - name: AGENT_TOOLSDIRECTORY
            value: /cache/tool-cache
          # This pod's own Postgres sidecar, for Backstage's TestDatabases (..._POSTGRES16_... is the slot it looks
          # for). Not a secret: the server is fresh per job and listens on the pod's localhost only.
          - name: BACKSTAGE_TEST_DATABASE_POSTGRES16_CONNECTION_STRING
            value: postgresql://postgres:ci-test-only@127.0.0.1:5432
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "6", memory: 8Gi}
        volumeMounts:
          - name: ci-cache
            mountPath: /cache
    volumes:
      # baseline PSA forbids hostPath: the PVC is bound by claimRef to the ci-cache-teknoir-ci PV over the host dir
      # /var/lib/ci-cache/teknoir-ci (owned by 1001:1001, created by infra clusters/devhost-ci/install.sh). All
      # runner pods are on the one node, so several may mount this ReadWriteOnce claim.
      - name: ci-cache
        persistentVolumeClaim:
          claimName: ci-cache-teknoir-ci
      # Per pod, so it dies with the pod (and with a cancelled job). 10Gi is far more than a test run needs; the
      # sidecar's 128Mi request counts against the arc-runners requests.memory quota like the runner's.
      - name: pgdata
        emptyDir:
          sizeLimit: 10Gi
