# Values for the gha-runner-scale-set chart (ARC 0.15.1), release name = scale-set name.
#   helm upgrade --install teknoir-land --namespace arc-runners --kube-context devhost-ci \
#     oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set \
#     --version 0.15.1 -f charts/ci-runners/arc/teknoir-land.yaml
#
# The Helm release MUST be named teknoir-land: charts/ci-runners NetworkPolicies select
# actions.github.com/scale-set-name=teknoir-land, which ARC sets from the release name.
#
# runs-on: teknoir-land - land.yml only (the merge/land job). No secrets.
# Egress and quotas come from the ci-runners chart (namespace arc-runners).
githubConfigUrl: https://github.com/teknoir
githubConfigSecret: arc-github
controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
runnerScaleSetName: teknoir-land
minRunners: 1
maxRunners: 2
template:
  spec:
    automountServiceAccountToken: false
    priorityClassName: ci-runner-low
    securityContext:
      fsGroup: 1001
    containers:
      # ARC requires the runner container to be named "runner"
      - name: runner
        image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
        imagePullPolicy: IfNotPresent
        # No sudo or root inside jobs: the runner image ships passwordless sudo, which this turns off.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1001
          runAsGroup: 1001
          capabilities:
            drop: [ALL]
          seccompProfile:
            type: RuntimeDefault
        command: ["/home/runner/run.sh"]
        env:
          # Land jobs run PR code. Nothing a job writes may be read by a later job (possibly another repo's), so every
          # cache lives on the pod's emptyDir and dies with the pod. Land is serial; a cold cache costs only time.
          - name: GOMODCACHE
            value: /scratch/go-mod
          - name: GOCACHE
            value: /scratch/go-build
          - name: YARN_CACHE_FOLDER
            value: /scratch/yarn
          - name: npm_config_cache
            value: /scratch/npm
          - name: RUNNER_TOOL_CACHE
            value: /scratch/tool-cache
          - name: AGENT_TOOLSDIRECTORY
            value: /scratch/tool-cache
        resources:
          requests: {cpu: "1", memory: 2Gi}
          limits: {cpu: "6", memory: 8Gi}
        volumeMounts:
          - name: scratch
            mountPath: /scratch
    volumes:
      - name: scratch
        emptyDir:
          sizeLimit: 30Gi
