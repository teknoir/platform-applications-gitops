suite: pin Stages (image pins through pull requests)
# plans/cicd/v4/p42-spec.md section 4. The step tests select the pin-wg-tunnel Stage by name
# (documentSelector), so they do not depend on which groups values.yaml enables; the count test sets its own
# explicit groups (two enabled, one disabled).
templates:
  - templates/stage-pins.yaml
tests:
  - it: renders one Stage per enabled group and none for a disabled group
    set:
      groups:
        - name: wg-tunnel
          enabled: true
          sameCommit: true
          images:
            - {component: wg-hub, poll: ghcr.io/teknoir/wg-hub, repository: ghcr.io/teknoir/wg-hub, key: hub.image.tag, style: tag}
        - name: web-terminal
          enabled: true
          sameCommit: false
          images:
            - {component: web-terminal, poll: ghcr.io/teknoir/web-terminal, repository: ghcr.io/teknoir/web-terminal, key: ztna.terminalImage, style: ref}
        - name: backstage
          enabled: false
          sameCommit: true
          images:
            - {component: backstage-app, poll: harbor.teknoir.cloud/teknoir/backstage-app, repository: ghcr.io/teknoir/backstage-app, key: backstage.image, style: ref}
    asserts:
      - hasDocuments: {count: 2}

  - it: names the Stage pin-<group> in the platform namespace and requests its image Warehouse
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - isKind: {of: Stage}
      - equal: {path: metadata.name, value: pin-wg-tunnel}
      - equal: {path: metadata.namespace, value: platform}
      - equal:
          path: spec.requestedFreight
          value:
            - origin: {kind: Warehouse, name: img-wg-tunnel}
              sources: {direct: true}

  - it: renders no pin Stage when pinStages.enabled is off
    set:
      pinStages.enabled: false
    asserts:
      - hasDocuments: {count: 0}

  - it: clones the branch, rewrites every key of the group pins file, commits, opens a PR and merges it
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal: {path: 'spec.promotionTemplate.spec.steps[0].uses', value: git-clone}
      - equal: {path: 'spec.promotionTemplate.spec.steps[0].as', value: clone}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[0].config.checkout'
          value:
            - {branch: main, path: ./src}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].as', value: update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].config.path', value: ./src/pins/wg-tunnel.yaml}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].uses', value: git-commit}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].as', value: commit}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].uses', value: git-push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].as', value: push}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[3].config.targetBranch'
          value: kargo/promotion/${{ ctx.promotion }}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].uses', value: git-open-pr}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].as', value: openpr}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[4].config'
          value:
            repoURL: https://github.com/teknoir/platform-applications-gitops.git
            provider: github
            sourceBranch: ${{ outputs.push.branch }}
            targetBranch: main
            title: 'chore(pins): wg-hub wg-agent wg-gateway ${{ imageFrom("ghcr.io/teknoir/wg-hub").Tag }} [kargo]'
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].uses', value: git-merge-pr}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].as', value: merge}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].retry', value: {timeout: 30m}}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[5].config'
          value:
            repoURL: https://github.com/teknoir/platform-applications-gitops.git
            provider: github
            prNumber: ${{ outputs.openpr.pr.id }}
            mergeMethod: squash
            wait: true
            pollInterval: 60s
            deleteSourceBranch: true

  - it: skips push, PR and merge when git-commit made no commit
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal:
          path: 'spec.promotionTemplate.spec.steps[3].if'
          value: "${{ success() && status('commit') == 'Succeeded' }}"
      - equal:
          path: 'spec.promotionTemplate.spec.steps[4].if'
          value: "${{ success() && status('push') == 'Succeeded' }}"
      - equal:
          path: 'spec.promotionTemplate.spec.steps[5].if'
          value: "${{ success() && status('openpr') == 'Succeeded' }}"
      - notExists: {path: 'spec.promotionTemplate.spec.steps[0].if'}
      - notExists: {path: 'spec.promotionTemplate.spec.steps[1].if'}
      - notExists: {path: 'spec.promotionTemplate.spec.steps[2].if'}
      - matchRegex:
          path: 'spec.promotionTemplate.spec.steps[3].if'
          pattern: "^\\$\\{\\{ success\\(\\) && status\\('commit'\\) == 'Succeeded' \\}\\}$"

  - it: retries only the push (GitHub may reject one of several simultaneous pushes)
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].as', value: push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].retry', value: {errorThreshold: 3}}
      - notExists: {path: 'spec.promotionTemplate.spec.steps[4].retry'}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].retry', value: {timeout: 30m}}

  - it: maps the style to the value written into the pins file (tag and ref)
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal:
          path: 'spec.promotionTemplate.spec.steps[1].config.updates'
          value:
            - {key: hub.image.tag, value: '${{ imageFrom("ghcr.io/teknoir/wg-hub").Tag }}@${{ imageFrom("ghcr.io/teknoir/wg-hub").Digest }}'}
            - {key: ztna.agentImage, value: 'ghcr.io/teknoir/wg-agent:${{ imageFrom("ghcr.io/teknoir/wg-agent").Tag }}@${{ imageFrom("ghcr.io/teknoir/wg-agent").Digest }}'}
            - {key: ztna.gatewayImage, value: 'ghcr.io/teknoir/wg-gateway:${{ imageFrom("ghcr.io/teknoir/wg-gateway").Tag }}@${{ imageFrom("ghcr.io/teknoir/wg-gateway").Digest }}'}

  - it: writes only the digest for the digest style (the sibling tag stays)
    set:
      groups:
        - name: keycloak-theme
          enabled: true
          sameCommit: false
          images:
            - {component: keycloak-theme, poll: ghcr.io/teknoir/keycloak-theme, repository: ghcr.io/teknoir/keycloak-theme, key: keycloak.image.digest, style: digest}
    asserts:
      - equal: {path: metadata.name, value: pin-keycloak-theme}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[1].config.updates'
          value:
            - {key: keycloak.image.digest, value: '${{ imageFrom("ghcr.io/teknoir/keycloak-theme").Digest }}'}

  - it: writes a group pinned in chart values files into one yaml-update step per file
    set:
      groups:
        - name: ci-runner
          enabled: true
          sameCommit: false
          images:
            - {component: ci-runner, poll: ghcr.io/teknoir/ci-runner, repository: ghcr.io/teknoir/ci-runner, key: template.spec.containers.0.image, style: ref, files: [charts/ci-runners/arc/teknoir-ci.yaml, charts/ci-runners/arc/teknoir-land.yaml, charts/ci-runners/arc/teknoir-push.yaml]}
    documentSelector:
      path: metadata.name
      value: pin-ci-runner
    asserts:
      - lengthEqual: {path: spec.promotionTemplate.spec.steps, count: 8}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].as', value: update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].config.path', value: ./src/charts/ci-runners/arc/teknoir-ci.yaml}
      - lengthEqual: {path: 'spec.promotionTemplate.spec.steps[1].config.updates', count: 1}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].config.updates[0].key', value: template.spec.containers.0.image}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[1].config.updates[0].value'
          value: 'ghcr.io/teknoir/ci-runner:${{ imageFrom("ghcr.io/teknoir/ci-runner").Tag }}@${{ imageFrom("ghcr.io/teknoir/ci-runner").Digest }}'
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].as', value: update2}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].config.path', value: ./src/charts/ci-runners/arc/teknoir-land.yaml}
      - lengthEqual: {path: 'spec.promotionTemplate.spec.steps[2].config.updates', count: 1}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].config.updates[0].key', value: template.spec.containers.0.image}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[2].config.updates[0].value'
          value: 'ghcr.io/teknoir/ci-runner:${{ imageFrom("ghcr.io/teknoir/ci-runner").Tag }}@${{ imageFrom("ghcr.io/teknoir/ci-runner").Digest }}'
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].as', value: update3}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].config.path', value: ./src/charts/ci-runners/arc/teknoir-push.yaml}
      - lengthEqual: {path: 'spec.promotionTemplate.spec.steps[3].config.updates', count: 1}
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].config.updates[0].key', value: template.spec.containers.0.image}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[3].config.updates[0].value'
          value: 'ghcr.io/teknoir/ci-runner:${{ imageFrom("ghcr.io/teknoir/ci-runner").Tag }}@${{ imageFrom("ghcr.io/teknoir/ci-runner").Digest }}'
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].uses', value: git-commit}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].as', value: commit}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].uses', value: git-push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].as', value: push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].retry', value: {errorThreshold: 3}}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[5].if'
          value: "${{ success() && status('commit') == 'Succeeded' }}"
      - equal: {path: 'spec.promotionTemplate.spec.steps[6].uses', value: git-open-pr}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[6].if'
          value: "${{ success() && status('push') == 'Succeeded' }}"
      - equal: {path: 'spec.promotionTemplate.spec.steps[7].uses', value: git-merge-pr}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[7].if'
          value: "${{ success() && status('openpr') == 'Succeeded' }}"
      - equal: {path: 'spec.promotionTemplate.spec.steps[7].retry', value: {timeout: 30m}}

  - it: writes a profile-plugin image into the plugin chart values under plugins/charts/
    # CI v4 P9.1 S7: the first plugin group (jwks-server); its pin lives in the plugin chart values file, which
    # scripts/staging-render.sh --plugins tree renders from plugins/charts/. Tag style: the key holds tag@digest,
    # and the version line carries no trailing comment for Kargo's yaml-update to drop.
    set:
      groups:
        - name: jwks-server
          enabled: true
          sameCommit: false
          images:
            - {component: jwks-server, poll: harbor.teknoir.cloud/teknoir/jwks-server, repository: harbor.teknoir.cloud/teknoir/jwks-server, key: jwks.image.version, style: tag, files: [plugins/charts/profile-plugin-jwks/values.yaml]}
    documentSelector:
      path: metadata.name
      value: pin-jwks-server
    asserts:
      - isKind: {of: Stage}
      - equal: {path: spec.requestedFreight, value: [{origin: {kind: Warehouse, name: img-jwks-server}, sources: {direct: true}}]}
      - lengthEqual: {path: spec.promotionTemplate.spec.steps, count: 6}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].config.path', value: ./src/plugins/charts/profile-plugin-jwks/values.yaml}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[1].config.updates'
          value:
            - {key: jwks.image.version, value: '${{ imageFrom("harbor.teknoir.cloud/teknoir/jwks-server").Tag }}@${{ imageFrom("harbor.teknoir.cloud/teknoir/jwks-server").Digest }}'}
      - equal: {path: 'spec.promotionTemplate.spec.steps[2].uses', value: git-commit}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[2].config.message'
          value: 'chore(pins): jwks-server ${{ imageFrom("harbor.teknoir.cloud/teknoir/jwks-server").Tag }} [kargo]'
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].uses', value: git-push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].uses', value: git-open-pr}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].uses', value: git-merge-pr}

  - it: writes both images of a same-commit plugin group into its one plugin chart values file
    # CI v4 P9.1 S7, group two (fleet-metrics): two images from one teknoir/fleet-metrics commit, pinned in the
    # same plugins/charts values file, so one yaml-update step carries both keys (in component order).
    set:
      groups:
        - name: fleet-metrics
          enabled: true
          sameCommit: true
          images:
            - {component: metrics-processor, poll: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-processor, repository: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-processor, key: metricsProcessor.image.version, style: tag, files: [plugins/charts/profile-plugin-fleet-metrics/values.yaml]}
            - {component: metrics-publisher, poll: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher, repository: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher, key: metricsPublisher.image.version, style: tag, files: [plugins/charts/profile-plugin-fleet-metrics/values.yaml]}
    documentSelector:
      path: metadata.name
      value: pin-fleet-metrics
    asserts:
      - isKind: {of: Stage}
      - equal: {path: spec.requestedFreight, value: [{origin: {kind: Warehouse, name: img-fleet-metrics}, sources: {direct: true}}]}
      - lengthEqual: {path: spec.promotionTemplate.spec.steps, count: 6}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].uses', value: yaml-update}
      - equal: {path: 'spec.promotionTemplate.spec.steps[1].config.path', value: ./src/plugins/charts/profile-plugin-fleet-metrics/values.yaml}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[1].config.updates'
          value:
            - {key: metricsProcessor.image.version, value: '${{ imageFrom("harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-processor").Tag }}@${{ imageFrom("harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-processor").Digest }}'}
            - {key: metricsPublisher.image.version, value: '${{ imageFrom("harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher").Tag }}@${{ imageFrom("harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher").Digest }}'}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[2].config.message'
          value: 'chore(pins): metrics-processor metrics-publisher ${{ imageFrom("harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-processor").Tag }} [kargo]'
      - equal: {path: 'spec.promotionTemplate.spec.steps[3].uses', value: git-push}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].uses', value: git-open-pr}
      - equal: {path: 'spec.promotionTemplate.spec.steps[5].uses', value: git-merge-pr}

  - it: names the components, not the group, in the commit message (plan 7.1)
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal:
          path: 'spec.promotionTemplate.spec.steps[2].config.message'
          value: 'chore(pins): wg-hub wg-agent wg-gateway ${{ imageFrom("ghcr.io/teknoir/wg-hub").Tag }} [kargo]'

  - it: uses the rehearsal branch and pin prefix from the override values
    values:
      - ../values-rehearsal.yaml
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - equal:
          path: 'spec.promotionTemplate.spec.steps[0].config.checkout'
          value:
            - {branch: rehearsal/kargo, path: ./src}
      - equal:
          path: 'spec.promotionTemplate.spec.steps[3].config.targetBranch'
          value: kargo/rehearsal/${{ ctx.promotion }}
      - equal: {path: 'spec.promotionTemplate.spec.steps[4].config.targetBranch', value: rehearsal/kargo}

  - it: renders the Kargo promotion name and image references literally
    documentSelector:
      path: metadata.name
      value: pin-wg-tunnel
    asserts:
      - matchRegex: {path: 'spec.promotionTemplate.spec.steps[3].config.targetBranch', pattern: '^kargo/promotion/\$\{\{ ctx\.promotion \}\}$'}
      - matchRegex: {path: 'spec.promotionTemplate.spec.steps[1].config.updates[0].value', pattern: '^\$\{\{ imageFrom\("ghcr\.io/teknoir/wg-hub"\)\.Tag \}\}@'}
