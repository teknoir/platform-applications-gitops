suite: Kargo UI VirtualService
templates:
  - templates/virtualservice.yaml
tests:
  - it: routes kargo.teknoir.cloud on the shared gateway to kargo-api over plain HTTP by default
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: VirtualService}
      - equal: {path: metadata.name, value: kargo}
      - equal: {path: metadata.namespace, value: platform}
      - equal: {path: spec.hosts, value: [kargo.teknoir.cloud]}
      - equal: {path: spec.gateways, value: [istio-system/teknoir-gateway]}
      - equal: {path: "spec.http[0].route[0].destination.host", value: kargo-api.kargo.svc.cluster.local}
      - equal: {path: "spec.http[0].route[0].destination.port.number", value: 80}
      # no route timeout key at all: Istio rejects timeout: 0s (duration must be greater than 1ms)
      - notExists: {path: "spec.http[0].timeout"}
  - it: renders nothing with ui.enabled false
    set:
      ui: {enabled: false}
    asserts:
      - hasDocuments: {count: 0}
