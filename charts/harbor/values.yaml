# GitOps values
namespace: teknoir-system

# Istio integration configuration
istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system
  auth:
    # We use Harbor's native OIDC integration instead of oauth2-proxy
    # to avoid breaking Docker/Helm CLI workflows.
    enabled: false

# Domain and naming conventions
domain: "teknoir.cloud"
hostname: "harbor.teknoir.cloud"

# Optional nodeAffinity for the hostPath PersistentVolumes
# (templates/harbor-pv.yaml), pinning Harbor's data to the node that holds it
# once there is more than one node, for example:
#   pvNodeAffinity:
#     required:
#       nodeSelectorTerms:
#         - matchExpressions:
#             - key: teknoir.org/storage
#               operator: In
#               values: ["true"]
# Empty (the default) renders none. A PersistentVolume's nodeAffinity cannot
# be changed after creation, so set it before the first install, or re-create
# the PVs (reclaim policy Retain keeps the data) when adding it later.
pvNodeAffinity: {}

# Harbor OIDC login through Keycloak (realm teknoir), configured by a PostSync
# Job (templates/oidc-config-job.yaml, files/oidc-config.sh) through Harbor's
# API instead of by hand. The Job reads the admin password and the OIDC client
# secret from Secrets (never printing them), GETs /api/v2.0/configurations and
# PUTs only the settings that differ. The client secret cannot be read back, so
# the Job keeps its sha256 in ConfigMap <oidcConfig.stateConfigMap> and sends it
# only when it changed. Harbor refuses to switch auth_mode once users other
# than admin exist; the Job then leaves auth_mode alone and says so. The local
# admin keeps working in OIDC mode (break-glass, and the airgap node's pushes).
oidcConfig:
  # Off on teknoir-cloud: realm master has no `harbor` Keycloak client yet (only an
  # admin can create one). Harbor uses local users (admin) and robot accounts; turn
  # this on together with a harbor-oidc-secret once the client exists.
  enabled: false
  # Mirrored toolbox image (sh, curl, jq, kubectl), also a bootstrap image.
  image: docker.io/alpine/k8s:1.34.11
  imagePullPolicy: IfNotPresent
  adminPasswordSecret:
    name: harbor-secret
    key: HARBOR_ADMIN_PASSWORD
  # Copy of the harbor client secret of Keycloak realm teknoir, kept in sync by
  # the platform-secrets chart from teknoir-auth/keycloak-client-secrets.
  clientSecret:
    name: harbor-oidc-secret
    key: client-secret
  stateConfigMap: harbor-oidc-config-state
  # How long the Job waits for Harbor to report healthy.
  waitSeconds: 1200
  # Harbor configuration keys (PUT /api/v2.0/configurations). oidc_endpoint is
  # the realm's issuer URL: Keycloak serves under /auth (KC_HTTP_RELATIVE_PATH).
  # oidc_verify_cert relies on harbor.caBundleSecretName above. offline_access
  # (an optional client scope of realm teknoir) gives Harbor a refresh token, so
  # OIDC users' CLI secrets keep working after their ID token expires.
  settings:
    auth_mode: oidc_auth
    oidc_name: Keycloak
    oidc_endpoint: https://auth.teknoir.cloud/auth/realms/master
    oidc_client_id: harbor
    oidc_scope: openid,profile,email,groups,offline_access
    oidc_user_claim: preferred_username
    oidc_groups_claim: groups
    oidc_admin_group: admin
    oidc_verify_cert: true
    oidc_auto_onboard: true

# Harbor's internal registry credential: harbor-core and harbor-jobservice log
# in to harbor-registry with basic auth as harbor.registry.credentials.username.
# harbor.registry.credentials.existingSecret below points all three at one
# Secret (keys REGISTRY_PASSWD and REGISTRY_HTPASSWD), so neither the password
# nor the htpasswd is rendered: the chart default password stays out of the
# render, and the render no longer changes with the htpasswd salt. A Sync hook
# Job (templates/registry-auth-job.yaml, files/registry-auth.sh) creates that
# Secret once, in-cluster, with a random password and its bcrypt htpasswd line
# (the registry accepts bcrypt only; the Job uses helm's htpasswd function,
# since the toolbox image has no other bcrypt tool). An existing Secret is
# never changed. To rotate, delete the Secret and sync the harbor Application:
# the Job creates a new one and restarts the Deployments below that were
# running with the old one.
# Token-service key pair (harbor.core.secretName below) from cert-manager: a
# self-signed RSA certificate, created once in-cluster and never rendered, so the
# render stays deterministic. The airgap node creates the same Secret itself, so
# this is off there.
tokenServiceCert:
  certManager: true
  duration: 87600h # 10 years; harbor-core reads it at start

# Harbor configuration as code (files/harbor-config.py): system settings, proxy-cache
# upstreams, projects with quotas and tag retention, GC / audit-purge / scan-all
# schedules, and robot accounts whose credentials are written as Secrets where they
# are used. Runs as a PostSync hook and hourly; every run is idempotent.
# Harbor schedules use 6-field cron (seconds first), in UTC.
harborConfig:
  enabled: true
  image: docker.io/library/python:3.14-alpine
  imagePullPolicy: IfNotPresent
  schedule: "17 * * * *"
  adminPasswordSecret:
    name: harbor-secret
    key: HARBOR_ADMIN_PASSWORD
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
  config:
    configurations:
      project_creation_restriction: adminonly
      self_registration: false
      robot_token_duration: 30
    # Upstreams for the pull-through proxy-cache projects (anonymous: public images only).
    registries:
      - {name: dockerhub, type: docker-hub, url: "https://hub.docker.com"}
      - {name: ghcr, type: github-ghcr, url: "https://ghcr.io"}
      - {name: quay, type: quay, url: "https://quay.io"}
      - {name: k8s, type: docker-registry, url: "https://registry.k8s.io"}
    # Quotas are the hard stop that keeps /opt from filling: 1 TiB + 4 x 150 GiB fits
    # in /opt (3.6 TB, 3.3 TB free on 2026-10-16) with room for k3s and the PVs.
    projects:
      - {name: teknoir, public: false, quotaGiB: 1024, retention: ci}
      - {name: dockerhub, proxyRegistry: dockerhub, public: false, quotaGiB: 150, retention: proxy}
      - {name: ghcr, proxyRegistry: ghcr, public: false, quotaGiB: 150, retention: proxy}
      - {name: quay, proxyRegistry: quay, public: false, quotaGiB: 150, retention: proxy}
      - {name: k8s, proxyRegistry: k8s, public: false, quotaGiB: 150, retention: proxy}
    retentionPolicies:
      # CI images (rules are OR-ed; anything no rule retains is deleted, including
      # untagged digests):
      #   - release and environment tags forever,
      #   - the 15 most recently pushed artifacts of every repository,
      #   - anything pulled in the last 30 days (in use).
      ci:
        schedule: "0 0 2 * * *"
        rules:
          - {template: always, tags: "{v*,latest,main,master,teknoir-cloud,teknoir-online,teknoir-local,robot}"}
          - {template: latestPushedK, value: 15}
          - {template: nDaysSinceLastPull, value: 30}
      # Proxy caches: keep what was pulled in the last 30 days.
      proxy:
        schedule: "0 30 2 * * *"
        rules:
          - {template: nDaysSinceLastPull, value: 30}
    # Blob GC after retention (Sunday); untagged manifests go too.
    gc: {schedule: "0 0 4 * * 0", deleteUntagged: true, workers: 1}
    auditPurge:
      schedule: "0 30 4 * * 0"
      retentionHours: 720
      eventTypes: [create_artifact, delete_artifact, pull_artifact, create_project, delete_project,
                   delete_repository, login_user, logout_user, create_user, delete_user, update_user,
                   create_robot, delete_robot, update_configuration, other]
    scanAll: {schedule: "0 0 5 * * 6"}
    robots:
      # CI push/pull (charts/ci). The Secret is a dockerconfigjson with extra
      # username/password keys; charts/ci grants this Job's ServiceAccount write access
      # to it. Delete the Secret to rotate the credential.
      - name: ci
        secret: {namespace: teknoir-ci, name: harbor-ci-robot}
        permissions:
          - project: teknoir
            access: ["repository:push", "repository:pull", "repository:list", "artifact:read", "artifact:list",
                     "artifact:create", "tag:create", "tag:list"]
          - {project: dockerhub, access: ["repository:pull"]}
          - {project: ghcr, access: ["repository:pull"]}
          - {project: quay, access: ["repository:pull"]}
          - {project: k8s, access: ["repository:pull"]}

registryAuth:
  enabled: true
  # Mirrored toolbox image (sh, kubectl, helm, jq), also a bootstrap image.
  image: docker.io/alpine/k8s:1.34.11
  imagePullPolicy: IfNotPresent
  # The Deployments that read the credential (release harbor).
  restartDeployments:
    - harbor-core
    - harbor-jobservice
    - harbor-registry
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The Harbor subchart configuration
harbor:
  expose:
    type: none
    tls:
      enabled: false

    # We use "clusterIP" type to enable the internal harbor-proxy (nginx)
    # as the single backend for Istio VirtualService.
#    type: clusterIP
#    tls:
#      # Istio handles TLS at the gateway, so we disable it for the internal proxy.
#      enabled: false
#    clusterIP:
#      name: harbor-proxy
#      ports:
#        httpPort: 80

  # Feeds Harbor core's EXT_ENDPOINT, which builds the registry token realm
  # advertised in /v2/'s Www-Authenticate header. Must include the https://
  # scheme, otherwise helm/oras reject the schemeless realm with
  # "bearer realm ... uses unsupported scheme". The airgap bootstrap renders
  # this chart with no overrides, so it must match `hostname` above.
  externalURL: "https://harbor.teknoir.cloud"

  # teknoir-cloud uses public Let's Encrypt certificates, so no private CA bundle
  # (the airgap branch sets caBundleSecretName: teknoir-root-ca-bundle here).

  # Persistence configuration following the repo's pattern of using hostPath for local/initial setups
  # or allowing override via PVCs.
  persistence:
    enabled: true
    resourcePolicy: "keep"
    hostPathPrefix: /opt/teknoir/harbor
    persistentVolumeClaim:
      registry:
        existingClaim: harbor-registry-pvc
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 500Gi
      jobservice:
        existingClaim: harbor-jobservice-pvc
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 1Gi
      database:
        existingClaim: harbor-database-pvc
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi
      redis:
        existingClaim: harbor-redis-pvc
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 1Gi
      trivy:
        existingClaim: harbor-trivy-pvc
        storageClass: ""
        accessMode: ReadWriteOnce
        size: 5Gi

  # Fix for hostPath permission issues on all components that use persistent volumes
  database:
    internal:
      extrInitContainers:
        - name: fix-permissions
          image: docker.io/library/busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 999:999 /var/lib/postgresql/data"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: database-data
              mountPath: /var/lib/postgresql/data

  redis:
    internal:
      initContainers:
        - name: fix-permissions
          image: docker.io/library/busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "chown -R 999:999 /var/lib/redis"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/redis

  trivy:
    enabled: true
    initContainers:
      - name: fix-permissions
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "chown -R 10000:10000 /home/scanner/.cache"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: data
            mountPath: /home/scanner/.cache

  registry:
    existingSecret: "harbor-secret"
    existingSecretKey: "REGISTRY_HTTP_SECRET"
    # core/jobservice -> registry basic auth, from the Secret that the
    # registryAuth Job above creates (keys REGISTRY_PASSWD, REGISTRY_HTPASSWD).
    credentials:
      username: harbor_registry_user
      existingSecret: harbor-registry-auth
    # Harbor core relays /v2/ requests to the registry and rewrites the Host
    # header to the internal harbor-registry service (see the core EnvoyFilter).
    # With relative URLs the registry returns Location headers relative to the
    # request path, so docker/helm/oras resolve them against the external
    # harbor URL instead of the internal service name.
    relativeurls: true
    initContainers:
      - name: fix-permissions
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "chown -R 10000:10000 /storage"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: registry-data
            mountPath: /storage

  jobservice:
    existingSecret: "harbor-secret"
    existingSecretKey: "JOBSERVICE_SECRET"
    initContainers:
      - name: fix-permissions
        image: docker.io/library/busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "chown -R 10000:10000 /var/log/jobs"]
        securityContext:
          runAsUser: 0
        volumeMounts:
          - name: job-logs
            mountPath: /var/log/jobs

  # Secret management
  # harbor-secret is created once in-cluster by the platform-secrets chart.
  existingSecretAdminPassword: "harbor-secret"
  existingSecretAdminPasswordKey: "HARBOR_ADMIN_PASSWORD"
  existingSecretSecretKey: "harbor-secret"

  core:
    existingSecret: "harbor-secret"
    # Note: 'secret' is the default key in core.existingSecret
    existingXsrfSecret: "harbor-secret"
    existingXsrfSecretKey: "CSRF_KEY"
    # The token-service key pair (tls.key signs registry tokens, tls.crt is the
    # registry's root.crt). On teknoir-cloud cert-manager creates this
    # kubernetes.io/tls Secret (tokenServiceCert above); the airgap node creates it
    # itself. Without it the chart generates a new key pair (genCA) on
    # every render, so every ArgoCD refresh rolled harbor-core and the registry.
    secretName: harbor-token-service

  # Not configurable from a Secret in Harbor chart 1.18.3 with the internal
  # database: database.internal.password, the internal PostgreSQL superuser
  # password, fixed at initdb. It stays the chart default, as on the running
  # teknoir-local install, and is rendered into the harbor-core
  # (POSTGRESQL_PASSWORD) and harbor-database (POSTGRES_PASSWORD) Secrets.
  # Changing it needs an in-database password change plus a chart that reads
  # it from a Secret (a follow-up that needs the owner's decision). Until then
  # any meshed workload in teknoir-system or teknoir-auth (AuthorizationPolicy
  # harbor-allow-internal, STRICT mTLS) can reach harbor-database:5432 and log
  # in with it.
