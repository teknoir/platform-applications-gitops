suite: harbor-config RBAC (Secrets it writes, Profiles it lists)
templates:
  - templates/harbor-config-rbac.yaml
release:
  name: harbor
  namespace: teknoir-system
tests:
  - it: gives get/update on exactly the Secrets in teknoir-system and no create
    documentSelector:
      path: kind
      value: Role
    asserts:
      - equal:
          path: metadata.namespace
          value: teknoir-system
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [harbor-nodes-pull, harbor-teamspace-pull]
              verbs: [get, update]
  - it: never grants create on Secrets (it would mint a token for a cluster-admin ServiceAccount)
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules[0].verbs
          content: create
      - lengthEqual:
          path: rules
          count: 1
  - it: renders the Secrets it writes as empty Opaque Secrets that ArgoCD does not prune
    asserts:
      - isKind: {of: Secret}
        documentIndex: 0
      - isKind: {of: Secret}
        documentIndex: 1
      - equal: {path: metadata.name, value: harbor-nodes-pull}
        documentIndex: 0
      - equal: {path: metadata.name, value: harbor-teamspace-pull}
        documentIndex: 1
      - equal: {path: type, value: Opaque}
        documentIndex: 0
      - equal: {path: type, value: Opaque}
        documentIndex: 1
      - notExists: {path: data}
        documentIndex: 0
      - notExists: {path: data}
        documentIndex: 1
      - notExists: {path: stringData}
        documentIndex: 1
      - equal: {path: metadata.namespace, value: teknoir-system}
        documentIndex: 1
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false
        documentIndex: 1
  - it: never grants delete, list or watch on Secrets
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules[0].verbs
          content: delete
      - notContains:
          path: rules[0].verbs
          content: list
      - notContains:
          path: rules[0].verbs
          content: watch
  - it: leaves the Secret in teknoir-ci to the ci chart
    documentSelector:
      path: kind
      value: Role
    asserts:
      - notContains:
          path: rules[0].resourceNames
          content: harbor-ci-robot
  - it: binds the Role to the harbor-config ServiceAccount
    documentSelector:
      path: kind
      value: RoleBinding
    asserts:
      - equal:
          path: subjects[0]
          value: {kind: ServiceAccount, name: harbor-config, namespace: teknoir-system}
      - equal:
          path: roleRef.name
          value: harbor-config
  - it: lets the job list Profiles and nothing else cluster-wide
    documentSelector:
      path: kind
      value: ClusterRole
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [teknoir.org]
              resources: [profiles]
              verbs: [get, list]
  - it: binds the ClusterRole to the harbor-config ServiceAccount
    documentSelector:
      path: kind
      value: ClusterRoleBinding
    asserts:
      - equal:
          path: subjects[0]
          value: {kind: ServiceAccount, name: harbor-config, namespace: teknoir-system}
  - it: renders only the nodes Secret, the Role and its binding when teamspace robots are off
    set:
      harborConfig.config.teamspaceRobots.enabled: false
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Secret
        documentIndex: 0
      - equal:
          path: metadata.name
          value: harbor-nodes-pull
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: rules[0].resourceNames
          value: [harbor-nodes-pull]
        documentIndex: 1
  - it: renders nothing when harbor-config is disabled
    set:
      harborConfig.enabled: false
    asserts:
      - hasDocuments:
          count: 0
