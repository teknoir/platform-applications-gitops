{{- if .Values.harborConfig.enabled }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $cfg := .Values.harborConfig.config }}
{{- /* The Secrets harbor-config writes in this namespace: robots whose Secret lives here, and the
teamspace pull Secret. Everything else (teknoir-ci) is granted by the consuming chart. */}}
{{- $names := list }}
{{- range $cfg.robots }}
{{- if eq .secret.namespace $namespace }}{{ $names = append $names .secret.name }}{{ end }}
{{- end }}
{{- if and $cfg.teamspaceRobots (ne $cfg.teamspaceRobots.enabled false) (eq $cfg.teamspaceRobots.secret.namespace $namespace) }}
{{- $names = append $names $cfg.teamspaceRobots.secret.name }}
{{- end }}
{{- if $names }}
---
# harbor-config writes the robot credentials it manages into Secrets in this namespace:
# get/update on exactly those Secrets, and create for the first write.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-config
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $names | uniq | toJson }}
    verbs: [get, update]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-config
  namespace: {{ $namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: harbor-config}
subjects:
  - {kind: ServiceAccount, name: harbor-config, namespace: {{ $namespace }}}
{{- end }}
{{- if and $cfg.teamspaceRobots (ne $cfg.teamspaceRobots.enabled false) }}
---
# One robot per teamspace: harbor-config lists the Profiles (and nothing else cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-config-profiles
rules:
  - apiGroups: [teknoir.org]
    resources: [profiles]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-config-profiles
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: harbor-config-profiles}
subjects:
  - {kind: ServiceAccount, name: harbor-config, namespace: {{ $namespace }}}
{{- end }}
{{- end }}
