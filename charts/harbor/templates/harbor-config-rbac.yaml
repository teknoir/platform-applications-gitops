{{- if .Values.harborConfig.enabled }}
{{- $namespace := .Values.namespace | default .Release.Namespace }}
{{- $cfg := .Values.harborConfig.config }}
{{- /* The Secrets harbor-config writes in this namespace: robots whose Secret lives here, and the
teamspace pull Secret. Everything else (teknoir-ci) is granted by the consuming chart. */}}
{{- $names := list }}
{{- range $cfg.robots }}
{{- if eq .secret.namespace $namespace }}{{ $names = append $names .secret.name }}{{ end }}
{{- end }}
{{- if and $cfg.teamspaceRobots (ne $cfg.teamspaceRobots.enabled false) (eq $cfg.teamspaceRobots.secret.namespace $namespace) }}
{{- $names = append $names $cfg.teamspaceRobots.secret.name }}
{{- end }}
{{- if $names }}
{{- range $names | uniq | sortAlpha }}
---
# The Secret is rendered here (empty, Opaque) so that harbor-config never needs `create` in this
# namespace: a Role with `create` on Secrets could mint a kubernetes.io/service-account-token
# Secret for one of the cluster-admin ServiceAccounts that live in teknoir-system and read its
# token. Secret `type` is immutable, so get/update on a name that already exists as Opaque cannot
# do that. harbor-config fills in the data; ArgoCD must neither prune nor reset it. Rotate by
# deleting a key (teamspace Secret) or the data keys, never the Secret.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ . }}
  namespace: {{ $namespace }}
  labels:
    teknoir.org/managed-by: harbor-config
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
{{- end }}
---
# harbor-config writes the robot credentials it manages into the Secrets above: get/update on
# exactly those names. No `create` (see above) and no list/watch/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harbor-config
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $names | uniq | sortAlpha | toJson }}
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harbor-config
  namespace: {{ $namespace }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: harbor-config}
subjects:
  - {kind: ServiceAccount, name: harbor-config, namespace: {{ $namespace }}}
{{- end }}
{{- if and $cfg.teamspaceRobots (ne $cfg.teamspaceRobots.enabled false) }}
---
# One robot per teamspace: harbor-config lists the Profiles (and nothing else cluster-wide).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harbor-config-profiles
rules:
  - apiGroups: [teknoir.org]
    resources: [profiles]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harbor-config-profiles
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: harbor-config-profiles}
subjects:
  - {kind: ServiceAccount, name: harbor-config, namespace: {{ $namespace }}}
{{- end }}
{{- end }}
