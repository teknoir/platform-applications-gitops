suite: desktop (remote desktop) config
templates:
  - templates/configmap.yaml
set:
  ztna.agentImage: "ghcr.io/teknoir/wg-agent:sha-0000000a@sha256:1111111111111111111111111111111111111111111111111111111111111111"
  ztna.terminalImage: "ghcr.io/teknoir/web-terminal:sha-0000000b@sha256:2222222222222222222222222222222222222222222222222222222222222222"
tests:
  - it: has no DESKTOP key while ztna is off (the default)
    asserts:
      - notExists:
          path: data.DESKTOP

  - it: has no DESKTOP key when desktop is on and ztna is off
    set:
      desktop.enabled: true
      desktop.image: "ghcr.io/teknoir/teknoir-desktop:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      ztna.enabled: false
    asserts:
      - notExists:
          path: data.DESKTOP

  - it: has no DESKTOP key when ztna is on and desktop is off
    set:
      desktop.enabled: false
      ztna.enabled: true
    asserts:
      - notExists:
          path: data.DESKTOP

  - it: puts DESKTOP in the ConfigMap when desktop and ztna are on
    set:
      desktop.enabled: true
      desktop.image: "ghcr.io/teknoir/teknoir-desktop:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      ztna.enabled: true
    asserts:
      - equal:
          path: data.DESKTOP
          value: '{"enabled":true,"hostGroupID":64080,"image":"ghcr.io/teknoir/teknoir-desktop:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"}'

  - it: passes a custom hostGroupID
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.hostGroupID: 70001
      ztna.enabled: true
    asserts:
      - matchRegex:
          path: data.DESKTOP
          pattern: '"hostGroupID":70001'

  - it: fails with an empty image when enabled
    set:
      desktop.enabled: true
      desktop.image: ""
      ztna.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "desktop.image is required when desktop.enabled.*scripts/pin-image"

  - it: has no agent while the agent switch is off, even with an agent image
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: "agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444"
      ztna.enabled: true
    asserts:
      - notMatchRegex:
          path: data.DESKTOP
          pattern: '"agent"'

  - it: has no agent with the switch on and no agent image
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: ""
      teknoirbotApi.enabled: true
      ztna.enabled: true
    asserts:
      - notMatchRegex:
          path: data.DESKTOP
          pattern: '"agent"'

  - it: renders the agent with the switch on and its images
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: "agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444"
      desktop.agent.buildkitImage: "buildkit:v1@sha256:5555555555555555555555555555555555555555555555555555555555555555"
      desktop.agent.registryImage: "registry:v1@sha256:6666666666666666666666666666666666666666666666666666666666666666"
      teknoirbotApi.enabled: true
      ztna.enabled: true
    asserts:
      - equal:
          path: data.DESKTOP
          value: '{"agent":{"buildkitImage":"buildkit:v1@sha256:5555555555555555555555555555555555555555555555555555555555555555","image":"agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444","registryImage":"registry:v1@sha256:6666666666666666666666666666666666666666666666666666666666666666"},"enabled":true,"hostGroupID":64080,"image":"img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"}'

  - it: passes the agent's memory limit when set
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: "agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444"
      desktop.agent.buildkitImage: "buildkit:v1@sha256:5555555555555555555555555555555555555555555555555555555555555555"
      desktop.agent.registryImage: "registry:v1@sha256:6666666666666666666666666666666666666666666666666666666666666666"
      desktop.agent.desktopMemoryLimit: 8Gi
      teknoirbotApi.enabled: true
      ztna.enabled: true
    asserts:
      - matchRegex:
          path: data.DESKTOP
          pattern: '"desktopMemoryLimit":"8Gi"'

  - it: fails when the agent image is set without the buildkit image
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: "agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444"
      desktop.agent.registryImage: "registry:v1@sha256:6666666666666666666666666666666666666666666666666666666666666666"
      desktop.agent.buildkitImage: ""
      teknoirbotApi.enabled: true
      ztna.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "desktop.agent.buildkitImage is required"

  - it: fails when the agent image is set without the registry image
    set:
      desktop.enabled: true
      desktop.image: "img:v1@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      desktop.agent.image: "agent:v1@sha256:4444444444444444444444444444444444444444444444444444444444444444"
      desktop.agent.buildkitImage: "buildkit:v1@sha256:5555555555555555555555555555555555555555555555555555555555555555"
      desktop.agent.registryImage: ""
      teknoirbotApi.enabled: true
      ztna.enabled: true
    asserts:
      - failedTemplate:
          errorPattern: "desktop.agent.registryImage is required"
