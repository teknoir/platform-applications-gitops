suite: platform DeviceApplicationSets, RobotTypes and Robots
# The optional labels/annotations/priority keys of the DAS entries, and the two new CR templates
# (CI v4 P8.1). Every test names the one template it tests, so the rest of the chart is not rendered.
# helm renders the whole chart even when a test asserts one template, and deployment.yaml requires the image pins
# the device-controller Application passes (charts/app-of-apps/templates/controllers.yaml).
values:
  - ../../../pins/device-controller.yaml
  - ../../../pins/teknoir-desktop.yaml
  - ../../../pins/web-terminal.yaml
  - ../../../pins/wg-tunnel.yaml
  # The fleet pointers of the hardware classes (fleet/README.md), as the device-controller Application passes them.
  - ../../../fleet/jetson-orin.yaml
  - ../../../fleet/nvidia-rtx.yaml
  - ../../../fleet/raspberry-pi.yaml
tests:
  - it: keeps the six default DAS documents with only the fixed annotation and label, and no priority
    templates:
      - templates/platform-device-application-sets.yaml
    documentSelector:
      path: metadata.name
      value: demo-test
    asserts:
      - hasDocuments: {count: 6}
      - equal:
          path: metadata.annotations
          value: {argocd.argoproj.io/sync-options: "Prune=false,Delete=false"}
      - equal:
          path: metadata.labels
          value: {teknoir.org/managed-by: gitops}
      - notExists: {path: spec.priority}

  - it: keeps demo-test's two per-application revisions and adds no fleet label
    templates:
      - templates/platform-device-application-sets.yaml
    documentSelector:
      path: metadata.name
      value: demo-test
    asserts:
      - equal: {path: 'spec.applications[0].revision', value: b35465914439f74af8d540645c339e3773092d69}
      - equal: {path: 'spec.applications[1].revision', value: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
      - notExists: {path: 'metadata.labels["teknoir.org/fleet"]'}

  - it: emits spec.priority 0 when the entry sets priority 0 explicitly
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: zero
          namespace: teknoir-demo
          priority: 0
          selector: {matchLabels: {device-group: test}}
          applications: []
    documentSelector:
      path: metadata.name
      value: zero
    asserts:
      - equal: {path: spec.priority, value: 0}

  - it: emits spec.priority 7 when the entry sets it
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: seven
          namespace: teknoir-demo
          priority: 7
          selector: {matchLabels: {device-group: test}}
          applications: []
    documentSelector:
      path: metadata.name
      value: seven
    asserts:
      - equal: {path: spec.priority, value: 7}

  - it: merges the entry's annotations and labels under the fixed ones, which always win
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: merged
          namespace: teknoir-demo
          annotations:
            teknoir.org/display-name: X
            argocd.argoproj.io/sync-options: Prune=true
          labels:
            site: k
            teknoir.org/managed-by: hand
          selector: {matchLabels: {device-group: test}}
          applications: []
    documentSelector:
      path: metadata.name
      value: merged
    asserts:
      - equal:
          path: metadata.annotations["teknoir.org/display-name"]
          value: X
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=false,Delete=false"
      - equal: {path: metadata.labels.site, value: k}
      - equal:
          path: metadata.labels["teknoir.org/managed-by"]
          value: gitops

  - it: renders no RobotType documents when platformRobotTypes is empty
    templates:
      - templates/platform-robot-types.yaml
    set:
      platformRobotTypes: []
    asserts:
      - hasDocuments: {count: 0}

  - it: renders no Robot documents when platformRobots is empty
    templates:
      - templates/platform-robots.yaml
    set:
      platformRobots: []
    asserts:
      - hasDocuments: {count: 0}

  # The shipped entries (transcribed from teknoir-demo on 2026-11-25): every one in teknoir-demo, pinned to a commit.
  - it: ships the three RobotTypes of teknoir-demo
    templates:
      - templates/platform-robot-types.yaml
    asserts:
      - hasDocuments: {count: 3}
      - equal: {path: metadata.namespace, value: teknoir-demo}
      - matchRegex: {path: 'metadata.name', pattern: '^(mobile-robot|sensor-unit|vision-station)$'}

  - it: pins mobile-robot's notebook and devstudio apps to the devstudio 0.1.0 commit
    templates:
      - templates/platform-robot-types.yaml
    documentSelector: {path: metadata.name, value: mobile-robot}
    asserts:
      - equal: {path: 'spec.applications[0].path', value: test/notebook.yaml}
      - equal: {path: 'spec.applications[0].revision', value: b35465914439f74af8d540645c339e3773092d69}
      - equal: {path: 'spec.applications[1].path', value: common/devstudio.yaml}
      - equal: {path: 'spec.applications[1].revision', value: b35465914439f74af8d540645c339e3773092d69}

  - it: ships the four Robots, each bound to its device
    templates:
      - templates/platform-robots.yaml
    asserts:
      - hasDocuments: {count: 4}
      - equal: {path: metadata.namespace, value: teknoir-demo}
      - equal: {path: 'metadata.labels.site', value: karlstad}
      - matchRegex: {path: 'spec.device', pattern: '^(orin-agx-32gb-se|rpi4-white-se|rtx2000-ada-128gb-se|orin-agx-64gb-se)$'}

  - it: pins the Robot apps to nextgen's head as of the move (1ea24b5f)
    templates:
      - templates/platform-robots.yaml
    documentSelector: {path: metadata.name, value: vision-station-01}
    asserts:
      - equal: {path: 'spec.applications[0].path', value: robots/vision-station-01}
      - equal: {path: 'spec.applications[0].revision', value: 1ea24b5f3ce479f6afa092c64c2e9240bde1e742}

  - it: keeps the mock DAS selector, node role and Backstage annotations
    templates:
      - templates/platform-device-application-sets.yaml
    documentSelector: {path: metadata.name, value: mock-io}
    asserts:
      - equal: {path: 'metadata.annotations["teknoir.org/display-name"]', value: Mock sensors and control}
      - equal: {path: 'metadata.annotations["argocd.argoproj.io/sync-options"]', value: 'Prune=false,Delete=false'}
      - equal: {path: 'metadata.labels["teknoir.org/managed-by"]', value: gitops}
      - equal: {path: 'spec.selector.matchExpressions[0].values', value: [mobile-robot, sensor-unit]}
      - equal: {path: 'spec.applications[0].node_role', value: io}
      - equal: {path: 'spec.applications[0].revision', value: 1ea24b5f3ce479f6afa092c64c2e9240bde1e742}
      - notExists: {path: spec.priority}

  # The class DAS take their commit from fleet/<class>.yaml (fleet: <class>), not from each application
  # (CI v4 P8.5, flow 3.5).
  - it: renders gpu-jetson as the jetson-orin class DAS from its fleet pointer
    templates:
      - templates/platform-device-application-sets.yaml
    documentSelector: {path: metadata.name, value: gpu-jetson}
    asserts:
      - equal: {path: spec.selector.matchLabels, value: {teknoir.org/hw-class: jetson-orin}}
      - equal: {path: 'metadata.labels["teknoir.org/fleet"]', value: jetson-orin}
      - equal: {path: 'metadata.labels["teknoir.org/managed-by"]', value: gitops}
      - equal: {path: 'spec.applications[0].path', value: fleets/gpu-metrics/prometheus.yaml}
      - equal: {path: 'spec.applications[0].revision', value: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
      - equal: {path: 'spec.applications[1].path', value: fleets/gpu-jetson/gpu-metrics.yaml}
      - equal: {path: 'spec.applications[1].revision', value: 2140e79c8d8815da3bb2bd1a186187322b2d0362}

  - it: renders gpu-nvidia as the nvidia-rtx class DAS from its fleet pointer
    templates:
      - templates/platform-device-application-sets.yaml
    documentSelector: {path: metadata.name, value: gpu-nvidia}
    asserts:
      - equal: {path: spec.selector.matchLabels, value: {teknoir.org/hw-class: nvidia-rtx}}
      - equal: {path: 'metadata.labels["teknoir.org/fleet"]', value: nvidia-rtx}
      - equal: {path: 'metadata.labels["teknoir.org/managed-by"]', value: gitops}
      - equal: {path: 'spec.applications[0].path', value: fleets/gpu-metrics/prometheus.yaml}
      - equal: {path: 'spec.applications[0].revision', value: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
      - equal: {path: 'spec.applications[1].path', value: fleets/gpu-nvidia/gpu-metrics.yaml}
      - equal: {path: 'spec.applications[1].revision', value: 2140e79c8d8815da3bb2bd1a186187322b2d0362}

  - it: renders the fleet revision on every application of an entry with fleet
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: fleetly
          namespace: teknoir-demo
          fleet: x
          selector: {matchLabels: {a: b}}
          applications:
            - {repo_url: "https://github.com/teknoir/x", path: p1}
            - {repo_url: "https://github.com/teknoir/x", path: p2}
      fleets:
        x: {revision: 0123456789abcdef0123456789abcdef01234567}
    documentSelector: {path: metadata.name, value: fleetly}
    asserts:
      - equal: {path: 'metadata.labels["teknoir.org/fleet"]', value: x}
      - equal: {path: 'spec.applications[0].revision', value: 0123456789abcdef0123456789abcdef01234567}
      - equal: {path: 'spec.applications[1].revision', value: 0123456789abcdef0123456789abcdef01234567}
      - equal: {path: 'spec.applications[1].path', value: p2}

  - it: fails the render when the fleet class has no revision
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: fleetly
          namespace: teknoir-demo
          fleet: x
          selector: {matchLabels: {a: b}}
          applications: []
    asserts:
      - failedTemplate: {errorPattern: "has no revision"}

  - it: fails the render when the fleet revision is not a 40-hex commit
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: fleetly
          namespace: teknoir-demo
          fleet: x
          selector: {matchLabels: {a: b}}
          applications: []
      fleets:
        x: {revision: main}
    asserts:
      - failedTemplate: {errorPattern: "not a 40-character lowercase hex commit"}

  - it: fails the render when a fleet entry's application sets its own revision
    templates:
      - templates/platform-device-application-sets.yaml
    set:
      platformDeviceApplicationSets:
        - name: fleetly
          namespace: teknoir-demo
          fleet: x
          selector: {matchLabels: {a: b}}
          applications:
            - {repo_url: "https://github.com/teknoir/x", path: p, revision: 0123456789abcdef0123456789abcdef01234567}
      fleets:
        x: {revision: 0123456789abcdef0123456789abcdef01234567}
    asserts:
      - failedTemplate: {errorPattern: "sets revision"}

  - it: renders a RobotType with its spec verbatim and the fixed annotation and label
    templates:
      - templates/platform-robot-types.yaml
    set:
      platformRobotTypes:
        - name: rt
          namespace: ns
          spec:
            displayName: D
            applications:
              - {repo_url: "https://github.com/teknoir/x", path: p, revision: 0123456789abcdef0123456789abcdef01234567}
    documentSelector:
      path: metadata.name
      value: rt
    asserts:
      - isKind: {of: RobotType}
      - equal: {path: apiVersion, value: teknoir.org/v1alpha1}
      - equal: {path: metadata.namespace, value: ns}
      - exists: {path: metadata.labels}
      - equal:
          path: spec
          value:
            displayName: D
            applications:
              - {repo_url: "https://github.com/teknoir/x", path: p, revision: 0123456789abcdef0123456789abcdef01234567}
      - matchRegex: {path: 'spec.applications[0].revision', pattern: '^[0-9a-f]{40}$'}
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=false,Delete=false"
      - equal:
          path: metadata.labels["teknoir.org/managed-by"]
          value: gitops

  - it: renders a Robot with its spec verbatim and the gitops marker as an annotation, with no labels
    templates:
      - templates/platform-robots.yaml
    set:
      platformRobots:
        - name: r1
          namespace: ns
          spec:
            type: rt
            device: d1
            nodes:
              - {nodeName: n1, role: vision}
            applications:
              - {repo_url: "https://github.com/teknoir/x", path: p, revision: 0123456789abcdef0123456789abcdef01234567}
    documentSelector:
      path: metadata.name
      value: r1
    asserts:
      - isKind: {of: Robot}
      - equal: {path: apiVersion, value: teknoir.org/v1alpha1}
      - equal: {path: metadata.namespace, value: ns}
      - equal:
          path: spec
          value:
            type: rt
            device: d1
            nodes:
              - {nodeName: n1, role: vision}
            applications:
              - {repo_url: "https://github.com/teknoir/x", path: p, revision: 0123456789abcdef0123456789abcdef01234567}
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: "Prune=false,Delete=false"
      - equal:
          path: metadata.annotations["teknoir.org/managed-by"]
          value: gitops
      - notExists: {path: metadata.labels}

  # device-controller copies Robot labels onto the Device (robot_controller.go copiedLabels): the gitops marker
  # must never become a Device label.
  - it: keeps a Robot's own labels and never adds teknoir.org/managed-by as a label
    templates:
      - templates/platform-robots.yaml
    documentSelector: {path: metadata.name, value: vision-station-02}
    asserts:
      - equal: {path: metadata.labels, value: {gpu: jetson, site: karlstad, teknoir.org/hw-class: jetson-orin}}
      - equal: {path: 'metadata.annotations["teknoir.org/managed-by"]', value: gitops}

  - it: refuses a Robot entry that sets teknoir.org/managed-by as a label
    templates:
      - templates/platform-robots.yaml
    set:
      platformRobots:
        - {name: r1, namespace: ns, labels: {teknoir.org/managed-by: gitops}, spec: {type: rt}}
    asserts:
      - failedTemplate: {errorPattern: 'must not set teknoir.org/managed-by'}

  - it: fails the render for a RobotType without a namespace
    templates:
      - templates/platform-robot-types.yaml
    set:
      platformRobotTypes:
        - name: rt
          spec: {displayName: D}
    asserts:
      - failedTemplate:
          errorPattern: "platformRobotTypes\\[\\]\\.namespace is required"

  - it: fails the render for a Robot without a spec
    templates:
      - templates/platform-robots.yaml
    set:
      platformRobots:
        - name: r1
          namespace: ns
    asserts:
      - failedTemplate:
          errorPattern: "platformRobots\\[\\]\\.spec is required"
