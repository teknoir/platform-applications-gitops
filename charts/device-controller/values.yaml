# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  # Pinned: '<immutable tag>@sha256:<linux/amd64 manifest digest>', the image
  # staging ran as :applicationset on 2026-10-09 (device-controller 9780e40).
  # Change it only by promoting a new sha-<commit> through this branch.
  tag: "sha-9780e409@sha256:764377e6053f3a4c1d92c94d14ff73f493edda5df2f415c6dc68489795622d84"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: teknoir-admin@teknoir.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  region: us-central1
  domain: teknoir.cloud
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
