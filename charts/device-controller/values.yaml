# GitOps values for device-controller

replicaCount: 1

image:
  repository: harbor.teknoir.cloud/teknoir/device-controller
  # pinned in pins/device-controller.yaml (Kargo stage pin-device-controller)
  tag: ""
  pullPolicy: IfNotPresent

# The image is pulled from Harbor with the node credential (CI v4 P6.2), so no pull secret.
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: teknoir-admin@teknoir.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  region: us-central1
  domain: teknoir.cloud
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Legacy cleanup (plans/ssh-tunnel-removal.md, step 11). On: the controller deletes, in every teamspace,
# the tunnel-* Deployments, Services, Secrets and VirtualServices that the removed RemoteAccess plugin
# left behind, and the virtual-device-* Deployments of the 2024 MVP runtime, and the ClusterRole gets the
# delete (and VirtualService list) rules that needs. Off (default): neither the code nor the ClusterRole
# does that, so the controller's rights stay at the minimum. Staging has no such objects (checked
# 2026-10-23). Set it true on an install that still has them (production, airgapped, until their
# cut-over) and turn it off again afterwards. Needs a device-controller image that reads
# LEGACY_TUNNEL_CLEANUP (an older image ignores it and always runs the cleanup, which then gets 403).
legacyTunnelCleanup: false

# Virtual devices (KubeVirt VMs that run the real Robot bootstrap). Everything in
# this block is inert when enabled is false or the block is absent: no runtime
# namespaces are rendered and the VIRTUAL_DEVICES key is left out of the controller
# ConfigMap (the controller treats a missing key as disabled).
# Needs KubeVirt + CDI (charts/virtual-devices) on the cluster. Plan:
# virtual-device-phase1-plan.md section 3.4 / 3.7.
virtualDevices:
  enabled: true                # on on r415 since 2026-11-07 (TeknoirBot, plans/teknoirbot/README.md)
  # vdevice-os (ghcr.io/teknoir/vdevice-os@sha256:019d2d2c4bfa042c79d5f61fb5708fbb41721f56307ec7be73b00e8a74d12c10) boot-checked on staging 2026-10-12; switching the default is P1-D15.
  osImage: docker://quay.io/containerdisks/debian@sha256:6b992c4a8a62ca57858cbbf60110e673928d27b2885ea2a106660bc26b112b5b
  k3sVersion: v1.34.11+k3s1
  innerCIDRs: {cluster: 10.52.0.0/16, service: 10.53.0.0/16, dns: 10.53.0.10}
  cpuOvercommit: 2
  maxPerDevice: {cpu: "4", memory: 8Gi, disk: 40Gi}
  storageClassName: local-path
  priorityClassName: teknoir-virtual-device
  # The VMs run on the r415 node (label teknoir.org/virtual-devices=true, set on the node on
  # 2026-11-07). The teknoir.org/ci toleration is left from vpro (dev host agent) and is harmless.
  nodeSelector: {teknoir.org/virtual-devices: "true"}
  tolerations:
    - {key: teknoir.org/ci, operator: Exists, effect: NoSchedule}
  # New VMs pull every image through Harbor's proxy cache (k3s registries.yaml written by the bootstrap),
  # with their teamspace's pull-only robot robot$ts-<teamspace> from the Secret charts/harbor keeps
  # (keys <teamspace>.username/.password). Private ghcr.io/teknoir images (the remote desktop) need it.
  # A VM created before this keeps pulling directly until it is re-created (a bot: delete the bot and add it
  # again). Remove the block to turn it off. The VM reaches Harbor by its public name through the router's
  # hairpin NAT (harbor.teknoir.cloud -> 155.4.167.210), so it needs egress: internet below; unlike the
  # other platform names it is not rewritten to an in-cluster address.
  registryMirror:
    host: harbor.teknoir.cloud
    secret: {namespace: teknoir-system, name: harbor-teamspace-pull}
  # internet: virtual devices reach the platform gateway and the public internet
  # (private ranges excluded); platform-only: the platform gateway only.
  egress: internet
  # One runtime namespace <teamspace>-vdev per entry, with the quota derived from
  # the allowance (devices, whole vCPUs, whole Gi). Teamspace name: at most 58 chars.
  # Removing an entry (or disabling the block, or reverting it) keeps the namespace
  # (Prune=false,Delete=false) and its default-deny NetworkPolicy, ResourceQuota and
  # LimitRange (Prune=false), so running VMs stay isolated and capped. Only
  # vdev-egress-internet (and the DNS/gateway policies) are pruned.
  # To revoke a teamspace's allowance through GitOps, set devices: 0 and keep cpu, memory
  # and disk (any valid value): the namespace, default-deny, quota and LimitRange keep
  # rendering, the allowance annotation says devices 0 (the controller admits nothing),
  # and the quota's VM/VMI/DataVolume counts are 0. Running guests keep running; pods,
  # PVCs and Secrets keep the headroom of one device so they can restart. Deleting the
  # entry instead only stops managing the objects, and the old allowance stays in force.

  allowances:
    teknoir-demo: {devices: 2, cpu: "6", memory: 12Gi, disk: 80Gi}

# Remote desktop for Devices with spec.desktop (plans/teknoirbot/mvp-spec.md 3.1): device-controller injects a
# teknoir-desktop Deployment into the device's config and the WireGuard plugin publishes it as the web service
# "desktop". Rendered as the DESKTOP config only together with ztna (the desktop is reached through Tunneling).
desktop:
  enabled: true
  # pinned in pins/teknoir-desktop.yaml (Kargo stage pin-teknoir-desktop)
  image: ""
  hostGroupID: 64080 # gid of group teknoir-desktop on devices (host mode; the ansible desktop playbook creates it)
  # The TeknoirBot agent on a bot's computer (DESKTOP.agent): only with the agent switch (teknoirbotApi.enabled,
  # app-of-apps teknoirbot.agent.enabled), and then the image is required (an empty one fails the render).
  # Every image pinned as <tag>@sha256:<digest> (scripts/pin-image).
  agent:
    # pinned in pins/teknoir-desktop.yaml (Kargo stage pin-teknoir-desktop)
    image: ""
    buildkitImage: "moby/buildkit:v0.25.1@sha256:79cc6476ab1a3371c9afd8b44e7c55610057c43e18d9b39b68e2b0c2475cc1b6"  # moby/buildkit, rootful buildkitd for the bot's image builds
    registryImage: "registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373"  # registry, the bot computer's own registry its builds push to
    councilMemoryLimit: ""  # optional; the controller's default is 2Gi (at least 1Gi): the council pod's memory limit

# TeknoirBot API (charts/istio teknoirbotApi): virtual devices may reach tb-api.<domain>:8085 on the public gateway pods
# (vdev-egress-gateway). Passed by charts/app-of-apps (teknoirbot.agent.enabled).
teknoirbotApi:
  enabled: false

# WireGuard (ZTNA) tunnels, an alternative to the SSH reverse tunnels (plan:
# plans/wireguard-ztna-tunnel.md). Everything in this block is inert while enabled is false:
# the ZTNA key is left out of the controller ConfigMap (the controller treats a missing key as
# disabled) and no Role is rendered in teknoir-ztna. teknoir-cloud (staging) only.
# enabled is NOT set here: charts/app-of-apps passes ztna.enabled=true to this Application when
# its own ztna.enabled flag (and the project allowlist) says so. Needs charts/ztna (the hub and
# the teknoir-ztna namespace), charts/stunner and charts/gateway-api-crds.
ztna:
  enabled: false
  # pinned in pins/wg-tunnel.yaml (Kargo stage pin-wg-tunnel)
  agentImage: ""
  # pinned in pins/web-terminal.yaml (Kargo stage pin-web-terminal)
  terminalImage: ""
  # Namespace of the hub, the policy ConfigMaps and the web terminals (charts/ztna).
  hubNamespace: teknoir-ztna
  # attestorEnabled is ignored since rev 3 (the agent signs with the device key that
  # device-controller delivers over MQTT; no host-key sidecar).
  attestorEnabled: false
  # The web gateway image (the second container in the per-device wgt- pod). Required while
  # ztna.enabled: an empty value fails the render (an enabled ZTNA without the gateway would
  # leave web services without a URL).
  # pinned in pins/wg-tunnel.yaml (Kargo stage pin-wg-tunnel)
  gatewayImage: ""
  # Device ports a client may reach.
  allowedPorts: [22]
  # How long the enrollment window stays open after enabling WireGuard or resetting enrollment.
  enrollWindowMinutes: 15
  # Non-root user and group of the web terminal (readOnlyRootFilesystem, /tmp emptyDir); 0 leaves it to the image.
  terminalRunAsUser: 65532
  # Istio principals that may reach a device's web terminal and web gateway (their
  # AuthorizationPolicy). ONLY the user gateway (istio-ingressgateway, which runs oauth2-proxy
  # ext_authz): the gateway trusts X-Auth-Request-Email, which the public gateway does not
  # set. Never add istio-ingressgateway-public here (it is needed only by the hub's
  # wg-device route, in charts/ztna/values.yaml). Empty makes the controller use the same default.
  ingressPrincipals:
    - cluster.local/ns/istio-system/sa/istio-ingressgateway
  # Istio principals that may call the web terminal's inspect port 8091 (read-only fixed ops pod, logs,
  # events and the installed helm release, for the next-gen robot pages; plans/nextgen/inspect.md). Only the
  # Backstage API service account, never the ingress gateways. [] turns the inspect rule off; leaving the key
  # out lets the controller use the same default.
  inspectPrincipals:
    - cluster.local/ns/teknoir-system/sa/backstage-api

# DeviceApplicationSets every install gets (templates/platform-device-application-sets.yaml).
# teknoir-demo: the starter apps of teknoir-demo-gitops on the test devices (label
# device-group=test), as on r415 before the move to vpro (2026-10-16).
# Revisions are commit SHAs (teknoir-demo-gitops main on 2026-10-17), so a push to that repo
# does not change staging by itself; move them with a PR to main, which Kargo then ships (staging-releases.md).
platformDeviceApplicationSets:
  - name: demo-test
    namespace: teknoir-demo
    selector:
      matchLabels:
        device-group: test
    applications:
      # devstudio chart 0.1.0: Node-RED 5.0.10, Teknoir theme (teknoir-demo-gitops #7, 2026-11-23).
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: common/devstudio.yaml, revision: b35465914439f74af8d540645c339e3773092d69}
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: common/notebook.yaml, revision: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
  # GPU metrics on the platform: the on-device Prometheus, the GPU exporter and gpu-metrics-app
  # (publishes to MQTT). Device label gpu=nvidia (discrete GPU, dcgm-exporter) or gpu=jetson
  # (jetson-exporter). An inline app of the same name on a device (prometheus, nvidia-exporter)
  # takes precedence over these.
  - name: gpu-nvidia
    namespace: teknoir-demo
    selector:
      matchLabels:
        gpu: nvidia
    applications:
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: fleets/gpu-metrics/prometheus.yaml, revision: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: fleets/gpu-nvidia/gpu-metrics.yaml, revision: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
  - name: gpu-jetson
    namespace: teknoir-demo
    selector:
      matchLabels:
        gpu: jetson
    applications:
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: fleets/gpu-metrics/prometheus.yaml, revision: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
      - {repo_url: "https://github.com/teknoir/teknoir-demo-gitops", path: fleets/gpu-jetson/gpu-metrics.yaml, revision: 2140e79c8d8815da3bb2bd1a186187322b2d0362}
