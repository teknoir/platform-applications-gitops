# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  # Pinned: '<immutable tag>@sha256:<multi-platform index digest>', the image
  # production ran as :latest on 2026-10-09 (device-controller main 6c718b6).
  # Change it only by promoting a new sha-<commit> through this branch.
  tag: "sha-6c718b60@sha256:e8074144e92913b516b06e25acb4db46a986f35db95713e3872861dfe2759c33"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: teknoir-admin@teknoir.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  region: us-central1
  domain: teknoir.online
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
