# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  # Pinned: '<immutable tag>@sha256:<linux/amd64 manifest digest>', the image
  # staging ran as :applicationset on 2026-10-09 (device-controller 9780e40).
  # Change it only by promoting a new sha-<commit> through this branch.
  tag: "sha-9780e409@sha256:764377e6053f3a4c1d92c94d14ff73f493edda5df2f415c6dc68489795622d84"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: teknoir-admin@teknoir.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  region: us-central1
  domain: teknoir.cloud
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Virtual devices (KubeVirt VMs that run the real Robot bootstrap). Everything in
# this block is inert when enabled is false or the block is absent: no runtime
# namespaces are rendered and the VIRTUAL_DEVICES key is left out of the controller
# ConfigMap (the controller treats a missing key as disabled).
# Needs KubeVirt + CDI (charts/virtual-devices) on the cluster. Plan:
# virtual-device-phase1-plan.md section 3.4 / 3.7.
virtualDevices:
  enabled: true                # teknoir-cloud (staging) only
  osImage: docker://quay.io/containerdisks/debian@sha256:6b992c4a8a62ca57858cbbf60110e673928d27b2885ea2a106660bc26b112b5b
  k3sVersion: v1.34.11+k3s1
  innerCIDRs: {cluster: 10.52.0.0/16, service: 10.53.0.0/16, dns: 10.53.0.10}
  cpuOvercommit: 2
  maxPerDevice: {cpu: "4", memory: 8Gi, disk: 40Gi}
  storageClassName: local-path
  priorityClassName: teknoir-virtual-device
  # internet: virtual devices reach the platform gateway and the public internet
  # (private ranges excluded); platform-only: the platform gateway only.
  egress: internet
  # One runtime namespace <teamspace>-vdev per entry, with the quota derived from
  # the allowance (devices, whole vCPUs, whole Gi). Teamspace name: at most 58 chars.
  # Removing an entry (or disabling the block, or reverting it) keeps the namespace
  # (Prune=false,Delete=false) and its default-deny NetworkPolicy, ResourceQuota and
  # LimitRange (Prune=false), so running VMs stay isolated and capped. Only
  # vdev-egress-internet (and the DNS/gateway policies) are pruned.
  # To revoke a teamspace's allowance through GitOps, set devices: 0 and keep cpu, memory
  # and disk (any valid value): the namespace, default-deny, quota and LimitRange keep
  # rendering, the allowance annotation says devices 0 (the controller admits nothing),
  # and the quota's VM/VMI/DataVolume counts are 0. Running guests keep running; pods,
  # PVCs and Secrets keep the headroom of one device so they can restart. Deleting the
  # entry instead only stops managing the objects, and the old allowance stays in force.

  allowances:
    teknoir-demo: {devices: 2, cpu: "4", memory: 8Gi, disk: 60Gi}
