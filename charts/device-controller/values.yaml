# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  # Pinned: '<immutable tag>@sha256:<linux/amd64 manifest digest>',
  # device-controller 7c2a852 (applicationset, F3: quota refusal in status + backoff; index sha256:8807375c31dfb7cb4227f4c26361957cf86a6b280fd864486a778c7eee8561fd). Previous pin: sha-87b8ebfb@sha256:d9cc97729ba89b9a4671dca463f772ec48767a3d7acca194de94aae2d10d7034
  # device-controller 87b8ebf = applicationset-20261012-112318, index sha256:14bbc608e32007d9c294705f0b6aecb5bcab0e7ba66ebdc88b89d5e92c1573e5 (virtual devices Phase 1 runtime). Previous pin: sha-b23700ba@sha256:1b96d735b10e4e0cb80e29cfe9e3a46a93e5efde01f7b4b1973db81e3ad82de4.
  # Change it only by promoting a new sha-<commit> through this branch.
  tag: "sha-7c2a852b@sha256:41b10284cf2fd3fea2606ccaf99186105614e9cf7f8a99521786ffe7a20a683e"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations:
    iam.gke.io/gcp-service-account: teknoir-admin@teknoir.iam.gserviceaccount.com
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  region: us-central1
  domain: teknoir.cloud
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Virtual devices (KubeVirt VMs that run the real Robot bootstrap). Everything in
# this block is inert when enabled is false or the block is absent: no runtime
# namespaces are rendered and the VIRTUAL_DEVICES key is left out of the controller
# ConfigMap (the controller treats a missing key as disabled).
# Needs KubeVirt + CDI (charts/virtual-devices) on the cluster. Plan:
# virtual-device-phase1-plan.md section 3.4 / 3.7.
virtualDevices:
  enabled: true                # teknoir-cloud (staging) only
  # vdevice-os (ghcr.io/teknoir/vdevice-os@sha256:019d2d2c4bfa042c79d5f61fb5708fbb41721f56307ec7be73b00e8a74d12c10) boot-checked on staging 2026-10-12; switching the default is P1-D15.
  osImage: docker://quay.io/containerdisks/debian@sha256:6b992c4a8a62ca57858cbbf60110e673928d27b2885ea2a106660bc26b112b5b
  k3sVersion: v1.34.11+k3s1
  innerCIDRs: {cluster: 10.52.0.0/16, service: 10.53.0.0/16, dns: 10.53.0.10}
  cpuOvercommit: 2
  maxPerDevice: {cpu: "4", memory: 8Gi, disk: 40Gi}
  storageClassName: local-path
  priorityClassName: teknoir-virtual-device
  # internet: virtual devices reach the platform gateway and the public internet
  # (private ranges excluded); platform-only: the platform gateway only.
  egress: internet
  # One runtime namespace <teamspace>-vdev per entry, with the quota derived from
  # the allowance (devices, whole vCPUs, whole Gi). Teamspace name: at most 58 chars.
  # Removing an entry (or disabling the block, or reverting it) keeps the namespace
  # (Prune=false,Delete=false) and its default-deny NetworkPolicy, ResourceQuota and
  # LimitRange (Prune=false), so running VMs stay isolated and capped. Only
  # vdev-egress-internet (and the DNS/gateway policies) are pruned.
  # To revoke a teamspace's allowance through GitOps, set devices: 0 and keep cpu, memory
  # and disk (any valid value): the namespace, default-deny, quota and LimitRange keep
  # rendering, the allowance annotation says devices 0 (the controller admits nothing),
  # and the quota's VM/VMI/DataVolume counts are 0. Running guests keep running; pods,
  # PVCs and Secrets keep the headroom of one device so they can restart. Deleting the
  # entry instead only stops managing the objects, and the old allowance stays in force.

  allowances:
    teknoir-demo: {devices: 2, cpu: "4", memory: 8Gi, disk: 60Gi}

# WireGuard (ZTNA) tunnels, an alternative to the SSH reverse tunnels (plan:
# plans/wireguard-ztna-tunnel.md). Everything in this block is inert while enabled is false:
# the ZTNA key is left out of the controller ConfigMap (the controller treats a missing key as
# disabled) and no Role is rendered in teknoir-ztna. teknoir-cloud (staging) only.
# enabled is NOT set here: charts/app-of-apps passes ztna.enabled=true to this Application when
# its own ztna.enabled flag (and the project allowlist) says so. Needs charts/ztna (the hub and
# the teknoir-ztna namespace), charts/stunner and charts/gateway-api-crds.
ztna:
  enabled: false
  # REQUIRED once enabled (the render fails without them): the wg-agent image that the controller
  # injects into a device, and the per-device WireGuard web terminal image
  # (SSH_PROXY_MODE=wireguard). '<immutable tag>@sha256:<digest>'.
  agentImage: ""
  terminalImage: ""
  # Namespace of the hub, the policy ConfigMaps and the web terminals (charts/ztna).
  hubNamespace: teknoir-ztna
  # Device ports a client may reach.
  allowedPorts: [22]
  # How long the enrollment window stays open after enabling WireGuard or resetting enrollment.
  enrollWindowMinutes: 15
  # Non-root user and group of the web terminal (readOnlyRootFilesystem, /tmp emptyDir); 0 leaves it to the image.
  terminalRunAsUser: 65532
  # Istio principals of the ingress gateways that may reach a device's web terminal (its
  # AuthorizationPolicy). Keep in step with ingressPrincipals in charts/ztna/values.yaml (two
  # charts cannot share a value); leaving it empty makes the controller default to the user
  # gateway only (istio-ingressgateway).
  ingressPrincipals:
    - cluster.local/ns/istio-system/sa/istio-ingressgateway
    - cluster.local/ns/istio-system/sa/istio-ingressgateway-public
