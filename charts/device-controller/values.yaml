# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  tag: applicationset
  pullPolicy: Always

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  domain: teknoir.airgapped
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
