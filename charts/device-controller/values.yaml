# GitOps values for device-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/device-controller
  # Pinned (G-09): '<immutable tag>@sha256:<linux/amd64 manifest digest>',
  # the image that ran as :applicationset (same as applicationset-20260724-123007).
  tag: "sha-9780e409@sha256:764377e6053f3a4c1d92c94d14ff73f493edda5df2f415c6dc68489795622d84"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "device-controller-service-account"

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podSecurityContext:
  runAsNonRoot: true
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  # runAsUser: 1000

config:
  projectId: teknoir
  domain: teknoir.airgapped
  domainPrefix: ""
  istioGateway: istio-system/teknoir-gateway

# GitHub App credentials mounted from the backstage-github-app-secret. The
# secret is optional: without it the controller runs, and only devices with
# GitOps applications fail to reconcile (credentials file not found).
githubApp:
  secretName: backstage-github-app-secret
  mountPath: /app/secrets
  credentialsFile: /app/secrets/github-app-backstage-teknoir-credentials.yaml

resources:
  limits:
    cpu: 500m
    memory: 1024Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}
