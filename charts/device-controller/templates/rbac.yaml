---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
# Leader election uses Leases (controller-runtime default); the ConfigMap rule of the
# scaffold was never used, and device-controller-parameters is read by the kubelet (envFrom).
rules:
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-editor-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-devices-admin: "true"
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-edit: "true"
rules:
- apiGroups:
  - teknoir.org
  resources:
  - devices
  - deviceapplicationsets
  - robots
  - robottypes
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - teknoir.org
  resources:
  - devices/status
  - deviceapplicationsets/status
  - robots/status
  - robottypes/status
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-manager-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
# The minimum of the controller (plans/ssh-tunnel-removal.md, step 11). It equals the ClusterRole that
# controller-gen generates from the kubebuilder markers (device-controller config/rbac/role.yaml, kept equal
# by that repo's rbac_markers_test.go and this chart's tests/rbac_test.yaml), plus, on purpose and
# only when legacyTunnelCleanup is on, the rules at the end.
# The manager client caches typed objects cluster-wide (cmd/main.go; ConfigMaps and ServiceAccounts excepted),
# so a typed Get of a Secret, Service, Deployment, Namespace or ResourceQuota needs list and watch.
# Writes of Secrets, Services, Deployments, VirtualServices and AuthorizationPolicies live in the namespaced
# Roles (teknoir-ztna below, <teamspace>-vdev further down). Nothing here grants exec, attach, port-forward or proxy.
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
# Secrets: read (cached) and create (Robot token Secret robot-<name>-k3s). Update, patch and delete are not
# needed cluster-wide: the hub's Secrets are in the ztna Role, the virtual devices' in the <teamspace>-vdev Roles.
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
  - create
# controller-runtime's recorder creates events and PATCHES repeated ones.
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# DeviceConfig plugin: the rendered GitOps sources of a device are cached in the ConfigMap
# teknoir-config-sources-<device> in the device's teamspace (owned by the Device); the published
# store is teknoir-config-published-<device>. ConfigMaps are not cached, so no list or watch.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - create
  - update
  - delete
- apiGroups:
  - teknoir.org
  resources:
  - devices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
- apiGroups:
  - teknoir.org
  resources:
  - devices/finalizers
  - robots/finalizers
  verbs:
  - update
- apiGroups:
  - teknoir.org
  resources:
  - deviceapplicationsets
  - robottypes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - teknoir.org
  resources:
  - robots
  verbs:
  - get
  - list
  - watch
  - update
  - patch
- apiGroups:
  - teknoir.org
  resources:
  - robots/status
  - robottypes/status
  verbs:
  - get
  - update
  - patch
# Virtual devices (device-controller vd1-runtime): admission reads, and the VMs. VMs are written only in
# the <teamspace>-vdev Roles below.
- apiGroups:
  - ""
  resources:
  - namespaces
  - resourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachines
  - virtualmachineinstances
  verbs:
  - get
  - list
  - watch
{{- if .Values.legacyTunnelCleanup }}
# legacyTunnelCleanup: the controller deletes what removed features left behind, in every teamspace:
# tunnel-* Deployments, Services, Secrets and VirtualServices of the RemoteAccess plugin, and the
# virtual-device-* Deployments of the MVP runtime. Only for installs that still have such objects
# (production and airgapped until their cut-over); staging has none and leaves this off.
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - delete
- apiGroups:
  - ""
  resources:
  - services
  - secrets
  verbs:
  - delete
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  verbs:
  - list
  - delete
{{- end }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-viewer-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-view: "true"
rules:
- apiGroups:
  - teknoir.org
  resources:
  - devices
  - deviceapplicationsets
  - robots
  - robottypes
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - teknoir.org
  resources:
  - devices/status
  - deviceapplicationsets/status
  - robots/status
  - robottypes/status
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "device-controller.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-manager-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "device-controller.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if (.Values.ztna).enabled }}

---
# WireGuard (ZTNA) plugin: the policy ConfigMap per device (written here, read by the hub), the
# identity ConfigMaps (read), and the per-device WireGuard web terminal in the hub namespace
# (Deployment, Service, Secret, ServiceAccount, VirtualService, AuthorizationPolicy). Namespaced on
# purpose: this is the only place the controller may write them (the ClusterRole above only reads
# Services, Secrets and Deployments, for its cache). Equal to the kubebuilder markers in
# device-controller internal/controller/plugin_wireguard/plugin_wireguard.go (role.yaml, Role in teknoir-ztna).
# Only what the code calls: no patch (no Patch on a hub object), watch only on Deployments (the one
# watched kind), list only on ConfigMaps, ServiceAccounts, Deployments and VirtualServices. The
# ValidatingAdmissionPolicy in charts/ztna lets only this service account write policy ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" . }}-ztna
  namespace: {{ .Values.ztna.hubNamespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  - services
  verbs:
  - get
  - create
  - update
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - delete
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  verbs:
  - get
  - list
  - create
  - update
  - delete
- apiGroups:
  - security.istio.io
  resources:
  - authorizationpolicies
  verbs:
  - get
  - create
  - update
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-ztna-rolebinding
  namespace: {{ .Values.ztna.hubNamespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "device-controller.fullname" . }}-ztna
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if (.Values.virtualDevices).enabled }}
{{- range $ts, $allowance := ((.Values.virtualDevices).allowances | default dict) }}

---
# Virtual devices: what the controller writes in the runtime namespace <teamspace>-vdev of this allowance
# (templates/virtual-devices-runtime.yaml). The cloud-init Secret <device>-cloudinit (plugin_virtualdevice/cloudinit.go)
# and the VirtualMachine (vm.go, plugin_virtualdevice.go). Reads come from the ClusterRole. DataVolumes are
# not written: the root disk is a dataVolumeTemplate of the VM, which virt-controller creates. If the VM create
# is ever refused over that template, add create on cdi.kubevirt.io datavolumes here, not cluster-wide. A clone or
# sourceRef disk source (instead of registry) would also need a CDI clone-auth grant for the requester.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" $ }}-vdev
  namespace: {{ $ts }}-vdev
  labels:
    {{- include "device-controller.labels" $ | nindent 4 }}
  annotations:
    # Lives as long as the runtime namespace (also Prune=false,Delete=false): a removed allowance keeps its VMs,
    # and this Role is the only grant of their writes.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - create
  - delete
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachines
  verbs:
  - get
  - create
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" $ }}-vdev-rolebinding
  namespace: {{ $ts }}-vdev
  labels:
    {{- include "device-controller.labels" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "device-controller.fullname" $ }}-vdev
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
