---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" . }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-editor-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-devices-admin: "true"
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-edit: "true"
rules:
- apiGroups:
  - teknoir.org
  resources:
  - devices
  - deviceapplicationsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - teknoir.org
  resources:
  - devices/status
  - deviceapplicationsets/status
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-manager-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - '*'
- apiGroups:
  - apps
  resources:
  - daemonsets
  - deployments
  - deployments/rollback
  - deployments/scale
  - replicasets
  - replicasets/scale
  - statefulsets
  - statefulsets/scale
  verbs:
  - get
  - list
  - watch
  - create
  - delete
  - deletecollection
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - pods/attach
  - pods/exec
  - pods/portforward
  - pods/proxy
  - secrets
  - services/proxy
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
  - create
- apiGroups:
  - teknoir.org
  resources:
  - devices
  - devices/status
  - devices/finalizers
  - deviceapplicationsets
  - deviceapplicationsets/status
  - deviceapplicationsets/finalizers
  verbs:
  - '*'
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Virtual devices (device-controller vd1-runtime): admission reads, the VM and its disk.
- apiGroups:
  - ""
  resources:
  - namespaces
  - persistentvolumeclaims
  - resourcequotas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachines
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - kubevirt.io
  resources:
  - virtualmachineinstances
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cdi.kubevirt.io
  resources:
  - datavolumes
  verbs:
  - get
  - list
  - watch
  - create
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "device-controller.fullname" . }}-viewer-role
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
    rbac.authorization.kubeflow.org/aggregate-to-kubeflow-view: "true"
rules:
- apiGroups:
  - teknoir.org
  resources:
  - devices
  - deviceapplicationsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - teknoir.org
  resources:
  - devices/status
  - deviceapplicationsets/status
  verbs:
  - get

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "device-controller.fullname" . }}-leader-election-role
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-manager-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "device-controller.fullname" . }}-manager-role
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- if (.Values.ztna).enabled }}

---
# WireGuard (ZTNA) plugin: the policy ConfigMap per device (written here, read by the hub), the
# identity ConfigMaps (read), and the per-device WireGuard web terminal in the hub namespace
# (Deployment, Service, Secret, ServiceAccount, VirtualService, AuthorizationPolicy). Namespaced on
# purpose: the ClusterRole above already covers Deployments, Services, Secrets and VirtualServices
# cluster-wide, this grants what it lacks (ConfigMaps write, ServiceAccounts, AuthorizationPolicies)
# only in teknoir-ztna. The ValidatingAdmissionPolicy in charts/ztna lets only this service account
# write policy ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "device-controller.fullname" . }}-ztna
  namespace: {{ .Values.ztna.hubNamespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - serviceaccounts
  - secrets
  - services
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - networking.istio.io
  resources:
  - virtualservices
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - security.istio.io
  resources:
  - authorizationpolicies
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "device-controller.fullname" . }}-ztna-rolebinding
  namespace: {{ .Values.ztna.hubNamespace }}
  labels:
    {{- include "device-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "device-controller.fullname" . }}-ztna
subjects:
- kind: ServiceAccount
  name: {{ include "device-controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
