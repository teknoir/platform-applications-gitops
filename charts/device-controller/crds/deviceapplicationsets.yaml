---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.15.0
  name: deviceapplicationsets.teknoir.org
spec:
  group: teknoir.org
  names:
    kind: DeviceApplicationSet
    listKind: DeviceApplicationSetList
    plural: deviceapplicationsets
    singular: deviceapplicationset
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: DeviceApplicationSet is the Schema for the deviceapplicationsets
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeviceApplicationSetSpec defines the desired state of DeviceApplicationSet
            properties:
              applications:
                description: |-
                  Applications lists GitOps applications that are deployed to every
                  matching Device. They are merged into the effective applications list
                  before the Device's own Spec.Applications, so device-level entries win
                  on shared resource identity.
                items:
                  description: |-
                    GitOpsApplication describes a set of k8s resources to deploy to the device
                    that are sourced from a Git repository following a GitOps model.
                  properties:
                    path:
                      description: |-
                        Path is the path within the repository to the YAML file (or directory)
                        containing the k8s resources to deploy to the device.
                      type: string
                    repo_url:
                      description: RepoURL is the URL of the Git repository that holds
                        the k8s resources.
                      type: string
                    revision:
                      description: Revision is the Git revision (branch, tag or commit)
                        to deploy.
                      type: string
                  required:
                  - repo_url
                  type: object
                type: array
              selector:
                description: |-
                  Selector determines which Devices receive the applications defined in
                  this set. It is evaluated against Device labels; a Device matches when
                  all matchLabels (and matchExpressions, if present) are satisfied. An
                  empty selector matches every Device in the namespace, so at least one
                  matchLabels or matchExpressions entry is required to avoid an
                  accidental fleet-wide rollout.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: selector must specify at least one matchLabels or matchExpressions
                    entry
                  rule: (has(self.matchLabels) && size(self.matchLabels) > 0) || (has(self.matchExpressions)
                    && size(self.matchExpressions) > 0)
            required:
            - selector
            type: object
        type: object
    served: true
    storage: true
