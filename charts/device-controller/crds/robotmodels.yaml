---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    # Never pruned or deleted by ArgoCD: removing a CRD deletes every object of its kind.
    # Re-add after copying regenerated CRDs from device-controller (tests/crd_guard_test.sh).
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    controller-gen.kubebuilder.io/version: v0.16.5
  name: robotmodels.teknoir.org
spec:
  group: teknoir.org
  names:
    kind: RobotModel
    listKind: RobotModelList
    plural: robotmodels
    singular: robotmodel
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Display name
      type: string
    - jsonPath: .status.robots
      name: Robots
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RobotModel is a kind of robot: its node roles, which one runs the k3s
          server, and its baseline applications.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RobotModelSpec defines the desired state of RobotModel.
            properties:
              applications:
                description: |-
                  Applications are the baseline applications of the model. They are the
                  lowest configuration layer of every robot of the model.
                items:
                  description: |-
                    GitOpsApplication describes a set of k8s resources to deploy to the device
                    that are sourced from a Git repository following a GitOps model.
                  properties:
                    path:
                      description: |-
                        Path is the path within the repository to the YAML file (or directory)
                        containing the k8s resources to deploy to the device.
                      type: string
                    repo_url:
                      description: RepoURL is the URL of the Git repository that holds
                        the k8s resources.
                      type: string
                    revision:
                      description: Revision is the Git revision (branch, tag or commit)
                        to deploy.
                      type: string
                  required:
                  - repo_url
                  type: object
                type: array
              capabilities:
                description: |-
                  Capabilities are advisory tags such as camera or navigation. The UI uses
                  them to decide which panels to show.
                items:
                  type: string
                type: array
              description:
                description: Description says what kind of robot this is.
                type: string
              displayName:
                description: DisplayName is the name people see, for example "AMR
                  Mk2".
                type: string
              nodes:
                description: 'Nodes are the node roles of the model. Exactly one has
                  k3s: server.'
                items:
                  description: RobotModelNodeRole describes one node role of a robot
                    model.
                  properties:
                    description:
                      description: Description says what the node does, for people.
                      type: string
                    hardware:
                      description: Hardware is the expected board (Device hardware
                        label value). Advisory.
                      type: string
                    k3s:
                      description: |-
                        K3s says whether the node runs the k3s server or an agent. A model has
                        exactly one server.
                      enum:
                      - server
                      - agent
                      type: string
                    labels:
                      additionalProperties:
                        type: string
                      description: Labels are extra node labels besides teknoir.org/node-role.
                      type: object
                    optional:
                      description: Optional marks a role that robots of this model
                        can do without.
                      type: boolean
                    role:
                      description: |-
                        Role becomes the k3s node label teknoir.org/node-role=<role>. It must be
                        a DNS label.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                  required:
                  - k3s
                  - role
                  type: object
                maxItems: 32
                minItems: 1
                type: array
            required:
            - nodes
            type: object
            x-kubernetes-validations:
            - message: 'a model needs exactly one node role with k3s: server'
              rule: self.nodes.filter(n, n.k3s == 'server').size() == 1
            - message: node role names must be unique
              rule: self.nodes.all(n, self.nodes.filter(m, m.role == n.role).size()
                == 1)
          status:
            description: RobotModelStatus defines the observed state of RobotModel.
            properties:
              observedGeneration:
                description: ObservedGeneration is the generation of the spec this
                  status describes.
                format: int64
                type: integer
              robots:
                description: Robots is the number of robots in the namespace that
                  use this model.
                format: int32
                type: integer
              robotsWithOverrides:
                description: |-
                  RobotsWithOverrides is the number of those robots whose device renders at
                  least one item that replaces a resource of this model's applications. The
                  count is approximate, see the RobotModel reconciler.
                format: int32
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
