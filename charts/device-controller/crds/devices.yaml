---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: devices.teknoir.org
spec:
  group: teknoir.org
  names:
    kind: Device
    listKind: DeviceList
    plural: devices
    singular: device
  scope: Namespaced
  versions:
  - name: v1
    schema:
      openAPIV3Schema:
        description: Device is the Schema for the devices API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DeviceSpec defines the desired state of Device
            properties:
              applications:
                description: |-
                  Applications holds additional k8s resources to deploy to the device,
                  sourced from Git repositories following a GitOps model.
                items:
                  description: |-
                    GitOpsApplication describes a set of k8s resources to deploy to the device
                    that are sourced from a Git repository following a GitOps model.
                  properties:
                    path:
                      description: |-
                        Path is the path within the repository to the YAML file (or directory)
                        containing the k8s resources to deploy to the device.
                      type: string
                    repo_url:
                      description: RepoURL is the URL of the Git repository that holds
                        the k8s resources.
                      type: string
                    revision:
                      description: Revision is the Git revision (branch, tag or commit)
                        to deploy.
                      type: string
                  required:
                  - repo_url
                  type: object
                type: array
              device_type:
                description: |-
                  INSERT ADDITIONAL SPEC FIELDS - desired state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                type: string
              keys:
                description: |-
                  Secret holds secret data of a certain type. The total bytes of the values in
                  the Data field must be less than MaxSecretSize bytes.
                properties:
                  apiVersion:
                    description: |-
                      APIVersion defines the versioned schema of this representation of an object.
                      Servers should convert recognized schemas to the latest internal value, and
                      may reject unrecognized values.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                    type: string
                  data:
                    additionalProperties:
                      format: byte
                      type: string
                    description: |-
                      Data contains the secret data. Each key must consist of alphanumeric
                      characters, '-', '_' or '.'. The serialized form of the secret data is a
                      base64 encoded string, representing the arbitrary (possibly non-string)
                      data value here. Described in https://tools.ietf.org/html/rfc4648#section-4
                    type: object
                  immutable:
                    description: |-
                      Immutable, if set to true, ensures that data stored in the Secret cannot
                      be updated (only object metadata can be modified).
                      If not set to true, the field can be modified at any time.
                      Defaulted to nil.
                    type: boolean
                  kind:
                    description: |-
                      Kind is a string value representing the REST resource this object represents.
                      Servers may infer this from the endpoint the client submits requests to.
                      Cannot be updated.
                      In CamelCase.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  metadata:
                    description: |-
                      Standard object's metadata.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#metadata
                    type: object
                  stringData:
                    additionalProperties:
                      type: string
                    description: |-
                      stringData allows specifying non-binary secret data in string form.
                      It is provided as a write-only input field for convenience.
                      All keys and values are merged into the data field on write, overwriting any existing values.
                      The stringData field is never output when reading from the API.
                    type: object
                  type:
                    description: |-
                      Used to facilitate programmatic handling of secret data.
                      More info: https://kubernetes.io/docs/concepts/configuration/secret/#secret-types
                    type: string
                type: object
              manifest:
                properties:
                  apps:
                    additionalProperties:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                type: object
              plugins:
                items:
                  properties:
                    apiVersion:
                      description: |-
                        APIVersion defines the versioned schema of this representation of an object.
                        Servers should convert recognized schemas to the latest internal value, and
                        may reject unrecognized values.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
                      type: string
                    kind:
                      description: |-
                        Kind is a string value representing the REST resource this object represents.
                        Servers may infer this from the endpoint the client submits requests to.
                        Cannot be updated.
                        In CamelCase.
                        More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                      type: string
                    spec:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                type: array
              virtual:
                description: |-
                  Virtual sizes the virtual machine of a virtual device. It is set if and
                  only if device_type is "virtual".
                properties:
                  cpu:
                    description: CPU is the number of whole vCPUs, 1..64.
                    pattern: ^([1-9]|[1-5][0-9]|6[0-4])$
                    type: string
                  disabled:
                    description: Disabled halts the VM (runStrategy Halted) and keeps
                      its disk and keys.
                    type: boolean
                  disk:
                    description: Disk is the root disk.
                    properties:
                      size:
                        description: |-
                          Size is the root disk size in whole GiB, 10Gi..1024Gi. It is fixed after
                          creation, because the local-path storage class cannot expand volumes.
                        pattern: ^([1-9][0-9]|[1-9][0-9][0-9]|10[01][0-9]|102[0-4])Gi$
                        type: string
                        x-kubernetes-validations:
                        - message: disk size cannot be changed after creation
                          rule: self == oldSelf
                    required:
                    - size
                    type: object
                  memory:
                    description: |-
                      Memory is the guest memory in whole GiB, 1Gi..256Gi. Gi only: "4Gi",
                      never "4GiB" or "4096Mi".
                    pattern: ^([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-6])Gi$
                    type: string
                required:
                - cpu
                - disk
                - memory
                type: object
            required:
            - keys
            - manifest
            type: object
            x-kubernetes-validations:
            - message: spec.virtual requires device_type virtual
              rule: '!has(self.virtual) || (has(self.device_type) && self.device_type
                == ''virtual'')'
            - message: a device cannot be converted to or from virtual
              rule: '!has(oldSelf.device_type) || oldSelf.device_type == '''' || ((oldSelf.device_type
                == ''virtual'') == (has(self.device_type) && self.device_type == ''virtual''))'
          status:
            description: SubResourcesStatus defines the observed state of Device
            properties:
              authorized_keys:
                description: |-
                  INSERT ADDITIONAL STATUS FIELD - define observed state of cluster
                  Important: Run "make" to regenerate code after modifying this file
                properties:
                  active:
                    type: boolean
                  key:
                    type: string
                type: object
              build_image:
                properties:
                  artifacts:
                    items:
                      type: string
                    type: array
                  triggered:
                    type: boolean
                type: object
              build_installer:
                properties:
                  artifacts:
                    items:
                      type: string
                    type: array
                  triggered:
                    type: boolean
                type: object
              config:
                properties:
                  active_config_hash:
                    type: string
                  github_rate_limits:
                    description: |-
                      GitHubRateLimits records, per GitHub API rate-limit bucket, that a GitOps
                      sync recently hit that bucket's limit. GitHub tracks rate limits
                      independently per credential (a personal access token, or a specific
                      GitHub App installation) and, for unauthenticated access, per outbound
                      IP shared across the whole cluster - so a limit hit on one bucket (most
                      likely unauthenticated access, given its much lower 60 requests/hour
                      budget) must not block GitOps syncs that would use a different,
                      unaffected bucket. While a bucket's entry is present and unexpired,
                      GitOps fetching that would use it is skipped until its RetryAfter has
                      passed, instead of retrying every reconcile and burning through the
                      rest of that bucket's window.
                    items:
                      description: |-
                        GitHubRateLimitStatus records an in-progress backoff after a GitOps sync hit
                        a GitHub API rate limit (primary or secondary/abuse) on a specific bucket.
                      properties:
                        bucket:
                          description: |-
                            Bucket identifies which independent GitHub rate limit budget this
                            backoff record applies to, e.g. "unauthenticated", "token", or
                            "app-install-<installation id>".
                          type: string
                        reason:
                          description: Reason is the error returned by GitHub that
                            triggered the backoff.
                          type: string
                        retry_after:
                          description: |-
                            RetryAfter is the earliest time at which GitOps fetching using this
                            bucket should be attempted again, taken from GitHub's own rate limit
                            reset (or Retry-After) signal.
                          format: date-time
                          type: string
                      required:
                      - bucket
                      - retry_after
                      type: object
                    type: array
                  gitops_applications:
                    description: |-
                      GitOpsApplications records, per GitOps application, the short Git commit
                      hash that was last loaded. It lets subsequent reconciles skip fetching
                      applications whose commit has not changed, reducing GitHub API usage.
                    items:
                      description: |-
                        GitOpsApplicationConfig records the last-loaded short Git commit hash for a
                        single GitOps application, keyed by its repository, revision and path.
                      properties:
                        commit:
                          description: |-
                            Commit is the short Git commit hash that was last loaded for this
                            application.
                          type: string
                        etag:
                          description: |-
                            ETag is the HTTP entity tag returned by GitHub for this application's
                            ListCommits request. It is sent back as an If-None-Match header on the
                            next reconcile so that an unchanged application yields a 304 Not Modified
                            response, which does not count against the GitHub API rate limit.
                          type: string
                        path:
                          type: string
                        repo_url:
                          type: string
                        revision:
                          type: string
                      type: object
                    type: array
                  last_config_change:
                    format: date-time
                    type: string
                type: object
              encryption_key_gen_info:
                properties:
                  active:
                    type: boolean
                  key_gen_success:
                    type: boolean
                type: object
              remote_access:
                properties:
                  active:
                    type: boolean
                  last_applied_tunnels:
                    items:
                      properties:
                        host:
                          type: string
                        name:
                          type: string
                        port:
                          type: string
                        type:
                          description: Type defines network protocols supported tunnels.
                          type: string
                      required:
                      - host
                      - name
                      - port
                      - type
                      type: object
                    type: array
                  port:
                    type: string
                  tunnels:
                    items:
                      properties:
                        host:
                          type: string
                        name:
                          type: string
                        port:
                          type: string
                        type:
                          description: Type defines network protocols supported tunnels.
                          type: string
                      required:
                      - host
                      - name
                      - port
                      - type
                      type: object
                    type: array
                type: object
              state:
                properties:
                  alerts:
                    items:
                      properties:
                        count:
                          type: integer
                        name:
                          type: string
                        state:
                          type: string
                      type: object
                    type: array
                  apps:
                    additionalProperties:
                      properties:
                        alerts:
                          items:
                            properties:
                              count:
                                type: integer
                              name:
                                type: string
                              state:
                                type: string
                            type: object
                          type: array
                        cpu_usage:
                          type: number
                        cpu_usage_pct:
                          type: number
                        memory_usage:
                          type: number
                        memory_usage_pct:
                          type: number
                        ready_containers:
                          type: integer
                        restarts:
                          type: integer
                        running:
                          type: boolean
                        total_containers:
                          type: integer
                      type: object
                    type: object
                  cpu_usage:
                    type: number
                  memory_usage:
                    type: number
                  net_rx_rate:
                    type: number
                  net_tx_rate:
                    type: number
                  storage_usage:
                    type: number
                type: object
              virtual_device:
                description: VirtualDevice is set by the VirtualDevice plugin on virtual
                  devices only.
                properties:
                  conditions:
                    description: 'Conditions: Admitted, RuntimeReady, RestartRequired,
                      BootstrapCurrent.'
                    items:
                      description: Condition contains details for one aspect of the
                        current state of this API Resource.
                      properties:
                        lastTransitionTime:
                          description: |-
                            lastTransitionTime is the last time the condition transitioned from one status to another.
                            This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                          format: date-time
                          type: string
                        message:
                          description: |-
                            message is a human readable message indicating details about the transition.
                            This may be an empty string.
                          maxLength: 32768
                          type: string
                        observedGeneration:
                          description: |-
                            observedGeneration represents the .metadata.generation that the condition was set based upon.
                            For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                            with respect to the current state of the instance.
                          format: int64
                          minimum: 0
                          type: integer
                        reason:
                          description: |-
                            reason contains a programmatic identifier indicating the reason for the condition's last transition.
                            Producers of specific condition types may define expected values and meanings for this field,
                            and whether the values are considered a guaranteed API.
                            The value should be a CamelCase string.
                            This field may not be empty.
                          maxLength: 1024
                          minLength: 1
                          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                          type: string
                        status:
                          description: status of the condition, one of True, False,
                            Unknown.
                          enum:
                          - "True"
                          - "False"
                          - Unknown
                          type: string
                        type:
                          description: type of condition in CamelCase or in foo.example.com/CamelCase.
                          maxLength: 316
                          pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                          type: string
                      required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  k3sVersion:
                    description: K3sVersion is the k3s version the device bootstraps.
                    type: string
                  message:
                    description: Message explains the phase to a person. It never
                      contains credentials.
                    type: string
                  osImage:
                    description: OSImage is the CDI URL the root disk was imported
                      from.
                    type: string
                  phase:
                    description: |-
                      Phase is a short machine-readable state, one of the VirtualDevicePhase
                      constants.
                    type: string
                  printableStatus:
                    description: PrintableStatus is the VM's status.printableStatus,
                      verbatim.
                    type: string
                  runtimeNamespace:
                    description: RuntimeNamespace is the namespace that holds the
                      VM, <namespace>-vdev.
                    type: string
                type: object
              wireguard:
                description: |-
                  WireGuard is set by the WireGuard (ZTNA) plugin while WireGuard is enabled
                  for the device by its ztna.teknoir.org/wireguard annotation.
                properties:
                  approvedFingerprint:
                    description: |-
                      ApprovedFingerprint is the identity fingerprint an admin approved (annotation
                      ztna.teknoir.org/approved-identity); a pinned identity gets sessions only
                      when it matches.
                    type: string
                  enabled:
                    description: Enabled is true while the device has the WireGuard
                      annotation set to "enabled".
                    type: boolean
                  enrolledAt:
                    description: EnrolledAt (RFC3339) is when that identity was pinned.
                    type: string
                  enrollmentConflicts:
                    description: EnrollmentConflicts counts rejected enrollments with
                      a different key.
                    type: integer
                  enrollmentGeneration:
                    description: EnrollmentGeneration increases whenever enrollment
                      is reset.
                    format: int64
                    type: integer
                  enrollUntil:
                    description: EnrollUntil (RFC3339) closes the enrollment window
                      of this generation.
                    type: string
                  identityFingerprint:
                    description: |-
                      IdentityFingerprint is the fingerprint of the device agent identity key
                      pinned by the hub for the current enrollment generation.
                    type: string
                  identityApproved:
                    description: IdentityApproved is true when the pinned identity matches
                      the fingerprint an admin approved.
                    type: boolean
                  identityVoided:
                    description: IdentityVoided is true when the hub voided the pinned
                      identity (compromised or health-check-failed flag); re-admission needs
                      a new identity.
                    type: boolean
                  lastFlagsSet:
                    description: |-
                      LastFlagsSet records that a compromised or health-check-failed flag was
                      set when the controller last looked; clearing it resets enrollment.
                    type: boolean
                  lastReenrollRequest:
                    description: LastReenrollRequest is the value of the reenroll
                      annotation that was last acted on.
                    type: string
                  message:
                    description: Message says what is wrong, if anything.
                    type: string
                  note:
                    description: Note is the free-text reason an operator entered
                      with the flag.
                    type: string
                  policyUpdatedAt:
                    description: PolicyUpdatedAt (RFC3339) is when the controller
                      last changed the hub's policy entry.
                    type: string
                  reasons:
                    description: |-
                      Reasons are the revocation reasons while State is revoked: compromised
                      and/or health_check_failed.
                    items:
                      type: string
                    type: array
                  state:
                    description: 'State is the access policy state: active, revoked
                      or disabled.'
                    type: string
                  webTerminalURL:
                    description: WebTerminalURL is the WireGuard web terminal of the
                      device, while enabled.
                    type: string
                type: object
            type: object
        type: object
        x-kubernetes-preserve-unknown-fields: true
    served: true
    storage: true
    subresources:
      status: {}
