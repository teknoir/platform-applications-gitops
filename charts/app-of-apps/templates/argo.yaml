---
# Argo CD manages itself (charts/argo). The Helm release name argo is the one teknoir/infra
# scripts/deploy-argo.sh installs (as the k3s manifest teknoir-argo.yaml), so the render keeps every
# name (argo-argocd-*) and this Application adopts the running install in place. Once it is Synced,
# move teknoir-argo.yaml out of the k3s manifests directory, or every k3s restart re-applies it over
# this Application.
#   - ServerSideApply: the ApplicationSet CRD is too large for client-side apply's last-applied
#     annotation.
#   - No resources-finalizer: deleting this Application (or pruning it from app-of-apps) must leave
#     Argo CD running, never cascade-delete it.
# Wave -5: after platform-secrets, before the platform.
#
# teknoir-cloud only, allowlisted here and not in values (as in _helpers.tpl): charts/argo is this
# environment's Argo CD, and a cherry-pick of this file onto teknoir-online (whose Argo CD is the
# Application argocd) or teknoir-local (the argo entry of its own app-of-apps) must render nothing
# there rather than a second Argo CD.
{{- if has .Values.project (list "teknoir-cloud") }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo
  annotations:
{{- if .Values.releaseName }}
    teknoir.org/release: {{ .Values.releaseName | quote }}
{{- end }}
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/argo
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
    helm:
      releaseName: argo
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
