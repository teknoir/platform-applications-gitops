{{- /*
ZTNA (WireGuard over STUNner): Gateway API CRDs, the STUNner gateway operator and the
wg-hub. Gated by app-of-apps.ztnaEnabled (see _helpers.tpl): values flag AND project
allowlist, so nothing renders on any other environment.

  gateway-api-crds  the Gateway API CRDs (standard channel), server-side applied
  stunner           operator + GatewayClass, GatewayConfig, Gateway, UDPRoute
  ztna              namespace teknoir-ztna, wg-hub, wg-flags, RBAC, admission policy, routing
  device-controller (controllers.yaml) gets its Role in teknoir-ztna

No sync waves on purpose: a wave makes the whole ROOT app-of-apps wait for the previous wave to
be Healthy, so one failing ZTNA Application (CRD error, image pull, unreachable chart repo) would
stall every other Application of the environment. The order is covered by retry (10 attempts,
30s backoff up to 5m) and by SkipDryRunOnMissingResource on the objects whose CRDs arrive in the
same run.

No resources-finalizer on any of them: turning the flag off removes the Applications
but leaves everything in the cluster (CRDs, the stunner and teknoir-ztna namespaces with
the pinned device identities). Removal is a manual, ordered procedure
(charts/ztna/README.md, "Removing").
*/ -}}
{{- if include "app-of-apps.ztnaEnabled" . }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    # Cluster-scoped objects only; the namespace is just a required field.
    namespace: kube-system
    server: https://kubernetes.default.svc
  source:
    path: charts/gateway-api-crds
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    syncOptions:
      # The CRDs are far above the 256 KiB last-applied-configuration annotation of
      # client-side apply (httproutes alone is about 300 KiB).
      - ServerSideApply=true
    automated:
      # CRDs are never pruned: deleting one deletes every object of its kind.
      prune: false
      selfHeal: true
      enabled: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stunner
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  destination:
    namespace: stunner-system
    server: https://kubernetes.default.svc
  source:
    path: charts/stunner
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    managedNamespaceMetadata:
      # stunnerd runs outside the mesh: UDP is not captured by the sidecar anyway, and
      # a sidecar on the dataplane would add nothing but a second thing to harden.
      labels:
        istio-injection: disabled
    syncOptions:
      - CreateNamespace=true
      # The STUNner CRDs (dataplanes, gatewayconfigs, udproutes) are large.
      - ServerSideApply=true
      # The subchart's Dataplane object is applied in the same sync as the STUNner CRDs.
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztna
spec:
  destination:
    namespace: teknoir-ztna
    server: https://kubernetes.default.svc
  source:
    path: charts/ztna
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    syncOptions:
      # The chart renders the Namespace itself (it must be labelled for the mesh and is
      # kept on removal), so CreateNamespace is not used.
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end }}
