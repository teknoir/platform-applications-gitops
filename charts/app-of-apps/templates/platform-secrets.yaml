---
# Keeps teknoir-system/backstage-keycloak-secrets (user-controller's Keycloak
# client credentials) a re-synced copy of teknoir-auth/oauth2-proxy-secret
# (see charts/platform-secrets/values.yaml). Wave -10: before everything that
# reads it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/platform-secrets
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
