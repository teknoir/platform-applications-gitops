---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.airgapped/teknoir
    chart: harbor
    # Pinned to the running release (Harbor v2.14.3). harbor 0.0.8 (Harbor
    # 2.15.2 + valkey) runs a one-way database migration and its images are
    # not mirrored yet; that upgrade is planned separately.
    targetRevision: 0.0.5
  project: {{ .Values.project }}
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
