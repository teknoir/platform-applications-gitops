---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.airgapped/teknoir
    chart: harbor
    targetRevision: 0.0.8
  project: {{ .Values.project }}
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
