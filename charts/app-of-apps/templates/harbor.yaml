{{- /*
Harbor (registry) on the cluster (plans/harbor-proxy-staging.md): the registry staging pulls its
first-party images through. It needs the environment in the allowlist below, so a cherry-pick of
this file onto teknoir-online (production) or teknoir-local (airgapped; it installs Harbor from the
airgap bootstrap) renders nothing there. Add an environment only in its own reviewed commit.

No sync waves (see ztna.yaml). No resources-finalizer: removing the Application leaves Harbor's data
in place.
*/ -}}
{{- $allowedProjects := list "teknoir-cloud" }}
{{- if and (.Values.harbor).enabled (has .Values.project $allowedProjects) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/harbor
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
    helm:
      parameters:
        # No CI on the cluster: the harbor chart drops the ci robot from its config. The vpro CI robot
        # is retired (CI v4 P7.2), so this is the literal "false", not computed from a values flag.
        - name: harborConfig.ciRobot.enabled
          value: "false"
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
  # The harbor chart renders the Secrets harbor-config writes its robot credentials into as empty
  # Opaque Secrets (harbor-config has no `create` in teknoir-system); the data is not ArgoCD's.
  # No RespectIgnoreDifferences on purpose: it would copy .data into last-applied, passwords included.
  ignoreDifferences:
    - kind: Secret
      name: harbor-nodes-pull
      jqPathExpressions: [.data]
    - kind: Secret
      name: harbor-teamspace-pull
      jqPathExpressions: [.data]
{{- end }}
