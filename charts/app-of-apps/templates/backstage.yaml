---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: backstage
    repoURL: harbor.teknoir.airgapped/teknoir
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true