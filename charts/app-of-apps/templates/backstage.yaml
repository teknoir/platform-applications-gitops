{{- /*
Gated: the backstage chart needs the backstage-postgres-secrets,
backstage-keycloak-secrets and backstage-github-app-secret Secrets, which
nothing creates air-gapped yet. Enable once they exist.
*/}}
{{- if .Values.backstage.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.airgapped/teknoir
    chart: backstage
    targetRevision: 0.0.82
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
{{- end }}
