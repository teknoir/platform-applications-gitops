---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
{{- if .Values.releaseName }}
  annotations:
    teknoir.org/release: {{ .Values.releaseName | quote }}
{{- end }}
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/backstage
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
{{- if include "app-of-apps.ztnaEnabled" . }}
    helm:
      parameters:
        # The ZTNA switch (app-of-apps values ztna.enabled), turns the WireGuard UI on (teknoir.ztna.enabled).
        - name: ztna.enabled
          value: "true"
{{- end }}
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
