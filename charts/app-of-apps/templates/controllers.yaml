---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.local/teknoir
    chart: user-controller
    targetRevision: 0.0.82
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-admin
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-edit
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-view
      jqPathExpressions:
        - .rules

