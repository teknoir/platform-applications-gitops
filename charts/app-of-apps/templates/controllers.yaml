---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-controller
{{- if .Values.releaseName }}
  annotations:
    teknoir.org/release: {{ .Values.releaseName | quote }}
{{- end }}
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/notebook-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

