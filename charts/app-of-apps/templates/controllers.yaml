---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/notebook-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devstudio-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/devstudio-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/user-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-admin
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-edit
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-view
      jqPathExpressions:
        - .rules

---
apiVersion: argoproj.io/v1alpha1
