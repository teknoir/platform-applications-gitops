---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/notebook-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
{{- if has .Values.project (list "teknoir-cloud") }}
    helm:
      # Pins of the image group (scripts/images.yaml); only teknoir-cloud has a pins/ directory.
      valueFiles:
        - values.yaml
        - ../../pins/notebook-controller.yaml
{{- end }}
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

