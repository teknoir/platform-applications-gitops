---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-controller
{{- if .Values.releaseName }}
  annotations:
    teknoir.org/release: {{ .Values.releaseName | quote }}
{{- end }}
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/user-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-admin
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-edit
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-view
      jqPathExpressions:
        - .rules

