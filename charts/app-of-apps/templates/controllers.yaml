---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/user-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
{{- if has .Values.project (list "teknoir-cloud") }}
    helm:
      # Pins of the image group (scripts/images.yaml); only teknoir-cloud has a pins/ directory.
      valueFiles:
        - values.yaml
        - ../../pins/user-controller.yaml
{{- end }}
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-admin
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-edit
      jqPathExpressions:
        - .rules
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      name: teknoir-view
      jqPathExpressions:
        - .rules

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: profile-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/profile-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
{{- if has .Values.project (list "teknoir-cloud") }}
    helm:
      # Pins of the image group (scripts/images.yaml); only teknoir-cloud has a pins/ directory.
      valueFiles:
        - values.yaml
        - ../../pins/profile-controller.yaml
{{- if include "app-of-apps.pluginGitEnabled" . }}
      parameters:
        # Plugin git mode (CI v4 P9.1, app-of-apps values profileController.pluginGit): the plugin charts live in
        # this repository, and profile-controller renders each profile-plugin-<x> Application from
        # plugins/charts/profile-plugin-<x> at the root's revision (app-of-apps.revision) instead of the
        # pluginChartVersion chart. Staging only (this allowlist): every other environment renders chart mode.
        # Quoted and forceString: a hex revision such as 12e45... must stay a string, never a number.
        - name: config.pluginGit.repoURL
          value: https://github.com/teknoir/platform-applications-gitops
        - name: config.pluginGit.revision
          value: {{ include "app-of-apps.revision" . | quote }}
          forceString: true
{{- end }}
{{- end }}
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: device-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/device-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
{{- if has .Values.project (list "teknoir-cloud") }}
    helm:
      # Pins of the image group (scripts/images.yaml); only teknoir-cloud has a pins/ directory.
      valueFiles:
        - values.yaml
        - ../../pins/device-controller.yaml
        - ../../pins/teknoir-desktop.yaml
        - ../../pins/web-terminal.yaml
        - ../../pins/wg-tunnel.yaml
        # Fleet pointers of the hardware classes (fleet/README.md): the commit each class DAS sends.
        - ../../fleet/jetson-orin.yaml
        - ../../fleet/nvidia-rtx.yaml
        - ../../fleet/raspberry-pi.yaml
      parameters:
        # Retained config republish (plans/teknoirbot/root-in-vm.md R0): app-of-apps values
        # deviceController.retainedConfigRepublish, staged off -> log -> on. Staging only (this allowlist): every other
        # environment keeps the chart default "off". forceString: a string, never a YAML boolean.
        - name: retainedConfigRepublish
          value: {{ include "app-of-apps.retainedConfigRepublish" . | quote }}
          forceString: true
{{- if include "app-of-apps.ztnaEnabled" . }}
        # One switch (app-of-apps values ztna.enabled) for the whole feature. The images
        # (ztna.agentImage, ztna.terminalImage) are in pins/wg-tunnel.yaml and pins/web-terminal.yaml.
        - name: ztna.enabled
          value: "true"
        # Tunneling (WireGuard) on for every Device without the annotation; an admin's
        # "disabled" and revocation tombstones are respected (plans/ssh-tunnel-removal.md).
        - name: ztna.defaultOn
          value: "true"
{{- if include "app-of-apps.botAgentEnabled" . }}
        # Virtual devices may reach the TeknoirBot API (tb-api.<domain>:8085) on the public gateway pods.
        - name: teknoirbotApi.enabled
          value: "true"
{{- end }}
{{- end }}
{{- end }}
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
{{- if include "app-of-apps.ztnaEnabled" . }}
    # The Role in teknoir-ztna needs the namespace; retry until the ztna Application made it.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
{{- end -}}