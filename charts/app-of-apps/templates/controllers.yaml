---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notebook-controller
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.local/teknoir
    chart: notebook-controller
    targetRevision: 0.0.82
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
