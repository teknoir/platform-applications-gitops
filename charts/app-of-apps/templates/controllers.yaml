    server: https://kubernetes.default.svc
  source:
    path: charts/profile-controller
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
