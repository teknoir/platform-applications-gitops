---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
spec:
  destination:
    namespace: teknoir-system
    server: https://kubernetes.default.svc
  source:
    path: charts/monitoring
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ .Values.project }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
      enabled: true
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: monitoring-grafana
      jsonPointers:
        - /data
        - /stringData
{{/*    - group: ""*/}}
{{/*      kind: Secret*/}}
{{/*      name: historian-mongodb-credentials*/}}
{{/*      jsonPointers:*/}}
{{/*        - /data*/}}
{{/*        - /stringData*/}}