---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth
spec:
  destination:
    namespace: teknoir-auth
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.airgapped/teknoir
    chart: auth
    # Pinned to the running release. auth 0.0.6/0.0.7 need oauth2-proxy
    # v7.15.4, which is not mirrored yet; that upgrade is planned separately.
    targetRevision: 0.0.3
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
