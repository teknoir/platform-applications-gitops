---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: auth
spec:
  destination:
    namespace: teknoir-auth
    server: https://kubernetes.default.svc
  source:
    repoURL: harbor.teknoir.airgapped/teknoir
    chart: auth
    targetRevision: 0.0.7
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
