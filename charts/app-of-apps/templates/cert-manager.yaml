---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
{{- if .Values.releaseName }}
  annotations:
    teknoir.org/release: {{ .Values.releaseName | quote }}
{{- end }}
spec:
  destination:
    namespace: cert-manager
    server: https://kubernetes.default.svc
  source:
    path: charts/cert-manager
    repoURL: https://github.com/teknoir/platform-applications-gitops
    targetRevision: {{ include "app-of-apps.revision" . }}
  sources: [ ]
  project: {{ .Values.project }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
