suite: staging release revision (plans/staging-releases.md)
# Every Application that reads platform-applications-gitops follows `release` (a full commit SHA)
# on teknoir-cloud, and the branch (`project`) everywhere else. The document counts per template
# make a missed replacement or a new Application without the helper fail here: add the new
# Application to the count AND to the targetRevision asserts of its file.
templates:
  - templates/auth.yaml
  - templates/backstage.yaml
  - templates/backstage-next.yaml
  - templates/cert-manager.yaml
  - templates/ci.yaml
  - templates/controllers.yaml
  - templates/istio.yaml
  - templates/monitoring.yaml
  - templates/platform-secrets.yaml
  - templates/virtual-device-spike.yaml
  - templates/virtual-devices.yaml
  - templates/ztna.yaml
  - templates/release-guard.yaml
tests:

  - it: "auth: 1 Application(s), all on the release SHA with the release annotation"
    template: templates/auth.yaml
    set:
      project: teknoir-cloud
      release: "0123456789abcdef0123456789abcdef01234567"
      releaseName: staging-20261017.1
      virtualDevices: {enabled: true, spike: {enabled: true}}
      releaseGuard: {enabled: true}
      ztna: {enabled: true}
    asserts:
      - hasDocuments: {count: 1}
      - isKind: {of: Application, documentIndex: 0}
      - equal: {path: spec.source.repoURL, value: https://github.com/teknoir/platform-applications-gitops, documentIndex: 0}
      - equal: {path: spec.source.targetRevision, value: "0123456789abcdef0123456789abcdef01234567", documentIndex: 0}
      - equal: {path: 'metadata.annotations["teknoir.org/release"]', value: staging-20261017.1, documentIndex: 0}

  - it: "backstage: 1 Application(s), all on the release SHA with the release annotation"
    template: templates/backstage.yaml
