suite: backstage Application (the staging UI, next-gen since the UI cut-over a2)
templates:
  - templates/backstage.yaml
tests:
  - it: sets the fleet Prometheus template always
    set: {project: teknoir-cloud, ztna.enabled: false}
    asserts:
      - equal: {path: metadata.name, value: backstage}
      - contains:
          path: spec.source.helm.parameters
          content: {name: fleet.prometheusUrlTemplate, value: "http://prometheus.{namespace}.svc.cluster.local/{namespace}/prometheus"}
      - notContains: {path: spec.source.helm.parameters, content: {name: fleet.access.enabled, value: "true"}}
      - contains: {path: spec.source.helm.parameters, content: {name: "config.redirectHosts[0]", value: next.teknoir.cloud}}

  - it: turns Connect on with writes where ZTNA is on
    set: {project: teknoir-cloud, ztna.enabled: true}
    asserts:
      - contains: {path: spec.source.helm.parameters, content: {name: ztna.enabled, value: "true"}}
      - contains: {path: spec.source.helm.parameters, content: {name: fleet.access.enabled, value: "true"}}
      - contains: {path: spec.source.helm.parameters, content: {name: fleet.access.writes, value: "true"}}

  - it: renders no helm parameters outside staging (production and airgapped render as before)
    set: {project: teknoir-online, ztna.enabled: true}
    asserts:
      - notExists: {path: spec.source.helm}
