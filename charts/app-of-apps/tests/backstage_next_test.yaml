suite: backstage-next Application gate
templates:
  - templates/backstage-next.yaml
tests:
  - it: renders the Application on teknoir-cloud
    set: {project: teknoir-cloud}
    asserts:
      - hasDocuments: {count: 1}
      - equal: {path: metadata.name, value: backstage-next}
      - equal: {path: spec.source.path, value: charts/backstage}
      - equal: {path: spec.source.targetRevision, value: teknoir-cloud}
      - equal: {path: spec.destination.namespace, value: teknoir-system}
      - contains: {path: spec.source.helm.parameters, content: {name: name, value: backstage-next}}
      - contains: {path: spec.source.helm.parameters, content: {name: config.host, value: next.teknoir.cloud}}
      - contains: {path: spec.source.helm.parameters, content: {name: backstage.image, value: "ghcr.io/teknoir/backstage-app:nextgen"}}
      - contains: {path: spec.source.helm.parameters, content: {name: backstageApi.image, value: "ghcr.io/teknoir/backstage:nextgen"}}
      - contains: {path: spec.source.helm.parameters, content: {name: backstageApi.imagePullPolicy, value: Always}}
      - contains: {path: spec.source.helm.parameters, content: {name: backstageApi.resources.limits.memory, value: 1536Mi}}
      - contains: {path: spec.source.helm.parameters, content: {name: backstage.resources.limits.memory, value: 256Mi}}
      - contains: {path: spec.source.helm.parameters, content: {name: postgres.resources.limits.memory, value: 512Mi}}
      - contains: {path: spec.source.helm.parameters, content: {name: fleet.classicUrl, value: "https://teknoir.cloud"}}

  - it: passes the ZTNA switch like the classic Application
    set: {project: teknoir-cloud, ztna.enabled: true}
    asserts:
      - contains: {path: spec.source.helm.parameters, content: {name: ztna.enabled, value: "true"}}

  - it: leaves ZTNA out when it is off
    set: {project: teknoir-cloud, ztna.enabled: false}
    asserts:
      - notContains: {path: spec.source.helm.parameters, content: {name: ztna.enabled, value: "true"}}

  - it: renders nothing when the flag is off
    set: {project: teknoir-cloud, backstageNext.enabled: false}
    asserts:
      - hasDocuments: {count: 0}

  - it: renders nothing on production
    set: {project: teknoir-online}
    asserts:
      - hasDocuments: {count: 0}

  - it: renders nothing on the airgapped environment
    set: {project: teknoir-local}
    asserts:
      - hasDocuments: {count: 0}
