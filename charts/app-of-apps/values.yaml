# GitOps values
project: teknoir-cloud

# Staging releases (plans/staging-releases.md). On teknoir-cloud every Application that reads this
# repository follows `release` (a full commit SHA) instead of the branch; with `release` empty they
# follow the branch as before (see app-of-apps.revision in templates/_helpers.tpl). Both values are set
# ONLY on the root Application, as helm parameters, by scripts/staging-release; never commit them here.
# releaseName is the tag (staging-YYYYMMDD.N) and is rendered as annotation teknoir.org/release.
release: ""
releaseName: ""

# Virtual-device runtime (charts/virtual-devices: KubeVirt, CDI) for the S1 spike on
# r415. The Application also needs this project in the allowlist in
# templates/virtual-devices.yaml, which is teknoir-cloud only, so this flag does
# nothing if it is cherry-picked onto another environment branch.
virtualDevices:
  # On for the single vpro host too (14 GB + 16 GB swap, KVM): room for KubeVirt and a small VM
  # or two; the device-controller allowance caps what a teamspace may run.
  enabled: true
  # S1 spike VM (charts/virtual-device-spike), teknoir-cloud only. Retired: the spike is done and
  # Phase 1 virtual devices (device-controller) replace it. Chart code kept for reference.
  spike:
    enabled: false

# ZTNA: WireGuard over STUNner as an alternative to the SSH reverse tunnels (plan:
# plans/wireguard-ztna-tunnel.md). One switch for the whole feature:
#   - Applications gateway-api-crds, stunner and ztna (no sync waves: a failing
#     ZTNA Application must not stall the root; retry covers the order)
#     (templates/ztna.yaml);
#   - ztna.enabled=true is passed to the device-controller Application, the virtual-devices
#     Application (CoreDNS rewrites for wg-device and turn, NetworkPolicy egress to the TURN
#     server), the auth Application (wg.<domain> bypasses the edge login redirect; the hub
#     validates the Keycloak tokens itself) and the backstage Application (UI flag teknoir.ztna).
# The images are NOT set here: before flipping this, set charts/ztna image.tag and
# charts/device-controller ztna.agentImage / ztna.terminalImage (a missing value fails
# the render of that chart, so nothing half-configured is ever applied). Like
# virtualDevices, the Applications also need the project in the allowlist in
# templates/_helpers.tpl (teknoir-cloud only), so this flag does nothing if it is
# cherry-picked onto another environment branch.
ztna:
  enabled: true

# CI/CD on the cluster (plans/ci-argo-workflows.md), teknoir-cloud only (allowlist in
# templates/ci.yaml): Harbor as the registry (harbor.teknoir.cloud) and Argo Workflows +
# BuildKit pipelines (ci.teknoir.cloud), with vpro as the k3s build node.
# Harbor adopts the earlier Harbor objects in teknoir-system (their StatefulSets were
# deleted by Anders on 2026-10-16) and reuses the data under /opt/teknoir/harbor.
# charts/ci harbor.enabled pushes CI images there too.
harbor:
  enabled: true
ci:
  enabled: true

# Next-gen robot fleet platform (plans/nextgen-fleet-platform.md): a second Backstage instance at
# next.teknoir.cloud (templates/backstage-next.yaml), teknoir-cloud only (allowlist in the
# template). Needs the DNS name and certificate for the host (wildcard *.teknoir.cloud covers it).
backstageNext:
  enabled: true

# Staging release guard (charts/release-guard, templates/release-guard.yaml): a
# ValidatingAdmissionPolicy that lets only scripts/staging-release (ServiceAccount
# teknoir-system/staging-releaser), ArgoCD and profile-controller write ArgoCD Applications.
# teknoir-cloud only (allowlist in templates/_helpers.tpl). OFF until release step 4, then Warn,
# then Deny (plans/staging-releases.md, rollout order).
releaseGuard:
  enabled: true
  # Warn | Deny, passed to the chart as guard.mode.
  mode: Warn
