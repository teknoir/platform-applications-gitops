# GitOps values
project: teknoir-cloud

# A commit SHA Kargo pins every Application of teknoir-cloud to (release=$ARGOCD_APP_REVISION); empty = main.
release: ""

# Virtual-device runtime (charts/virtual-devices: KubeVirt, CDI) for the S1 spike on
# r415. The Application also needs this project in the allowlist in
# templates/virtual-devices.yaml, which is teknoir-cloud only, so this flag does
# nothing if it is cherry-picked onto another environment branch.
virtualDevices:
  # On on r415 since 2026-11-07 (Anders: "You are allowed to enable KubeVirt and Virtual devices
  # on r415"; TeknoirBot VMs are virtual devices, plans/teknoirbot/README.md).
  enabled: true
  # S1 spike VM (charts/virtual-device-spike), teknoir-cloud only. Retired: the spike is done and
  # Phase 1 virtual devices (device-controller) replace it. Chart code kept for reference.
  spike:
    enabled: false

# TeknoirBot controller (charts/teknoirbot-controller, templates/teknoirbot.yaml): the TeknoirBot CRD and its
# controller, which gives each bot a virtual Device with a browser remote desktop. teknoir-cloud only (allowlist in
# the template). Turned on only after (a) charts/device-controller crds/devices.yaml carries spec.desktop (copied from
# device-controller with its Prune=false,Delete=false annotation) and pins/device-controller.yaml is a device-controller
# build with the desktop, (b) desktop.enabled is set and desktop.image is pinned in pins/teknoir-desktop.yaml, and
# (c) charts/teknoirbot-controller image.tag is pinned in pins/teknoirbot-controller.yaml.
teknoirbot:
  enabled: true
  # The AI agent in a bot's computer (plans/teknoirbot/design/agent-mvp-design.md): the in-cluster bot API
  # tb-api.<domain>:8085 (istio, virtual-devices, device-controller, backstage; app-of-apps.botAgentEnabled).
  # Turn on only with a backstage-api image that serves /api/device/bot/v1 and checks the Host header.
  agent:
    enabled: true
  # The TeknoirBot council chat (plans/teknoirbot/council-mvp.md). Needs teknoirbot.agent.enabled; turns on the
  # Backstage council config (teknoirBots.council.enabled).
  council:
    enabled: true

# ZTNA: WireGuard over STUNner as an alternative to the SSH reverse tunnels (plan:
# plans/wireguard-ztna-tunnel.md). One switch for the whole feature:
#   - Applications gateway-api-crds, stunner and ztna (no sync waves: a failing
#     ZTNA Application must not stall the root; retry covers the order)
#     (templates/ztna.yaml);
#   - ztna.enabled=true is passed to the device-controller Application, the virtual-devices
#     Application (CoreDNS rewrites for wg-device and turn, NetworkPolicy egress to the TURN
#     server), the auth Application (wg.<domain> bypasses the edge login redirect; the hub
#     validates the Keycloak tokens itself) and the backstage Application (UI flag teknoir.ztna).
# The images are NOT set here: before flipping this, pin hub.image.tag and
# ztna.agentImage / ztna.gatewayImage in pins/wg-tunnel.yaml and ztna.terminalImage in
# pins/web-terminal.yaml (a missing value fails the render of that chart, so nothing
# half-configured is ever applied). Like
# virtualDevices, the Applications also need the project in the allowlist in
# templates/_helpers.tpl (teknoir-cloud only), so this flag does nothing if it is
# cherry-picked onto another environment branch.
ztna:
  enabled: true

# device-controller settings passed to the device-controller Application as helm parameters (templates/controllers.yaml),
# teknoir-cloud only (allowlist in the template), so a cherry-pick onto another environment branch passes nothing and
# that environment keeps the chart default.
deviceController:
  # Retained config republish (plans/teknoirbot/root-in-vm.md R0, D13): device-controller republishes a Device's
  # unchanged config when the teamspace's EMQX holds no retained message for it. "off" (the chart default), "log" (only
  # logs what it would publish) or "on" (publishes); keep the quotes. Staged one release at a time: off -> log -> on, and
  # "log" or "on" only with a pins/device-controller.yaml image that reads RETAINED_CONFIG_REPUBLISH.
  retainedConfigRepublish: "on"

# profile-controller settings passed to the profile-controller Application as helm parameters (templates/controllers.yaml),
# teknoir-cloud only (allowlist in the template), so a cherry-pick onto another environment branch passes nothing and
# that environment keeps the chart default.
profileController:
  # Plugin git mode (CI v4 P9.1, plugins/charts/README.md): profile-controller renders every profile-plugin-<x>
  # Application from plugins/charts/profile-plugin-<x> of this repository at the root's revision, instead of the
  # published pluginChartVersion chart. Off: chart mode, the behaviour since the plugin charts were released. This is
  # the staging switch a later one-line PR turns on; turning it off again is the rollback (profile-controller keeps
  # config.pluginChartVersion, so its plugins return to that published version).
  pluginGit:
    enabled: false

# CI/CD on the cluster (plans/ci-argo-workflows.md), teknoir-cloud only (allowlist in
# templates/harbor.yaml): Harbor as the registry (harbor.teknoir.cloud), which staging pulls its
# first-party images through. The vpro-era on-cluster CI (Argo Workflows) is retired.
harbor:
  enabled: true

# Next-gen robot fleet platform (plans/nextgen-fleet-platform.md): a second Backstage instance at
# next.teknoir.cloud (templates/backstage-next.yaml), teknoir-cloud only (allowlist in the
# template). Needs the DNS name and certificate for the host (wildcard *.teknoir.cloud covers it).
# The next.teknoir.cloud preview instance. Off since the UI cut-over (release B, 2026-10-17): the next-gen pages
# run on the main backstage Application, and next.teknoir.cloud redirects there (charts/backstage
# config.redirectHosts, set in templates/backstage.yaml).
# Enabling it also needs its API service account in the teamspaces: add teknoir-system/backstage-next-api to
# config.portal.serviceAccounts in charts/profile-controller/values.yaml (profile-controller binds every listed account to
# the ONE config.portal.clusterRole, so that role must be one this instance may use: backstage-api-teamspace, rendered by
# the main backstage chart, or the instance's own backstage-next-api-teamspace). Without it the instance has no rights in
# any teamspace once the teknoir-admin binding is gone (backstage-sa R2).
backstageNext:
  enabled: false

# Argo Rollouts (plans/cicd/proposal-v4.md 6.1/6.2, charts/app-of-apps/templates/kargo.yaml): the controller
# that runs the AnalysisRuns a Kargo Stage verification creates. Off: nothing renders until P4.3 rehearses the
# stack on k3d. teknoir-cloud only (allowlist in the template), so a cherry-pick onto another environment branch
# renders nothing.
argoRollouts:
  # Application argo-rollouts. On its own, one release before Kargo: Kargo looks for the Rollouts CRDs once, at
  # startup, and never again (see the template header). On since P4.5 (2026-11-24, after the P4.3 rehearsal).
  enabled: true

# Kargo and kargo-config (charts/kargo-config: the Project, Warehouses, Stages and AnalysisTemplates). Off:
# nothing renders until P4.3 rehearses the stack on k3d and a later release turns it on. teknoir-cloud only
# (allowlist in the template), so a cherry-pick onto another environment branch renders nothing.
kargo:
  # Application kargo. Needs argoRollouts.enabled: it renders only with Rollouts already installed. On since
  # P4.5 (2026-11-24), one release after argoRollouts.
  enabled: true
  # Application kargo-config (the Kargo objects of this repository).
  config:
    # Needs kargo.enabled too: the Kargo CRDs must exist before its Project and Stages sync. On since P4.5
    # (2026-11-24), one release after kargo.
    enabled: true

# The dev-host CI cluster's five Helm releases under ArgoCD (CI v4 P6.3, templates/ci-runners.yaml):
# ci-runners, arc, teknoir-ci, teknoir-land and teknoir-push, destination devhost-ci. teknoir-cloud only
# (allowlist in the template), so a cherry-pick onto another environment branch renders nothing. On since
# 2026-11-25: ArgoCD on r415 owns them. Off again orphans them (no finalizer): the releases keep running as they
# are and charts/ci-runners/README.md's hand install takes over.
ciRunners:
  enabled: true
  # The devhost-ci API server as registered in the r415 ArgoCD cluster Secret (teknoir-system, name
  # devhost-ci). destination.server, never destination.name. It must equal charts/kargo-config
  # verification.devhostCiServer: the staging revision check skips sync and health only for a child whose
  # destination.server is exactly this value.
  server: https://192.168.2.181:6443
