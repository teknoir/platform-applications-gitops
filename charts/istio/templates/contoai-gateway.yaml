{{- if .Values.contoai.enabled -}}
{{- $domain := .Values.contoai.domain | default "contoai.site" -}}
{{- $hosts := .Values.contoai.hosts | default (list $domain (printf "*.%s" $domain)) -}}
{{- $credentialName := .Values.contoai.tls.credentialName | default (printf "%s-wildcard-tls" (replace "." "-" $domain)) -}}
{{- $passthrough := eq (.Values.contoai.tls.mode | default "PASSTHROUGH") "PASSTHROUGH" -}}
---
# Edge Gateway for contoai (*.contoai.site): a second server on the same 443 listener
# as teknoir-gateway, selected by SNI, so the two Gateway resources coexist.
# PASSTHROUGH (default): the TLS connection goes untouched to the contoai ingress,
# which holds and renews its own certificate. SIMPLE: terminate here with a copied
# wildcard Secret (old r415 setup).
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: contoai-gateway
  namespace: istio-system
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
{{- range $hosts }}
    - {{ . | quote }}
{{- end }}
    tls:
      httpsRedirect: true
  - port:
      number: 443
{{- if $passthrough }}
      name: tls-contoai
      protocol: TLS
{{- else }}
      name: https
      protocol: HTTPS
{{- end }}
    hosts:
{{- range $hosts }}
    - {{ . | quote }}
{{- end }}
    tls:
{{- if $passthrough }}
      mode: PASSTHROUGH
{{- else }}
      mode: SIMPLE
      credentialName: {{ $credentialName | quote }}
{{- end }}
{{- end }}
