# Values for istio.

global:
  domain: teknoir.airgapped
  # Istio images are pinned to explicit version tags, so IfNotPresent is safe
  # and correct everywhere. It is also mandatory for the air gap: the gateway
  # pods run a placeholder container (image: auto == :latest) that the API
  # server would otherwise default to imagePullPolicy: Always, forcing a
  # registry pull of proxyv2 on every start even though the image is already
  # present locally. Applies to injected sidecars via global; each gateway also
  # sets its own .imagePullPolicy below (the gateway chart reads the local key).
  imagePullPolicy: IfNotPresent

# Dependency configurations
# Only keeping values that change defaults or are required by the dependencies

# The istio CRDs ship from this chart's crds/, vendored from the pinned istio
# base chart by update-crds.sh and annotated Prune=false,Delete=false, so ArgoCD
# never deletes them (and with them every VirtualService, Gateway,
# AuthorizationPolicy, ... in the cluster) on a prune or a cascading delete of
# this Application. ArgoCD applies crds/ on every sync (server-side apply). The
# base chart renders its own copy from a template that cannot be annotated, and
# excludedCRDs is the only knob that turns it off, so it lists every vendored
# CRD. update-crds.sh generates the list and templates/crds-version-check.yaml
# fails the render when it and crds/ disagree, so no CRD is rendered twice and
# none is missing. The airgap bootstrap renders this chart with no overrides.
istio-base:
  base:
    # BEGIN excludedCRDs (generated by update-crds.sh from crds/; do not edit)
    excludedCRDs:
      - authorizationpolicies.security.istio.io
      - destinationrules.networking.istio.io
      - envoyfilters.networking.istio.io
      - gateways.networking.istio.io
      - peerauthentications.security.istio.io
      - proxyconfigs.networking.istio.io
      - requestauthentications.security.istio.io
      - serviceentries.networking.istio.io
      - sidecars.networking.istio.io
      - telemetries.telemetry.istio.io
      - virtualservices.networking.istio.io
      - wasmplugins.extensions.istio.io
      - workloadentries.networking.istio.io
      - workloadgroups.networking.istio.io
    # END excludedCRDs

istiod:
  global:
    proxy:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi
  # istiod fetches the JWKS of every RequestAuthentication (Backstage, httpbin)
  # from https://auth.<domain>, whose certificate the Teknoir Root CA signs.
  # istiod adds /cacerts/extra.pem to its JWKS trust, reading it once when the
  # resolver starts. The wildcard TLS Secret's ca.crt is that CA: the node
  # creates the Secret before this chart is first applied, and cert-manager
  # keeps ca.crt equal to the issuing CA, so no PEM lives in this repo.
  # Not optional: istiod waits for the Secret rather than starting without the
  # CA and rejecting every JWT until its next restart. If the CA ever changes,
  # restart istiod after cert-manager has re-issued the Secret.
  # The Secret name is <domain with dots as dashes>-wildcard-tls (see
  # templates/gateway.yaml and the cert-manager chart's Certificate).
  volumes:
    - name: teknoir-root-ca
      secret:
        secretName: teknoir-airgapped-wildcard-tls
        optional: false
        items:
          - key: ca.crt
            path: extra.pem
  volumeMounts:
    - name: teknoir-root-ca
      mountPath: /cacerts
      readOnly: true

istio-ingressgateway:
  name: istio-ingressgateway
  imagePullPolicy: IfNotPresent
  labels:
    istio: ingressgateway
  service:
    type: LoadBalancer
    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021
      - name: http2
        port: 80
        protocol: TCP
        targetPort: 80
      - name: https
        port: 443
        protocol: TCP
        targetPort: 443

istio-ingressgateway-public:
  name: istio-ingressgateway-public
  imagePullPolicy: IfNotPresent
  labels:
    istio: ingressgateway-public
  service:
    type: LoadBalancer
    ports:
      - name: status-port
        port: 16021
        protocol: TCP
        targetPort: 15021
      - name: tls-ssh
        port: 2222
        targetPort: 2222
        protocol: TCP
      - name: https-mqtt
        port: 8084
        targetPort: 8084
        protocol: TCP
      - name: tls-mqtt
        port: 8883
        targetPort: 8883
        protocol: TCP

istio-egressgateway:
  name: istio-egressgateway
  imagePullPolicy: IfNotPresent
  labels:
    istio: egressgateway
  service:
    type: ClusterIP

# jwks-watch: istiod resolves the Keycloak JWKS of every RequestAuthentication
# (jwksUri) while it builds the proxy configuration. A fetch that fails because
# Keycloak is still starting (every node boot) is dropped from istiod's cache
# after a few quick retries and is NOT tried again until the next full push of
# that configuration (a changed Service/Gateway/RequestAuthentication), which
# can be much later or never. Until then istiod serves a fail-closed JWKS and
# every JWT is rejected ("Jwt verification fails", 401 for every sign-in) while
# all pods are Ready. PILOT_JWT_PUB_KEY_REFRESH_INTERVAL does not help: the
# failed entry is deleted, the refresher has nothing left to retry.
# This small Deployment watches istiod's pilot_jwks_resolver_network_fetch_*
# counters. When a fetch failed and every jwksUri answers now, it deletes the
# istiod pod once (the Deployment recreates it; proxies keep their config
# meanwhile), so the new istiod resolves the JWKS with Keycloak up. At most one
# deletion per minAgeSeconds of istiod's age.
jwksWatch:
  enabled: true
  image: docker.io/alpine/k8s:1.34.11
  imagePullPolicy: IfNotPresent
  intervalSeconds: 20
  minAgeSeconds: 120
  # The CA that signs the jwksUri host (the same Secret istiod mounts above).
  caSecret: teknoir-airgapped-wildcard-tls
  resources:
    requests:
      cpu: 5m
      memory: 32Mi
    limits:
      memory: 128Mi
