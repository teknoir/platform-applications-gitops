# Values for istio.

global:
  domain: teknoir.cloud

# Dependency configurations
# Only keeping values that change defaults or are required by the dependencies

istio-base: {}

istiod:
  global:
    proxy:
      resources:
        requests:
          cpu: 10m
          memory: 50Mi

istio-ingressgateway:
  name: istio-ingressgateway
  labels:
    istio: ingressgateway
  service:
    type: LoadBalancer
    ports:
      - name: status-port
        port: 15021
        protocol: TCP
        targetPort: 15021
      - name: http2
        port: 80
        protocol: TCP
        targetPort: 80
      - name: https
        port: 443
        protocol: TCP
        targetPort: 443

istio-ingressgateway-public:
  name: istio-ingressgateway-public
  labels:
    istio: ingressgateway-public
  service:
    type: LoadBalancer
    ports:
      - name: status-port
        port: 16021
        protocol: TCP
        targetPort: 15021
      - name: tls-ssh
        port: 2222
        targetPort: 2222
        protocol: TCP
      - name: https-mqtt
        port: 8084
        targetPort: 8084
        protocol: TCP
      - name: tls-mqtt
        port: 8883
        targetPort: 8883
        protocol: TCP

istio-egressgateway:
  name: istio-egressgateway
  labels:
    istio: egressgateway
  service:
    type: ClusterIP

# Second public domain fronted by the r415 edge. The single public IP is
# port-forwarded to r415, so the hostname decision happens on this cluster's
# ingress gateway. TLS is terminated here with a wildcard secret mirrored
# out-of-band from the contoai cluster (r415 has no DNS-01 credentials for the
# contoai.site zone - the Loopia webhook lives on contoai):
#   infra/scripts/copy-contoai-cert-secret.sh
# Traffic is then re-encrypted to the contoai ingress, which is authoritative
# for *.contoai.site.
contoai:
  enabled: true
  domain: contoai.site
  # Explicit host list override (unset = [domain, *.domain]).
  hosts: []
  tls:
    # Secret in istio-system, copied out-of-band (NOT managed by this chart).
    # Unset = "<domain-with-dashes>-wildcard-tls".
    credentialName: contoai-site-wildcard-tls
  backend:
    # The contoai cluster is outside this mesh (same subnet, directly routable).
    host: contoai-backend.internal
    address: 192.168.2.204
    port: 443
    # SNI for the TLS origin hop to the backend. The wildcard certificate also
    # carries the apex (contoai.site), so the apex is a valid SNI.
    sni: contoai.site
    # Set true only if the backend certificate cannot be verified against the
    # gateway CA bundle. Prefer pinning a CA over disabling verification.
    insecureSkipVerify: false
