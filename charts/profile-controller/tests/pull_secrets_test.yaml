suite: profile-controller pull secrets and default-editor role
# plans/security-findings-2026-10-23.md F1 (PULL_SECRET_NAMES) and F2 step 1 (DEFAULT_EDITOR_CLUSTERROLE)
templates:
  - templates/configmap.yaml
tests:
  - it: staging copies no pull secrets (F1); default-editor keeps the controller default until F2
    asserts:
      - equal: {path: data.PULL_SECRET_NAMES, value: "none"}
      - notExists: {path: data.DEFAULT_EDITOR_CLUSTERROLE}

  - it: renders neither key when both are unset (production default, airgapped)
    set:
      config.pullSecrets: null
      config.defaultEditorClusterRole: null
    asserts:
      - notExists: {path: data.PULL_SECRET_NAMES}
      - notExists: {path: data.DEFAULT_EDITOR_CLUSTERROLE}

  - it: renders neither key when the values are empty strings (rollback)
    set:
      config.pullSecrets.names: ""
      config.defaultEditorClusterRole: ""
    asserts:
      - notExists: {path: data.PULL_SECRET_NAMES}
      - notExists: {path: data.DEFAULT_EDITOR_CLUSTERROLE}

  - it: renders no key when names is null
    set:
      config.pullSecrets.names: null
    asserts:
      - notExists: {path: data.PULL_SECRET_NAMES}

  - it: renders a comma list as given
    set:
      config.pullSecrets.names: "ghcr-token,gcr-json-key"
    asserts:
      - equal: {path: data.PULL_SECRET_NAMES, value: "ghcr-token,gcr-json-key"}

  - it: the two settings are independent
    set:
      config.pullSecrets.names: ""
      config.defaultEditorClusterRole: teknoir-workload
    asserts:
      - notExists: {path: data.PULL_SECRET_NAMES}
      - equal: {path: data.DEFAULT_EDITOR_CLUSTERROLE, value: teknoir-workload}

  - it: keeps the other settings
    asserts:
      - equal: {path: data.DOMAIN, value: teknoir.cloud}
      - exists: {path: data.PLUGIN_CHART_VERSION}
      - equal: {path: data.PORTAL_TEAMSPACE_CLUSTERROLE, value: backstage-api-teamspace}
