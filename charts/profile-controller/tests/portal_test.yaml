suite: profile-controller portal binding settings
templates:
  - templates/configmap.yaml
tests:
  - it: sets the portal service account and ClusterRole on staging
    asserts:
      - equal: {path: data.PORTAL_SERVICE_ACCOUNTS, value: "teknoir-system/backstage-api"}
      - equal: {path: data.PORTAL_TEAMSPACE_CLUSTERROLE, value: backstage-api-teamspace}

  - it: renders neither key when both are unset (production default, airgapped)
    set:
      config.portal: null
    asserts:
      - notExists: {path: data.PORTAL_SERVICE_ACCOUNTS}
      - notExists: {path: data.PORTAL_TEAMSPACE_CLUSTERROLE}

  - it: renders neither key when the portal values are empty strings
    set:
      config.portal.serviceAccounts: ""
      config.portal.clusterRole: ""
    asserts:
      - notExists: {path: data.PORTAL_SERVICE_ACCOUNTS}
      - notExists: {path: data.PORTAL_TEAMSPACE_CLUSTERROLE}

  - it: renders only the keys that are set
    set:
      config.portal.serviceAccounts: ""
    asserts:
      - notExists: {path: data.PORTAL_SERVICE_ACCOUNTS}
      - equal: {path: data.PORTAL_TEAMSPACE_CLUSTERROLE, value: backstage-api-teamspace}

  - it: keeps the other settings
    asserts:
      - equal: {path: data.DOMAIN, value: teknoir.cloud}
      - equal: {path: data.PLUGIN_CHART_VERSION, value: "0.0.108"}
