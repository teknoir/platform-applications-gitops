# GitOps values for profile-controller.

replicaCount: 1

image:
  repository: ghcr.io/teknoir/profile-controller
  # Pinned by tag@digest: profile-controller teknoir-cloud (59523f59), r5 release line.
  # profile-controller 2b54db9 (teknoir-cloud #211: Deadend plugin off by default, plans/ssh-tunnel-removal.md
  # step 8). Previous pin: sha-59523f59@sha256:6d67f83d05da3f043f4a1382798830773d72fe721addef5919fd4d1c393b0fcf
  tag: "sha-fd269839@sha256:f7b0f68bb0043ddf1ecb2e7e91adaa89302d790b401476ea16c326288a6a699e"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  # Annotations to add to the service account
  annotations: {}


config:
  admin: "anders.aslund@teknoir.ai"
  workloadIdentity: ""
  userIdHeader: "X-Auth-Request-Email"
  userIdPrefix: ""
  projectId: "teknoir"
  domain: "teknoir.cloud"
  domainPrefix: ""
  region: "us-central1"
  dnsZone: "teknoir-cloud"
  istioRevision: "1.29.0"
  # Plugin chart repository (env PLUGIN_CHART_REPO). Empty: the controller default, https://teknoir.github.io/profile-plugins-helm
  pluginChartRepo: ""
  # Chart version for every profile-plugin (env PLUGIN_CHART_VERSION). Empty: the compiled-in default (0.0.99).
  # 0.0.101: EMQX 5 listener names, so 8883 serves domain-wildcard-tls; deadend stunnel image.
  # 0.0.102: EMQX restarts on a config change. 0.0.103/0.0.104: jwks key writes only from device-controller (DENY policy).
  # 0.0.105: every first-party plugin image is pinned as tag@sha256 (IfNotPresent); release only after chart-releaser has published it.
  # 0.0.106: Observatory: standalone frontend off, wss-mqtt admits the Backstage backends, legacy wss path routed.
  # 0.0.107: jwks-server (jwx 1.2.29 / v2 2.0.21) and fleet-metrics (gorilla/websocket 1.5.3) on sha-* tags.
  # 0.0.108: the prometheus LowDiskSpace rule fires on <20 GB free or >90% used (not only the percentage).
  pluginChartVersion: "0.0.108"

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Teamspaces every install gets (templates/platform-profiles.yaml). teknoir-demo is the
# staging demo teamspace (devices, devstudios, notebooks; claude-agent's test teamspace).
platformProfiles:
  - name: teknoir-demo
    owner: anders.aslund@teknoir.ai
