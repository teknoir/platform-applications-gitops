# GitOps values for profile-controller.

replicaCount: 1

image:
  repository: ghcr.io/teknoir/profile-controller
  # Pinned by tag@digest: profile-controller teknoir-cloud (59523f59), r5 release line.
  # profile-controller 2b54db9 (teknoir-cloud #211: Deadend plugin off by default, plans/ssh-tunnel-removal.md
  # step 8). Previous pin: sha-59523f59@sha256:6d67f83d05da3f043f4a1382798830773d72fe721addef5919fd4d1c393b0fcf
  tag: "sha-f31a3fbd@sha256:ce635c2fe93dc57b38a8038241c3d72e961a41c74dc38941974459fafa7694f0"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  # Annotations to add to the service account
  annotations: {}


config:
  admin: "anders.aslund@teknoir.ai"
  workloadIdentity: ""
  userIdHeader: "X-Auth-Request-Email"
  userIdPrefix: ""
  projectId: "teknoir"
  domain: "teknoir.cloud"
  domainPrefix: ""
  region: "us-central1"
  dnsZone: "teknoir-cloud"
  istioRevision: "1.29.0"
  # Plugin chart repository (env PLUGIN_CHART_REPO). Empty: the controller default, https://teknoir.github.io/profile-plugins-helm
  pluginChartRepo: ""
  # Chart version for every profile-plugin (env PLUGIN_CHART_VERSION). Empty: the compiled-in default (0.0.99).
  # 0.0.101: EMQX 5 listener names, so 8883 serves domain-wildcard-tls; deadend stunnel image.
  # 0.0.102: EMQX restarts on a config change. 0.0.103/0.0.104: jwks key writes only from device-controller (DENY policy).
  # 0.0.105: every first-party plugin image is pinned as tag@sha256 (IfNotPresent); release only after chart-releaser has published it.
  # 0.0.106: Observatory: standalone frontend off, wss-mqtt admits the Backstage backends, legacy wss path routed.
  # 0.0.107: jwks-server (jwx 1.2.29 / v2 2.0.21) and fleet-metrics (gorilla/websocket 1.5.3) on sha-* tags.
  # 0.0.108: the prometheus LowDiskSpace rule fires on <20 GB free or >90% used (not only the percentage).
  # 0.0.109: EMQX dashboard without its own login behind an owner-only proxy; default dashboard passwords rotated.
  # 0.0.110: EMQX dashboard audit line per write (owner email), no-cache index, guard every 60 s, port 18083 for the proxy only.
  pluginChartVersion: "0.0.110"
  # Issuer and JWKS URI of the teamspace RequestAuthentication jwt-policy (env OIDC_ISSUER, OIDC_JWKS_URI).
  # Empty issuer: https://auth.<domain>/auth/realms/master, derived from `domain` above (same as the auth chart).
  # Empty jwksUri: the controller uses <issuer>/protocol/openid-connect/certs.
  oidc:
    issuer: ""
    jwksUri: ""
  # The portal (Backstage) service account and the ClusterRole it gets inside every teamspace, as a RoleBinding
  # "teknoir-portal" next to the owner's (env PORTAL_SERVICE_ACCOUNTS, PORTAL_TEAMSPACE_CLUSTERROLE; plans/ztna-later.md
  # "backstage-sa"). serviceAccounts is a comma list of <namespace>/<name>; the ClusterRole is in charts/backstage
  # (<name>-api-teamspace). Both empty: no binding. An image that does not know the keys ignores them.
  portal:
    serviceAccounts: "teknoir-system/backstage-api"
    clusterRole: backstage-api-teamspace
  # Secrets of teknoir-system that profile-controller copies into every teamspace (env PULL_SECRET_NAMES;
  # plans/security-findings-2026-10-23.md F1). Empty: the controller default, ghcr-token,gcr-json-key (production and
  # airgapped nodes have no registry mirror and need the copy). "none": copy nothing and delete the copies the Profile
  # owns. Staging: the nodes pull private ghcr.io/teknoir/* through the Harbor mirror (plans/harbor-proxy-staging.md), so the
  # personal ghcr PAT does not belong in teamspaces. A comma list copies exactly those names.
  # Needs profile-controller sha-f31a3fbd or later (an older image ignores the key and keeps copying). Rollback: set to "".
  pullSecrets:
    names: "none"

resources: {}
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Teamspaces every install gets (templates/platform-profiles.yaml). teknoir-demo is the
# staging demo teamspace (devices, devstudios, notebooks; claude-agent's test teamspace).
platformProfiles:
  - name: teknoir-demo
    owner: anders.aslund@teknoir.ai
