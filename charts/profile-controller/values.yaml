# GitOps values for profile-controller.

replicaCount: 1

image:
  repository: ghcr.io/teknoir/profile-controller
  # Production hotfix (2026-10-20): master f348d6d9 + TS-C1 only (plugin chart version from config),
  # branch hotfix/plugin-chart-version (profile-controller #212, not merged to master). Was latest@f348d6d9.
  tag: "sha-8d81bace@sha256:2b712a1e4d68294f55fbac8b2dd8cfa672304a97dd058ccb0f686a3407961c4c"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

serviceAccount:
  # Annotations to add to the service account
  annotations: {}


config:
  admin: "anders.aslund@teknoir.ai"
  workloadIdentity: ""
  userIdHeader: "X-Auth-Request-Email"
  userIdPrefix: ""
  projectId: "teknoir"
  domain: "teknoir.online"
  domainPrefix: ""
  region: "us-central1"
  dnsZone: "teknoir-online"
  istioRevision: "1.29.0"
  # Plugin chart version for every teamspace plugin (env PLUGIN_CHART_VERSION, read by the hotfix image).
  # 0.0.99-p3: the 0.0.99 charts with every image pinned to the digest production runs (2026-10-29)
  # (profile-plugins-helm branch beta). Empty: the compiled-in 0.0.99.
  pluginChartVersion: "0.0.99-p3"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
