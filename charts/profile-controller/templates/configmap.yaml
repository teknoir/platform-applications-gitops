apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "profile-controller.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "profile-controller.labels" . | nindent 4 }}
data:
  ADMIN: {{ .Values.config.admin | quote }}
  WORKLOAD_IDENTITY: {{ .Values.config.workloadIdentity | quote }}
  USERID_HEADER: {{ .Values.config.userIdHeader | quote }}
  USERID_PREFIX: {{ .Values.config.userIdPrefix | quote }}
  PROJECT_ID: {{ .Values.config.projectId | quote }}
  DOMAIN: {{ .Values.config.domain | quote }}
  DOMAIN_PREFIX: {{ .Values.config.domainPrefix | quote }}
  REGION: {{ .Values.config.region | quote }}
  DNS_ZONE: {{ .Values.config.dnsZone | quote }}
  ISTIO_REVISION: {{ .Values.config.istioRevision | quote }}
  {{- /* Read from the environment, not passed as args: an image that does
  not know them ignores them. Unset: the controller's compiled default. */}}
  {{- with .Values.config.pluginChartRepo }}
  {{- if hasPrefix "oci://" . }}
  {{- fail "config.pluginChartRepo: no oci:// prefix (same form as the app-of-apps repoURL)" }}
  {{- end }}
  PLUGIN_CHART_REPO: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.pluginChartVersion }}
  PLUGIN_CHART_VERSION: {{ . | toString | quote }}
  {{- end }}
  {{- /* Git mode for the profile plugins (CI v4 P9.1, plugins/charts/README.md): profile-controller renders each
  profile-plugin-<x> Application from <PLUGIN_GIT_PATH>/profile-plugin-<x> of PLUGIN_GIT_REPO_URL at the revision in
  the ConfigMap PLUGIN_REVISION_CONFIGMAP ("<namespace>/<name>", key "revision"), which it watches. That second
  ConfigMap carries the per-release revision and is deliberately not hashed by the Deployment. An empty repoURL is
  chart mode: nothing renders here, so the release render of every other install is unchanged. */}}
  {{- $pluginGit := (.Values.config).pluginGit | default dict }}
  {{- with $pluginGit.repoURL }}
  {{- $repoURL := . | toString }}
  {{- if hasPrefix "oci://" $repoURL }}
  {{- fail "config.pluginGit.repoURL: a git repository URL, not a chart repository (no oci:// prefix)" }}
  {{- end }}
  {{- if not (hasPrefix "https://" $repoURL) }}
  {{- fail "config.pluginGit.repoURL: must start with https://" }}
  {{- end }}
  {{- if hasSuffix ".git" $repoURL }}
  {{- fail "config.pluginGit.repoURL: no trailing .git (the controller compares it with the Application repoURL)" }}
  {{- end }}
  {{- if hasSuffix "/" $repoURL }}
  {{- fail "config.pluginGit.repoURL: no trailing / (the controller compares it with the Application repoURL)" }}
  {{- end }}
  {{- $path := $pluginGit.path | default "plugins/charts" | toString | trimSuffix "/" }}
  {{- if or (not $path) (hasPrefix "/" $path) (has ".." (splitList "/" $path)) (ne $path (trim $path)) }}
  {{- fail "config.pluginGit.path: a relative path inside the repository (not empty, no leading /, no .., no surrounding whitespace)" }}
  {{- end }}
  PLUGIN_GIT_REPO_URL: {{ $repoURL | quote }}
  PLUGIN_GIT_PATH: {{ $path | quote }}
  PLUGIN_REVISION_CONFIGMAP: {{ printf "%s/%s-plugin-revision" $.Release.Namespace (include "profile-controller.fullname" $) | quote }}
  {{- end }}
  {{- /* Issuer and JWKS URI of the RequestAuthentication jwt-policy that profile-controller creates in every
  teamspace. Derived from config.domain, like the auth chart (auth.<domain>). Unset keys would leave the
  controller default (the production Keycloak, https://auth.teknoir.online). */}}
  {{- $oidc := .Values.config.oidc | default dict }}
  {{- $issuer := $oidc.issuer | default (printf "https://auth.%s/auth/realms/master" .Values.config.domain) }}
  OIDC_ISSUER: {{ $issuer | quote }}
  {{- with $oidc.jwksUri }}
  OIDC_JWKS_URI: {{ . | quote }}
  {{- end }}
  {{- /* The portal (Backstage) service account gets a ClusterRole inside every teamspace through a
  RoleBinding "teknoir-portal". Both unset: no binding. Exactly one set: the controller refuses to start
  ("must be set together"), so fail here instead of in a CrashLoop. */}}
  {{- $portal := .Values.config.portal | default dict }}
  {{- if not (eq (empty $portal.serviceAccounts) (empty $portal.clusterRole)) }}
  {{- fail "config.portal: serviceAccounts and clusterRole must be set together (or both empty)" }}
  {{- end }}
  {{- with $portal.serviceAccounts }}
  PORTAL_SERVICE_ACCOUNTS: {{ . | quote }}
  {{- end }}
  {{- with $portal.clusterRole }}
  PORTAL_TEAMSPACE_CLUSTERROLE: {{ . | quote }}
  {{- end }}
  {{- /* Pull secrets copied from teknoir-system into every teamspace by the PullSecrets plugin. Unset: the
  controller default (ghcr-token,gcr-json-key). "none": copy nothing and delete the copies the Profile owns
  (plans/security-findings-2026-10-23.md F1). A comma list: exactly those. An image that does not know the key ignores it. */}}
  {{- $pullSecrets := .Values.config.pullSecrets | default dict }}
  {{- with $pullSecrets.names }}
  PULL_SECRET_NAMES: {{ . | toString | quote }}
  {{- end }}
  {{- /* ClusterRole bound to the ServiceAccount default-editor of every teamspace (its token is mounted into
  Devstudio, Notebook and plugin pods). Unset: the controller default, teknoir-edit. An image that does not know
  the key ignores it and keeps teknoir-edit. */}}
  {{- with .Values.config.defaultEditorClusterRole }}
  DEFAULT_EDITOR_CLUSTERROLE: {{ . | toString | quote }}
  {{- end }}
