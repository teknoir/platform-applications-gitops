apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "profile-controller.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "profile-controller.labels" . | nindent 4 }}
data:
  ADMIN: {{ .Values.config.admin | quote }}
  WORKLOAD_IDENTITY: {{ .Values.config.workloadIdentity | quote }}
  USERID_HEADER: {{ .Values.config.userIdHeader | quote }}
  USERID_PREFIX: {{ .Values.config.userIdPrefix | quote }}
  PROJECT_ID: {{ .Values.config.projectId | quote }}
  DOMAIN: {{ .Values.config.domain | quote }}
  DOMAIN_PREFIX: {{ .Values.config.domainPrefix | quote }}
  REGION: {{ .Values.config.region | quote }}
  DNS_ZONE: {{ .Values.config.dnsZone | quote }}
  ISTIO_REVISION: {{ .Values.config.istioRevision | quote }}
  {{- /* Read from the environment, not passed as args: an image that does
  not know them ignores them. Unset: the controller's compiled default. */}}
  {{- with .Values.config.pluginChartRepo }}
  {{- if hasPrefix "oci://" . }}
  {{- fail "config.pluginChartRepo: no oci:// prefix (same form as the app-of-apps repoURL)" }}
  {{- end }}
  PLUGIN_CHART_REPO: {{ . | quote }}
  {{- end }}
  {{- with .Values.config.pluginChartVersion }}
  PLUGIN_CHART_VERSION: {{ . | toString | quote }}
  {{- end }}
  {{- /* The portal (Backstage) service account gets a ClusterRole inside every teamspace through a
  RoleBinding "teknoir-portal". Both unset: no binding. Exactly one set: the controller refuses to start
  ("must be set together"), so fail here instead of in a CrashLoop. */}}
  {{- $portal := .Values.config.portal | default dict }}
  {{- if not (eq (empty $portal.serviceAccounts) (empty $portal.clusterRole)) }}
  {{- fail "config.portal: serviceAccounts and clusterRole must be set together (or both empty)" }}
  {{- end }}
  {{- with $portal.serviceAccounts }}
  PORTAL_SERVICE_ACCOUNTS: {{ . | quote }}
  {{- end }}
  {{- with $portal.clusterRole }}
  PORTAL_TEAMSPACE_CLUSTERROLE: {{ . | quote }}
  {{- end }}
