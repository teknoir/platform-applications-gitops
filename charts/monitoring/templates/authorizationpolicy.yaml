{{- $namespace := .Values.namespace | default .Release.Namespace -}}
{{- $groups := .Values.monitoring.access.groups -}}
{{- if not $groups }}
{{- fail "monitoring.access.groups must list at least one Keycloak group" }}
{{- end }}
{{- /*
Ingress: the gateway only, and only for a verified token
(requestauthentication.yaml) whose "groups" claim holds one of
monitoring.access.groups. A list claim matches when any element matches.
*/}}
{{- range list "grafana" "prometheus" "alertmanager" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ . }}-allow-ingress
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ . }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      when:
        - key: request.auth.claims[groups]
          values:
            {{- range $groups }}
            - {{ . | quote }}
            {{- end }}
{{- end }}

---
# In-namespace clients (Grafana's datasource, the operator, the sidecars).
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prometheus-allow-internal
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ $namespace | quote }}

---
# Alert delivery: Prometheus posts to /<namespace>/alertmanager/api/v2/alerts,
# addressed to the Service (values: prometheusSpec.alertingEndpoints), so over
# mTLS with its own identity. Alertmanager's other ALLOW admits the gateway
# only.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: alertmanager-allow-prometheus
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # kube-prometheus-stack's Prometheus ServiceAccount, <fullnameOverride>-prometheus.
              - {{ printf "cluster.local/ns/%s/sa/%s-prometheus" $namespace (index .Values "kube-prometheus-stack" "fullnameOverride") | quote }}
