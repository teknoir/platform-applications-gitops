{{- $namespace := .Values.namespace | default .Release.Namespace -}}
{{- /*
meshScrape.enabled: Prometheus reaches Grafana and Alertmanager with its own workload identity (mTLS scrape and
alert delivery, see values.yaml), so the two policies below name that service account next to the ingress gateway.
Without the flag they render as before.
*/ -}}
{{- $promPrincipal := "" -}}
{{- if (.Values.meshScrape).enabled -}}
{{- $promPrincipal = printf "cluster.local/ns/%s/sa/%s" $namespace (.Values.meshScrape.prometheusServiceAccount | default "monitoring-prometheus") -}}
{{- end -}}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: grafana-allow-ingress
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      # Apply to the actual components receiving ingress traffic now
      app.kubernetes.io/name: grafana
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
{{- if $promPrincipal }}
              - {{ $promPrincipal | quote }}
{{- end }}

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prometheus-allow-ingress
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: alertmanager-allow-ingress
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
{{- if $promPrincipal }}
              - {{ $promPrincipal | quote }}
{{- end }}

---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prometheus-allow-internal
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ $namespace | quote }}
