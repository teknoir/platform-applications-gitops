{{- $namespace := .Values.namespace | default .Release.Namespace -}}
{{- $groups := .Values.monitoring.access.groups -}}
{{- if not $groups }}
{{- fail "monitoring.access.groups must list at least one Keycloak group" }}
{{- end }}
{{- /*
Ingress: the gateway only, and only for a verified token
(requestauthentication.yaml) whose "groups" claim holds one of
monitoring.access.groups. A list claim matches when any element matches.

In the mesh these are not the only ALLOWs. The harbor chart's
harbor-allow-internal has no selector, so it applies to every workload in this
namespace, these three included, and admits any mTLS source in teknoir-system
and teknoir-auth without a token. Grafana's Alertmanager datasource works only
through it today. So "group admin only" holds for the gateway path: platform
pods in those two namespaces reach the Prometheus and Alertmanager APIs without
a token. tests/namespace-authz-test.sh checks the namespace as a whole: no
policy from any chart may admit the gateway without the groups claim. The
in-namespace ALLOWs below are this chart's own, for the paths it needs, so
they keep working when harbor-allow-internal gets a selector.
*/}}
{{- range list "grafana" "prometheus" "alertmanager" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ . }}-allow-ingress
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ . }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway"
      when:
        - key: request.auth.claims[groups]
          values:
            {{- range $groups }}
            - {{ . | quote }}
            {{- end }}
{{- end }}

---
# In-namespace clients: Grafana's Prometheus datasource, the operator.
# harbor-allow-internal admits them too today.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: prometheus-allow-internal
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces:
              - {{ $namespace | quote }}

---
# Alert delivery: Prometheus posts to /<namespace>/alertmanager/api/v2/alerts,
# addressed to the Service (values: prometheusSpec.alertingEndpoints), so over
# mTLS with its own identity. harbor-allow-internal (no selector) admits it
# today as well. This ALLOW keeps alert delivery working without it.
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: alertmanager-allow-prometheus
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              # kube-prometheus-stack's Prometheus ServiceAccount, <fullnameOverride>-prometheus.
              - {{ printf "cluster.local/ns/%s/sa/%s-prometheus" $namespace (index .Values "kube-prometheus-stack" "fullnameOverride") | quote }}
{{- /*
Lifecycle endpoints: no source in the mesh may call them. The operator runs
Prometheus with --web.enable-lifecycle, so POST /<prefix>/-/quit stops it and
/-/reload reloads it; Alertmanager serves /-/reload. These accept a simple
cross-site POST, and the oauth2-proxy cookie is SameSite=None, so a page an
admin visits could shut Prometheus down through the gateway, with the admin's
token injected. The in-namespace ALLOWs (and harbor-allow-internal) would let
any platform pod do the same without a token. The config-reloader sidecars
call 127.0.0.1, which does not pass the inbound sidecar, so they are not
affected. DENY is evaluated before every ALLOW, whichever chart renders it.
Paths are matched without the query string and after Istio's path
normalization. The mesh uses the default, BASE: it resolves dot segments and
decodes percent-encoded unreserved characters (%2D, %71), but it keeps an
encoded slash (%2F, %2f) as it is. Prometheus and Alertmanager (Go) decode
%2F before they route, so POST <prefix>/-%2Fquit and <prefix>%2F-/quit would
pass a match on the suffix "/-/quit" and still stop Prometheus. Each path therefore ends in
"-", then a slash in one of its three spellings, then the endpoint; the "-"
is matched without the slash before it, which covers that slash's spellings
too. tests/lifecycle-deny-docker-test.sh proves this against Envoy with the
mesh's normalization and the chart's Prometheus and Alertmanager.
*/}}
{{- range list "prometheus" "alertmanager" }}
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ . }}-deny-lifecycle
  namespace: {{ $namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ . }}
  action: DENY
  rules:
    - to:
        - operation:
            paths:
{{- range list "quit" "reload" }}
              - "*-/{{ . }}"
              - "*-%2F{{ . }}"
              - "*-%2f{{ . }}"
{{- end }}
{{- end }}
