# GitOps values for notebook-controller.

# Labels to add to all resources
commonLabels:
  app: notebook-controller

image:
  repository: ghcr.io/teknoir/notebook-controller
  # Pinned (G-09): '<immutable tag>@sha256:<linux/amd64 manifest digest>',
  # the image that ran as :teknoir-cloud-20260522-055950.
  tag: "sha-c751073b@sha256:91ff952fd23a2bae74f99015f418ee089d4e9cf50454eaba7bbde0adb8e857f7"
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  name: notebook-controller-service-account

addFsGroup: "true"

parameters:
  USE_ISTIO: "true"
  ISTIO_GATEWAY: istio-system/teknoir-gateway
  POD_LABELS: gcp-cred-secret=user-gcp-sa,gcp-cred-secret-filename=user-gcp-sa.json
  project-id: teknoir
  domain: teknoir.airgapped
