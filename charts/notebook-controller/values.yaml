# GitOps values for notebook-controller.

# Labels to add to all resources
commonLabels:
  app: notebook-controller

image:
  repository: harbor.teknoir.cloud/teknoir/notebook-controller
  # pinned in pins/notebook-controller.yaml (Kargo stage pin-notebook-controller)
  tag: ""
  pullPolicy: Always

# The image is pulled from Harbor with the node credential (CI v4 P6.2), so no pull secret.
imagePullSecrets: []

serviceAccount:
  name: notebook-controller-service-account

addFsGroup: "true"

parameters:
  USE_ISTIO: "true"
  ISTIO_GATEWAY: istio-system/teknoir-gateway
  POD_LABELS: gcp-cred-secret=user-gcp-sa,gcp-cred-secret-filename=user-gcp-sa.json
  project-id: teknoir
  domain: teknoir.cloud
