# GitOps values for notebook-controller.

# Labels to add to all resources
commonLabels:
  app: notebook-controller

image:
  repository: ghcr.io/teknoir/notebook-controller
  # Pinned 2026-10-19: '<tag>@sha256:<digest>' = the image production ran (adopted, no change).
  tag: "teknoir-cloud-20260522-055950@sha256:7a717c3bd14bfa8a1f4899d4902351148fa83ee5a07d75c9488c2d6508ae35ac"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

serviceAccount:
  name: notebook-controller-service-account

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 50m
    memory: 128Mi

addFsGroup: "true"

parameters:
  USE_ISTIO: "true"
  ISTIO_GATEWAY: istio-system/teknoir-gateway
  POD_LABELS: gcp-cred-secret=user-gcp-sa,gcp-cred-secret-filename=user-gcp-sa.json
  project-id: teknoir
  domain: teknoir.online
