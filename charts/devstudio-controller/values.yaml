# GitOps values for devstudio-controller.

replicaCount: 1

image:
  repository: ghcr.io/teknoir/devstudio-controller
  # Pinned (G-09): '<immutable tag>@sha256:<linux/amd64 manifest digest>',
  # the image that ran as :teknoir-cloud (same as teknoir-cloud-20260430-135659).
  tag: "sha-4ec934c4@sha256:8cd41bc5e630238ab2b611a411261b2ee029c9a3c7cb5ad970f73648c509a28d"
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations:
  kubectl.kubernetes.io/default-container: manager
  prometheus.io/scrape: "true"

podLabels:
  sidecar.istio.io/inject: "false"

podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

config:
  useIstio: "true"
  istioGateway: "istio-system/teknoir-gateway"
  podLabels: "gcp-cred-secret=user-gcp-sa,gcp-cred-secret-filename=user-gcp-sa.json"
  projectId: "teknoir"
  domain: "teknoir.airgapped"
  addFsgroup: "false"
