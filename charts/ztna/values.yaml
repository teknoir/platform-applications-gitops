# Values for the ztna chart on teknoir-cloud (staging, r415). The chart is only deployed
# when charts/app-of-apps sets ztna.enabled (Application ztna, namespace teknoir-ztna).
# Contract: github.com/teknoir/wg-tunnel pkg/api/api.go (names, ports, labels); plan:
# plans/wireguard-ztna-tunnel.md.

# Platform domain: wg.<domain>, wg-device.<domain>, turn.<domain>, auth.<domain>.
domain: teknoir.cloud

hub:
  image:
    repository: ghcr.io/teknoir/wg-hub
    # REQUIRED, no default: '<immutable tag>@sha256:<manifest digest>' of the wg-hub image
    # (CI pushes sha-<commit>). Set it before flipping ztna.enabled in charts/app-of-apps;
    # an empty tag fails the render of this chart (nothing half-configured is applied).
    # wg-tunnel 41a0c20 (main: rev 3 zero-touch activation, revoke notice, k3s Service
    # discovery, agent race fixes #4): hub + flags watcher, index digest.
    # MUST be re-pinned (scripts/pin-image wg-hub=sha-<commit>) to the wg-tunnel ztna-audience merge commit or later
    # before this is released: sha-9c9bdae predates the audience check and ignores KEYCLOAK_AUDIENCE*. Release lint
    # (scripts/check-pins.py) fails audienceMode transition and enforce on any tag not listed in release-policy.yaml
    # audience_hub_tags (an allowlist: list the new tag there when you re-pin).
    # Previous pin: sha-37fe475@sha256:4a405ccced8b389e254d3f9965b0c2ea35ca1b0a77bb6c42c17b076b7b27f58b
    # hub-ha: this pin MUST be replaced by an image built from wg-tunnel with leader election (branch
    # hub-ha, hub.leaderElection) before this stage is released. An older image ignores LEADER_ELECTION and never
    # sets ztna.teknoir.org/hub-role, so the Service wg-hub (selector hub-role=leader) would have no endpoints
    # (full ZTNA outage). The chart enforces it: the render fails until leaderElection below is true.
    # wg-tunnel #8 (b563d89): leader election and planned handover; live as leader since staging-20261022.6.
    tag: "sha-a2478da@sha256:2239908245b1e17301a6484a1f6fcce0ea5a5a2d973e108dd552c8c756cc3019"
    # Set to true TOGETHER WITH the repin above, and only when the image is built from wg-tunnel with leader
    # election (it sets ztna.teknoir.org/hub-role). The render fails while hub.leaderElection.enabled is on and
    # this is false, so an image that never labels a pod cannot leave wg-hub without endpoints.
    # scripts/pin-image wg-hub=<tag> --write resets this to false on every tag change; pass --leader-election
    # for an image with leader election. Roll back by switching hub.leaderElection.enabled (and replicas) off first.
    leaderElection: true
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-token
  # Hub replicas (active-passive, see leaderElection): one serves, the others are hot standbys. Above 1 the
  # Deployment rolls (maxSurge 1, maxUnavailable 0), a PodDisruptionBudget is rendered, and
  # leaderElection.enabled is required (the render fails without it). 1: Recreate, no PDB.
  replicas: 2
  pdb:
    # One replica may be disrupted at a time (a drain needs the other one Ready). A single-node
    # cluster can still not drain its last hub pod; that is the same as the 7 existing PDBs there.
    maxUnavailable: 1
  # Active-passive replicas (plans/ztna-later.md, hub-ha): the replicas campaign for the Lease
  # `lease` in this namespace, the leader serves, the others answer 503. Needs a wg-hub image
  # with leader election (an older image ignores these variables and always serves).
  leaderElection:
    enabled: true
    lease: wg-hub
    # A leader survives an API server outage up to renewDeadline; a crashed leader's lease is
    # taken over after leaseDuration, a released one within retryPeriod. The long timings are for
    # the single-node vpro (k3s restarts of a minute or two are routine): a longer API outage drops
    # every session, today's hub rides it out on cached informers. A pod or node loss then takes up
    # to leaseDuration before the standby serves, about the 80-140 s the agents need anyway
    # (deadLimit). Faster failover (60s/45s) needs Anders' acceptance (plans/ztna-later.md, hub-ha).
    leaseDuration: 120s
    renewDeadline: 110s
    retryPeriod: 2s
    # A stepping-down leader waits this long for the other replica to take the lease (not with
    # one replica), then handoverSettle for EndpointSlice, mesh and DNS to follow, then tells the devices.
    handoverWait: 10s
    handoverSettle: 2s
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Keycloak tokens are accepted only for this client (azp). Browser tokens (azp teknoir)
  # are forwarded to every upstream behind oauth2-proxy and must never be accepted.
  allowedAZP: teknoir-cli
  # Live status port 8082 (Backstage backend only). backstageSA is the exact username the hub
  # checks on the TokenReview; statusPrincipal is the Istio mTLS principal the AuthorizationPolicy
  # admits (the pods app=backstage-api carry an istio-proxy sidecar and run as this SA).
  backstageSA: system:serviceaccount:teknoir-system:backstage-api
  statusPrincipal: cluster.local/ns/teknoir-system/sa/backstage-api
  keycloak:
    realm: master
    # Keycloak tokens must carry this audience on top of azp (client scope teknoir-ztna, optional
    # on teknoir-cli; charts/auth realm). audienceMode: transition accepts a token without it and
    # counts it (wghub_user_tokens_total{audience="legacy"}); enforce (the hub's own default)
    # refuses it. Anything else fails the render. plans/ztna-later.md, "ztna-audience".
    audience: teknoir-ztna
    audienceMode: "transition"
  # The org gate in the hub (CanOpen): enforce (default, fails closed), audit (log would-be denials,
  # allow) or off. Any other value fails the render.
  orgGate:
    # Staging: audit in staging-20261017.14 (only would_deny: claude-agent on virtual-2cpu-4gb), enforce since.
    mode: "enforce"

# The flags watcher (Deployment wg-flags, same image as the hub, command `flags-watcher`): the only
# component with access to Device objects.
flags:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The TURN gateway the hub mints credentials for (charts/stunner).
turn:
  port: 3478
  # Namespace and Secret of the TURN shared secret. NOT in Git: infra/scripts/gen-stunner-auth-secret.sh.
  secretNamespace: stunner-system
  secretName: stunner-auth-secret

# Who writes the access policy (admission policy, RBAC). device-controller's service account
# is charts/device-controller serviceAccount.name in the namespace of that Application.
deviceController:
  namespace: teknoir-system
  serviceAccount: device-controller-service-account

# Backstage backend service account (charts/backstage serviceaccount.yaml): the only other
# identity besides device-controller that may change ztna.teknoir.org/* annotations on Devices
# (admission policy ztna-device-annotations).
backstage:
  serviceAccount: system:serviceaccount:teknoir-system:backstage-api

# Who may add, change or remove the org-tree annotations on Users (teknoir.org/org-tree-member-* and
# org-tree-units-*), the inputs of the hub org gate (admission policy ztna-user-org-annotations),
# besides system:masters. Backstage backend (Settings > Members), ArgoCD (platformUsers/orgUnits in
# charts/user-controller) and user-controller. backstage.serviceAccount is always added by the policy.
userOrgAnnotations:
  writers:
    - system:serviceaccount:teknoir-system:argocd-application-controller
    - system:serviceaccount:teknoir-system:user-controller

# Identities (besides device-controller, the ArgoCD application controller and anything in
# kube-system, i.e. the replicaset/job controllers) that may create or update pods and workloads
# in teknoir-ztna and stunner-system (admission policy ztna-workloads). The stunner operator
# creates the TURN dataplane Deployment. The Backstage service account is deliberately NOT on it.
admission:
  workloadCreators:
    - system:serviceaccount:teknoir-system:argocd-application-controller
    - system:serviceaccount:stunner-system:stunner-gateway-operator-controller-manager

# Istio principals that may call the hub HTTP port from outside the namespace. Both ingress
# gateways: users (wg.<domain>, 443) and devices (wg-device.<domain>, 8084). They reach port 8080
# only. The internal port 8081 (service account delegation by the web terminals, direct sessions)
# is admitted for workloads in teknoir-ztna only and is not routed by any VirtualService.
ingressPrincipals:
  - cluster.local/ns/istio-system/sa/istio-ingressgateway
  - cluster.local/ns/istio-system/sa/istio-ingressgateway-public

# Prometheus (kube-prometheus-stack in teknoir-system) scrapes :9090. Its Service Account is the
# only caller admitted on that port. A ServiceMonitor with the label release=monitoring is
# selected by monitoring-prometheus (serviceMonitorSelector).
metrics:
  principal: cluster.local/ns/teknoir-system/sa/monitoring-prometheus
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring
    # Prometheus presents the Istio workload certificate of its own sidecar (mTLS scrape): the pod has the
    # sidecar's OUTPUT_CERTS volume mounted at /etc/prom-certs and its outbound capture off (charts/monitoring
    # values.yaml, meshScrape; plans/monitoring-mesh-scrape.md). A plaintext scrape to the pod IP has no peer
    # identity and the wg-hub AuthorizationPolicy answers it with 403. Set scheme "" and tlsConfig null (a
    # values override) for a Prometheus without that setup. A mesh TLS scrape works only for STRICT target
    # ports (Prometheus does not offer Istio's ALPN, which a PERMISSIVE port's TLS chain requires), so with
    # tlsConfig set the chart also renders a PeerAuthentication that makes port 9090 (only) STRICT.
    # insecureSkipVerify: the certificate has a SPIFFE ID, not the pod IP.
    scheme: https
    tlsConfig:
      caFile: /etc/prom-certs/root-cert.pem
      certFile: /etc/prom-certs/cert-chain.pem
      keyFile: /etc/prom-certs/key.pem
      insecureSkipVerify: true
  # Alerts on the hub-ha series (wghub_leader, wghub_role_patch_errors_total). Rendered with the ServiceMonitor,
  # whose Service wg-hub-metrics scrapes every hub pod (the standby too), not only the leader.
  prometheusRule:
    enabled: true
    # No (or two) serving replicas for this long. Keep it above hub.leaderElection.leaseDuration (120s): a
    # crashed leader is replaced only after its lease expires, which is a normal failover, not an incident.
    leaderFor: 5m

# The hub pulls ghcr.io/teknoir/wg-hub with the ghcr-token pull secret. That Secret exists in
# teknoir-system (infra scripts/create-ghcr-token-secret.sh) and in each teamspace, not in a new
# namespace, and no controller copies it here. A Sync hook Job copies it once per sync.
# Switch it off when the image is public.
pullSecretCopy:
  enabled: true
  sourceNamespace: teknoir-system
  secretName: ghcr-token
  # The copy is repeated by a CronJob so a rotated source token reaches the namespace without a sync.
  refreshSchedule: "17 * * * *"
  # Same toolbox image as charts/platform-secrets (sh, kubectl, jq), pinned to the digest.
  image: docker.io/alpine/k8s:1.34.11@sha256:9ec4a7d9720f07c2f4ff20025bc9798918a4b2a050fb62226dd4f3e904e59121
