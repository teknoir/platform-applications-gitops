# Values for the ztna chart on teknoir-cloud (staging, r415). The chart is only deployed
# when charts/app-of-apps sets ztna.enabled (Application ztna, namespace teknoir-ztna).
# Contract: github.com/teknoir/wg-tunnel pkg/api/api.go (names, ports, labels); plan:
# plans/wireguard-ztna-tunnel.md.

# Platform domain: wg.<domain>, wg-device.<domain>, turn.<domain>, auth.<domain>.
domain: teknoir.cloud

hub:
  image:
    repository: ghcr.io/teknoir/wg-hub
    # REQUIRED, no default: '<immutable tag>@sha256:<manifest digest>' of the wg-hub image
    # (CI pushes sha-<commit>). Set it before flipping ztna.enabled in charts/app-of-apps;
    # an empty tag fails the render of this chart (nothing half-configured is applied).
    # wg-tunnel 41a0c20 (main: rev 3 zero-touch activation, revoke notice, k3s Service
    # discovery, agent race fixes #4): hub + flags watcher, index digest.
    # Previous pin: sha-37fe475@sha256:4a405ccced8b389e254d3f9965b0c2ea35ca1b0a77bb6c42c17b076b7b27f58b
    tag: "sha-9c9bdae@sha256:f9bf658fc8c993054ce2a4cda35aa79d3b7a894ac78ee887136dcdcfdca08c63"
    pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-token
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  # Keycloak tokens are accepted only for this client (azp). Browser tokens (azp teknoir)
  # are forwarded to every upstream behind oauth2-proxy and must never be accepted.
  allowedAZP: teknoir-cli
  # Live status port 8082 (Backstage backend only). backstageSA is the exact username the hub
  # checks on the TokenReview; statusPrincipal is the Istio mTLS principal the AuthorizationPolicy
  # admits (the pods app=backstage-api carry an istio-proxy sidecar and run as this SA).
  backstageSA: system:serviceaccount:teknoir-system:backstage-api
  statusPrincipal: cluster.local/ns/teknoir-system/sa/backstage-api
  keycloak:
    realm: master
  # The org gate in the hub (CanOpen): enforce (default, fails closed), audit (log would-be denials,
  # allow) or off. Any other value fails the render.
  orgGate:
    # Staging: audit in staging-20261017.14 (only would_deny: claude-agent on virtual-2cpu-4gb), enforce since.
    mode: "enforce"

# The flags watcher (Deployment wg-flags, same image as the hub, command `flags-watcher`): the only
# component with access to Device objects.
flags:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# The TURN gateway the hub mints credentials for (charts/stunner).
turn:
  port: 3478
  # Namespace and Secret of the TURN shared secret. NOT in Git: infra/scripts/gen-stunner-auth-secret.sh.
  secretNamespace: stunner-system
  secretName: stunner-auth-secret

# Who writes the access policy (admission policy, RBAC). device-controller's service account
# is charts/device-controller serviceAccount.name in the namespace of that Application.
deviceController:
  namespace: teknoir-system
  serviceAccount: device-controller-service-account

# Backstage backend service account (charts/backstage serviceaccount.yaml): the only other
# identity besides device-controller that may change ztna.teknoir.org/* annotations on Devices
# (admission policy ztna-device-annotations).
backstage:
  serviceAccount: system:serviceaccount:teknoir-system:backstage-api

# Who may add, change or remove the org-tree annotations on Users (teknoir.org/org-tree-member-* and
# org-tree-units-*), the inputs of the hub org gate (admission policy ztna-user-org-annotations),
# besides system:masters. Backstage backend (Settings > Members), ArgoCD (platformUsers/orgUnits in
# charts/user-controller) and user-controller. backstage.serviceAccount is always added by the policy.
userOrgAnnotations:
  writers:
    - system:serviceaccount:teknoir-system:argocd-application-controller
    - system:serviceaccount:teknoir-system:user-controller

# Identities (besides device-controller, the ArgoCD application controller and anything in
# kube-system, i.e. the replicaset/job controllers) that may create or update pods and workloads
# in teknoir-ztna and stunner-system (admission policy ztna-workloads). The stunner operator
# creates the TURN dataplane Deployment. The Backstage service account is deliberately NOT on it.
admission:
  workloadCreators:
    - system:serviceaccount:teknoir-system:argocd-application-controller
    - system:serviceaccount:stunner-system:stunner-gateway-operator-controller-manager

# Istio principals that may call the hub HTTP port from outside the namespace. Both ingress
# gateways: users (wg.<domain>, 443) and devices (wg-device.<domain>, 8084). They reach port 8080
# only. The internal port 8081 (service account delegation by the web terminals, direct sessions)
# is admitted for workloads in teknoir-ztna only and is not routed by any VirtualService.
ingressPrincipals:
  - cluster.local/ns/istio-system/sa/istio-ingressgateway
  - cluster.local/ns/istio-system/sa/istio-ingressgateway-public

# Prometheus (kube-prometheus-stack in teknoir-system) scrapes :9090. Its Service Account is the
# only caller admitted on that port. A ServiceMonitor with the label release=monitoring is
# selected by monitoring-prometheus (serviceMonitorSelector).
metrics:
  principal: cluster.local/ns/teknoir-system/sa/monitoring-prometheus
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring

# The hub pulls ghcr.io/teknoir/wg-hub with the ghcr-token pull secret. That Secret exists in
# teknoir-system (infra scripts/create-ghcr-token-secret.sh) and in each teamspace, not in a new
# namespace, and no controller copies it here. A Sync hook Job copies it once per sync.
# Switch it off when the image is public.
pullSecretCopy:
  enabled: true
  sourceNamespace: teknoir-system
  secretName: ghcr-token
  # The copy is repeated by a CronJob so a rotated source token reaches the namespace without a sync.
  refreshSchedule: "17 * * * *"
  # Same toolbox image as charts/platform-secrets (sh, kubectl, jq), pinned to the digest.
  image: docker.io/alpine/k8s:1.34.11@sha256:9ec4a7d9720f07c2f4ff20025bc9798918a4b2a050fb62226dd4f3e904e59121
