{{- $domain := required "domain is required" .Values.domain }}
{{- $turn := .Values.turn }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
automountServiceAccountToken: true
---
# One replica: sessions, IP allocation and the WireGuard socket are in memory. Recreate (not a
# rolling update) so two hubs never run at once: STUNner routes to every endpoint of the headless
# Service, and a second hub would receive handshakes for sessions it does not know.
# hub-ha stage 1 (plans/ztna-later.md): every pod already runs the leader election (LEADER_ELECTION,
# Lease wg-hub) and labels itself ztna.teknoir.org/hub-role leader|standby, but nothing selects on
# that label yet and the replica count stays 1. Stage 2 raises it to hub.replicas, switches the
# strategy to RollingUpdate and points Service wg-hub at the leader label.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "ztna.hubSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ztna.hubLabels" . | nindent 8 }}
        # The pods of the pull secret Job and CronJob carry ztna.hubLabels too (component
        # pull-secret); the component label tells a hub pod from them. The hub moves its own
        # hub-role between standby and leader.
        app.kubernetes.io/component: hub
        ztna.teknoir.org/hub-role: standby
    spec:
      serviceAccountName: wg-hub
      {{- with .Values.hub.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wg-hub
          image: {{ include "ztna.hubImage" . | quote }}
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          env:
            - name: DOMAIN
              value: {{ $domain | quote }}
            - name: HUB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The TURN peer address the STUNner dataplane relays to (headless Service: pod IP).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TURN_URLS
              value: {{ printf "turn:turn.%s:%d?transport=udp" $domain (int $turn.port) | quote }}
            - name: TURN_SECRET_REF
              value: {{ printf "%s/%s" $turn.secretNamespace $turn.secretName | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ printf "https://auth.%s/auth/realms/%s" $domain .Values.hub.keycloak.realm | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ printf "https://auth.%s/auth/realms/%s/protocol/openid-connect/certs" $domain .Values.hub.keycloak.realm | quote }}
            # CLIENT_IP_HEADER is deliberately NOT set. On k3s servicelb (klipper) with
            # externalTrafficPolicy Cluster the ingress gateway sees the svclb/node address
            # for every client (SNAT), so X-Envoy-External-Address is a private address that is
            # the same for everybody. The hub ignores such values anyway (loopback, RFC1918,
            # CGNAT, link-local), and without the setting only the global backstop and the
            # per-subject caps limit requests. Re-enable it (value X-Envoy-External-Address)
            # only after verifying on r415 that the hub logs the real, distinct client
            # addresses (README, "Client IP and rate limits").
            # Org gate (wg-tunnel CanOpen): enforce | audit | off. Fails the render for anything else.
            - name: ORG_GATE_MODE
              value: {{ include "ztna.orgGateMode" . | quote }}
            - name: ALLOWED_AZP
              value: {{ .Values.hub.allowedAZP | quote }}
            # Live status listener (Backstage only; AuthorizationPolicy + exact TokenReview username).
            - name: STATUS_ADDR
              value: ":8082"
            - name: BACKSTAGE_SA
              value: {{ .Values.hub.backstageSA | quote }}
            # Audience of the projected token Backstage sends to the status port (TokenReview).
            - name: STATUS_AUDIENCE
              value: "teknoir-ztna-status"
            # Leader election on the Lease in this namespace; POD_NAME is the identity and the pod
            # whose role label the hub sets. HANDOVER_WAIT is 0s with one replica (nobody takes
            # over, so a stepping-down hub does not wait for one).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.hub.leaderElection }}
            {{- if .enabled }}
            - name: LEADER_ELECTION
              value: {{ .lease | quote }}
            - name: LEASE_DURATION
              value: {{ .leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .retryPeriod | quote }}
            - name: HANDOVER_WAIT
              value: {{ ternary "0s" .handoverWait (eq (int $.Values.hub.replicas) 1) | quote }}
            - name: HANDOVER_SETTLE
              value: {{ .handoverSettle | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Internal API (service account delegation, direct sessions). No VirtualService routes
            # it; the AuthorizationPolicy admits workloads in this namespace only.
            - name: http-internal
              containerPort: 8081
              protocol: TCP
            # Live status for the Backstage backend only (AuthorizationPolicy: its principal).
            - name: http-status
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: wg
              containerPort: 51820
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# Headless: the endpoints are the pod IPs. STUNner's UDPRoute backend and the hub's own
# endpoint (POD_IP:51820) avoid ClusterIP NAT and conntrack on the TURN leg. UDP is not
# captured by the Istio sidecar; the TCP ports are.
apiVersion: v1
kind: Service
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ztna.hubSelector" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: http-internal
      port: 8081
      targetPort: http-internal
      protocol: TCP
    - name: http-status
      port: 8082
      targetPort: http-status
      protocol: TCP
    - name: http-metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: wg
      port: 51820
      targetPort: wg
      protocol: UDP
---
# The hub pods as TURN peers, ready or not (UDP 51820 only): STUNner's UDPRoute permits every pod
# here before a failover, so a new leader needs no operator re-render, and a terminating leader
# stays reachable for the handover notices it sends to the agents through TURN. A standby has no
# peers, so permitting it is harmless; clients send WireGuard only to the endpoint of the session.
# The selector includes the component label: the pods of the pull secret Job and CronJob carry
# the name label too (component pull-secret) and must not become peers.
apiVersion: v1
kind: Service
metadata:
  name: wg-hub-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ztna.hubPodSelector" . | nindent 4 }}
  ports:
    - name: wg
      port: 51820
      targetPort: wg
      protocol: UDP
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      {{- include "ztna.hubSelector" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
