{{- $domain := required "domain is required" .Values.domain }}
{{- $turn := .Values.turn }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Replicas (hub.replicas): sessions, IP allocation and the WireGuard socket are in memory, so only
# one replica serves. The replicas run a leader election (Lease wg-hub, wg-tunnel pkg/hub/leader.go):
# the leader serves, the others are ready hot standbys that answer 503, and each pod labels itself
# ztna.teknoir.org/hub-role leader|standby. Service wg-hub selects the leader; the UDPRoute of STUNner
# permits every hub pod through wg-hub-pods. A rolling update (maxSurge 1, maxUnavailable 0) starts the
# new pod first and deletes the standby first (pod-deletion-cost), so a rollout hands over once. With
# a single replica (hub.replicas: 1) it is Recreate: two hubs must never serve at once, and a second
# one would receive handshakes for sessions it does not know.
{{- $replicas := int .Values.hub.replicas }}
{{- if and (gt $replicas 1) (not .Values.hub.leaderElection.enabled) }}
{{- fail "hub.replicas > 1 needs hub.leaderElection.enabled: without an election every replica would serve" }}
{{- end }}
{{- /* Service wg-hub selects hub-role=leader, which only an image with leader election sets: an older image
       would leave wg-hub without endpoints (a full ZTNA outage). The pin carries the confirmation. */ -}}
{{- if and .Values.hub.leaderElection.enabled (not .Values.hub.image.leaderElection) }}
{{- fail "hub.leaderElection.enabled selects the Service wg-hub by the hub-role=leader label, which only a wg-hub image with leader election sets: repin hub.image.tag to an image built from wg-tunnel with leader election (scripts/pin-image) and set hub.image.leaderElection: true, or switch hub.leaderElection.enabled off" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  replicas: {{ $replicas }}
  strategy:
    {{- if gt $replicas 1 }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "ztna.hubSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ztna.hubLabels" . | nindent 8 }}
        # The pods of the pull secret Job and CronJob carry ztna.hubLabels too (component
        # pull-secret); the component label tells a hub pod from them. The hub moves its own
        # hub-role between standby and leader.
        app.kubernetes.io/component: hub
        ztna.teknoir.org/hub-role: standby
    spec:
      serviceAccountName: wg-hub
      # Spread the replicas over nodes when there are several (no effect on a single node).
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ztna.hubPodSelector" . | nindent 20 }}
      {{- with .Values.hub.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: wg-hub
          image: {{ include "ztna.hubImage" . | quote }}
          imagePullPolicy: {{ .Values.hub.image.pullPolicy }}
          env:
            - name: DOMAIN
              value: {{ $domain | quote }}
            - name: HUB_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # The TURN peer address the STUNner dataplane relays to (headless Service: pod IP).
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TURN_URLS
              value: {{ printf "turn:turn.%s:%d?transport=udp" $domain (int $turn.port) | quote }}
            - name: TURN_SECRET_REF
              value: {{ printf "%s/%s" $turn.secretNamespace $turn.secretName | quote }}
            - name: KEYCLOAK_ISSUER
              value: {{ printf "https://auth.%s/auth/realms/%s" $domain .Values.hub.keycloak.realm | quote }}
            - name: KEYCLOAK_JWKS_URL
              value: {{ printf "https://auth.%s/auth/realms/%s/protocol/openid-connect/certs" $domain .Values.hub.keycloak.realm | quote }}
            # CLIENT_IP_HEADER is deliberately NOT set. On k3s servicelb (klipper) with
            # externalTrafficPolicy Cluster the ingress gateway sees the svclb/node address
            # for every client (SNAT), so X-Envoy-External-Address is a private address that is
            # the same for everybody. The hub ignores such values anyway (loopback, RFC1918,
            # CGNAT, link-local), and without the setting only the global backstop and the
            # per-subject caps limit requests. Re-enable it (value X-Envoy-External-Address)
            # only after verifying on r415 that the hub logs the real, distinct client
            # addresses (README, "Client IP and rate limits").
            # Org gate (wg-tunnel CanOpen): enforce | audit | off. Fails the render for anything else.
            - name: ORG_GATE_MODE
              value: {{ include "ztna.orgGateMode" . | quote }}
            - name: ALLOWED_AZP
              value: {{ .Values.hub.allowedAZP | quote }}
            # Live status listener (Backstage only; AuthorizationPolicy + exact TokenReview username).
            - name: STATUS_ADDR
              value: ":8082"
            - name: BACKSTAGE_SA
              value: {{ .Values.hub.backstageSA | quote }}
            # Audience of the projected token Backstage sends to the status port (TokenReview).
            - name: STATUS_AUDIENCE
              value: "teknoir-ztna-status"
            # Leader election on the Lease in this namespace; POD_NAME is the identity and the pod
            # whose role label the hub sets. HANDOVER_WAIT is 0s with one replica (nobody takes
            # over, so a stepping-down hub does not wait for one).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.hub.leaderElection }}
            {{- if .enabled }}
            - name: LEADER_ELECTION
              value: {{ .lease | quote }}
            - name: LEASE_DURATION
              value: {{ .leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .retryPeriod | quote }}
            - name: HANDOVER_WAIT
              value: {{ ternary "0s" .handoverWait (eq (int $.Values.hub.replicas) 1) | quote }}
            - name: HANDOVER_SETTLE
              value: {{ .handoverSettle | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            # Internal API (service account delegation, direct sessions). No VirtualService routes
            # it; the AuthorizationPolicy admits workloads in this namespace only.
            - name: http-internal
              containerPort: 8081
              protocol: TCP
            # Live status for the Backstage backend only (AuthorizationPolicy: its principal).
            - name: http-status
              containerPort: 8082
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
            - name: wg
              containerPort: 51820
              protocol: UDP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            {{- toYaml .Values.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
---
# Headless: the endpoints are the pod IPs (here only the LEADER's: the hub-role label that the hub
# sets on its own pod; the VirtualServices, the internal and the status port all go to this name).
# The hub's own endpoint (POD_IP:51820) avoids ClusterIP NAT and conntrack on the TURN leg. UDP is
# not captured by the Istio sidecar; the TCP ports are. STUNner's UDPRoute permits the hub pods
# through wg-hub-pods (below), so a failover does not wait for the operator to re-render.
# Needs a wg-hub image with leader election: an older image never sets the hub-role label and this Service
# would have no endpoints, so the render fails unless hub.image.leaderElection confirms the pin (top of this file).
apiVersion: v1
kind: Service
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ztna.hubPodSelector" . | nindent 4 }}
    {{- if .Values.hub.leaderElection.enabled }}
    ztna.teknoir.org/hub-role: leader
    {{- end }}
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: http-internal
      port: 8081
      targetPort: http-internal
      protocol: TCP
    - name: http-status
      port: 8082
      targetPort: http-status
      protocol: TCP
    - name: http-metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
    - name: wg
      port: 51820
      targetPort: wg
      protocol: UDP
---
# The hub pods as TURN peers, ready or not (UDP 51820 only): STUNner's UDPRoute permits every pod
# here before a failover, so a new leader needs no operator re-render, and a terminating leader
# stays reachable for the handover notices it sends to the agents through TURN. A standby has no
# peers, so permitting it is harmless; clients send WireGuard only to the endpoint of the session.
# The selector includes the component label: the pods of the pull secret Job and CronJob carry
# the name label too (component pull-secret) and must not become peers.
apiVersion: v1
kind: Service
metadata:
  name: wg-hub-pods
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "ztna.hubPodSelector" . | nindent 4 }}
  ports:
    - name: wg
      port: 51820
      targetPort: wg
      protocol: UDP
{{- if .Values.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: wg-hub
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
    {{- toYaml .Values.metrics.serviceMonitor.labels | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      {{- include "ztna.hubSelector" . | nindent 6 }}
  endpoints:
    - port: http-metrics
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
