{{- /*
ValidatingAdmissionPolicies (Kubernetes 1.30+, r415 runs 1.34) that protect the policy store and
the hub. Backstage's service account has cluster-wide teknoir-admin (ConfigMaps, Secrets, exec),
so RBAC alone does not keep a compromised UI out of the access policy.

  ztna-policy-store:  - ConfigMaps labelled ztna.teknoir.org/policy (or named ztna-policy-*):
                        only device-controller's service account may create, update or delete them;
                      - ConfigMaps labelled ztna.teknoir.org/identity (or named ztna-identity-*):
                        only the hub's service account;
                      - ConfigMaps labelled ztna.teknoir.org/flags (or named ztna-flags-*):
                        only the flags watcher's service account (wg-flags);
                      - ConfigMaps labelled ztna.teknoir.org/org (or named ztna-org-*), the per-teamspace
                        org-gate data for the hub: only the flags watcher's service account;
                      - ConfigMaps labelled ztna.teknoir.org/revoked (or named ztna-revoked-*), the
                        revocation tombstones that keep a recreated Device off: only device-controller;
                      - the hub may write no other ConfigMap, the flags watcher only flags and org ones.
  ztna-workloads:     pods and workload kinds (deployments, replicasets, statefulsets, daemonsets,
                      jobs, cronjobs) in teknoir-ztna and stunner-system are created and updated
                      only by ArgoCD's application controller, device-controller, the stunner
                      operator and kube-system / controller-manager identities (the replicaset and
                      job controllers create the pods). Closes the routes by which a compromised
                      UI could run its own pod as wg-hub, or patch the hub image.
  ztna-no-token-mint: serviceaccounts/token (TokenRequest) for wg-hub, wg-flags and the terminal
                      accounts (wgt-*) only by the kubelet (system:node:*) and kube-system.

Accepted risk (plan "Rev 3 changes"): these policies check request.userInfo.username. A caller that
may impersonate ServiceAccounts (the Backstage SA holds cluster-wide teknoir-admin) can still stand
in for an allowed identity. The policies close the direct routes; scoping that binding per
teamspace is a platform follow-up.
  ztna-no-exec:       nobody may exec into, attach to, port-forward to or add ephemeral
                      containers to pods in teknoir-ztna and stunner-system (the hub holds the
                      session keys in memory, stunnerd the TURN secret).

ArgoCD is not affected: the policy and identity ConfigMaps are not in Git, so ArgoCD never writes
them, and Argo's own resources here are no ConfigMaps at all. Namespace teardown is: the namespace
controller deletes the ConfigMaps as itself, so DELETE is allowed while the namespace is Terminating
(nobody can start that without deleting the namespace, which is cluster-admin anyway).

Break-glass: a cluster-admin (system:masters is NOT exempt) pauses auto-sync FIRST (the ztna
Application has selfHeal and would restore the binding within seconds: `argocd app set ztna
--sync-policy none`), deletes the ValidatingAdmissionPolicyBinding, acts, re-applies it and
re-enables auto-sync. See README, "Break-glass".
*/ -}}
{{- $label := "ztna.teknoir.org" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-policy-store
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  variables:
    # object is null on DELETE, oldObject on CREATE; a label or name prefix on either side counts, so
    # relabelling a policy ConfigMap does not escape the rule.
    - name: isPolicy
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-policy-')) ||
          (has(object.metadata.labels) && '{{ $label }}/policy' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-policy-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/policy' in oldObject.metadata.labels)))
    - name: isIdentity
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-identity-')) ||
          (has(object.metadata.labels) && '{{ $label }}/identity' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-identity-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/identity' in oldObject.metadata.labels)))
    - name: isFlags
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-flags-')) ||
          (has(object.metadata.labels) && '{{ $label }}/flags' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-flags-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/flags' in oldObject.metadata.labels)))
    - name: isOrg
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-org-')) ||
          (has(object.metadata.labels) && '{{ $label }}/org' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-org-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/org' in oldObject.metadata.labels)))
    - name: isRevoked
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-revoked-')) ||
          (has(object.metadata.labels) && '{{ $label }}/revoked' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-revoked-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/revoked' in oldObject.metadata.labels)))
    - name: teardown
      expression: >-
        request.operation == 'DELETE' && namespaceObject != null &&
        has(namespaceObject.status) && has(namespaceObject.status.phase) &&
        namespaceObject.status.phase == 'Terminating'
  validations:
    - expression: >-
        !variables.isPolicy || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.controllerUser" . }}'
      message: "ztna policy ConfigMaps are written by device-controller only"
      reason: Forbidden
    - expression: >-
        !variables.isRevoked || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.controllerUser" . }}'
      message: "ztna revocation tombstones are written by device-controller only"
      reason: Forbidden
    - expression: >-
        !variables.isIdentity || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.hubUser" . }}'
      message: "ztna identity ConfigMaps are written by the wg-hub only"
      reason: Forbidden
    - expression: >-
        !variables.isFlags || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.flagsUser" . }}'
      message: "ztna flags ConfigMaps are written by the wg-flags watcher only"
      reason: Forbidden
    - expression: >-
        !variables.isOrg || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.flagsUser" . }}'
      message: "ztna org ConfigMaps are written by the wg-flags watcher only"
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ include "ztna.hubUser" . }}' || variables.isIdentity
      message: "the wg-hub may only write ztna identity ConfigMaps"
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ include "ztna.flagsUser" . }}' || variables.isFlags || variables.isOrg
      message: "the wg-flags watcher may only write ztna flags and org ConfigMaps"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-policy-store-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-policy-store
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-no-exec
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: "false"
      message: "exec, attach, port-forward and ephemeral containers are denied for everyone in the ZTNA namespaces"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-no-exec-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-no-exec
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - {{ .Release.Namespace }}
            - {{ .Values.turn.secretNamespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-workloads
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: user
      expression: request.userInfo.username
    - name: allowedUsers
      expression: >-
        ['{{ include "ztna.controllerUser" . }}'
        {{- range .Values.admission.workloadCreators }}, {{ . | squote }}{{ end }}]
  validations:
    - expression: >-
        variables.user in variables.allowedUsers ||
        variables.user.startsWith('system:serviceaccount:kube-system:') ||
        variables.user.startsWith('system:kube-controller-manager')
      message: "pods and workloads here are created and changed only by ArgoCD, device-controller, the stunner operator and the kube-system controllers"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-workloads-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-workloads
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - {{ .Release.Namespace }}
            - {{ .Values.turn.secretNamespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-no-token-mint
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  validations:
    - expression: >-
        !(request.name in ['wg-hub', 'wg-flags'] || request.name.startsWith('wgt-')) ||
        request.userInfo.username.startsWith('system:node:') ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username.startsWith('system:kube-controller-manager')
      message: "tokens for the ZTNA service accounts (wg-hub, wg-flags, wgt-*) are minted by the kubelet only"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-no-token-mint-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-no-token-mint
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
{{- /*
ztna-device-annotations: every ztna.teknoir.org/* annotation on a Device (wireguard enable, approved
identity, trusted host key, compromised/health flags, reenroll) is a security decision. Notebook
pods run as the default-editor service account and can edit Devices, which would bypass the
Backstage admin gate. Only the Backstage backend, device-controller and system:masters may add,
change or remove such an annotation; any other Device edit is unaffected, and DELETE is not matched.
The same holds for the exact keys teknoir.org/org-tree-path and teknoir.org/org-tree-node-id: they
place a Device in the org tree and so feed the hub org gate. Their writers (checked 2026-10-17):
device-controller (copy from a Robot), the Backstage backend (Settings > Org tree) and
`kubectl annotate` by a cluster admin (system:masters).
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-device-annotations
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["devices"]
  variables:
    - name: prefix
      expression: "'ztna.teknoir.org/'"
    - name: orgKeys
      expression: "['teknoir.org/org-tree-path', 'teknoir.org/org-tree-node-id']"
    - name: oldA
      expression: >-
        (oldObject != null && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: newA
      expression: >-
        has(object.metadata.annotations) ? object.metadata.annotations : {}
    - name: privileged
      expression: >-
        request.userInfo.username in ['{{ include "ztna.controllerUser" . }}', '{{ .Values.backstage.serviceAccount }}'] ||
        'system:masters' in request.userInfo.groups
  validations:
    - expression: >-
        variables.privileged ||
        (variables.newA.all(k, !(k.startsWith(variables.prefix) || k in variables.orgKeys) || (k in variables.oldA && variables.oldA[k] == variables.newA[k])) &&
         variables.oldA.all(k, !(k.startsWith(variables.prefix) || k in variables.orgKeys) || k in variables.newA))
      message: "ztna.teknoir.org/* and teknoir.org/org-tree-path|node-id annotations on a Device are changed only by the Backstage backend, device-controller or system:masters"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-device-annotations-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-device-annotations
  validationActions: ["Deny", "Audit"]
---
{{- /*
ztna-user-org-annotations: protects the INPUTS of the hub org gate. The gate decides from the User's
annotations teknoir.org/org-tree-member-<teamspace> and teknoir.org/org-tree-units-<teamspace>;
anyone who can edit a User could otherwise widen their own scope. Only the identities in values
userOrgAnnotations.writers (Backstage backend: Settings > Members; ArgoCD: platformUsers/orgUnits
rendered by charts/user-controller; user-controller) and system:masters may add, change or remove
such an annotation. Any other User edit is unaffected, and DELETE is not matched. Writers checked
2026-10-17: backstage-nextgen user-entity.ts (backstage-api), charts/user-controller
platform-users.yaml (ArgoCD application controller); user-controller itself writes none (it is on
the list because it rewrites User objects).
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-user-org-annotations
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["users"]
  variables:
    - name: oldA
      expression: >-
        (oldObject != null && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: newA
      expression: >-
        has(object.metadata.annotations) ? object.metadata.annotations : {}
    - name: privileged
      expression: >-
        request.userInfo.username in [{{ range $i, $w := .Values.userOrgAnnotations.writers }}{{ if $i }}, {{ end }}'{{ $w }}'{{ end }}] ||
        'system:masters' in request.userInfo.groups
  validations:
    - expression: >-
        variables.privileged ||
        (variables.newA.all(k, !(k.startsWith('teknoir.org/org-tree-member-') || k.startsWith('teknoir.org/org-tree-units-')) ||
           (k in variables.oldA && variables.oldA[k] == variables.newA[k])) &&
         variables.oldA.all(k, !(k.startsWith('teknoir.org/org-tree-member-') || k.startsWith('teknoir.org/org-tree-units-')) ||
           k in variables.newA))
      message: "teknoir.org/org-tree-member-* and org-tree-units-* annotations on a User are changed only by the Backstage backend, ArgoCD, user-controller or system:masters"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-user-org-annotations-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-user-org-annotations
  validationActions: ["Deny", "Audit"]
