{{- /*
ValidatingAdmissionPolicies (Kubernetes 1.30+, r415 runs 1.34) that protect the policy store and
the hub. Backstage's service account can write Devices and Users in every teamspace, so RBAC alone
does not keep a compromised UI out of the access policy.

  ztna-policy-store:  - ConfigMaps labelled ztna.teknoir.org/policy (or named ztna-policy-*):
                        only device-controller's service account may create, update or delete them;
                      - ConfigMaps labelled ztna.teknoir.org/identity (or named ztna-identity-*):
                        only the hub's service account;
                      - ConfigMaps labelled ztna.teknoir.org/flags (or named ztna-flags-*):
                        only the flags watcher's service account (wg-flags);
                      - ConfigMaps labelled ztna.teknoir.org/org (or named ztna-org-*), the per-teamspace
                        org-gate data for the hub: only the flags watcher's service account;
                      - ConfigMaps labelled ztna.teknoir.org/revoked (or named ztna-revoked-*), the
                        revocation tombstones that keep a recreated Device off: only device-controller;
                      - the hub may write no other ConfigMap, the flags watcher only flags and org ones.
  ztna-workloads:     pods and workload kinds (deployments, replicasets, statefulsets, daemonsets,
                      jobs, cronjobs) in teknoir-ztna and stunner-system are created and updated
                      only by ArgoCD's application controller, device-controller, the stunner
                      operator and kube-system / controller-manager identities (the replicaset and
                      job controllers create the pods). Closes the routes by which a compromised
                      UI could run its own pod as wg-hub, or patch the hub image.
                      One carve-out (hub.leaderElection.enabled): the wg-hub service account may
                      UPDATE a pod of the hub (labels app.kubernetes.io/name=wg-hub and
                      app.kubernetes.io/component=hub) in teknoir-ztna, changing only the label
                      ztna.teknoir.org/hub-role (leader|standby) and the annotation
                      controller.kubernetes.io/pod-deletion-cost (0|100): the leader election's
                      role marker. spec, ownerReferences, finalizers and every other label and
                      annotation must stay equal. The pod name is not checked: the worst a hub can
                      do is relabel the other hub pod, and a hub already holds every session.
  ztna-hub-lease:     the Lease of the hub's leader election (hub.leaderElection.lease) is written
                      only by the wg-hub service account (plus namespace teardown); the hub writes
                      no other Lease. Without it a compromised UI (teknoir-admin) could steal the
                      leadership and with it the sessions.
  ztna-no-token-mint: serviceaccounts/token (TokenRequest) for wg-hub, wg-flags and the terminal
                      accounts (wgt-*) only by the kubelet (system:node:*) and kube-system.
  ztna-no-exec:       nobody may exec into, attach to, port-forward to or add ephemeral
                      containers to pods in teknoir-ztna and stunner-system (the hub holds the
                      session keys in memory, stunnerd the TURN secret).

  ztna-backstage-identities: the Backstage service account may not create or change a User whose spec.email is
                      not a plain e-mail address (lower-cased: [a-z0-9._%+-]+@[a-z0-9.-]+, so no ':', space, quote,
                      '#' or line break), nor a Profile whose owner is not a User with such an address: the
                      controllers render role bindings from those names with text templates, verbatim. It also may
                      not create a Profile with spec.plugins or spec.resourceQuotaSpec, nor change either on an
                      existing Profile: profile-controller writes each plugin's `values` verbatim into the
                      teamspace's ArgoCD Application helm values, and the emqx subchart renders initContainers,
                      extraVolumes and containerSecurityContext from them, a third way to a privileged pod.

Backstage's service account (backstage.serviceAccount) holds no impersonate, pod, exec, secret-list or RBAC rights
(charts/backstage templates/rbac.yaml; its teamspace rights are a RoleBinding per teamspace written by
profile-controller, and in this namespace it may only get Deployments). It can still write Users and Profiles, and
user-controller and profile-controller turn those into role bindings (teknoir-admin for a Profile's owner), so
ztna-backstage-identities stops it from naming itself, a service account or a group there, and from touching
spec.plugins (the Helm values route) and spec.resourceQuotaSpec; Backstage writes neither (create_profile.ts sends only
spec.owner, the Profile update validator carries over metadata annotations and labels only), so no flow breaks. Three things
remain, as ACCEPTED RISKS, and it is NOT true that a compromised Backstage cannot run code or act as someone else:
  - it can make any e-mail address, its own included, an owner of a teamspace (the create-Profiles right itself);
  - it may write Devstudios and Notebooks, and their controllers run spec.image in a privileged container, so it
    can run any image privileged in any teamspace (as can teamspace developers). An image allowlist is a named
    follow-up for Anders to decide ("teamspace image allowlist", plans/ztna-later.md);
  - it may write Devices and DeviceApplicationSets, and device-controller runs a virtual Device as a privileged
    Deployment (image ghcr.io/teknoir/virtual-device:<spec version>) into which any HelmChart can be deployed. That
    is a second privileged route to the node, which the image allowlist above does NOT close (follow-up "virtual
    device / DeviceApplicationSet workloads").
So the goal "cannot bypass the admission policies" is only PARTLY met: the direct routes (impersonation, pods, exec,
Secrets, RBAC, teknoir-admin through a User or Profile, Helm values through Profile plugins) are closed, the two
privileged-workload routes through Devstudio/Notebook images and virtual Devices are not.
The two username exemptions for it (ztna-device-annotations, ztna-user-org-annotations) are deliberate: Backstage
applies the org gate and the end user's SubjectAccessReview before it writes. The policies check
request.userInfo.username, so they are only as strong as the right to become another identity.

ArgoCD is not affected: the policy and identity ConfigMaps are not in Git, so ArgoCD never writes
them, and Argo's own resources here are no ConfigMaps at all. Namespace teardown is: the namespace
controller deletes the ConfigMaps as itself, so DELETE is allowed while the namespace is Terminating
(nobody can start that without deleting the namespace, which is cluster-admin anyway).

Break-glass: a cluster-admin (system:masters is NOT exempt) pauses auto-sync FIRST (the ztna
Application has selfHeal and would restore the binding within seconds: `argocd app set ztna
--sync-policy none`), deletes the ValidatingAdmissionPolicyBinding, acts, re-applies it and
re-enables auto-sync. See README, "Break-glass".
*/ -}}
{{- $label := "ztna.teknoir.org" }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-policy-store
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["configmaps"]
  variables:
    # object is null on DELETE, oldObject on CREATE; a label or name prefix on either side counts, so
    # relabelling a policy ConfigMap does not escape the rule.
    - name: isPolicy
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-policy-')) ||
          (has(object.metadata.labels) && '{{ $label }}/policy' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-policy-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/policy' in oldObject.metadata.labels)))
    - name: isIdentity
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-identity-')) ||
          (has(object.metadata.labels) && '{{ $label }}/identity' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-identity-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/identity' in oldObject.metadata.labels)))
    - name: isFlags
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-flags-')) ||
          (has(object.metadata.labels) && '{{ $label }}/flags' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-flags-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/flags' in oldObject.metadata.labels)))
    - name: isOrg
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-org-')) ||
          (has(object.metadata.labels) && '{{ $label }}/org' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-org-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/org' in oldObject.metadata.labels)))
    - name: isRevoked
      expression: >-
        (object != null && ((has(object.metadata.name) && object.metadata.name.startsWith('ztna-revoked-')) ||
          (has(object.metadata.labels) && '{{ $label }}/revoked' in object.metadata.labels))) ||
        (oldObject != null && ((has(oldObject.metadata.name) && oldObject.metadata.name.startsWith('ztna-revoked-')) ||
          (has(oldObject.metadata.labels) && '{{ $label }}/revoked' in oldObject.metadata.labels)))
    - name: teardown
      expression: >-
        request.operation == 'DELETE' && namespaceObject != null &&
        has(namespaceObject.status) && has(namespaceObject.status.phase) &&
        namespaceObject.status.phase == 'Terminating'
  validations:
    - expression: >-
        !variables.isPolicy || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.controllerUser" . }}'
      message: "ztna policy ConfigMaps are written by device-controller only"
      reason: Forbidden
    - expression: >-
        !variables.isRevoked || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.controllerUser" . }}'
      message: "ztna revocation tombstones are written by device-controller only"
      reason: Forbidden
    - expression: >-
        !variables.isIdentity || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.hubUser" . }}'
      message: "ztna identity ConfigMaps are written by the wg-hub only"
      reason: Forbidden
    - expression: >-
        !variables.isFlags || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.flagsUser" . }}'
      message: "ztna flags ConfigMaps are written by the wg-flags watcher only"
      reason: Forbidden
    - expression: >-
        !variables.isOrg || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.flagsUser" . }}'
      message: "ztna org ConfigMaps are written by the wg-flags watcher only"
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ include "ztna.hubUser" . }}' || variables.isIdentity
      message: "the wg-hub may only write ztna identity ConfigMaps"
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ include "ztna.flagsUser" . }}' || variables.isFlags || variables.isOrg
      message: "the wg-flags watcher may only write ztna flags and org ConfigMaps"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-policy-store-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-policy-store
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-no-exec
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CONNECT"]
        resources: ["pods/exec", "pods/attach", "pods/portforward"]
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE"]
        resources: ["pods/ephemeralcontainers"]
  validations:
    - expression: "false"
      message: "exec, attach, port-forward and ephemeral containers are denied for everyone in the ZTNA namespaces"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-no-exec-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-no-exec
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - {{ .Release.Namespace }}
            - {{ .Values.turn.secretNamespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-workloads
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: user
      expression: request.userInfo.username
    - name: allowedUsers
      expression: >-
        ['{{ include "ztna.controllerUser" . }}'
        {{- range .Values.admission.workloadCreators }}, {{ . | squote }}{{ end }}]
    {{- if .Values.hub.leaderElection.enabled }}
    # The hub's role marker on its own pod (see the header). Variables are lazy and && is
    # error-tolerant, so oldObject (null on CREATE) is only read after the operation is known.
    - name: oldL
      expression: >-
        (oldObject != null && has(oldObject.metadata.labels)) ? oldObject.metadata.labels : {}
    - name: newL
      expression: >-
        (object != null && has(object.metadata.labels)) ? object.metadata.labels : {}
    - name: oldA
      expression: >-
        (oldObject != null && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: newA
      expression: >-
        (object != null && has(object.metadata.annotations)) ? object.metadata.annotations : {}
    - name: hubRoleUpdate
      expression: >-
        variables.user == '{{ include "ztna.hubUser" . }}' &&
        request.operation == 'UPDATE' && request.kind.kind == 'Pod' && (!has(request.subResource) || request.subResource == '') &&
        request.namespace == '{{ .Release.Namespace }}' &&
        'app.kubernetes.io/name' in variables.oldL && variables.oldL['app.kubernetes.io/name'] == 'wg-hub' &&
        'app.kubernetes.io/component' in variables.oldL && variables.oldL['app.kubernetes.io/component'] == 'hub' &&
        object.spec == oldObject.spec &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) ==
          (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) ==
          (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        '{{ $label }}/hub-role' in variables.newL && variables.newL['{{ $label }}/hub-role'] in ['leader', 'standby'] &&
        variables.newL.all(k, k == '{{ $label }}/hub-role' || (k in variables.oldL && variables.oldL[k] == variables.newL[k])) &&
        variables.oldL.all(k, k == '{{ $label }}/hub-role' || k in variables.newL) &&
        variables.newA.all(k, k == 'controller.kubernetes.io/pod-deletion-cost' || (k in variables.oldA && variables.oldA[k] == variables.newA[k])) &&
        variables.oldA.all(k, k == 'controller.kubernetes.io/pod-deletion-cost' || k in variables.newA) &&
        (!('controller.kubernetes.io/pod-deletion-cost' in variables.newA) || variables.newA['controller.kubernetes.io/pod-deletion-cost'] in ['0', '100'])
    {{- end }}
  validations:
    - expression: >-
        variables.user in variables.allowedUsers ||
        variables.user.startsWith('system:serviceaccount:kube-system:') ||
        variables.user.startsWith('system:kube-controller-manager')
        {{- if .Values.hub.leaderElection.enabled }} ||
        variables.hubRoleUpdate
        {{- end }}
      message: "pods and workloads here are created and changed only by ArgoCD, device-controller, the stunner operator and the kube-system controllers (the wg-hub may only set its role label and deletion cost)"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-workloads-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-workloads
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            - {{ .Release.Namespace }}
            - {{ .Values.turn.secretNamespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-hub-lease
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["coordination.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["leases"]
  variables:
    # object is null on DELETE, oldObject on CREATE (see ztna-policy-store).
    - name: isHubLease
      expression: >-
        (object != null && has(object.metadata.name) && object.metadata.name == '{{ .Values.hub.leaderElection.lease }}') ||
        (oldObject != null && has(oldObject.metadata.name) && oldObject.metadata.name == '{{ .Values.hub.leaderElection.lease }}')
    - name: teardown
      expression: >-
        request.operation == 'DELETE' && namespaceObject != null &&
        has(namespaceObject.status) && has(namespaceObject.status.phase) &&
        namespaceObject.status.phase == 'Terminating'
  validations:
    - expression: >-
        !variables.isHubLease || variables.teardown ||
        request.userInfo.username == '{{ include "ztna.hubUser" . }}'
      message: "the leader Lease of the wg-hub is written by the wg-hub only"
      reason: Forbidden
    - expression: >-
        request.userInfo.username != '{{ include "ztna.hubUser" . }}' || variables.isHubLease
      message: "the wg-hub may only write its own leader Lease"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-hub-lease-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-hub-lease
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-no-token-mint
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["serviceaccounts/token"]
  validations:
    - expression: >-
        !(request.name in ['wg-hub', 'wg-flags'] || request.name.startsWith('wgt-')) ||
        request.userInfo.username.startsWith('system:node:') ||
        request.userInfo.username.startsWith('system:serviceaccount:kube-system:') ||
        request.userInfo.username.startsWith('system:kube-controller-manager')
      message: "tokens for the ZTNA service accounts (wg-hub, wg-flags, wgt-*) are minted by the kubelet only"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-no-token-mint-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-no-token-mint
  validationActions: ["Deny", "Audit"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ .Release.Namespace }}
---
{{- /*
ztna-device-annotations: every ztna.teknoir.org/* annotation on a Device (wireguard enable, approved
identity, trusted host key, compromised/health flags, reenroll) is a security decision. Notebook
pods run as the default-editor service account and can edit Devices, which would bypass the
Backstage admin gate. Only the Backstage backend, device-controller and system:masters may add,
change or remove such an annotation; any other Device edit is unaffected, and DELETE is not matched.
The same holds for the exact keys teknoir.org/org-tree-path and teknoir.org/org-tree-node-id: they
place a Device in the org tree and so feed the hub org gate. Their writers (checked 2026-10-17):
device-controller (copy from a Robot), the Backstage backend (Settings > Org tree) and
`kubectl annotate` by a cluster admin (system:masters).
Robot org annotations are not guarded: device-controller copies a Robot's placement only onto an
unplaced Device, so an editor of Robots can narrow but not widen access. Guarding Robots is a follow-up.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-device-annotations
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["devices"]
  variables:
    - name: prefix
      expression: "'ztna.teknoir.org/'"
    - name: orgKeys
      expression: "['teknoir.org/org-tree-path', 'teknoir.org/org-tree-node-id']"
    - name: oldA
      expression: >-
        (oldObject != null && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: newA
      expression: >-
        has(object.metadata.annotations) ? object.metadata.annotations : {}
    - name: privileged
      expression: >-
        request.userInfo.username in ['{{ include "ztna.controllerUser" . }}', '{{ .Values.backstage.serviceAccount }}'] ||
        'system:masters' in request.userInfo.groups
  validations:
    - expression: >-
        variables.privileged ||
        (variables.newA.all(k, !(k.startsWith(variables.prefix) || k in variables.orgKeys) || (k in variables.oldA && variables.oldA[k] == variables.newA[k])) &&
         variables.oldA.all(k, !(k.startsWith(variables.prefix) || k in variables.orgKeys) || k in variables.newA))
      message: "ztna.teknoir.org/* and teknoir.org/org-tree-path|node-id annotations on a Device are changed only by the Backstage backend, device-controller or system:masters"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-device-annotations-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-device-annotations
  validationActions: ["Deny", "Audit"]
---
{{- /*
ztna-user-org-annotations: protects the INPUTS of the hub org gate. The gate decides from the User's
annotations teknoir.org/org-tree-member-<teamspace> and teknoir.org/org-tree-units-<teamspace>;
anyone who can edit a User could otherwise widen their own scope. Only the identities in values
userOrgAnnotations.writers (Backstage backend: Settings > Members; ArgoCD: platformUsers/orgUnits
rendered by charts/user-controller; user-controller) and system:masters may add, change or remove
such an annotation. Any other User edit is unaffected, and DELETE is not matched. Writers checked
2026-10-17: backstage-nextgen user-entity.ts (backstage-api), charts/user-controller
platform-users.yaml (ArgoCD application controller); user-controller itself writes none (it is on
the list because it rewrites User objects).
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-user-org-annotations
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["users"]
  variables:
    - name: oldA
      expression: >-
        (oldObject != null && has(oldObject.metadata.annotations)) ? oldObject.metadata.annotations : {}
    - name: newA
      expression: >-
        has(object.metadata.annotations) ? object.metadata.annotations : {}
    - name: privileged
      expression: >-
        request.userInfo.username in [{{ .Values.backstage.serviceAccount | squote }}{{ range .Values.userOrgAnnotations.writers }}, {{ . | squote }}{{ end }}] ||
        'system:masters' in request.userInfo.groups
  validations:
    - expression: >-
        variables.privileged ||
        (variables.newA.all(k, !(k.startsWith('teknoir.org/org-tree-member-') || k.startsWith('teknoir.org/org-tree-units-')) ||
           (k in variables.oldA && variables.oldA[k] == variables.newA[k])) &&
         variables.oldA.all(k, !(k.startsWith('teknoir.org/org-tree-member-') || k.startsWith('teknoir.org/org-tree-units-')) ||
           k in variables.newA))
      message: "teknoir.org/org-tree-member-* and org-tree-units-* annotations on a User are changed only by the Backstage backend, ArgoCD, user-controller or system:masters"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-user-org-annotations-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-user-org-annotations
  validationActions: ["Deny", "Audit"]
---
{{- /*
ztna-backstage-identities: keeps the Backstage service account from turning its right to write Users and Profiles
into teknoir-admin (or any other role) for ITSELF. Both controllers bind a role to a name taken verbatim from the
object: user-controller writes a RoleBinding to teknoir-admin (or the claim set's role) for `kind: User, name:
<spec.email>`, and profile-controller binds teknoir-admin in the new teamspace to `spec.owner`. Without this policy
a User with spec.email `system:serviceaccount:teknoir-system:backstage-api`, or a Profile whose owner is that
service account (kind ServiceAccount, or the Group system:serviceaccounts:teknoir-system), gives the service
account teknoir-admin: pods, exec, impersonation and Secrets in that namespace. For requests from the Backstage
service account only (matchConditions):
  - a User's spec.email must match the strict pattern ^[a-z0-9._%+-]+@[a-z0-9.-]+$ (after lowerAscii);
  - a Profile's spec.owner must be `kind: User` with a name matching the same pattern.
The pattern is deliberately an allowlist, not "contains '@' and no `system:` prefix": user-controller renders its
RoleBinding (`name: <usermail>`, internal/plugins/k8s/namespace_user_role_binding.go) and its
AuthorizationPolicy (userIdHeaderValue) from text templates without escaping, so an e-mail with a line break,
`:`, quote, space or `#` can inject a second `name:` key (the last one wins) and still contain an '@'.
Reproduced with the real template and decoder; the injected name system:serviceaccount:teknoir-system:backstage-api
came out as the RoleBinding's subject. Follow-up (user-controller): build both objects as structs, or quote with
toJson, so the controller no longer trusts the string.
Every legitimate flow uses an e-mail address (create_profile.ts, the Members page). Everyone else is unaffected.
Profile spec.plugins: profile-controller unmarshals each plugin's `values` (plugin_emqx.go) and writes them verbatim
into the teamspace ArgoCD Application's helm values; the emqx subchart renders `initContainers`, `extraVolumes` and
`containerSecurityContext` from them, and the teamspace has no Pod Security labels. So a Profile create or patch with
emqx.initContainers set privileged plus a hostPath mount would put a pod on the node. For requests from the Backstage
service account only: a CREATE must carry no (or an empty) spec.plugins and spec.resourceQuotaSpec, and an UPDATE must
leave both exactly as they were (absent counts as empty, so `plugins: []` on create still passes; the status
subresource and metadata-only changes such as annotations, labels and finalizers are not affected).
What is NOT closed: Backstage can still make any e-mail address, its own included, an owner of a teamspace (that
is the "create Profiles" right itself; the README lists it). Break-glass as for the other policies.
*/}}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ztna-backstage-identities
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["teknoir.org"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["users", "profiles"]
  matchConditions:
    - name: from-backstage
      expression: "request.userInfo.username == {{ .Values.backstage.serviceAccount | squote }}"
  variables:
    - name: email
      expression: >-
        (request.resource.resource == 'users' && has(object.spec) && has(object.spec.email)) ? object.spec.email : ''
    - name: owner
      expression: >-
        (request.resource.resource == 'profiles' && has(object.spec) && has(object.spec.owner) && has(object.spec.owner.name)) ?
          object.spec.owner.name : ''
    - name: ownerKind
      expression: >-
        (request.resource.resource == 'profiles' && has(object.spec) && has(object.spec.owner) && has(object.spec.owner.kind)) ?
          object.spec.owner.kind : ''
    # spec.plugins and spec.resourceQuotaSpec as they are now and as they were (absent = empty)
    - name: newPlugins
      expression: >-
        (has(object.spec) && has(object.spec.plugins)) ? object.spec.plugins : []
    - name: oldPlugins
      expression: >-
        (oldObject != null && has(oldObject.spec) && has(oldObject.spec.plugins)) ? oldObject.spec.plugins : []
    - name: newQuota
      expression: >-
        (has(object.spec) && has(object.spec.resourceQuotaSpec)) ? object.spec.resourceQuotaSpec : {}
    - name: oldQuota
      expression: >-
        (oldObject != null && has(oldObject.spec) && has(oldObject.spec.resourceQuotaSpec)) ? oldObject.spec.resourceQuotaSpec : {}
  validations:
    - expression: >-
        request.resource.resource != 'users' ||
        variables.email.lowerAscii().matches('^[a-z0-9._%+-]+@[a-z0-9.-]+$')
      message: "a User's spec.email must be a plain e-mail address ([a-z0-9._%+-]+@[a-z0-9.-]+, no ':', space, quote, '#' or line break): the controllers render role bindings from that text"
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'profiles' ||
        (variables.ownerKind == 'User' && variables.owner.lowerAscii().matches('^[a-z0-9._%+-]+@[a-z0-9.-]+$'))
      message: "a Profile's spec.owner must be kind User with a plain e-mail address ([a-z0-9._%+-]+@[a-z0-9.-]+, no ':', space, quote, '#' or line break): profile-controller binds teknoir-admin to it"
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'profiles' ||
        (request.operation == 'CREATE' ? (size(variables.newPlugins) == 0 && size(variables.newQuota) == 0) :
          (variables.newPlugins == variables.oldPlugins && variables.newQuota == variables.oldQuota))
      message: "a Profile's spec.plugins and spec.resourceQuotaSpec are not written by the Backstage service account: profile-controller turns plugin values into Helm values of the teamspace, including initContainers and hostPath volumes"
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ztna-backstage-identities-binding
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
spec:
  policyName: ztna-backstage-identities
  validationActions: ["Deny", "Audit"]
