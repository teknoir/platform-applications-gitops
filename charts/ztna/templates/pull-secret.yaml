{{- /*
Copy of the ghcr pull secret into this namespace. A new namespace has none, and no controller
copies it (teamspaces get theirs from profile-controller). A Sync hook Job reads
teknoir-system/ghcr-token and server-side applies it as ghcr-token here. Nothing prints the value;
the Job only pipes it from kubectl get through jq into kubectl apply. A rotated source reaches
the namespace on the next sync of this Application (re-run the hook with an ArgoCD sync). Off when
the image is public (pullSecretCopy.enabled=false).
*/ -}}
{{- $c := .Values.pullSecretCopy }}
{{- if $c.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ztna-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
---
# Read the source Secret, by name only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ztna-pull-secret-source
  namespace: {{ $c.sourceNamespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $c.secretName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ztna-pull-secret-source
  namespace: {{ $c.sourceNamespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ztna-pull-secret-source
subjects:
  - kind: ServiceAccount
    name: ztna-pull-secret
    namespace: {{ .Release.Namespace }}
---
# Write the copy. Secret create cannot be restricted by name; get and patch can.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ztna-pull-secret-target
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $c.secretName | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ztna-pull-secret-target
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ztna-pull-secret-target
subjects:
  - kind: ServiceAccount
    name: ztna-pull-secret
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ztna-pull-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ztna.hubLabels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # Before the Deployment (wave 0) starts pulling; its pods would retry anyway.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "ztna.hubLabels" . | nindent 8 }}
        app.kubernetes.io/component: pull-secret
      annotations:
        # A finished Job with a sidecar never completes.
        sidecar.istio.io/inject: "false"
    spec:
      serviceAccountName: ztna-pull-secret
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: copy
          image: {{ $c.image | quote }}
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              kubectl --namespace "$SRC_NS" get secret "$SECRET" --output json |
                jq --arg ns "$DST_NS" '{apiVersion: "v1", kind: "Secret",
                  metadata: {name: .metadata.name, namespace: $ns, labels: {"app.kubernetes.io/managed-by": "ztna"}},
                  type: .type, data: .data}' |
                kubectl apply --server-side --force-conflicts --field-manager=ztna-pull-secret --filename -
          env:
            - name: HOME
              value: /tmp
            - name: SRC_NS
              value: {{ $c.sourceNamespace | quote }}
            - name: DST_NS
              value: {{ .Release.Namespace | quote }}
            - name: SECRET
              value: {{ $c.secretName | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
{{- end }}
