suite: ztna hub
release:
  name: ztna
  namespace: teknoir-ztna
templates:
  - templates/hub.yaml
  - templates/pdb.yaml
  - templates/flags.yaml
  - templates/rbac.yaml
  - templates/routing.yaml
  - templates/namespace.yaml
  - templates/admission.yaml
  - templates/pull-secret.yaml
set:
  hub.image.tag: "sha-0123abcd@sha256:3333333333333333333333333333333333333333333333333333333333333333"
  hub.image.leaderElection: true
tests:
  - it: fails the render when the leader Service would select pods an image without leader election never labels
    template: templates/hub.yaml
    set:
      hub.image.leaderElection: false
    asserts:
      - failedTemplate:
          errorPattern: "hub-role=leader label, which only a wg-hub image with leader election sets"

  - it: fails the render for one replica too (the Service still selects the leader label) without the image confirmation
    template: templates/hub.yaml
    set:
      hub.image.leaderElection: false
      hub.replicas: 1
    asserts:
      - failedTemplate:
          errorPattern: "hub.image.leaderElection: true"

  - it: renders with the old pin once the election is switched off (no leader selector, no gate)
    template: templates/hub.yaml
    set:
      hub.image.leaderElection: false
      hub.replicas: 1
      hub.leaderElection.enabled: false
    asserts:
      - notFailedTemplate: {}

  - it: fails the render without an image tag
    template: templates/hub.yaml
    set:
      hub.image.tag: ""
    asserts:
      - failedTemplate:
          errorPattern: "hub.image.tag is required"

  - it: labels the namespace for the mesh and keeps it on removal
    template: templates/namespace.yaml
    asserts:
      - equal:
          path: metadata.name
          value: teknoir-ztna
      - equal:
          path: metadata.labels["istio-injection"]
          value: enabled
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-options"]
          value: Prune=false,Delete=false

  - it: runs two hub replicas that roll over one at a time (the standby is deleted first), hardened and non-root
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
      # hub-ha: the pods carry the component and the role label (the hub moves the role), the
      # immutable selector stays as it was.
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: wg-hub
      - equal:
          path: spec.template.metadata.labels
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/part-of: teknoir-ztna
            app.kubernetes.io/component: hub
            ztna.teknoir.org/hub-role: standby
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution
          value:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: wg-hub
                    app.kubernetes.io/component: hub
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/teknoir/wg-hub:sha-0123abcd@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext
          value:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      - equal:
          path: spec.template.spec.serviceAccountName
          value: wg-hub
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: ghcr-token
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /healthz
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /readyz
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: wg, containerPort: 51820, protocol: UDP}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: http, containerPort: 8080, protocol: TCP}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: metrics, containerPort: 9090, protocol: TCP}

  - it: runs one hub pod with Recreate and no PodDisruptionBudget when hub.replicas is 1
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      hub.replicas: 1
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.strategy
          value:
            type: Recreate

  - it: renders no PodDisruptionBudget with one replica
    template: templates/pdb.yaml
    set:
      hub.replicas: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: protects the replicas with a PodDisruptionBudget that lets one go and never blocks on an unhealthy pod
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: apiVersion
          value: policy/v1
      - equal:
          path: metadata.name
          value: wg-hub
      - equal:
          path: metadata.namespace
          value: teknoir-ztna
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.unhealthyPodEvictionPolicy
          value: AlwaysAllow
      # the hub pods only: the pull secret pods carry the name label too
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/component: hub

  - it: takes the PodDisruptionBudget size from hub.pdb.maxUnavailable
    template: templates/pdb.yaml
    set:
      hub.replicas: 3
      hub.pdb.maxUnavailable: 2
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 2

  - it: refuses several replicas without a leader election (every replica would serve)
    template: templates/hub.yaml
    set:
      hub.replicas: 2
      hub.leaderElection.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "hub.replicas > 1 needs hub.leaderElection.enabled"

  - it: configures the hub through the contract's environment
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: DOMAIN, value: teknoir.cloud}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TURN_URLS, value: "turn:turn.teknoir.cloud:3478?transport=udp"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TURN_SECRET_REF, value: stunner-system/stunner-auth-secret}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KEYCLOAK_ISSUER, value: "https://auth.teknoir.cloud/auth/realms/master"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KEYCLOAK_JWKS_URL, value: "https://auth.teknoir.cloud/auth/realms/master/protocol/openid-connect/certs"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ALLOWED_AZP, value: teknoir-cli}
      - contains:
          path: spec.template.spec.containers[0].env
          # values.yaml default
          content: {name: ORG_GATE_MODE, value: enforce}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: HUB_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

  - it: runs the leader election on the Lease wg-hub with the contract's timings (one replica waits for nobody)
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      hub.replicas: 1
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LEADER_ELECTION, value: wg-hub}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LEASE_DURATION, value: 120s}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: RENEW_DEADLINE, value: 110s}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: RETRY_PERIOD, value: 2s}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: HANDOVER_WAIT, value: 0s}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: HANDOVER_SETTLE, value: 2s}

  - it: waits for the other replica to take the lease only when there is one
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: HANDOVER_WAIT, value: 10s}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LEADER_ELECTION, value: wg-hub}

  - it: follows hub.leaderElection (lease name, timings) and renders none of it when switched off
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      hub.leaderElection.lease: other-lease
      hub.leaderElection.retryPeriod: 5s
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: LEADER_ELECTION, value: other-lease}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: RETRY_PERIOD, value: 5s}

  - it: sets no election variable when leader election is off
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    set:
      hub.leaderElection.enabled: false
      hub.replicas: 1
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: LEADER_ELECTION, value: wg-hub}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: HANDOVER_WAIT, value: 0s}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: RETRY_PERIOD, value: 2s}

  - it: does not trust a client address header (servicelb hides client addresses)
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: CLIENT_IP_HEADER, value: X-Envoy-External-Address}

  - it: follows the domain
    template: templates/hub.yaml
    set:
      domain: example.test
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: TURN_URLS, value: "turn:turn.example.test:3478?transport=udp"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: KEYCLOAK_ISSUER, value: "https://auth.example.test/auth/realms/master"}

  - it: has a headless Service with the HTTP, metrics and WireGuard UDP ports
    template: templates/hub.yaml
    asserts:
      - equal:
          path: kind
          value: Service
        documentIndex: 2
      - equal:
          path: metadata.name
          value: wg-hub
        documentIndex: 2
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 2
      # only the leader: the hub-role label the hub sets on its own pod
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/component: hub
            ztna.teknoir.org/hub-role: leader
        documentIndex: 2
      - equal:
          path: spec.ports
          value:
            - {name: http, port: 8080, targetPort: http, protocol: TCP}
            - {name: http-internal, port: 8081, targetPort: http-internal, protocol: TCP}
            - {name: http-status, port: 8082, targetPort: http-status, protocol: TCP}
            - {name: http-metrics, port: 9090, targetPort: metrics, protocol: TCP}
            - {name: wg, port: 51820, targetPort: wg, protocol: UDP}
        documentIndex: 2

  - it: selects every pod without the role label when there is no election (nothing would set it)
    template: templates/hub.yaml
    set:
      hub.replicas: 1
      hub.leaderElection.enabled: false
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/component: hub
        documentIndex: 2

  - it: lists every hub pod, ready or not, on UDP 51820 only in Service wg-hub-pods (not the pull secret CronJob pods)
    template: templates/hub.yaml
    asserts:
      - equal:
          path: metadata.name
          value: wg-hub-pods
        documentIndex: 3
      - equal:
          path: spec.clusterIP
          value: None
        documentIndex: 3
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
        documentIndex: 3
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/component: hub
        documentIndex: 3
      - equal:
          path: spec.ports
          value:
            - {name: wg, port: 51820, targetPort: wg, protocol: UDP}
        documentIndex: 3

  - it: keeps the pull secret CronJob pods out of the hub pod selector (component pull-secret, not hub)
    template: templates/pull-secret.yaml
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.metadata.labels
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/part-of: teknoir-ztna
            app.kubernetes.io/component: pull-secret

  - it: scrapes the metrics port with a ServiceMonitor that Prometheus selects
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - equal:
          path: metadata.labels.release
          value: monitoring
      - equal:
          path: spec.endpoints[0].port
          value: http-metrics

  - it: scrapes every hub pod, standby and leaderless pods included, through a Service of its own (not the leader-only wg-hub)
    template: templates/hub.yaml
    documentSelector:
      path: metadata.name
      value: wg-hub-metrics
    asserts:
      - equal:
          path: kind
          value: Service
      - equal:
          path: spec.clusterIP
          value: None
      - equal:
          path: spec.publishNotReadyAddresses
          value: true
      # no hub-role in the selector: both replicas, whatever their role label
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: wg-hub
            app.kubernetes.io/component: hub
      - equal:
          path: spec.ports
          value:
            - {name: http-metrics, port: 9090, targetPort: metrics, protocol: TCP}
      - equal:
          path: metadata.labels["ztna.teknoir.org/scrape"]
          value: hub-pods

  - it: points the ServiceMonitor at the all-pods metrics Service only (wg-hub and wg-hub-pods lack its label)
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: wg-hub
            ztna.teknoir.org/scrape: hub-pods

  - it: alerts when the serving replicas are not exactly one, when a role patch fails and when a replica is not scraped
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: PrometheusRule
    asserts:
      - equal:
          path: metadata.labels.release
          value: monitoring
      - equal:
          path: spec.groups[0].rules[0].alert
          value: WgHubLeaderCount
      - equal:
          path: spec.groups[0].rules[0].expr
          value: (sum(wghub_leader{namespace="teknoir-ztna"}) or vector(0)) != 1
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[0].rules[1].alert
          value: WgHubRolePatchErrors
      - equal:
          path: spec.groups[0].rules[1].expr
          value: increase(wghub_role_patch_errors_total{namespace="teknoir-ztna"}[5m]) > 0
      - equal:
          path: spec.groups[0].rules[2].alert
          value: WgHubReplicaNotScraped
      - equal:
          path: spec.groups[0].rules[2].expr
          value: (count(up{job="wg-hub-metrics",namespace="teknoir-ztna"} == 1) or vector(0)) < 2

  - it: follows hub.replicas and the leader window in the alerts
    template: templates/hub.yaml
    set:
      hub.replicas: 3
      metrics.prometheusRule.leaderFor: 8m
    documentSelector:
      path: kind
      value: PrometheusRule
    asserts:
      - equal:
          path: spec.groups[0].rules[0].for
          value: 8m
      - matchRegex:
          path: spec.groups[0].rules[2].expr
          pattern: "< 3$"

  - it: renders no alert when metrics.prometheusRule is off
    template: templates/hub.yaml
    set:
      metrics.prometheusRule.enabled: false
    asserts:
      - hasDocuments:
          count: 6

  - it: renders no ServiceMonitor, metrics Service or alert when switched off
    template: templates/hub.yaml
    set:
      metrics.serviceMonitor.enabled: false
    asserts:
      - hasDocuments:
          count: 4

  - it: gives the hub least-privilege cluster rights and no access to Devices
    template: templates/rbac.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [authorization.k8s.io]
              resources: [subjectaccessreviews]
              verbs: [create]
            - apiGroups: [authentication.k8s.io]
              resources: [tokenreviews]
              verbs: [create]
        documentIndex: 0
      - notMatchRegex:
          path: rules[0].resources[0]
          pattern: devices
        documentIndex: 0

  - it: gives only the flags watcher read access to Devices and Users
    template: templates/rbac.yaml
    asserts:
      - equal:
          path: metadata.name
          value: wg-flags
        documentIndex: 6
      - equal:
          path: rules
          value:
            - apiGroups: [teknoir.org]
              resources: [devices]
              verbs: [get, list, watch]
            - apiGroups: [teknoir.org]
              resources: [users]
              verbs: [get, list, watch]
        documentIndex: 6
      - equal:
          path: subjects
          value: [{kind: ServiceAccount, name: wg-flags, namespace: teknoir-ztna}]
        documentIndex: 7
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, list, watch, create, update, patch, delete]
        documentIndex: 8
      - equal:
          path: metadata.namespace
          value: teknoir-ztna
        documentIndex: 8

  - it: runs the flags watcher from the hub image with the flags-watcher command, no ports
    template: templates/flags.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: wg-flags
      - equal:
          path: spec.template.spec.containers[0].image
          value: "ghcr.io/teknoir/wg-hub:sha-0123abcd@sha256:3333333333333333333333333333333333333333333333333333333333333333"
      - equal:
          path: spec.template.spec.containers[0].args
          value: [flags-watcher]
      - notExists:
          path: spec.template.spec.containers[0].ports
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true

  - it: denies all mesh traffic to the flags watcher
    template: templates/flags.yaml
    documentSelector:
      path: kind
      value: AuthorizationPolicy
    asserts:
      - equal:
          path: spec.action
          value: ALLOW
      - notExists:
          path: spec.rules

  - it: lets the hub read the TURN secret by name only, in the STUNner namespace
    template: templates/rbac.yaml
    asserts:
      - hasDocuments:
          count: 10
      - equal:
          path: metadata.namespace
          value: stunner-system
        documentIndex: 4
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [secrets]
              resourceNames: [stunner-auth-secret]
              verbs: [get]
        documentIndex: 4
      - equal:
          path: subjects[0]
          value: {kind: ServiceAccount, name: wg-hub, namespace: teknoir-ztna}
        documentIndex: 5

  - it: has a Role in teknoir-ztna for ConfigMaps and ServiceAccounts, with no delete
    template: templates/rbac.yaml
    asserts:
      - equal:
          path: metadata.namespace
          value: teknoir-ztna
        documentIndex: 2
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, update, patch]
            - apiGroups: [""]
              resources: [serviceaccounts]
              verbs: [get]
            # leader election and the role label (hub-ha)
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              verbs: [create]
            - apiGroups: [coordination.k8s.io]
              resources: [leases]
              resourceNames: [wg-hub]
              verbs: [get, update]
            - apiGroups: [""]
              resources: [pods]
              verbs: [patch]
        documentIndex: 2

  - it: gives the hub no Lease or Pod rights when leader election is off
    template: templates/rbac.yaml
    set:
      hub.leaderElection.enabled: false
      hub.replicas: 1
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [get, list, watch]
            - apiGroups: [""]
              resources: [configmaps]
              verbs: [create, update, patch]
            - apiGroups: [""]
              resources: [serviceaccounts]
              verbs: [get]
        documentIndex: 2

  - it: limits the Lease rights of the hub to the named Lease (create aside) and never gives delete
    template: templates/rbac.yaml
    set:
      hub.leaderElection.lease: other-lease
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            resourceNames: [other-lease]
            verbs: [get, update]
        documentIndex: 2
      - notContains:
          path: rules
          content:
            apiGroups: [coordination.k8s.io]
            resources: [leases]
            verbs: [create, get, update, delete]
        documentIndex: 2

  - it: routes wg.<domain> on the 443 gateway to the hub
    template: templates/routing.yaml
    documentSelector:
      path: metadata.name
      value: wg
      matchMany: true
    asserts:
      - equal:
          path: spec.hosts
          value: [wg.teknoir.cloud]
        documentIndex: 0
      - equal:
          path: spec.gateways
          value: [istio-system/teknoir-gateway]
        documentIndex: 0
      - equal:
          path: spec.http[0].route[0].destination
          value:
            host: wg-hub.teknoir-ztna.svc.cluster.local
            port:
              number: 8080
        documentIndex: 0

  - it: routes wg-device.<domain>:8084 on the public gateway to the hub
    template: templates/routing.yaml
    documentSelector:
      path: metadata.name
      value: wg-device
    asserts:
      - equal:
          path: spec.hosts
          value: [wg-device.teknoir.cloud]
      - equal:
          path: spec.gateways
          value: [istio-system/teknoir-gateway-public]
      - equal:
          path: spec.http[0].match
          value:
            - port: 8084

  - it: admits the ingress gateways to 8080, the namespace to 8081, Backstage to 8082 and Prometheus to 9090, nothing else
    template: templates/routing.yaml
    documentSelector:
      path: kind
      value: AuthorizationPolicy
    asserts:
      - equal:
          path: spec.action
          value: ALLOW
      - equal:
          path: spec.rules
          value:
            - from:
                - source:
                    principals:
                      - cluster.local/ns/istio-system/sa/istio-ingressgateway
                      - cluster.local/ns/istio-system/sa/istio-ingressgateway-public
              to:
                - operation:
                    ports: ["8080"]
            - from:
                - source:
                    namespaces: [teknoir-ztna]
              to:
                - operation:
                    ports: ["8081"]
            - from:
                - source:
                    principals: [cluster.local/ns/teknoir-system/sa/backstage-api]
              to:
                - operation:
                    ports: ["8082"]
            - from:
                - source:
                    principals: [cluster.local/ns/teknoir-system/sa/monitoring-prometheus]
              to:
                - operation:
                    ports: ["9090"]

  - it: names the writers in the admission policy
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-policy-store
    asserts:
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "username == 'system:serviceaccount:teknoir-system:device-controller-service-account'"
        documentIndex: 0
      - matchRegex:
          path: spec.validations[2].expression
          pattern: "username == 'system:serviceaccount:teknoir-ztna:wg-hub'"
        documentIndex: 0
      - equal:
          path: spec.failurePolicy
          value: Fail
        documentIndex: 0

  - it: binds the config store policy to the hub namespace
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-policy-store-binding
    asserts:
      - equal:
          path: spec.policyName
          value: ztna-policy-store
      - equal:
          path: spec.matchResources.namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: teknoir-ztna
      - equal:
          path: spec.validationActions
          value: [Deny, Audit]

  - it: denies exec in the hub and the STUNner namespaces
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-no-exec-binding
    asserts:
      - equal:
          path: spec.policyName
          value: ztna-no-exec
      - equal:
          path: spec.matchResources.namespaceSelector.matchExpressions[0].values
          value: [teknoir-ztna, stunner-system]

  - it: copies the pull secret with a hook Job that has no sidecar
    template: templates/pull-secret.yaml
    documentSelector:
      path: kind
      value: Job
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: Sync
      - equal:
          path: spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true

  - it: repeats the copy hourly with a CronJob so a rotated token needs no sync
    template: templates/pull-secret.yaml
    documentSelector:
      path: kind
      value: CronJob
    asserts:
      - equal:
          path: spec.schedule
          value: "17 * * * *"
      - equal:
          path: spec.concurrencyPolicy
          value: Forbid
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: ztna-pull-secret
      - equal:
          path: spec.jobTemplate.spec.template.metadata.annotations["sidecar.istio.io/inject"]
          value: "false"

  - it: renders no pull secret copy when the image is public
    template: templates/pull-secret.yaml
    set:
      pullSecretCopy.enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: names device-controller as the only writer of revocation tombstones (ztna-revoked-*)
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-policy-store
    asserts:
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "isRevoked.*username == 'system:serviceaccount:teknoir-system:device-controller-service-account'"
      - matchRegex:
          path: spec.variables[4].expression
          pattern: "ztna-revoked-"
      - matchRegex:
          path: spec.variables[4].expression
          pattern: "ztna.teknoir.org/revoked"

  - it: names the flags watcher as the only writer of flags ConfigMaps
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-policy-store
    asserts:
      - matchRegex:
          path: spec.validations[3].expression
          pattern: "username == 'system:serviceaccount:teknoir-ztna:wg-flags'"
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "ztna-flags-"
      - matchRegex:
          path: spec.validations[6].expression
          pattern: "wg-flags.*variables.isFlags \\|\\| variables.isOrg"

  - it: limits who may create or update pods and workloads in the ZTNA namespaces
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-workloads
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[1].resources
          value: [deployments, replicasets, statefulsets, daemonsets]
      - equal:
          path: spec.matchConstraints.resourceRules[2].resources
          value: [jobs, cronjobs]
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE, UPDATE]
      - matchRegex:
          path: spec.variables[1].expression
          pattern: "device-controller-service-account.*argocd-application-controller.*stunner-gateway-operator-controller-manager"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "system:serviceaccount:kube-system:.*system:kube-controller-manager"

  - it: lets the hub UPDATE its own pod's role label and deletion cost only
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-workloads
    asserts:
      - equal:
          path: spec.variables[6].name
          value: hubRoleUpdate
      - matchRegex:
          path: spec.variables[6].expression
          pattern: "variables.user == 'system:serviceaccount:teknoir-ztna:wg-hub'"
      - matchRegex:
          path: spec.variables[6].expression
          pattern: "request.operation == 'UPDATE' && request.kind.kind == 'Pod' && \\(!has\\(request.subResource\\) \\|\\| request.subResource == ''\\)"
      - matchRegex:
          path: spec.variables[6].expression
          pattern: "(?s)oldL\\['app.kubernetes.io/name'\\] == 'wg-hub'.*oldL\\['app.kubernetes.io/component'\\] == 'hub'"
      - matchRegex:
          path: spec.variables[6].expression
          pattern: "(?s)object.spec == oldObject.spec.*ownerReferences.*finalizers"
      - matchRegex:
          path: spec.variables[6].expression
          pattern: "(?s)in \\['leader', 'standby'\\].*in \\['0', '100'\\]"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "(?s)kube-controller-manager'\\) \\|\\|\\s+variables.hubRoleUpdate"
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [pods]

  - it: renders no hub carve-out when leader election is off
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-workloads
    set:
      hub.leaderElection.enabled: false
      hub.replicas: 1
    asserts:
      - lengthEqual:
          path: spec.variables
          count: 2
      - notMatchRegex:
          path: spec.validations[0].expression
          pattern: "hubRoleUpdate"

  - it: reserves the leader Lease to the hub (and namespace teardown)
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-hub-lease
    asserts:
      - equal:
          path: spec.failurePolicy
          value: Fail
      - equal:
          path: spec.matchConstraints.resourceRules
          value:
            - apiGroups: [coordination.k8s.io]
              apiVersions: [v1]
              operations: [CREATE, UPDATE, DELETE]
              resources: [leases]
      - matchRegex:
          path: spec.variables[0].expression
          pattern: "object.metadata.name == 'wg-hub'.*oldObject.metadata.name == 'wg-hub'"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "variables.teardown \\|\\|\\s+request.userInfo.username == 'system:serviceaccount:teknoir-ztna:wg-hub'"
      - matchRegex:
          path: spec.validations[1].expression
          pattern: "username != 'system:serviceaccount:teknoir-ztna:wg-hub' \\|\\| variables.isHubLease"

  - it: names the configured Lease in the Lease policy
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-hub-lease
    set:
      hub.leaderElection.lease: other-lease
    asserts:
      - matchRegex:
          path: spec.variables[0].expression
          pattern: "object.metadata.name == 'other-lease'"

  - it: binds the Lease policy to the hub namespace with Deny
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-hub-lease-binding
    asserts:
      - equal:
          path: spec.policyName
          value: ztna-hub-lease
      - equal:
          path: spec.matchResources.namespaceSelector.matchLabels["kubernetes.io/metadata.name"]
          value: teknoir-ztna
      - equal:
          path: spec.validationActions
          value: [Deny, Audit]

  - it: binds the workload policy to the hub and STUNner namespaces
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-workloads-binding
    asserts:
      - equal:
          path: spec.matchResources.namespaceSelector.matchExpressions[0].values
          value: [teknoir-ztna, stunner-system]

  - it: reserves TokenRequest for the ZTNA service accounts to the kubelet and kube-system
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-no-token-mint
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [serviceaccounts/token]
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "'wg-hub', 'wg-flags'.*startsWith\\('wgt-'\\).*system:node:.*system:serviceaccount:kube-system:"

  - it: serves the live status on 8082 for the Backstage service account
    template: templates/hub.yaml
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STATUS_ADDR, value: ":8082"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: BACKSTAGE_SA, value: "system:serviceaccount:teknoir-system:backstage-api"}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: STATUS_AUDIENCE, value: "teknoir-ztna-status"}
      - contains:
          path: spec.template.spec.containers[0].ports
          content: {name: http-status, containerPort: 8082, protocol: TCP}

  - it: guards ztna annotations on Devices
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-device-annotations
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: ["CREATE", "UPDATE"]
      - matchRegex:
          path: spec.variables[4].expression
          pattern: "system:serviceaccount:teknoir-system:backstage-api"
      - matchRegex:
          path: spec.variables[4].expression
          pattern: "device-controller-service-account"

  - it: sets ORG_GATE_MODE enforce when asked
    template: templates/hub.yaml
    set:
      hub.orgGate.mode: enforce
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ORG_GATE_MODE, value: enforce}

  - it: sets ORG_GATE_MODE from hub.orgGate.mode (audit, off)
    template: templates/hub.yaml
    set:
      hub.orgGate.mode: audit
    documentSelector:
      path: kind
      value: Deployment
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: ORG_GATE_MODE, value: audit}

  - it: fails the render for an unquoted YAML boolean mode (off parses as false)
    template: templates/hub.yaml
    set:
      hub.orgGate.mode: false
    asserts:
      - failedTemplate:
          errorPattern: "quote it"

  - it: fails the render for an unknown org gate mode
    template: templates/hub.yaml
    set:
      hub.orgGate.mode: permissive
    asserts:
      - failedTemplate:
          errorPattern: "hub.orgGate.mode must be enforce, audit or off"

  - it: makes the wg-flags watcher the only writer of ztna-org ConfigMaps
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-policy-store
    asserts:
      - matchRegex:
          path: spec.variables[3].expression
          pattern: "(?s)ztna-org-.*ztna.teknoir.org/org"
      - matchRegex:
          path: spec.validations[4].expression
          pattern: "(?s)!variables.isOrg \\|\\| variables.teardown.*username == 'system:serviceaccount:teknoir-ztna:wg-flags'"

  - it: guards the org-tree placement keys on Devices
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-device-annotations
    asserts:
      - matchRegex:
          path: spec.variables[1].expression
          pattern: "teknoir.org/org-tree-path.*teknoir.org/org-tree-node-id"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "k in variables.orgKeys"

  - it: protects the org-tree annotations on Users
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-user-org-annotations
    asserts:
      - equal:
          path: spec.matchConstraints.resourceRules[0].resources
          value: [users]
      - equal:
          path: spec.matchConstraints.resourceRules[0].operations
          value: [CREATE, UPDATE]
      - equal:
          path: spec.failurePolicy
          value: Fail
      - matchRegex:
          path: spec.variables[2].expression
          pattern: "'system:serviceaccount:teknoir-system:backstage-api', 'system:serviceaccount:teknoir-system:argocd-application-controller', 'system:serviceaccount:teknoir-system:user-controller'.*system:masters"
      - matchRegex:
          path: spec.validations[0].expression
          pattern: "org-tree-member-.*org-tree-units-"

  - it: binds the user org annotation policy with Deny
    template: templates/admission.yaml
    documentSelector:
      path: metadata.name
      value: ztna-user-org-annotations-binding
    asserts:
      - equal:
          path: spec.policyName
          value: ztna-user-org-annotations
      - equal:
          path: spec.validationActions
          value: [Deny, Audit]
