# Argo CD manages itself: app-of-apps renders the Application argo (templates/argo.yaml), Helm
# release argo, the name teknoir/infra scripts/deploy-argo.sh installs it with, so the render keeps
# every name (argo-argocd-*) and adopts that install in place. No resources: on staging Argo CD
# shares the node with everything else (only production sets them).

namespace: teknoir-system
domain: "teknoir.cloud"

# Istio integration configuration
istio:
  gateway:
    name: teknoir-gateway
    namespace: istio-system

argo-cd:
  namespaceOverride: "teknoir-system"

  # Argo CD must survive its own Application: Prune=false,Delete=false keeps the CRDs (and with them
  # every Application) even if the Application argo is deleted with cascade. ServerSideApply=true is
  # the chart default for the CRDs (too large for client-side apply's last-applied annotation).
  crds:
    annotations:
      argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false

  global:
    # -- Default domain used by all components
    ## Used for ingresses, certificates, SSO, notifications, etc.
    domain: argocd.teknoir.cloud


  configs:
    # argocd-secret holds server.secretkey and admin.password (written at runtime): never delete it.
    secret:
      annotations:
        argocd.argoproj.io/sync-options: Prune=false,Delete=false
    cm:
      oidc.config: |
        name: Keycloak
        issuer: https://auth.teknoir.cloud/auth/realms/master
        clientID: argocd
        clientSecret: $argocd-oidc-secret:oidc.auth.clientSecret
        requestedScopes: ["openid", "profile", "email", "groups"]

    rbac:
      policy.default: role:readonly
      # Map the 'admin' group from Keycloak to ArgoCD admin role. The deny line: nobody deletes Argo
      # CD's own Application from the UI/CLI (a cascade delete removes Argo CD); remove it from
      # app-of-apps instead (no finalizer, so the resources stay).
      policy.csv: |
        g, admin, role:admin
        g, argocd-admins, role:admin
        p, role:admin, applications, delete, teknoir-cloud/argo, deny

  server:
    extraArgs:
      - --insecure

