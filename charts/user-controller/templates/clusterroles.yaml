---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teknoir-admin
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.teknoir.org/aggregate-to-teknoir-admin: "true"
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teknoir-edit
  labels:
    rbac.authorization.teknoir.org/aggregate-to-teknoir-admin: "true"
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.teknoir.org/aggregate-to-teknoir-edit: "true"
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teknoir-view
  labels:
    rbac.authorization.teknoir.org/aggregate-to-teknoir-edit: "true"
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.teknoir.org/aggregate-to-teknoir-view: "true"
rules: []

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teknoir-kubernetes-admin
  labels:
    rbac.authorization.teknoir.org/aggregate-to-teknoir-admin: "true"
rules:
  - apiGroups:
      - authorization.k8s.io
    resources:
      - localsubjectaccessreviews
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
      - roles
    verbs:
      - create
      - delete
      - deletecollection
      - get
      - list
      - patch
      - update
      - watch

---
# POLICY MARKER, not a capability. Users (teknoir-edit, and teknoir-admin by aggregation) have no Kubernetes API
# credentials on staging: the RoleBindings to Users are an authorization oracle. Backstage (canExec, a
# LocalSubjectAccessReview as the user) and the WireGuard hub (CanExec, a SubjectAccessReview as the user) ask
# "may this user `create pods/exec` in the teamspace?" to decide who may use device access (terminals, tunnels,
# `tnctl ssh`). Removing this rule locks every developer out of device access. Do not "clean it up", and do not
# grant more here: secrets, impersonate, pod writes and the rest were removed on purpose
# (plans/security-findings-2026-10-23.md F2). The read set comes from teknoir-kubernetes-view through aggregation.
# If API login for Users is ever introduced (OIDC on the API server), first add a ValidatingAdmissionPolicy that
# denies real CONNECT pods/exec in teamspaces, because this marker would then be a real capability.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.teknoir.org/aggregate-to-teknoir-edit: "true"
  name: teknoir-kubernetes-edit
rules:
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create

---
# The identity of teamspace workloads: bound to the ServiceAccount default-editor (token mounted into every
# Devstudio, Notebook and plugin pod) by profile-controller when DEFAULT_EDITOR_CLUSTERROLE=teknoir-workload
# (charts/profile-controller config.defaultEditorClusterRole). A plain ClusterRole with explicit rules and NO
# aggregationRule, so ArgoCD selfHeal never fights the aggregation controller.
# Read: the same non-secret set as teknoir-view. No secrets, no exec, no impersonate, no pod or workload writes.
# Write: only Devices (get/list/watch/update/patch), because Devstudio's node-red-teknoir-configure-devices
# (devstudio-cloud image) lists Devices and PUTs the Device manifest with the pod's own token, and the deprecated
# Ansible inventory plugin of the notebook image lists them. Both ran through the fleet-metrics Role bound to
# default-editor before; this role keeps them working when that binding moves (F2 step 3).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: teknoir-workload
rules:
  {{- include "user-controller.viewRules" . | nindent 2 }}
  - apiGroups:
      - teknoir.org
    resources:
      - devices
    verbs:
      - get
      - list
      - patch
      - update
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    rbac.authorization.teknoir.org/aggregate-to-teknoir-view: "true"
  name: teknoir-kubernetes-view
rules:
  {{- include "user-controller.viewRules" . | nindent 2 }}
