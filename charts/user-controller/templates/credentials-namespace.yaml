{{- /*
The temporary-password Secrets live here (see values.yaml credentials). Never
pruned or deleted by ArgoCD: deleting the namespace would drop passwords not
yet handed out. No workload runs here; the restricted Pod Security level is
enforced anyway.
IgnoreExtraneous: a rollback to a release without this Namespace (a pre-r5
user-controller) leaves it behind (Prune=false), and without this option that
older chart's Application would stay OutOfSync on it for good. The option is
read from the live object, so it works after the older chart has taken over.
*/}}
---
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "user-controller.credentialsNamespace" . }}
  labels:
    {{- include "user-controller.labels" . | nindent 4 }}
    pod-security.kubernetes.io/enforce: restricted
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    argocd.argoproj.io/compare-options: IgnoreExtraneous
