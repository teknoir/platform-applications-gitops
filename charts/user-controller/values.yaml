# GitOps values for user-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/user-controller
  tag: "teknoir-cloud-20260413-054338@sha256:7fb5a7cdc4995a0dd11e462499d1d2d76d73e7774a31991f8004fc02be3041cb"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

config:
  projectId: teknoir
  userIdHeader: X-Auth-Request-Email
  userIdPrefix:
  mailClientApiKey: ""
  webDomain: teknoir.cloud

# Users every install gets (templates/platform-users.yaml). role superadmin = platform
# superuser (all teamspaces). Anders (2026-10-16): "always add my user as a superuser".
platformUsers:
  - email: anders.aslund@teknoir.ai
    displayName: Anders Åslund
    role: superadmin
    claimSet:
      - {name: owner, namespace: teknoir-demo}
  # Staging test user for the agents' browser checks (developer in teknoir-demo, not a
  # platform admin). Its password lives only in the dev host's
  # ~/.config/teknoir/staging-agent-user.env (set in Keycloak from there, never in Git).
  - email: claude-agent@teknoir.cloud
    displayName: Claude Agent Staging Test
    role: ""
    claimSet:
      - {name: developer, namespace: teknoir-demo}
    # Org-tree member of Karlstad in teknoir-demo, so the org gate can be tested: it sees
    # the Karlstad lab and warehouse robots and devices, not Stockholm's (demo org seeded by
    # ~/git/ai/plans/nextgen/staging-demo/org-tree.sh).
    orgUnits:
      teknoir-demo: [se-karlstad]
