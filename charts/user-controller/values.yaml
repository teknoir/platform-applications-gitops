# GitOps values for user-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/user-controller
  # A dated build tag, never moved: no need to re-pull on every start (which
  # also makes a restart depend on Harbor being up).
  tag: teknoir-cloud-20260413-054338
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Keycloak client credentials, loaded with envFrom (non-optional: the pod
# must not start without them). The platform-secrets chart creates this
# Secret: KEYCLOAK_REALM=teknoir, KEYCLOAK_CLIENTID=user-controller and
# KEYCLOAK_CLIENTSECRET, a re-synced copy of
# teknoir-auth/keycloak-client-secrets[user-controller], which the auth chart
# also imports into realm teknoir. It restarts this Deployment when the copy
# changes. KEYCLOAK_URL stays in the ConfigMap.
keycloak:
  secretName: backstage-keycloak-secrets

config:
  projectId: teknoir
  userIdHeader: X-Auth-Request-Email
  userIdPrefix:
  mailClientApiKey: ""
  webDomain: teknoir.airgapped
