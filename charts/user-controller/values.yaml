# GitOps values for user-controller

replicaCount: 1

image:
  repository: ghcr.io/teknoir/user-controller
  # Pinned 2026-10-19: '<tag>@sha256:<digest>' = the image production ran (adopted, no change).
  tag: "teknoir-cloud-20260413-054338@sha256:7fb5a7cdc4995a0dd11e462499d1d2d76d73e7774a31991f8004fc02be3041cb"
  pullPolicy: Always

imagePullSecrets:
  - name: ghcr-token

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Annotations to add to the service account
  annotations: {}

podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

config:
  projectId: teknoir
  userIdHeader: X-Auth-Request-Email
  userIdPrefix:
  mailClientApiKey: ""
  webDomain: teknoir.online
