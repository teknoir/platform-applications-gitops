name: vdev-spike-render

# Builds ghcr.io/teknoir/vdev-spike-render, the Job image of charts/virtual-device-spike
# (hack/virtual-device-spike/renderer). A pull request only builds; a push to
# teknoir-cloud builds and pushes. The digest in the job summary is what
# charts/virtual-device-spike/values.yaml (renderer.digest) pins in a follow-up PR.
#
# One-time, by an org owner: make the ghcr package public (r415 has no pull secret in
# the Job's namespace).

on:
  push:
    branches: [teknoir-cloud]
    paths:
      - hack/virtual-device-spike/renderer/**
      - hack/virtual-device-spike/lib/pins.sh
      - .github/workflows/vdev-spike-render.yaml
  pull_request:
    paths:
      - hack/virtual-device-spike/renderer/**
      - hack/virtual-device-spike/lib/pins.sh
      - .github/workflows/vdev-spike-render.yaml
  workflow_dispatch:

env:
  IMAGE: ghcr.io/teknoir/vdev-spike-render

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read the cli pin
        id: pins
        run: |
          . hack/virtual-device-spike/lib/pins.sh
          echo "cli_ref=${VDS_CLI_REF}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: hack/virtual-device-spike/renderer
          platforms: linux/amd64
          build-args: CLI_REF=${{ steps.pins.outputs.cli_ref }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          provenance: false

      - name: Digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### vdev-spike-render"
            echo
            echo "renderer.digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
