# Every Teknoir-built image, its pin and where the pin lives (CI/CD v4 P4.2,
# plans/cicd/v4/p42-spec.md section 1). Replaces scripts/images.tsv.
#
# groups  the Kargo image groups: one pins/<group>.yaml (unless its rows pin into chart values files, see
#         values_files), one Warehouse img-<group> and, when enabled, one Stage pin-<group> (charts/kargo-config
#         values groups[], asserted against this file).
#         same_commit: the group makes freight only when every image carries the same sha tag.
#         enabled:     the kargo-config default (auto-promotion and by-hand pin Stages); nothing else.
# images  component: the pin-image name; group: a group above, or null for a third party image;
#         pins_file: pins/<group>.yaml for a grouped row (null for a third party row, and for a grouped row
#         whose pin lives in chart values files);
#         values_files: for a grouped row whose pin lives in chart values files instead of pins/<group>.yaml:
#         the list of files, each holding the same key_path (Kargo's pin Stage and scripts/pin-image write all
#         of them). Such a row has pins_file null and no values_file. Other grouped rows do not set it;
#         values_file: the chart values file of a third-party row (null for a grouped row);
#         chart: the chart directory under charts/, or for a profile-plugin row the plugin chart under
#         plugins/charts/ (information only; the child Application has the same name but for auth
#         (keycloak-theme) and ztna (wg-tunnel));
#         key_path: the nested values key that holds the pin. A segment of digits indexes a list item (e.g.
#         template.spec.containers.0.image), but scripts/pin-image reads only a list indented under its key whose
#         pinned key is not the item's first key (i.e. not on the `- ` line): any other shape is an error, not a
#         silent edit. Kargo's yaml-update has no such limit (scripts/tests/test_pin_image.py locks the real
#         shape of the ci-runner files);
#         style: ref = repo:tag@sha256:…, tag = tag@sha256:…, digest = sha256:… (the sibling tag stays);
#         repository: the registry repository the image is pinned from: Harbor for a private image (built and
#         pushed to Harbor since CI v4 P6.2, 2026-11-25), ghcr for a public one;
#         poll: the repository a Kargo Warehouse polls (equal to repository: Harbor for a private image, ghcr for a
#         public one).
#
# scripts/pin-image reads this file: it writes the pins file (or every values_files file) of a grouped component
# and the chart values of a third-party one. Kargo's pin Stages write the same files too (one pull request per pin).
groups:
  backstage: {same_commit: true, enabled: true}
  device-controller: {same_commit: false, enabled: true}
  profile-controller: {same_commit: false, enabled: true}
  devstudio-controller: {same_commit: false, enabled: true}
  devstudio-cloud: {same_commit: false, enabled: true}
  user-controller: {same_commit: false, enabled: true}
  notebook-controller: {same_commit: false, enabled: true}
  teknoirbot-controller: {same_commit: false, enabled: true}
  keycloak-theme: {same_commit: false, enabled: true}
  wg-tunnel: {same_commit: true, enabled: true}
  web-terminal: {same_commit: false, enabled: true}
  teknoir-desktop: {same_commit: true, enabled: true}
  # The ARC runner image (teknoir/ci-workflows runner-image.yml, first sha-<8> build 2026-11-25, P6.4).
  ci-runner: {same_commit: false, enabled: true}
  # The first profile-plugin image (CI v4 P9.1 S7): pinned in plugins/charts/profile-plugin-jwks/values.yaml.
  # jwks is one replica with strategy Recreate, so a pin restarts it once.
  jwks-server: {same_commit: false, enabled: true}
  # The second profile-plugin image group (CI v4 P9.1 S7): both images from one teknoir/fleet-metrics commit,
  # pinned in plugins/charts/profile-plugin-fleet-metrics/values.yaml.
  fleet-metrics: {same_commit: true, enabled: true}
  # The historian plugin images (CI v4 P9.1 S7): one group per source repo, all three pinned in
  # plugins/charts/profile-plugin-historian/values.yaml.
  historian-middle-end-api: {same_commit: false, enabled: true}
  historian-api: {same_commit: false, enabled: true}
  observatory-event-processing-app: {same_commit: false, enabled: true}
  # The observatory plugin images (CI v4 P9.1 S7): one group per source repo, all three pinned in
  # plugins/charts/profile-plugin-observatory/values.yaml. Public on ghcr (no Harbor mirror): repository = poll =
  # ghcr.io/teknoir/<image>, and the values keep the ghcr registry.
  observatory-wss-mqtt: {same_commit: false, enabled: true}
  observatory-snapshot-exporter: {same_commit: false, enabled: true}
  observatory-media-service: {same_commit: false, enabled: true}

images:
  - component: backstage-app
    group: backstage
    pins_file: pins/backstage.yaml
    chart: backstage
    key_path: backstage.image
    style: ref
    repository: harbor.teknoir.cloud/teknoir/backstage-app
    poll: harbor.teknoir.cloud/teknoir/backstage-app
    note: "the staging UI: next-gen (backstage branch nextgen) since the UI cut-over a2 (2026-10-17); was classic :robot"

  - component: backstage-api
    group: backstage
    pins_file: pins/backstage.yaml
    chart: backstage
    key_path: backstageApi.image
    style: ref
    repository: harbor.teknoir.cloud/teknoir/backstage
    poll: harbor.teknoir.cloud/teknoir/backstage
    note: "the staging UI API: next-gen (nextgen) since the UI cut-over a2; was classic :robot"

  - component: device-controller
    group: device-controller
    pins_file: pins/device-controller.yaml
    chart: device-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/device-controller
    poll: harbor.teknoir.cloud/teknoir/device-controller
    note: "already tag@digest"

  - component: profile-controller
    group: profile-controller
    pins_file: pins/profile-controller.yaml
    chart: profile-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/profile-controller
    poll: harbor.teknoir.cloud/teknoir/profile-controller
    note: "already tag@digest; production pulls :latest of this repo"

  - component: devstudio-controller
    group: devstudio-controller
    pins_file: pins/devstudio-controller.yaml
    chart: devstudio-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/devstudio-controller
    poll: harbor.teknoir.cloud/teknoir/devstudio-controller
    note: "dormant; production pulls :teknoir-cloud of this repo"

  - component: devstudio-cloud
    group: devstudio-cloud
    pins_file: pins/devstudio-cloud.yaml
    chart: devstudio-controller
    key_path: devstudio.image
    style: ref
    repository: harbor.teknoir.cloud/teknoir/devstudio-cloud
    poll: harbor.teknoir.cloud/teknoir/devstudio-cloud
    note: "the Devstudio workload image (DEVSTUDIO_IMAGE); CRs keep :latest, the controller substitutes the pin"

  - component: user-controller
    group: user-controller
    pins_file: pins/user-controller.yaml
    chart: user-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/user-controller
    poll: harbor.teknoir.cloud/teknoir/user-controller
    note: "timestamp tag, built by legacy GitHub Actions"

  - component: notebook-controller
    group: notebook-controller
    pins_file: pins/notebook-controller.yaml
    chart: notebook-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/notebook-controller
    poll: harbor.teknoir.cloud/teknoir/notebook-controller
    note: "timestamp tag, built by legacy GitHub Actions"

  - component: teknoirbot-controller
    group: teknoirbot-controller
    pins_file: pins/teknoirbot-controller.yaml
    chart: teknoirbot-controller
    key_path: image.tag
    style: tag
    repository: harbor.teknoir.cloud/teknoir/teknoirbot-controller
    poll: harbor.teknoir.cloud/teknoir/teknoirbot-controller
    note: "TeknoirBot controller (private repo, local-ci builds)"

  - component: keycloak-theme
    group: keycloak-theme
    pins_file: pins/keycloak-theme.yaml
    chart: auth
    key_path: keycloak.image.digest
    style: digest
    repository: ghcr.io/teknoir/keycloak-theme
    poll: ghcr.io/teknoir/keycloak-theme
    note: "StatefulSet and keycloak-config Job; production pulls :latest of this repo"

  - component: wg-hub
    group: wg-tunnel
    pins_file: pins/wg-tunnel.yaml
    chart: ztna
    key_path: hub.image.tag
    style: tag
    repository: ghcr.io/teknoir/wg-hub
    poll: ghcr.io/teknoir/wg-hub
    note: "already tag@digest; also the wg-flags watcher"

  - component: wg-agent
    group: wg-tunnel
    pins_file: pins/wg-tunnel.yaml
    chart: device-controller
    key_path: ztna.agentImage
    style: ref
    repository: ghcr.io/teknoir/wg-agent
    poll: ghcr.io/teknoir/wg-agent
    note: "already tag@digest"

  - component: wg-gateway
    group: wg-tunnel
    pins_file: pins/wg-tunnel.yaml
    chart: device-controller
    key_path: ztna.gatewayImage
    style: ref
    repository: ghcr.io/teknoir/wg-gateway
