    style: tag
    repository: ghcr.io/teknoir/observatory-media-service
    poll: ghcr.io/teknoir/observatory-media-service
    note: "the observatory media service (profile-plugin-observatory, plugins/charts); public ghcr"

  # Third party images: no group, pinned by hand into the chart values file with scripts/pin-image.
  - component: postgres
    group: null
    pins_file: null
    values_file: charts/backstage/values.yaml
    chart: backstage
    key_path: postgres.image
    style: ref
    repository: postgres
    poll: null
