      - plugins/charts/profile-plugin-historian/values.yaml
    chart: profile-plugin-historian
    key_path: historianStreams.image.version
    style: tag
    repository: harbor.teknoir.cloud/teknoir/observatory-event-processing-app
    poll: harbor.teknoir.cloud/teknoir/observatory-event-processing-app
    note: "the historian event-processing streams worker (profile-plugin-historian, plugins/charts)"

  - component: observatory-wss-mqtt
