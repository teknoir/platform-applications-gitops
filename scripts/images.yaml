    chart: device-controller
    key_path: desktop.image
    style: ref
    repository: ghcr.io/teknoir/teknoir-desktop
    poll: ghcr.io/teknoir/teknoir-desktop
    note: "browser remote desktop, injected into devices by device-controller (public repo)"

  - component: teknoir-desktop-agent
    group: teknoir-desktop
    pins_file: pins/teknoir-desktop.yaml
    chart: device-controller
    key_path: desktop.agent.image
    style: ref
    repository: ghcr.io/teknoir/teknoir-desktop/council
    poll: ghcr.io/teknoir/teknoir-desktop/council
    note: "the TeknoirBot council image (target council, linux/amd64), built by teknoir-desktop image.yml job council as the sub-image council:sha-<8>; its tnctl is the job's TNCTL_REF and TNCTL_VERSION build-args (was teknoir-desktop:sha-<8>-council from the local-ci script until 2026-11-23)"

  - component: ci-runner
    group: ci-runner
    pins_file: null
    values_files:
      - charts/ci-runners/arc/teknoir-ci.yaml
      - charts/ci-runners/arc/teknoir-land.yaml
      - charts/ci-runners/arc/teknoir-push.yaml
    chart: ci-runners
    key_path: template.spec.containers.0.image
    style: ref
    repository: ghcr.io/teknoir/ci-runner
    poll: ghcr.io/teknoir/ci-runner
    note: "the dev-host ARC runner image (teknoir/ci-workflows runner-image/); pinned in the three scale-set values files"

  - component: jwks-server
