    chart: profile-plugin-fleet-metrics
    key_path: metricsPublisher.image.version
    style: tag
    repository: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher
    poll: harbor.teknoir.cloud/teknoir/fleet-metrics/metrics-publisher
    note: "the fleet-metrics publisher (profile-plugin-fleet-metrics, plugins/charts)"

  - component: historian-middle-end-api
    group: historian-middle-end-api
    pins_file: null
    values_files:
      - plugins/charts/profile-plugin-historian/values.yaml
    chart: profile-plugin-historian
    key_path: historianMiddleend.image.version
    style: tag
    repository: harbor.teknoir.cloud/teknoir/historian-middle-end-api
    poll: harbor.teknoir.cloud/teknoir/historian-middle-end-api
    note: "the historian middle-end API (profile-plugin-historian, plugins/charts)"

  - component: historian-api
    group: historian-api
    pins_file: null
    values_files:
      - plugins/charts/profile-plugin-historian/values.yaml
    chart: profile-plugin-historian
    key_path: historianApi.image.version
    style: tag
    repository: harbor.teknoir.cloud/teknoir/historian-api
    poll: harbor.teknoir.cloud/teknoir/historian-api
    note: "the historian API (profile-plugin-historian, plugins/charts)"

  - component: observatory-event-processing-app
