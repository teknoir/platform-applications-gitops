# Release policy of the staging releases (plans/staging-releases.md, "enforcement" 1).
# Read by scripts/check-pins.py (which scripts/staging-release runs on every dry run and --yes) and by
# scripts/staging-release for the rollback floor.

# How a first-party image that is not '<tag>@sha256:<digest>' counts:
#   warn  listed in the output, the release goes ahead (until the pins are adopted, rollout step 4/8)
#   deny  fails the release lint
# Third-party images without a digest are always only a warning.
images: warn

# First-party registries. An image under one of these prefixes must be pinned by digest once
# `images: deny` is set: repo:<tag>@sha256:<64 hex>.
first_party_prefixes:
  - ghcr.io/teknoir/
  - harbor.teknoir.cloud/
  - docker.io/tekn0ir/

# Roll back no further than this release (the first release containing the release guard and the
# helper). Empty until that release exists (rollout step 4); set it in the PR that follows. Rolling
# back before the floor is a break-glass action for Anders.
rollback_floor: ""

# Dated exceptions to the first-party digest rule. An expired exception fails the lint from day 1.
#   image    exact image reference without digest, or a prefix ending in *
#   reason   why it floats
#   owner    who answers for it
#   expires  YYYY-MM-DD, the date the exception ends
exceptions:
  # The next.teknoir.cloud preview lane: Nextgen iterates by pushing :nextgen and restarting the pod.
  # Until the Nextgen cut-over it stays a floating tag with pullPolicy Always (design question 1,
  # default yes). From the cut-over it is pinned with IfNotPresent and every iteration is a pin-image
  # PR, a merge and a release. EXPIRES at the planned Nextgen cut-over: if the cut-over slips,
  # extend this date in a reviewed PR rather than letting the lint be switched off.
  - image: ghcr.io/teknoir/backstage-app:nextgen
    reason: backstage-next preview lane (next.teknoir.cloud), floats until the Nextgen cut-over
    owner: Nextgen
    expires: 2026-11-30
  - image: ghcr.io/teknoir/backstage:nextgen
    reason: backstage-next preview lane (next.teknoir.cloud), floats until the Nextgen cut-over
    owner: Nextgen
    expires: 2026-11-30
