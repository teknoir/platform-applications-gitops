# Release policy of the gitops render (plans/cicd/proposal-v4.md).
# Read by scripts/check-pins.py, which CI runs over the render of every pull request.

# How a first-party image that is not '<tag>@sha256:<digest>' counts:
#   warn  listed in the output, the merge goes ahead
#   deny  fails the lint
# Third-party images without a digest are always only a warning.
images: deny   # since 2026-10-17 (all first-party images pinned)

# First-party registries. An image under one of these prefixes must be pinned by digest once
# `images: deny` is set: repo:<tag>@sha256:<64 hex>.
first_party_prefixes:
  - ghcr.io/teknoir/
  - harbor.teknoir.cloud/
  - docker.io/tekn0ir/

# Rendered teknoir.org CRs (DeviceApplicationSets, and since CI v4 P8.1 RobotTypes and Robots, all from
# charts/device-controller) must pin a 40-hex commit of their repo, and every spec.applications item must
# have a revision: deny since 2026-10-17 (staging-20261017.6 pinned demo-test, gpu-nvidia, gpu-jetson; Nextgen).
cr_revisions: deny

# Dated exceptions to the first-party digest rule. An expired exception fails the lint from day 1.
#   image    exact image reference without digest, or a prefix ending in *
#   reason   why it floats
#   owner    who answers for it
#   expires  YYYY-MM-DD, the date the exception ends
exceptions: []
